<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<title>وجيز — الخيط (Preview v3)</title>
<!--
  «الخيط» Preview v3 — 10 ث، 1920×1080. الرسالة واحدة: ترسل طلبك بسعرك، الكباتن يرسلون عروضهم، وتختار.
  seek(t) دالة نقيّة؛ canvas واحدة وإسقاطٌ منظوري مكتوب يدوياً فوق شوارع حقيقية (OSM) مخفّفة.
  النصوص كلها من التطبيق: «سعرك» تسمية محايدة لحقل السعر، «اطلب الكابتن الآن»، «كابتن»، «عرضه»، «قبول العرض».

  BEAT SHEET
  0.00  لوحة الطلب حاضرة فوراً (الشعار في ترويستها كما في التطبيق) — تستقر بوزن خلال 0.5 ث
  0.80  الضغط على «+» → priceBump على «سعرك»                      (نقرة خفيفة)
  1.60  الضغط على «اطلب الكابتن الآن» — Anticipation ثم اللوحة تنطوي إلى دبوسٍ على المدينة
  2.30  الدبوس يستقر ومعه «سعرك»؛ radarPulse قصير (نبضتان) — صمت
  3.40  الخيط يخرج من الدبوس على الشارع إلى أقرب كابتن ويستقر
  4.20  Anticipation: علامة الكابتن تنخفض ثم ترتفع ← بطاقة العرض تنهض منها (offerIn بوزن) وتستقر 4.95 (صوتٌ له شخصية)
  4.95–5.50 سكون: بطاقةٌ واحدة مقروءة
  5.50  العرض الثاني يظهر ثانوياً (أصغر، أبعد، أخفت)
  6.50  الخيط الذهبي من «سعرك» إلى «عرضه» — يصل بتجاوزٍ صغير ثم يستقر؛ نبضةٌ مشتركة 7.25
  7.30–8.10 صمت قبل القرار؛ الإصبع يصل 7.80
  8.15  «قبول العرض» + جرس التطبيق الحقيقي؛ البطاقة تنطوي في كابتنها، الثانية تتلاشى
  8.75–10 marker-motion: الكابتن يتسارع تدريجياً نحو الدبوس والخيط يقصر أمامه (الرحلة لا تكتمل)
-->
<link rel="stylesheet" href="../../../public_html/vendor/fonts/fonts.css">
<style>
@font-face { font-family: 'bootstrap-icons'; src: url('../../../public_html/vendor/bootstrap-icons/fonts/bootstrap-icons.woff2') format('woff2'); }
html, body { margin: 0; background: #111; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: #E4EAE2; }
#fx { position: absolute; inset: 0; }
#ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; background: #111; color: #ddd; font: 13px system-ui; display: flex; gap: 10px; align-items: center; }
#ui input { flex: 1; }
.probe { position: absolute; left: 0; top: 0; opacity: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="fx" width="1920" height="1080"></canvas></div>
<span class="probe" style="font-family:Cairo;font-weight:800">سعرك</span><span class="probe" style="font-family:'bootstrap-icons'">&#xf844;</span>
<div id="ui"><button id="pp">play</button><input id="sc" type="range" min="0" max="10" step="0.01" value="0"><span id="tt">0.00</span></div>
<script src="world.js"></script>
<script>
const W = 1920, H = 1080, DUR = 10, FPS = 30;
window.VIDEO = { w: W, h: H, duration: DUR, fps: FPS };
const RENDER = location.search.includes('render');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => { x = clamp(x); return 1 - Math.pow(1 - x, 4); };
const eIn = x => { x = clamp(x); return x * x * x; };
const eOut5 = x => { x = clamp(x); return 1 - Math.pow(1 - x, 5); };
// منحنيات بأوزانٍ مختلفة: البطاقة ثقيلة (تجاوزٌ صغير ثم استقرار)، الخيط يبدأ سريعاً ويستقر بنعومة
const settle = (x, over = 0.015) => { x = clamp(x); return eOut5(x) + Math.sin(x * Math.PI) * over * (1 - x) * 3; };
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };

const cv = document.getElementById('fx'), g = cv.getContext('2d');
const WD = window.WORLD, A = WD.A;
const COL = { ground: '#E4EAE2', road: '#FFFFFF', roof: '#EEF2EC', green: '#04553A', ui: '#048c5b', btn: '#198754', gold: '#BF8B1F', ink: '#0f172a' };

// ── الكاميرا: ميلٌ واحد ثابت، دفعٌ بطيء جداً، ثم تلحق الكابتن قليلاً ──
const F = 1400;
const camD = kf([[0, 1040], [8.3, 960], [9.0, 840]]);   // بعد القبول: اقترابٌ هادئ قبل أن تنفتح البطاقة الختامية
const camTX = kf([[0, A[0]], [8.3, A[0]], [9.0, lerp(A[0], WD.C1[0], 0.2)]]), camTY = kf([[0, A[1] + 30], [8.3, A[1] + 30], [9.0, lerp(A[1] + 30, WD.C1[1], 0.2)]]);
function cam(t) { return { tx: camTX(t), ty: camTY(t), D: camD(t), p: 50 * Math.PI / 180, y: 166 * Math.PI / 180, cx: W / 2 - 60, cy: H / 2 + 210 }; }
function P(c, x, y, z = 0) {
  const dx = x - c.tx, dy = y - c.ty;
  const xr = dx * Math.cos(c.y) - dy * Math.sin(c.y), yr = dx * Math.sin(c.y) + dy * Math.cos(c.y);
  const Y = yr * Math.cos(c.p) + z * Math.sin(c.p), Z = c.D + yr * Math.sin(c.p) - z * Math.cos(c.p);
  return { x: c.cx + F * xr / Z, y: c.cy - F * Y / Z, k: F / Z, Z };
}
const cum = pts => { const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return c; };
const S1 = WD.strand1, L1 = cum(S1), LR = L1[L1.length - 1], S2 = WD.strand2, L2 = cum(S2);
function along(pts, L, d) { d = clamp(d, 0, L[L.length - 1]); let i = L.findIndex(v => v >= d); if (i <= 0) return pts[0].slice(); const k = (d - L[i - 1]) / (L[i] - L[i - 1] || 1); return [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)]; }
function sub(pts, L, d0, d1) { const out = [along(pts, L, d0)]; for (let i = 0; i < pts.length; i++) if (L[i] > d0 && L[i] < d1) out.push(pts[i]); out.push(along(pts, L, d1)); return out; }

const IM = {};
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function glyph(code, x, y, size, color) { g.font = `${size}px bootstrap-icons`; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(code, x, y); }
function txt(s, x, y, size, weight, color, align = 'center') { g.font = `${weight} ${size}px Cairo`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.direction = 'rtl'; g.fillText(s, x, y); }

// ── المدينة خلفيةً وظيفية: طرقٌ بيضاء واضحة، المباني سقوفٌ مسطّحة خافتة (بلا جدران) ──
const WIDTH = { '-1': 3, 0: 6, 1: 9, 2: 13, 3: 18 };
function city(c) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  g.fillStyle = COL.roof;
  for (const b of WD.buildings) {
    const q = b.p.map(p => P(c, p[0], p[1]));
    if (q.every(v => v.x < -50 || v.x > W + 50 || v.y < -50 || v.y > H + 50) || q.some(v => v.Z < 40)) continue;
    g.beginPath(); q.forEach((v, i) => i ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)); g.closePath(); g.fill();
  }
  g.strokeStyle = COL.road;
  for (const rank of [-1, 0, 1, 2, 3]) for (const st of WD.streets) {
    if (st.r !== rank) continue;
    const q = st.p.map(p => P(c, p[0], p[1]));
    if (q.every(v => v.x < -300 || v.x > W + 300 || v.y < -300 || v.y > H + 300) || q.some(v => v.Z < 40)) continue;
    g.lineWidth = Math.min(54, Math.max(1, WIDTH[rank] * q[0].k)); g.beginPath(); q.forEach((v, i) => i ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)); g.stroke();
  }
  g.restore();
  const far = P(c, c.tx + 3000 * Math.sin(c.y), c.ty + 3000 * Math.cos(c.y)), hz = Math.min(H, Math.max(-200, far.y));
  const fog = g.createLinearGradient(0, hz, 0, hz + 420); fog.addColorStop(0, COL.ground); fog.addColorStop(1, 'rgba(228,234,226,0)');
  g.fillStyle = fog; g.fillRect(0, 0, W, hz + 420); g.fillStyle = COL.ground; g.fillRect(0, 0, W, Math.max(0, hz));
}
// الخيط: حافةٌ بيضاء وقلبٌ أخضر داكن؛ السماكة تُرفع في لحظة الوصول فقط
function thread(c, pts, w, color = COL.green, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.lineCap = 'round'; g.lineJoin = 'round';
  const s = pts.map(p => P(c, p[0], p[1]));
  for (const [col, ww] of [['#fff', w + 5], [color, w]]) { g.strokeStyle = col; g.lineWidth = ww; g.beginPath(); s.forEach((v, i) => i ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)); g.stroke(); }
  g.restore();
}

// ── عناصر الواجهة بأنماط التطبيق ──
function pin(x, y, p) {
  if (p <= 0) return; const sz = 96 * p;
  g.save(); g.fillStyle = 'rgba(16,36,28,.18)'; g.beginPath(); g.ellipse(x, y + 2, 18 * p, 7 * p, 0, 0, 7); g.fill();
  glyph('', x, y - sz * 0.48, sz, COL.ui); g.restore();
}
function marker(x, y, p, code, lift = 0, alpha = 1) {
  if (p <= 0) return null; const r = 40 * p;
  g.save(); g.globalAlpha = alpha;
  g.fillStyle = 'rgba(16,36,28,.18)'; g.beginPath(); g.ellipse(x, y + 4, r * 0.9, r * 0.35, 0, 0, 7); g.fill();
  const cy = y - r - lift;
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, cy, r + 5, 0, 7); g.fill(); g.fillStyle = COL.green; g.beginPath(); g.arc(x, cy, r, 0, 7); g.fill();
  glyph(code, x, cy + 1, r * 1.05, '#fff'); g.restore();
  return { x, y: cy - r - 5 };
}
// حقل السعر كما في التطبيق (index.html#price): +/− على أخضر، الحقل بإطارٍ داكن؛ القيمة «سعرك» (لا أرقام)
function priceField(x, y, s, bump = 0, pressPlus = 0) {
  const w = 600 * s, h = 120 * s, u = v => v * s;
  g.save(); g.translate(x, y); g.scale(1 + bump, 1 + bump); g.translate(-x, -y);
  g.fillStyle = COL.btn; rr(x - w / 2, y - h / 2, w, h, u(20)); g.fill();
  g.fillStyle = '#ecfdf3'; rr(x - w / 2 + u(118), y - h / 2 + u(10), w - u(236), h - u(20), u(14)); g.fill();
  g.strokeStyle = '#0b3d2a'; g.lineWidth = u(5); g.stroke();
  if (pressPlus > 0) { g.fillStyle = `rgba(0,0,0,${0.18 * pressPlus})`; rr(x - w / 2, y - h / 2, u(118), h, u(20)); g.fill(); }
  txt('+', x - w / 2 + u(59), y + u(2), u(70), 300, '#fff'); txt('−', x + w / 2 - u(59), y + u(2), u(70), 300, '#fff');
  txt('سعرك', x, y + u(6), u(64), 800, COL.green);
  g.restore();
  return { x: x - w / 2 + u(118), y: y - h / 2, w: w - u(236), h };
}
// بطاقة العرض بأنماط .offer-card: «كابتن» (نص التطبيق حين لا اسم)، صندوق «عرضه»، «قبول العرض» و«رفض»
const CW = 700, CH = 350;
function card(x, y, s, d) {
  const w = CW * s, h = CH * s, u = v => v * s;
  g.save(); g.shadowColor = 'rgba(4,85,58,.18)'; g.shadowBlur = u(44); g.shadowOffsetY = u(18);
  g.fillStyle = '#fff'; rr(x, y, w, h, u(30)); g.fill(); g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.strokeStyle = 'rgba(4,140,91,.24)'; g.lineWidth = u(2.5); g.stroke();
  const ax = x + w - u(84), ay = y + u(84), ar = u(52);
  const gr = g.createLinearGradient(ax - ar, ay - ar, ax + ar, ay + ar); gr.addColorStop(0, '#04553A'); gr.addColorStop(1, '#10b981');
  g.fillStyle = gr; g.beginPath(); g.arc(ax, ay, ar, 0, 7); g.fill(); glyph(d.icon, ax, ay + u(2), u(54), '#fff');
  txt('كابتن', ax - ar - u(26), y + u(86), u(62), 800, COL.ink, 'right');
  const bx = x + u(28), by = y + u(30), bw = u(230), bh = u(118);
  g.fillStyle = '#f0fdf4'; rr(bx, by, bw, bh, u(20)); g.fill(); g.strokeStyle = d.gold ? COL.gold : '#bbf7d0'; g.lineWidth = d.gold ? u(5) : u(2); g.stroke();
  txt('عرضه', bx + bw / 2, by + bh / 2 + u(4), u(60), 900, '#16a34a');
  const kx = x + w - u(28), ky = y + h - u(124), kw = u(430), kh = u(100);
  g.fillStyle = d.pressed ? COL.green : COL.btn; rr(kx - kw, ky, kw, kh, u(43)); g.fill();
  txt('قبول العرض', kx - kw / 2 + u(20), ky + kh / 2 + u(3), u(54), 700, '#fff'); glyph('', kx - kw + u(52), ky + kh / 2, u(42), '#fff');
  txt('رفض', x + u(130), ky + kh / 2 + u(3), u(52), 700, '#dc3545'); glyph('', x + u(212), ky + kh / 2, u(36), '#dc3545');
  g.restore();
  return { box: { x: bx, y: by, w: bw, h: bh }, accept: { x: kx - kw / 2, y: ky + kh / 2 } };
}
function finger(x, y, a, press, ring) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  if (ring >= 0 && ring < 1) { g.globalAlpha = a * (1 - ring) * 0.6; g.lineWidth = 3; g.strokeStyle = '#fff'; g.beginPath(); g.arc(x, y, 34 + 52 * eOut(ring), 0, 7); g.stroke(); g.globalAlpha = a; }
  g.fillStyle = `rgba(16,36,28,${0.32 + 0.12 * press})`; g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 3;
  g.beginPath(); g.arc(x, y, 34 * (1 - 0.16 * press), 0, 7); g.fill(); g.stroke(); g.restore();
}
const pressAt = (t, tp) => { const d = t - tp; return [d > -0.14 && d < 0.1 ? (d < 0 ? seg(d, -0.14, 0) : 1 - seg(d, 0, 0.1)) : 0, d >= 0 && d < 0.5 ? d / 0.5 : -1]; };

// ── لوحة الطلب كما في التطبيق: ترويسة خضراء بالشعار، حقل السعر، زرّ «اطلب الكابتن الآن» ──
const PANEL = { x: 960, y: 520, w: 820, h: 560 };
function panel(t) {
  const ent = settle(seg(t, 0, 0.55)), sendDip = Math.sin(seg(t, 1.5, 1.66) * Math.PI) * 0.03;
  const fold = seg(t, 1.72, 2.3);
  if (fold >= 1) return;
  const pA = P(cam(t), A[0], A[1]);
  // تنطوي نحو الدبوس: ثقيلةٌ في البداية ثم تُسحب (ease-in)
  const k = eIn(fold), s = lerp(1, 0.08, k) * (1 - sendDip), cx = lerp(PANEL.x, pA.x, k), cy = lerp(PANEL.y + (1 - ent) * 40, pA.y - 40, k);
  const w = PANEL.w * s, h = PANEL.h * s, x = cx - w / 2, y = cy - h / 2, u = v => v * s;
  g.save(); g.globalAlpha = 1 - seg(fold, 0.75, 1);
  g.shadowColor = 'rgba(4,85,58,.22)'; g.shadowBlur = u(60); g.shadowOffsetY = u(24);
  g.fillStyle = '#fff'; rr(x, y, w, h, u(36)); g.fill(); g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.save(); rr(x, y, w, h, u(36)); g.clip();
  g.fillStyle = COL.green; g.fillRect(x, y, w, u(132));
  if (IM.logo) { const lw = u(250), lh = lw * IM.logo.height / IM.logo.width; g.drawImage(IM.logo, x + u(46), y + u(66) - lh / 2, lw, lh); }
  g.restore();
  const plusP = pressAt(t, 0.8), bump = Math.sin(seg(t, 0.84, 1.18) * Math.PI) * 0.05;
  priceField(cx, y + u(250), s, bump, plusP[0]);
  // زرّ الإرسال (.btn-submit: حبّة متدرّجة، أيقونة الصاروخ)
  const bw = u(600), bh = u(116), bx = cx - bw / 2, by = y + u(370), sendP = pressAt(t, 1.6);
  const gr = g.createLinearGradient(bx, by, bx + bw, by + bh); gr.addColorStop(0, '#0A8754'); gr.addColorStop(1, '#04553A');
  g.save(); g.translate(cx, by + bh / 2); g.scale(1 - 0.04 * sendP[0], 1 - 0.04 * sendP[0]); g.translate(-cx, -(by + bh / 2));
  g.shadowColor = 'rgba(10,135,84,.3)'; g.shadowBlur = u(26); g.shadowOffsetY = u(8); g.fillStyle = gr; rr(bx, by, bw, bh, bh / 2); g.fill(); g.shadowBlur = 0;
  txt('اطلب الكابتن الآن', cx + u(26), by + bh / 2 + u(4), u(50), 800, '#fff'); glyph('', cx + u(250), by + bh / 2, u(42), '#fff');
  g.restore();
  g.restore();
  // الإصبع: «+» ثم الإرسال
  const fa = seg(t, 0.45, 0.6) * (1 - seg(t, 1.66, 1.8));
  const fx = kf([[0.45, cx - u(240)], [0.72, cx - u(241)], [1.25, cx - u(241)], [1.52, cx + u(40)]])(t), fy = kf([[0.45, y + u(250)], [1.25, y + u(250)], [1.52, by + bh / 2]])(t);
  const pp = t < 1.2 ? plusP : sendP; finger(fx, fy, fa, pp[0], pp[1]);
}

async function draw(t) {
  const c = cam(t);
  g.fillStyle = COL.ground; g.fillRect(0, 0, W, H);
  city(c);
  // في البداية: المدينة خلف لوحة الطلب تحت طبقةٍ فاتحة تنقشع حين يُرسل الطلب
  const veil = 1 - eOut(seg(t, 1.8, 2.5));
  if (veil > 0) { g.fillStyle = `rgba(244,247,243,${0.82 * veil})`; g.fillRect(0, 0, W, H); }

  const pA = P(c, A[0], A[1]);
  // البحث: نبضتان من radarPulse فقط — يتوقف حين ينطلق الخيط
  for (let k = 0; k < 2; k++) {
    const t0 = 2.35 + k * 0.55, u = (t - t0) / 1.6; if (u < 0 || u > 1) continue;
    const R = 260 * lerp(0.3, 1, eOut(u)), pts = []; for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2; pts.push([A[0] + R * Math.cos(a), A[1] + R * Math.sin(a)]); }
    g.save(); g.globalAlpha = (1 - u) * 0.85; g.strokeStyle = COL.ui; g.lineWidth = 4; g.beginPath(); pts.forEach((p, i) => { const s = P(c, p[0], p[1]); i ? g.lineTo(s.x, s.y) : g.moveTo(s.x, s.y); }); g.stroke(); g.restore();
  }
  // الخيط إلى أقرب كابتن: يبدأ سريعاً ويتباطأ ويستقر؛ أعرض لحظة وصوله فقط
  const reach = LR * eOut(seg(t, 3.4, 4.1)), dv = driveS(t);
  const thick = 6 + 3 * Math.sin(seg(t, 3.9, 4.6) * Math.PI);
  if (t >= 3.4 && t < 8.5 && reach > 1) thread(c, sub(S1, L1, 0, reach), thick);
  if (t >= 8.5) thread(c, sub(S1, L1, 0, LR - dv), 7);
  // العرض الثاني: خيطٌ خافت
  const r2 = L2[L2.length - 1] * ease(seg(t, 5.2, 5.75)), fade2 = 1 - seg(t, 8.25, 8.55);
  if (t >= 5.2 && fade2 > 0) thread(c, sub(S2, L2, 0, r2), 4, COL.ui, 0.55 * fade2);

  pin(pA.x, pA.y, t < 2.15 ? 0 : clamp(eOut5(seg(t, 2.15, 2.5)) * 1.04 - 0.04 * seg(t, 2.4, 2.6)));
  // «سعرك» يبقى مع الطلب تحت الدبوس، ويعود إليه بعد القبول
  let chip = null;
  if (t >= 2.15) {
    const p = settle(seg(t, 2.15, 2.75)), back = eIn(seg(t, 8.25, 8.55)), bump = Math.sin(seg(t, 7.2, 7.55) * Math.PI) * 0.07;
    const s = lerp(0.2, 0.62, p) * (1 - back);
    if (s > 0.02) { g.save(); g.globalAlpha = 1 - seg(back, 0.6, 1); const r = priceField(pA.x, pA.y + 92, s, bump); g.restore(); chip = { x: r.x + r.w / 2, y: r.y }; }
  }
  // الكابتن الأقرب: Anticipation (ينخفض ثم يرتفع) قبل أن تنهض بطاقته
  const cpos = t >= 8.5 ? along(S1, L1, LR - dv) : WD.C1, cS = P(c, cpos[0], cpos[1]);
  const lift = -6 * Math.sin(seg(t, 4.12, 4.28) * Math.PI) + 10 * Math.sin(seg(t, 4.26, 4.5) * Math.PI);
  const m1 = marker(cS.x, cS.y, clamp(eOut5(seg(t, 3.95, 4.2))), '', lift);
  const c2 = P(c, WD.C2[0], WD.C2[1]);
  const m2 = t >= 5.6 ? marker(c2.x, c2.y, eOut5(seg(t, 5.6, 5.85)) * 0.8, '', 0, 0.75 * fade2) : null;

  // العرض الثاني (ثانوي): أصغر وأخفت — لا ينافس الأول
  if (m2 && fade2 > 0) {
    const p = settle(seg(t, 5.75, 6.35)), s = 0.62, w = CW * s, h = CH * s;
    const x = Math.max(70, m2.x - w * 0.7), y = lerp(m2.y - 20, m2.y - 40 - h, p);
    g.save(); g.globalAlpha = p * 0.8 * fade2; g.strokeStyle = COL.ui; g.lineWidth = 3; g.beginPath(); g.moveTo(m2.x, m2.y); g.lineTo(x + w * 0.7, y + h); g.stroke();
    card(x, y, s * lerp(0.9, 1, p), { icon: '' }); g.restore();
  }
  // العرض الأول — البطل: ينهض من كابتنه بوزن ويستقر، ويُقرأ وحده
  let c1 = null;
  if (m1 && t >= 4.3) {
    const p = settle(seg(t, 4.3, 4.95)), fold = eIn(seg(t, 8.25, 8.55));
    const s = lerp(0.1, 1, p) * lerp(1, 0.06, fold), w = CW * s, h = CH * s;
    const tx = Math.min(W - 90 - CW, m1.x - CW * 0.35), ty = m1.y - 64 - CH;
    const x = lerp(m1.x - w / 2, lerp(tx, m1.x - w / 2, fold), p), y = lerp(m1.y - h, lerp(ty, m1.y - h, fold), p);
    g.save(); g.globalAlpha = clamp(p * 1.8) * (1 - seg(fold, 0.7, 1));
    g.strokeStyle = COL.green; g.lineWidth = 5; g.beginPath(); g.moveTo(m1.x, m1.y); g.lineTo(x + w * 0.35, y + h); g.stroke();
    c1 = card(x, y, s, { icon: '', gold: t > 7.15 && t < 8.4, pressed: t > 8.15 && t < 8.3 });
    g.restore();
  }
  // «سعرك» ← «عرضه»: خيطٌ ذهبي يُرسم ببطء، يصل بتجاوزٍ صغير ثم يستقر
  if (chip && c1 && t >= 6.5 && t < 8.45) {
    const k = seg(t, 6.5, 7.2), reachK = clamp(ease(k) * 1.02 - 0.02 * seg(t, 7.2, 7.4)), a = 1 - seg(t, 8.2, 8.45);
    const tgt = { x: c1.box.x - 4, y: c1.box.y + c1.box.h / 2 };   // يصل «عرضه» من خارج البطاقة (حافتها اليسرى)
    const mx = Math.min(chip.x, tgt.x) - 170, my = (chip.y + tgt.y) / 2;
    g.save(); g.globalAlpha = a; g.strokeStyle = COL.gold; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath();
    for (let i = 0; i <= 50 * clamp(reachK); i++) { const u = i / 50; const x = (1 - u) ** 2 * chip.x + 2 * (1 - u) * u * mx + u * u * tgt.x, y = (1 - u) ** 2 * chip.y + 2 * (1 - u) * u * my + u * u * tgt.y; i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke(); g.restore();
  }
  // القرار: صمتٌ، الإصبع يصل 7.80، الضغط 8.15
  if (c1) { const [pr, ring] = pressAt(t, 8.15); finger(c1.accept.x, c1.accept.y, seg(t, 7.75, 7.95) * (1 - seg(t, 8.28, 8.4)), pr, ring); }

  panel(t);
  endCard(t, pA);
  const att = seg(t, 2.4, 2.8) * (1 - seg(t, 8.6, 8.8)); if (att > 0) { g.save(); g.globalAlpha = att * 0.55; g.font = '16px Arial'; g.fillStyle = COL.ink; g.textAlign = 'left'; g.direction = 'ltr'; g.fillText('Map data © OpenStreetMap contributors', 24, H - 20); g.restore(); }
}
// البطاقة الختامية (8.60–10.0): رأس دبوس الطلب ينفتح دائرةً بأخضر العلامة تملأ الإطار — نقطة الطلب صارت وجيز —
// ثم الشعار الحقيقي و«اطلب الكابتن الآن» (نص زرّ الإرسال في التطبيق وأيقونته)، وثباتٌ حتى النهاية
function endCard(t, pA) {
  if (t < 8.6) return;
  const ox = pA.x, oy = pA.y - 58, R = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy)) + 20;
  const open = seg(t, 8.6, 8.95), r = lerp(10, R, open < 0.5 ? 2 * open * open : 1 - Math.pow(-2 * open + 2, 2) / 2);
  g.save(); g.fillStyle = COL.green; g.beginPath(); g.arc(ox, oy, r, 0, 7); g.fill(); g.restore();
  const la = eOut(seg(t, 8.9, 9.2)), ca = eOut(seg(t, 9.05, 9.35));
  if (la > 0 && IM.logo) { const lw = 620, lh = lw * IM.logo.height / IM.logo.width; g.save(); g.globalAlpha = la; g.drawImage(IM.logo, W / 2 - lw / 2, 430 - lh / 2 + (1 - la) * 18, lw, lh); g.restore(); }
  if (ca > 0) {
    const bw = 620, bh = 120, bx = W / 2 - bw / 2, by = 650 + (1 - ca) * 16;
    g.save(); g.globalAlpha = ca; g.fillStyle = '#fff'; rr(bx, by, bw, bh, bh / 2); g.fill();
    txt('اطلب الكابتن الآن', W / 2 - 24, by + bh / 2 + 4, 54, 800, COL.green); glyph('', W / 2 + 248, by + bh / 2, 44, COL.green);
    g.restore();
  }
}
// marker-motion: تسارعٌ تدريجي من السكون، ثم سرعةٌ ثابتة — الرحلة لا تكتمل في الـ Preview
function driveS(t) { if (t <= 8.5) return 0; const u = t - 8.5; return 70 * u * u; }   // marker-motion: يتسارع من السكون، ولا يتوقف أمام الكاميرا

window.seek = async t => { await draw(clamp(t, 0, DUR - 1e-6)); };
(async () => {
  IM.logo = await load('../assets/logo-white.png');
  await document.fonts.load('800 64px Cairo'); await document.fonts.load('60px bootstrap-icons'); await document.fonts.ready;
  window.READY = true;
  if (RENDER) { document.getElementById('ui').remove(); return; }
  const stage = document.getElementById('stage'); const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 50) / H); stage.style.transform = `scale(${s})`; }; fit(); addEventListener('resize', fit);
  let playing = false, t0 = 0, off = 0; const now = () => playing ? (off + (performance.now() - t0) / 1000) % DUR : off;
  document.getElementById('pp').onclick = () => { if (playing) { off = now(); playing = false; } else { t0 = performance.now(); playing = true; } };
  document.getElementById('sc').oninput = e => { off = +e.target.value; playing = false; };
  (async function loop() { const t = now(); await seek(t); document.getElementById('tt').textContent = t.toFixed(2); if (playing) document.getElementById('sc').value = t; requestAnimationFrame(loop); })();
})();
</script>
