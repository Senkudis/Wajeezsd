<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Ar;src:url('../brand-fonts/alarabiya/Alarabiya Normal Font.ttf')}
@font-face{font-family:ArB;src:url('../brand-fonts/arabic-modern/ArabicModern-Bold.otf')}
@font-face{font-family:En;src:url('../brand-fonts/intro/Intro Bold Alt.otf')}

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="edit.js"></script>
<script>
// طبقة الموشن v3 — مبدأ واحد: لا شيء يغطّي المتكلّم.
//  • لقطات المتكلّم: عنوان قصير في الفراغ فوق الرأس + ترجمة بلا صندوق في الثلث السفلي.
//  • المعلومة البصرية (المشكلة، الشعار، شاشة التطبيق) = مشهد قطع كامل 1–3 ث ثم عودة للوجه.
//  • منحنيات حركة ثابتة: easeOut للدخول، easeIn للخروج، ومدد قصيرة (0.25–0.45 ث).
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1080, H = 1920, CX = 500;          // مركز المحتوى يسار أزرار المنصّات قليلاً
const COL = { g: '#048c5b', gd: '#033A27', ink: '#0d1117', gold: '#F5A623', w: '#ffffff', red: '#d64545' };
const E = window.EDIT;

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (p) => 1 - Math.pow(1 - p, 3);
const eIn = (p) => p * p * p;
const eIO = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eio = eIO, eo = eOut;   // أسماء قديمة تستعملها بطاقة النهاية
const life = (t, a, b, i = .3, o = .2) => Math.min(eOut(lin(t, a, a + i)), 1 - eIn(lin(t, b - o, b)));

const img = {};
function load(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { img[k] = i; r(); }; i.onerror = () => r(); i.src = src; }); }
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function font(f, s) { X.font = `${s}px ${f}`; }
function shadow(b = 24, a = .35, y = 8) { X.shadowColor = `rgba(0,0,0,${a})`; X.shadowBlur = b; X.shadowOffsetY = y; }
function noShadow() { X.shadowColor = 'transparent'; X.shadowBlur = 0; X.shadowOffsetY = 0; }

const ICON = {
  bike(s) { X.beginPath(); X.arc(-s*.32, s*.22, s*.2, 0, 7); X.moveTo(s*.52, s*.22); X.arc(s*.32, s*.22, s*.2, 0, 7);
    X.moveTo(-s*.32, s*.22); X.lineTo(-s*.05, -s*.12); X.lineTo(s*.22, -s*.12); X.lineTo(s*.32, s*.22);
    X.moveTo(-s*.05, -s*.12); X.lineTo(s*.06, s*.22); X.lineTo(s*.32, s*.22); X.moveTo(s*.16, -s*.12); X.lineTo(s*.1, -s*.32); X.lineTo(s*.26, -s*.32); X.stroke(); },
  moto(s) { // موتر: عجلتان، جسم، صندوق توصيل خلفي، مقود
    X.beginPath(); X.arc(-s*.3, s*.2, s*.15, 0, 7); X.moveTo(s*.45, s*.2); X.arc(s*.3, s*.2, s*.15, 0, 7); X.stroke();
    X.beginPath(); X.moveTo(-s*.3, s*.2); X.lineTo(-s*.12, s*.02); X.lineTo(s*.14, s*.02); X.lineTo(s*.3, s*.2); X.moveTo(s*.14, s*.02); X.lineTo(s*.2, -s*.18); X.lineTo(s*.3, -s*.2); X.stroke();
    rr(-s*.44, -s*.26, s*.28, s*.24, 3); X.stroke(); },
  fuel(s) { rr(-s*.3, -s*.36, s*.4, s*.74, s*.06); X.stroke(); rr(-s*.22, -s*.26, s*.24, s*.18, 3); X.stroke();
    X.beginPath(); X.moveTo(s*.1, -s*.14); X.lineTo(s*.26, -s*.04); X.lineTo(s*.26, s*.22); X.lineTo(s*.36, s*.22); X.lineTo(s*.36, -s*.24); X.stroke(); },
  car(s) { X.beginPath(); X.moveTo(-s*.4, s*.12); X.lineTo(-s*.4, -s*.04); X.lineTo(-s*.26, -s*.08); X.lineTo(-s*.14, -s*.28); X.lineTo(s*.16, -s*.28); X.lineTo(s*.28, -s*.08); X.lineTo(s*.4, -s*.04); X.lineTo(s*.4, s*.12); X.closePath(); X.stroke();
    X.beginPath(); X.arc(-s*.22, s*.14, s*.09, 0, 7); X.moveTo(s*.31, s*.14); X.arc(s*.22, s*.14, s*.09, 0, 7); X.stroke(); },
  queue(s) { for (const dx of [-.28, 0, .28]) { X.beginPath(); X.arc(s*dx, -s*.14, s*.09, 0, 7); X.stroke(); X.beginPath(); X.arc(s*dx, s*.22, s*.13, Math.PI, 0); X.stroke(); } },
  bag(s) { rr(-s*.34, -s*.18, s*.68, s*.56, s*.08); X.stroke(); X.beginPath(); X.arc(0, -s*.18, s*.17, Math.PI, 0); X.stroke(); },
  pin(s) { X.beginPath(); X.moveTo(0, s*.42); X.bezierCurveTo(-s*.12, s*.2, -s*.34, s*.02, -s*.34, -s*.14); X.arc(0, -s*.14, s*.34, Math.PI, 0); X.bezierCurveTo(s*.34, s*.02, s*.12, s*.2, 0, s*.42); X.stroke(); X.beginPath(); X.arc(0, -s*.14, s*.11, 0, 7); X.stroke(); },
  wallet(s) { rr(-s*.4, -s*.26, s*.8, s*.56, s*.08); X.stroke(); X.beginPath(); X.moveTo(-s*.4, -s*.1); X.lineTo(s*.4, -s*.1); X.stroke(); X.beginPath(); X.arc(s*.22, s*.1, s*.05, 0, 7); X.fill(); },
  store(s) { X.beginPath(); X.moveTo(-s*.4, -s*.08); X.lineTo(-s*.32, -s*.34); X.lineTo(s*.32, -s*.34); X.lineTo(s*.4, -s*.08); X.closePath(); X.stroke(); rr(-s*.34, -s*.08, s*.68, s*.46, 4); X.stroke(); rr(-s*.1, s*.12, s*.2, s*.26, 3); X.stroke(); },
  clock(s) { X.beginPath(); X.arc(0, 0, s*.38, 0, 7); X.stroke(); X.beginPath(); X.moveTo(0, -s*.22); X.lineTo(0, 0); X.lineTo(s*.16, s*.1); X.stroke(); },
  phone(s) { rr(-s*.22, -s*.4, s*.44, s*.8, s*.08); X.stroke(); X.beginPath(); X.moveTo(-s*.06, s*.3); X.lineTo(s*.06, s*.3); X.stroke(); },
  check(s) { X.beginPath(); X.moveTo(-s*.26, 0); X.lineTo(-s*.06, s*.2); X.lineTo(s*.3, -s*.2); X.stroke(); },
};

// ── أيقونات خطّية موحّدة: شبكة 24×24، سُمك موحّد، أطراف مستديرة (على نمط Lucide، ترخيص ISC) ──
const LI = {
  car: ['M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2', 'M9 17h6', 'M5 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0', 'M15 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0'],
  fuel: ['M3 22h12', 'M4 9h10', 'M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18', 'M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5'],
  users: ['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2', 'M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0', 'M22 21v-2a4 4 0 0 0-3-3.87', 'M16 3.13a4 4 0 0 1 0 7.75'],
  bag: ['M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z', 'M3 6h18', 'M16 10a4 4 0 0 1-8 0'],
  pin: ['M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z', 'M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'],
  tag: ['M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z', 'M7 7.5a.5.5 0 1 0 1 0a.5.5 0 1 0 -1 0'],
  zap: ['M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z'],
  phone: ['M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z', 'M12 18h.01'],
  plane: ['M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z'],
  help: ['M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0', 'M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3', 'M12 17h.01'],
};
const LP = {}; for (const k in LI) LP[k] = LI[k].map(d => new Path2D(d));
// x,y = المركز؛ s = الحجم بالبكسل؛ السُّمك بوحدات الشبكة (2 من 24) فيبقى متناسباً مهما كبرت الأيقونة
function licon(name, x, y, s, color, sw = 2) {
  if (!LP[name] || s <= 0) return; X.save(); X.translate(x - s / 2, y - s / 2); X.scale(s / 24, s / 24);
  X.strokeStyle = color; X.lineWidth = sw; X.lineCap = 'round'; X.lineJoin = 'round';
  for (const p of LP[name]) X.stroke(p); X.restore();
}
// نابض مغلق الصيغة (مبدأ motion-broll): كل تغيير هدفٍ نابضٌ يُجمع فوق السابق — دالة صِرفة لـ t، لا حالة بين الإطارات
const SPR = { MORPH: [14, .78], FAST: [22, .9], SOFT: [9, .85] };
function spring(dt, w, z) { if (dt <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt)); }
function track(v0, keys, sp = SPR.MORPH) { return (t) => { let v = v0, prev = v0; for (const [tk, val] of keys) { v += (val - prev) * spring(t - tk, sp[0], sp[1]); prev = val; } return v; }; }

function icon(name, x, y, s, color, lw) { X.save(); X.translate(x, y); X.strokeStyle = color; X.fillStyle = color; X.lineWidth = lw || s * .07; X.lineCap = 'round'; X.lineJoin = 'round'; ICON[name](s); X.restore(); }

// نص بحدّ داكن وظل ناعم — مقروء فوق أي خلفية بلا صندوق
function outlined(text, x, y, fill, stroke = 'rgba(0,0,0,.85)', sw = 13) {
  X.lineJoin = 'round'; X.miterLimit = 2;
  shadow(18, .45, 4); X.strokeStyle = stroke; X.lineWidth = sw; X.strokeText(text, x, y); noShadow();
  X.fillStyle = fill; X.fillText(text, x, y);
}

// تظليل سفلي خفيف جداً لقراءة الترجمة (لا يُرى كصندوق)
function grades() {
  const g = X.createLinearGradient(0, 1250, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.30)');
  X.fillStyle = g; X.fillRect(0, 1250, W, H - 1250);
  // شريط ظلّ ناعم خلف الترجمة (بلا حواف) لتُقرأ فوق القميص المخطّط
  const b = X.createLinearGradient(0, 1330, 0, 1680); b.addColorStop(0, 'rgba(0,0,0,0)'); b.addColorStop(.45, 'rgba(0,0,0,.34)'); b.addColorStop(1, 'rgba(0,0,0,0)');
  X.fillStyle = b; X.fillRect(0, 1330, W, 350);
}

function progress(t) {
  if (t > E.endcard) return; const p = clamp(t / E.endcard);
  X.fillStyle = 'rgba(255,255,255,.18)'; X.fillRect(0, 0, W, 6);
  X.fillStyle = COL.gold; X.fillRect(W - W * p, 0, W * p, 6);
}

// ── شارة الشعار الصغيرة (أعلى اليسار، تحت شريط المنصّة) ──
function bug(t) {
  const a = life(t, E.bug[0], E.bug[1], .5, .3); if (a <= 0 || !img.logo) return;
  const w = 150, h = w * img.logo.height / img.logo.width;
  X.save(); X.globalAlpha = a * .9; X.drawImage(img.logo, 64, 176, w, h); X.restore();
}

// ── عنوان في فراغ الرأس: كلمة/عبارة واحدة تلخّص الجملة ──
function heads(t) {
  for (const h of E.heads || []) {
    const a = life(t, h.s, h.e, .3, .2); if (a <= 0) continue;
    const p = eOut(lin(t, h.s, h.s + .35));
    X.save(); X.globalAlpha = a; X.direction = 'rtl'; X.textAlign = 'center';
    let y = h.y || 330;
    if (h.icon) { // أيقونة في قرص أبيض فوق العنوان، تدخل بنابض
      const ip = spring(t - h.s, ...SPR.FAST), r = 54 * ip; X.save(); shadow(24, .3, 8);
      X.beginPath(); X.arc(W / 2, y - 150, Math.max(0, r), 0, 7); X.fillStyle = '#fff'; X.fill(); noShadow();
      if (ip > .2) licon(h.icon, W / 2, y - 150, 60 * ip, COL.g, 2.2); X.restore(); }
    if (h.kicker) { font('ArB', 46); const kw = X.measureText(h.kicker).width;
      const kp = eOut(lin(t, h.s, h.s + .3)); rr(W / 2 - kw / 2 - 26, y - 150 + (1 - kp) * 16, kw + 52, 68, 34); X.fillStyle = COL.g; X.fill();
      X.fillStyle = '#fff'; X.fillText(h.kicker, W / 2, y - 102 + (1 - kp) * 16); }
    let size = h.size || 88; font('ArB', size); const tw = X.measureText(h.t).width; if (tw > 820) { size = Math.floor(size * 820 / tw); font('ArB', size); }
    X.translate(0, (1 - p) * 26);
    if (h.accent && h.t.endsWith(h.accent)) { const head = h.t.slice(0, -h.accent.length), tw2 = X.measureText(h.t).width;
      X.textAlign = 'right'; outlined(head, W / 2 + tw2 / 2, y, '#fff', 'rgba(0,0,0,.6)', 12);
      X.textAlign = 'left'; outlined(h.accent, W / 2 - tw2 / 2, y, COL.gold, 'rgba(0,0,0,.6)', 12); X.textAlign = 'center';
    } else outlined(h.t, W / 2, y, '#fff', 'rgba(0,0,0,.6)', 12);
    // خطّ ذهبي يتمدّد تحت العنوان
    const u = eOut(lin(t, h.s + .15, h.s + .55)), uw = Math.min(X.measureText(h.t).width, 420) * u;
    X.fillStyle = COL.gold; rr(W / 2 - uw / 2, y + 26, uw, 8, 4); X.fill();
    X.restore();
  }
}

// ── الترجمة: بلا صندوق، سطر أو سطران، الكلمة الحالية ذهبية ──
function captions(t) {
  const ch = E.captions.find(c => t >= c.s - .04 && t < c.e + .1); if (!ch) return;
  const a = life(t, ch.s - .04, ch.e + .1, .1, .08);
  const size = 74; font('ArB', size); X.direction = 'rtl';
  const ws = ch.words.map(w => X.measureText(w.w).width), gap = size * .3;
  const width = (a0, b0) => ws.slice(a0, b0).reduce((p, q) => p + q, 0) + gap * (b0 - a0 - 1);
  let rows = [[0, ws.length]];
  if (width(0, ws.length) > 760 && ws.length > 1) {
    let best = 1, bd = 1e9;
    for (let k = 1; k < ws.length; k++) { const d = Math.max(width(0, k), width(k, ws.length)); if (d < bd) { bd = d; best = k; } }
    rows = [[0, best], [best, ws.length]];
  }
  const lh = size * 1.22, y0 = E.capY - (rows.length - 1) * lh;
  X.save(); X.globalAlpha = a; X.textAlign = 'right'; X.textBaseline = 'alphabetic';
  if (ch.q) { // الصوت من وراء الكاميرا: وسم صغير فوق الترجمة
    font('ArB', 70); X.textAlign = 'center'; outlined(E.qLabel + ':', CX, y0 - size - 10, COL.gold, 'rgba(0,0,0,.75)', 10);
    font('ArB', size); X.textAlign = 'right';
  }
  rows.forEach(([r0, r1], ri) => {
    const ly = y0 + ri * lh; let x = CX + width(r0, r1) / 2;
    for (let i = r0; i < r1; i++) {
      const w = ch.words[i], on = t >= w.s && t < w.e + .06;
      const fill = on ? COL.gold : (ch.q ? '#e9efe9' : '#ffffff');
      X.save();
      if (on) { const k = eOut(lin(t, w.s, w.s + .1)), s = 1 + .06 * k, mx = x - ws[i] / 2; X.translate(mx, ly); X.scale(s, s); X.translate(-mx, -ly); }
      outlined(w.w, x, ly, fill);
      X.restore(); x -= ws[i] + gap;
    }
  });
  X.restore();
}

// ── خلفية المشاهد الكاملة: أخضر الهوية مع ضوء مائل بطيء ──
function sceneBg(t, s, tone) {
  const pr = tone === 'problem';   // المشكلة: فحمي مع توهّج أحمر — والحل لاحقاً بأخضر الهوية
  let g = X.createLinearGradient(0, 0, 0, H);
  if (pr) { g.addColorStop(0, '#2a1416'); g.addColorStop(.6, '#141012'); g.addColorStop(1, '#070607'); }
  else { g.addColorStop(0, '#05593f'); g.addColorStop(.6, COL.gd); g.addColorStop(1, '#06120d'); }
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  const k = Math.max(0, t - s), gx = 200 + 120 * Math.sin(k * .8);
  g = X.createRadialGradient(gx, 520, 30, gx, 520, 820);
  g.addColorStop(0, pr ? 'rgba(214,69,69,.38)' : 'rgba(4,140,91,.55)'); g.addColorStop(1, pr ? 'rgba(214,69,69,0)' : 'rgba(4,140,91,0)');
  X.fillStyle = g; X.fillRect(0, 0, W, H);
}

// مشهد المشكلة: ثلاث بطاقات كبيرة تظهر مع كل كلمة
function scenePains(t, sc) {
  sceneBg(t, sc.s, sc.tone);
  // اهتزاز قصير يتلاشى مع كل ضربة
  let sh = 0; for (const it of sc.items) { const d = t - it.t; if (d >= 0 && d < .18) sh = Math.max(sh, 14 * (1 - d / .18)); }
  X.save(); X.translate(sh * Math.sin(t * 157), sh * Math.cos(t * 131));
  X.direction = 'rtl'; X.textAlign = 'center';
  const tp = eOut(lin(t, sc.s, sc.s + .3)); X.globalAlpha = tp; font('ArB', 96); const ty = 430 + (1 - tp) * 20;
  if (sc.accent && sc.title.endsWith(sc.accent)) { // الكلمة المفتاحية بالذهبي، والباقي أبيض — كل جزء يُرسم مرة واحدة
    const head = sc.title.slice(0, -sc.accent.length), tw = X.measureText(sc.title).width;
    X.textAlign = 'right'; outlined(head, W / 2 + tw / 2, ty, '#fff', 'rgba(0,0,0,.5)', 10);
    X.textAlign = 'left'; outlined(sc.accent, W / 2 - tw / 2, ty, COL.gold, 'rgba(0,0,0,.5)', 10); X.textAlign = 'center';
  } else outlined(sc.title, W / 2, ty, '#fff', 'rgba(0,0,0,.5)', 10);
  const q = sc.q ? eOut(lin(t, sc.q.t, sc.q.t + .25)) : 0;   // لحظة السؤال: البطاقات تنسحب والسؤال يتصدّر
  sc.items.forEach((it, i) => {
    const p = eOut(lin(t, it.t, it.t + .32)) * (1 - q); if (p <= 0) return;
    const y = 560 + i * 230, w = 760, h = 190, x = W / 2 - w / 2;
    X.globalAlpha = p; X.save(); X.translate(0, (1 - p) * 40);
    shadow(40, .35, 14); rr(x, y, w, h, 36); X.fillStyle = 'rgba(255,255,255,.97)'; X.fill(); noShadow();
    X.beginPath(); X.arc(x + w - 110, y + h / 2, 64, 0, 7); X.fillStyle = COL.red; X.fill(); icon(it.icon, x + w - 110, y + h / 2, 92, '#fff', 6.5);
    X.textAlign = 'right'; font('ArB', 72); X.fillStyle = COL.ink; X.fillText(it.label, x + w - 210, y + h / 2 + 26);
    X.restore();
  });
  if (q > 0) {
    X.globalAlpha = q; X.textAlign = 'center'; const s2 = .8 + .2 * q; X.save(); X.translate(W / 2, 900); X.scale(s2, s2);
    font('ArB', 150); outlined(sc.q.text, 0, 0, COL.gold, 'rgba(0,0,0,.55)', 14); X.restore();
  }
  X.restore();
}

// ── مشهد المشكلة (v6): شكل واحد لا يُقطع — يتبدّل حجمه وزواياه ولونه من حالة لحالة بنابض،
//    والمحتوى داخله يتبادل بضبابية قصيرة. تحته عدّاد يجمع المشاكل الثلاث (إنفوجرافيك تراكمي). ──
const MS = {
  market:  { w: 640, h: 200, r: 100, bg: '#ffffff', icon: 'bag',   label: 'مشوار السوق', ic: COL.ink },
  traffic: { w: 760, h: 560, r: 64,  bg: '#ffffff', icon: 'car',   label: 'الزحمة', ic: COL.red, n: 1 },
  fuel:    { w: 760, h: 560, r: 64,  bg: '#ffffff', icon: 'fuel',  label: 'البنزين الغالي', ic: COL.red, n: 2 },
  queue:   { w: 760, h: 560, r: 64,  bg: '#ffffff', icon: 'users', label: 'الصفوف', ic: COL.red, n: 3 },
  q:       { w: 880, h: 300, r: 150, bg: COL.gold,  icon: 'help',  label: 'عندك حل؟', ic: COL.ink },
};
const hexRGB = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function sceneMorph(t, sc) {
  sceneBg(t, sc.s, sc.tone);
  const st = sc.states, k0 = MS[st[0][1]], ks = (f) => st.slice(1).map(([tk, n]) => [tk, f(MS[n])]);
  sc._w = sc._w || track(k0.w, ks(m => m.w));
  sc._h = sc._h || track(k0.h, ks(m => m.h));
  sc._r = sc._r || track(k0.r, ks(m => m.r));
  sc._c = sc._c || [0, 1, 2].map(i => track(hexRGB(k0.bg)[i], ks(m => hexRGB(m.bg)[i]), SPR.FAST));
  const intro = spring(t - sc.s, ...SPR.FAST);                      // الشكل يقفز للوجود مرة واحدة
  const w = sc._w(t) * (.6 + .4 * intro), h = sc._h(t) * (.6 + .4 * intro), r = Math.min(sc._r(t), h / 2), cy = 900;
  // العنوان الثابت فوق
  X.save(); X.direction = 'rtl'; const tp = eOut(lin(t, sc.s, sc.s + .3)); X.globalAlpha = tp; font('ArB', 92);
  const ty = 380 + (1 - tp) * 20, tw = X.measureText(sc.title).width, head = sc.title.slice(0, -sc.accent.length);
  X.textAlign = 'right'; outlined(head, W / 2 + tw / 2, ty, '#fff', 'rgba(0,0,0,.5)', 10);
  X.textAlign = 'left'; outlined(sc.accent, W / 2 - tw / 2, ty, COL.gold, 'rgba(0,0,0,.5)', 10); X.restore();
  // الشكل
  X.save(); X.globalAlpha = Math.min(1, intro * 1.5); shadow(60, .45, 22); rr(W / 2 - w / 2, cy - h / 2, w, h, r);
  X.fillStyle = `rgb(${sc._c.map(f => Math.round(f(t))).join(',')})`; X.fill(); noShadow(); X.restore();
  // المحتوى: كل حالة طبقة تدخل بضبابية وتخرج أسرع (تبادل لا قطع)
  st.forEach(([tin, n], i) => {
    const tout = i + 1 < st.length ? st[i + 1][0] : sc.e + 1, S = MS[n];
    const inP = eOut(lin(t, tin + .05, tin + .28)), outP = eIn(lin(t, tout - .02, tout + .1)), o = Math.min(inP, 1 - outP);
    if (o <= .01) return;
    X.save(); X.globalAlpha = o; X.filter = `blur(${((1 - inP) * 14 + outP * 10).toFixed(1)}px)`;
    X.direction = 'rtl'; X.textAlign = 'center';
    if (n === 'market' || n === 'q') { // حبّة عريضة: أيقونة + نص في سطر
      const big = n === 'q'; font('ArB', big ? 118 : 76);
      const lw2 = X.measureText(S.label).width, is = big ? 110 : 76, gap = 28, tot = lw2 + is + gap;
      X.fillStyle = S.ic; X.textAlign = 'right'; X.fillText(S.label, W / 2 + tot / 2, cy + (big ? 40 : 27));
      licon(S.icon, W / 2 - tot / 2 + is / 2, cy, is, S.ic, 2.2);
    } else { // بطاقة كبيرة: قرص أيقونة أحمر فاتح + عنوان
      const s2 = .92 + .08 * inP; X.translate(W / 2, cy); X.scale(s2, s2);
      X.beginPath(); X.arc(0, -70, 130, 0, 7); X.fillStyle = 'rgba(214,69,69,.12)'; X.fill();
      licon(S.icon, 0, -70, 150, COL.red, 1.9);
      font('ArB', 96); X.fillStyle = COL.ink; X.fillText(S.label, 0, 190);
    }
    X.restore();
  });
  // العدّاد التراكمي: كل مشكلة تستقرّ أيقونةً صغيرة في صفّ فوق الشكل (يمين ← يسار)
  const pains = st.filter(([, n]) => MS[n].n);
  pains.forEach(([tk, n], i) => {
    const sp = spring(t - tk - .15, ...SPR.FAST); if (sp <= .01) return;
    const x = W / 2 + (1 - i) * 150, y = 515;   // بين العنوان والشكل: بعيداً عن الترجمة في الثلث السفلي
    X.save(); X.globalAlpha = Math.min(1, sp); shadow(20, .3, 6); X.beginPath(); X.arc(x, y, 56 * sp, 0, 7); X.fillStyle = COL.red; X.fill(); noShadow();
    licon(MS[n].icon, x, y, 58 * sp, '#fff', 2.2); X.restore();
  });
}

// مشهد الشعار: ظهور واثق مع حلقات ذهبية
function sceneLogo(t, sc) {
  sceneBg(t, sc.s);
  const k = t - sc.s, p = eOut(lin(k, 0, .45));
  for (let r = 0; r < 2; r++) { const q = lin(k, r * .15, .9 + r * .15); if (q > 0 && q < 1) { X.strokeStyle = `rgba(245,166,35,${.7 * (1 - q)})`; X.lineWidth = 8 * (1 - q); X.beginPath(); X.arc(W / 2, 820, 160 + 360 * eOut(q), 0, 7); X.stroke(); } }
  if (img.logo) { const w = 640 * (.88 + .12 * p), h = w * img.logo.height / img.logo.width; X.globalAlpha = p; X.drawImage(img.logo, W / 2 - w / 2, 820 - h / 2, w, h); X.globalAlpha = 1; }
  if (sc.sub) { const q = eOut(lin(k, .25, .6)); X.globalAlpha = q; X.direction = 'rtl'; X.textAlign = 'center'; font('ArB', 58); X.fillStyle = 'rgba(255,255,255,.9)'; X.fillText(sc.sub, W / 2, 1110 + (1 - q) * 18); X.globalAlpha = 1; }
}

// مشهد شاشة التطبيق: هاتف كبير في المنتصف + عنوان
function scenePhone(t, sc) {
  sceneBg(t, sc.s);
  const k = t - sc.s, p = eOut(lin(k, 0, .45));
  X.save(); X.direction = 'rtl'; X.textAlign = 'center'; X.globalAlpha = eOut(lin(k, 0, .3)); font('ArB', 70);
  outlined(sc.title, W / 2, 300 + (1 - p) * 20, '#fff', 'rgba(0,0,0,.35)', 6);
  const uw = 300 * eOut(lin(k, .15, .55)); X.fillStyle = COL.gold; rr(W / 2 - uw / 2, 330, uw, 8, 4); X.fill(); X.restore();
  const im = img[sc.img]; if (!im) return;
  const w = 620, h = Math.min(w * im.height / im.width, 980), x = W / 2 - w / 2, y = 380 + (1 - p) * 120 - k * 10;
  X.save(); X.globalAlpha = p;
  shadow(60, .5, 24); rr(x - 18, y - 18, w + 36, h + 36, 62); X.fillStyle = '#0b0b0b'; X.fill(); noShadow();
  X.save(); rr(x, y, w, h, 46); X.clip();
  const sy = (sc.scroll || 0) * eIO(lin(k, .5, sc.e - sc.s)) * (im.height * w / im.width - h);   // تمرير بطيء للشاشات الطويلة
  X.drawImage(im, x, y - sy, w, im.height * w / im.width); X.restore();
  X.restore();
  if (sc.chip) { // شارة بأيقونة: إنفوجرافيك صغير يربط الشاشة بالفائدة
    const c = sc.chip, sp = spring(k - c.dt, ...SPR.FAST); if (sp > .01) {
      font('ArB', 50); const tw = X.measureText(c.text).width, cw = tw + 150, chh = 110, cyy = Math.min(y + h - 150, 1230);
      X.save(); X.globalAlpha = Math.min(1, sp); X.translate(W / 2, cyy + (1 - sp) * 60); X.scale(.85 + .15 * sp, .85 + .15 * sp);
      shadow(40, .4, 14); rr(-cw / 2, -chh / 2, cw, chh, chh / 2); X.fillStyle = '#fff'; X.fill(); noShadow();
      X.beginPath(); X.arc(cw / 2 - 58, 0, 38, 0, 7); X.fillStyle = COL.g; X.fill(); licon(c.icon, cw / 2 - 58, 0, 44, '#fff', 2.2);
      X.direction = 'rtl'; X.textAlign = 'right'; X.fillStyle = COL.ink; X.fillText(c.text, cw / 2 - 112, 17); X.restore();
    }
  }
}

function scenes(t) {
  for (const sc of E.scenes || []) {
    if (t < sc.s || t >= sc.e) continue;
    if (sc.type === 'morph') sceneMorph(t, sc); else if (sc.type === 'pains') scenePains(t, sc); else if (sc.type === 'logo') sceneLogo(t, sc); else if (sc.type === 'phone') scenePhone(t, sc);
    return true;
  }
  return false;
}

// ── شارة الدعوة أعلى الشاشة ──
function cta(t) {
  const c = E.cta; if (!c) return; const a = life(t, c.s, c.e, .3, .2); if (a <= 0) return;
  const p = eOut(lin(t, c.s, c.s + .35)); X.save(); X.globalAlpha = a; X.direction = 'rtl'; X.textAlign = 'center';
  font('ArB', 72); const tw = X.measureText(c.text).width; X.translate(W / 2, c.y + (1 - p) * 20);
  shadow(30, .35, 10); rr(-tw / 2 - 46, -74, tw + 92, 120, 60); X.fillStyle = COL.gold; X.fill(); noShadow();
  X.fillStyle = COL.ink; X.fillText(c.text, 0, 20); X.restore();
}

function endcard(t) {
  const s = E.endcard; if (t < s) return; const k = t - s, EC = 500;   // مركز المحتوى بعيداً عن أزرار المنصّة يميناً
  // انتقال: ستارة تصعد من الأسفل بحافّة ذهبية رفيعة
  const cov = eio(clamp(k / .55)), top = H * (1 - cov);
  X.save(); X.beginPath(); X.rect(0, top, W, H); X.clip();
  let g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#04523a'); g.addColorStop(.55, COL.gd); g.addColorStop(1, '#06120d');
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  // توهّج ناعم خلف الشعار
  g = X.createRadialGradient(EC, 720, 20, EC, 720, 620); g.addColorStop(0, 'rgba(4,140,91,.55)'); g.addColorStop(1, 'rgba(4,140,91,0)');
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  X.restore();
  if (cov < 1) { X.fillStyle = COL.gold; X.fillRect(0, top - 6, W, 6); }
  const up = (a, b) => eo(lin(k, a, b));
  // الشعار
  if (img.logo) {
    const p = up(.35, 1.0), w = 560 * (.92 + .08 * p) * (1 + .012 * Math.sin(k * 1.4)), h = w * img.logo.height / img.logo.width;
    X.globalAlpha = p; X.drawImage(img.logo, EC - w / 2, 720 - h / 2 + (1 - p) * 30, w, h); X.globalAlpha = 1;
  }
  // فاصل ذهبي يتمدّد
  const d = up(.6, 1.1); X.fillStyle = COL.gold; rr(EC - 70 * d, 965, 140 * d, 6, 3); X.fill();
  X.direction = 'rtl'; X.textAlign = 'center';
  const l1 = up(.7, 1.15); X.globalAlpha = l1; font('ArB', 86); X.fillStyle = '#fff'; X.fillText(E.endText1, EC, 1095 + (1 - l1) * 24);
  const l2 = up(.82, 1.27); X.globalAlpha = l2; font('Ar', 48); X.fillStyle = 'rgba(255,255,255,.78)'; X.fillText(E.endText2, EC, 1175 + (1 - l2) * 24);
  // شارتا المتجرين الرسميتان، بنفس الارتفاع
  const bh = 130, l3 = up(.95, 1.4);
  const bs = [img.appstore, img.play].filter(Boolean).map(im => ({ im, w: bh * im.width / im.height }));
  const gap = 28, tot = bs.reduce((a, b) => a + b.w, 0) + gap * (bs.length - 1);
  let bx = EC - tot / 2; X.globalAlpha = l3;
  for (const b of bs) { shadow(30, .45, 10); X.drawImage(b.im, bx, 1260 + (1 - l3) * 30, b.w, bh); noShadow(); bx += b.w + gap; }
  const l4 = up(1.15, 1.6); X.globalAlpha = l4 * .8; X.direction = 'ltr'; font('En', 44); X.fillStyle = '#fff'; X.fillText('wajeezsd.com', EC, 1540);
  X.globalAlpha = 1;
}


window.seek = (t) => {
  X.clearRect(0, 0, W, H);
  if (t < E.endcard + .6) {
    const inScene = scenes(t);
    if (!inScene) { grades(); bug(t); heads(t); cta(t); }
    captions(t);
  }
  endcard(t); progress(t);
};
window.ready = Promise.all([load('logo', 'assets/logo-notag.png'), load('play', 'assets/dl/gp_en_crop.png'), load('appstore', 'assets/dl/as_en.svg'),
  ...(E.images || []).map(k => load(k, `assets/${k}.png`)), document.fonts.load('80px ArB'), document.fonts.load('80px Ar'), document.fonts.load('80px En'), document.fonts.load('80px EnB')]).then(() => document.fonts.ready);
</script>
