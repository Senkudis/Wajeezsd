# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Parallel builds and build caching for faster builds
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true

# 🚀 تفعيل الوضع الكامل لأداة R8 (R8 Full Mode) لتحسين استهلاك الذاكرة وتصغير الكود
android.enableR8.fullMode=true

# 📦 تفعيل تقليص الموارد المحسّن (Optimized Resource Shrinker)
android.enableResourceShrinking.optimized=true

# Suppress compileSdk 36 warning with AGP 8.9
android.suppressUnsupportedCompileSdk=36
