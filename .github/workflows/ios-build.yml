name: iOS Build & TestFlight Release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'رفع إلى TestFlight بعد البناء'
        required: true
        type: boolean
        default: true

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run version:check

      - name: Run tests
        run: npm test

      - name: Detect signing mode
        id: mode
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          FIREBASE: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$TEAM" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::وضع البناء الموقَّع — سيُنتَج IPA."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::لا أسرار توقيع (BUILD_CERTIFICATE_BASE64 / APPLE_TEAM_ID) — بناء غير موقَّع للتحقق فقط."
          fi
          if [ -n "$FIREBASE" ]; then
            echo "firebase=true" >> "$GITHUB_OUTPUT"
          else
            echo "firebase=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GoogleService-Info.plist غائب — التطبيق سيُبنى بلا إشعارات."
          fi
          if [ -n "$KEY_ID" ]; then
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode GoogleService-Info.plist
        if: steps.mode.outputs.firebase == 'true'
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          mkdir -p resources/ios
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > resources/ios/GoogleService-Info.plist

      - name: Prepare webDir for Capacitor
        run: |
          mkdir -p public_html
          echo "✅ public_html created"
          ls -la public_html

      - name: Add iOS platform
        run: |
          set -euo pipefail
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Capacitor CLI version:"
          npx cap --version
          echo "capacitor.config.json:"
          cat capacitor.config.json
          echo "--- Running cap add ios ---"
          npx cap add ios 2>&1
          echo "✅ cap add ios succeeded"

      - name: Generate iOS assets
        run: |
          set -euo pipefail
          npx @capacitor/assets generate --ios --assetPath resources/ios || true
          cp resources/ios/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          if [ -f resources/ios/GoogleService-Info.plist ]; then
            cp resources/ios/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          fi
          npx cap sync ios
          echo "✅ cap sync ios succeeded"

      - name: Set iOS version and build number
        run: |
          set -euo pipefail
          # 🔢 مشروع iOS مُولَّد لا مُخزَّن (ios/ في .gitignore، ويُعاد إنشاؤه بـ
          #    cap add ios في كل تشغيل)، فأي رقم يُضبط محلياً لا يصل هنا إطلاقاً.
          #    وCapacitor يولّده دائماً بـ MARKETING_VERSION = 1.0 و
          #    CURRENT_PROJECT_VERSION = 1.
          #
          #    ⚠️ العطل الذي يُغلقه هذا: App Store Connect يرفض رفع بناءٍ برقمٍ
          #    سبق رفعه. فأول رفعة كانت تنجح، وكل رفعةٍ بعدها تفشل بـ
          #    "The bundle version must be higher than the previously uploaded
          #    version" — أي أن أول خطأٍ في البناء كان يُقفل المسار كلّه.
          #
          #    الإصدار من package.json (مصدر الحقيقة الذي يحرسه version:check)،
          #    ورقم البناء من run_number لأنه تصاعديٌّ بطبعه ولا يتكرّر.
          MARKETING=$(node -p "require('./package.json').version")
          BUILD_NUM=${{ github.run_number }}
          echo "MARKETING_VERSION=$MARKETING  CURRENT_PROJECT_VERSION=$BUILD_NUM"

          cd ios/App
          xcrun agvtool new-marketing-version "$MARKETING"
          xcrun agvtool new-version -all "$BUILD_NUM"
          cd - >/dev/null

          # ✅ تحقّق أن الضبط وقع فعلاً — agvtool يُرجع 0 حتى حين لا يجد ما يعدّله.
          #
          # ⚠️ الفحص على Info.plist لا على project.pbxproj: قالب Capacitor يكتب
          #    الرقمين حرفياً في Info.plist ولا يستعمل $(MARKETING_VERSION)، وهذا
          #    ما يعدّله agvtool فعلاً (ولذلك فشلت أول محاولة هنا رغم نجاح الضبط).
          #    وInfo.plist هو ما يُحزَم في التطبيق على أي حال، فهو الموضع الذي
          #    يهمّ التحقّق منه.
          PLIST=ios/App/App/Info.plist
          GOT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          GOT_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "Info.plist → $GOT_VER ($GOT_BUILD)"

          [ "$GOT_VER" = "$MARKETING" ] \
            || { echo "::error::CFBundleShortVersionString = '$GOT_VER' والمتوقّع '$MARKETING'"; exit 1; }
          [ "$GOT_BUILD" = "$BUILD_NUM" ] \
            || { echo "::error::CFBundleVersion = '$GOT_BUILD' والمتوقّع '$BUILD_NUM'"; exit 1; }
          echo "✅ الإصدار $MARKETING ($BUILD_NUM)"

      - name: Restrict to iPhone (drop iPad support)
        run: |
          set -euo pipefail
          # 📱 Capacitor يولّد المشروع بـ TARGETED_DEVICE_FAMILY = "1,2" أي
          #    آيفون وآيباد معاً. وهذا يجعل App Store Connect يطالب بلقطات
          #    آيباد 13 بوصة ويمنع الإرسال للمراجعة بدونها.
          #
          #    التطبيق مصمَّم للهاتف: الواجهات كلها بعرض عمود واحد، والخريطة
          #    والتتبّع مبنيان على شاشة تُمسك بيد. ادّعاء دعم الآيباد بلا تصميم
          #    له لا يجلب مستخدمين بل يجلب رفضاً — Apple تفتح التطبيق على آيباد
          #    وترفضه لواجهة ممطوطة.
          #
          #    "1" = آيفون فقط. لو أُريد دعم الآيباد يوماً فالقرار يبدأ من
          #    التصميم لا من هذا السطر.
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = "1";/g' "$PBX"

          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2";' "$PBX"; then
            echo "::error::ما زال المشروع يعلن دعم الآيباد"; exit 1
          fi
          echo "✅ آيفون فقط — $(grep -c 'TARGETED_DEVICE_FAMILY = \"1\";' "$PBX") هدف"

      - name: Verify iOS project structure
        run: |
          echo "=== iOS project structure ==="
          find ios -maxdepth 5 \( -name "*.xcworkspace" -o -name "*.xcodeproj" -o -name "Podfile" -o -name "Package.swift" \) 2>/dev/null || true
          echo "Capacitor 8 uses SPM — no CocoaPods/Podfile needed"
          echo "============================="

      - name: Patch Info.plist with required keys
        run: |
          set -euo pipefail
          PLIST=ios/App/App/Info.plist

          patch_key() {
            local key="$1" type="$2" value="$3"
            if /usr/libexec/PlistBuddy -c "Print :${key}" "$PLIST" > /dev/null 2>&1; then
              echo "↩️  موجود مسبقاً: $key"
            else
              /usr/libexec/PlistBuddy -c "Add :${key} ${type} ${value}" "$PLIST"
              echo "✅ أُضيف: $key"
            fi
          }

          # تصحيح منطقة التطوير إلى عربي
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ar" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ar" "$PLIST"

          patch_key "NSLocationWhenInUseUsageDescription" "string" \
            "نستخدم موقعك لتحديد نقطة الاستلام والتسليم بدقة وحساب سعر التوصيل."

          patch_key "NSLocationAlwaysAndWhenInUseUsageDescription" "string" \
            "يستخدم تطبيق الكابتن موقعك أثناء المهمة النشطة فقط لعرض موقعه للعميل ومتابعة الطلب حتى التسليم."

          patch_key "NSLocationAlwaysUsageDescription" "string" \
            "يستخدم تطبيق الكابتن موقعك أثناء المهمة النشطة فقط لعرض موقعه للعميل ومتابعة الطلب حتى التسليم."

          patch_key "NSCameraUsageDescription" "string" \
            "لتصوير الطرد أو إشعار الدفع أو وثائق الكابتن ورفعها مع الطلب."

          patch_key "NSPhotoLibraryUsageDescription" "string" \
            "لاختيار صورة الطرد أو إشعار الدفع أو الوثائق من معرض الصور."

          patch_key "NSPhotoLibraryAddUsageDescription" "string" \
            "لحفظ صورة إيصال الطلب في معرض صورك عند طلبك ذلك."

          patch_key "ITSAppUsesNonExemptEncryption" "bool" "false"

          # UIBackgroundModes — array تحتاج معالجة خاصة
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" > /dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string remote-notification" "$PLIST"
            echo "✅ أُضيف: UIBackgroundModes"
          fi

          # CFBundleLocalizations
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations" "$PLIST" > /dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string ar" "$PLIST"
            echo "✅ أُضيف: CFBundleLocalizations"
          fi

          echo "=== Info.plist المُرقَّع ==="
          cat "$PLIST"
          echo "============================"

      - name: Verify Info.plist keys
        run: |
          set -euo pipefail
          PLIST=ios/App/App/Info.plist
          for KEY in NSLocationWhenInUseUsageDescription \
                     NSLocationAlwaysAndWhenInUseUsageDescription \
                     NSCameraUsageDescription \
                     NSPhotoLibraryUsageDescription \
                     UIBackgroundModes \
                     ITSAppUsesNonExemptEncryption; do
            /usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" > /dev/null \
              || { echo "❌ مفتاح مفقود في Info.plist: $KEY"; exit 1; }
          done
          echo "✅ كل مفاتيح Info.plist موجودة."

      - name: Install Apple certificate and provisioning profile
        if: steps.mode.outputs.signed == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ci-temporary-keychain-password' }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "=== Code Signing Identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          if [ -n "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            PP_PATH="$RUNNER_TEMP/build.mobileprovision"
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

            # استخراج UUID و Name من الـ provisioning profile عبر ملف مؤقت
            security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
            PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
            PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
            echo "📋 Provisioning Profile: $PP_NAME ($PP_UUID)"

            # نسخ الملف باسم UUID وباسم build
            cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PP_UUID}.mobileprovision"
            echo "PP_UUID=${PP_UUID}" >> "$GITHUB_ENV"
            echo "PP_NAME=${PP_NAME}" >> "$GITHUB_ENV"
            echo "✅ Provisioning profile installed: ${PP_UUID}.mobileprovision"
          fi

          # إعداد مفتاح App Store Connect إن وُجد
          if [ -n "${APP_STORE_PRIVATE_KEY_BASE64:-}" ] && [ -n "${APP_STORE_KEY_ID:-}" ]; then
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            echo "$APP_STORE_PRIVATE_KEY_BASE64" | base64 --decode \
              > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8
            cp ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8 ~/.private_keys/
            echo "✅ App Store Connect API Key installed"
          fi

      - name: Verify iOS project exists
        run: |
          set -euo pipefail
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "❌ ios/App/App.xcodeproj غير موجود!"
            ls -la ios/App/ 2>/dev/null || echo "المجلد غير موجود"
            exit 1
          fi
          echo "✅ ios/App/App.xcodeproj موجود وجاهز للبناء"
          ls -la ios/App/

      - name: Configure Manual Signing in Xcode Project
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -euo pipefail
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          # تحويل المشروع للتوقيع اليدوي لمنع Xcode من طلب حسابات Apple ID مطوّرين تلقائية
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          echo "✅ Configured Manual Signing in $PBXPROJ"

      - name: Archive (signed)
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PP_UUID"

      - name: Archive (unsigned — compile check only)
        if: steps.mode.outputs.signed != 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""
          echo "::notice::تمّت الأرشفة بلا توقيع. لا IPA — التوقيع يتطلب حساب مطوّر Apple."

      - name: Create ExportOptions.plist
        if: steps.mode.outputs.signed == 'true'
        run: |
          cat << EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.wajeezsd.app</key>
                  <string>${PP_UUID}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "=== ExportOptions.plist ==="
          cat ExportOptions.plist
          echo "==========================="

      - name: Export IPA
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/build"

      - name: Upload IPA artifact
        if: steps.mode.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Wajeez-iOS-IPA
          path: ${{ runner.temp }}/build/*.ipa
          retention-days: 14

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wajeez-iOS-Archive
          path: ${{ runner.temp }}/App.xcarchive
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to TestFlight
        if: >-
          inputs.upload_to_testflight &&
          steps.mode.outputs.signed == 'true' &&
          steps.mode.outputs.can_upload == 'true'
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$APP_STORE_PRIVATE_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8 ~/.private_keys/

          IPA_PATH=$(find "$RUNNER_TEMP/build" -name "*.ipa" | head -n 1)
          [ -n "$IPA_PATH" ] || { echo "❌ لم يُعثر على IPA"; exit 1; }

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID"