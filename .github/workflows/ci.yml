name: CI

# يشغّل الاختبارات وفحوصات السلامة عند كل push و PR على الفروع الرئيسية.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify cache versions are bumped
        # يفشل إن عُدّل CSS/JS دون رفع ?v= و CACHE_NAME (يمنع تسليم ملفات قديمة للأجهزة)
        run: npm run cache:check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        # فحص بسيط يمنع عودة أسرار مكتوبة حرفياً (مثل مفتاح البوت السابق).
        run: |
          if git grep -nE "scrt_[a-z_]+|(BRQSMS_TOKEN|JWT_SECRET|EMAIL_PASS)\s*=\s*['\"][A-Za-z0-9]{8,}" -- '*.js' ':!*.test.js'; then
            echo "::error::سرّ مكتوب حرفياً في المصدر — انقله لمتغيّر بيئة"
            exit 1
          fi
          echo "✓ لا أسرار مكتوبة حرفياً"
