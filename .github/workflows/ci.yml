name: CI

# يشغّل الاختبارات وفحوصات السلامة عند كل push و PR على الفروع الرئيسية.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # 🗄️ قاعدة بيانات حقيقية للاختبارات.
    # اختبارات الدفتر المالي وسباق قبول الطلب تفحص سلوك MongoDB نفسها —
    # الذرّية في findOneAndUpdate بشرط، والفهرس الفريد الجزئي — ولا معنى
    # لها بلا mongod. وهي تُتخطّى محلياً إن غاب، لكن assertRanInCI يُسقط
    # البناء هنا إن تُخطّيت: مجموعةٌ خضراء لم تُشغَّل أسوأ من مجموعةٍ حمراء.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/wajeez_ci
      JWT_SECRET: ci-only-secret-never-used-in-production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify cache versions are bumped
        # public_html موجود على السيرفر فقط — الفحص يعمل محلياً قبل الـ deploy
        # ولا معنى لتشغيله في CI حيث المجلد غير موجود
        run: |
          if [ -d "public_html/js" ] || [ -d "public_html/css" ]; then
            npm run cache:check
          else
            echo "⏭️  public_html غير موجود في CI — تخطّي فحص الكاش (يعمل محلياً)"
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        # فحص بسيط يمنع عودة أسرار مكتوبة حرفياً (مثل مفتاح البوت السابق).
        run: |
          if git grep -nE "scrt_[a-z_]+|(BRQSMS_TOKEN|JWT_SECRET|EMAIL_PASS)\s*=\s*['\"][A-Za-z0-9]{8,}" -- '*.js' ':!*.test.js'; then
            echo "::error::سرّ مكتوب حرفياً في المصدر — انقله لمتغيّر بيئة"
            exit 1
          fi
          echo "✓ لا أسرار مكتوبة حرفياً"
