<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم – وجيز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css">
<style>
/* Extra page styles */
.tables-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .tables-grid { grid-template-columns: 1fr; } }

.progress-wrap { background: var(--gray-100); border-radius: 99px; height: 5px; flex: 1; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green), #0a9464); transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }

.rank-badge { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
.rank-1 { background: #fef9c3; color: #854d0e; }
.rank-2 { background: var(--gray-100); color: var(--gray-700); }
.rank-3 { background: #fef2f2; color: var(--danger); }

.quick-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="admin-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">
        <img src="../assets/logo-mark-white.png" alt="وجيز" class="sidebar-logo-img">
        <div>
          <div class="sidebar-logo-text">وجيز</div>
          <div class="sidebar-logo-sub">نظام الإحالات</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-label">الإدارة</div>
        <a href="dashboard.html" class="nav-item active">
          <i data-lucide="layout-dashboard"></i> لوحة التحكم
        </a>
        <a href="marketers.html" class="nav-item">
          <i data-lucide="users"></i> المسوّقون
        </a>
        <a href="pending.html" class="nav-item">
          <i data-lucide="clock"></i> طلبات المسوّقين
          <span class="nav-badge" id="pendingBadge" style="display:none;"></span>
        </a>
        <a href="referrals.html" class="nav-item">
          <i data-lucide="link-2"></i> الإحالات
        </a>
        <a href="rewards.html" class="nav-item">
          <i data-lucide="gift"></i> المكافآت
        </a>
        <a href="settings.html" class="nav-item">
          <i data-lucide="settings"></i> الإعدادات
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">عام</div>
        <a href="../index.html" class="nav-item">
          <i data-lucide="home"></i> الرئيسية
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div class="avatar avatar-green" id="sidebarAvatar">م</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:700;color:white;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" id="sidebarName">المشرف</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.4);" id="sidebarEmail">—</div>
        </div>
      </div>
      <button class="nav-item" id="logoutBtn" style="width:100%;color:rgba(255,255,255,0.6);">
        <i data-lucide="log-out"></i> تسجيل الخروج
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i data-lucide="menu"></i>
      </button>
      <div class="topbar-left">
        <div class="topbar-title">لوحة التحكم</div>
        <div class="topbar-sub">مرحباً، <strong id="greetName">المشرف</strong></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="refreshBtn" title="تحديث">
          <i data-lucide="refresh-cw"></i>
        </button>
        <div class="avatar avatar-green" id="topbarAvatar">م</div>
      </div>
    </header>

    <div class="page-body">

      <!-- Quick Actions -->
      <div class="quick-actions">
        <a href="marketers.html" class="btn btn-primary btn-sm"><i data-lucide="user-plus"></i> إضافة مسوّق</a>
        <a href="pending.html"   class="btn btn-ghost   btn-sm"><i data-lucide="clock"></i> مراجعة الطلبات</a>
        <a href="referrals.html" class="btn btn-ghost   btn-sm"><i data-lucide="link-2"></i> كل الإحالات</a>
        <a href="rewards.html"   class="btn btn-gold    btn-sm"><i data-lucide="gift"></i> إدارة المكافآت</a>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid">
        <!-- Skeleton placeholders -->
        <div class="stat-card"><div class="stat-icon green skeleton" style="width:52px;height:52px;"></div><div style="flex:1"><div class="skeleton" style="height:28px;width:70%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;width:50%;"></div></div></div>
        <div class="stat-card"><div class="stat-icon green skeleton" style="width:52px;height:52px;"></div><div style="flex:1"><div class="skeleton" style="height:28px;width:70%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;width:50%;"></div></div></div>
        <div class="stat-card"><div class="stat-icon green skeleton" style="width:52px;height:52px;"></div><div style="flex:1"><div class="skeleton" style="height:28px;width:70%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;width:50%;"></div></div></div>
        <div class="stat-card"><div class="stat-icon green skeleton" style="width:52px;height:52px;"></div><div style="flex:1"><div class="skeleton" style="height:28px;width:70%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;width:50%;"></div></div></div>
        <div class="stat-card"><div class="stat-icon green skeleton" style="width:52px;height:52px;"></div><div style="flex:1"><div class="skeleton" style="height:28px;width:70%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;width:50%;"></div></div></div>
      </div>

      <!-- Tables -->
      <div class="tables-grid">
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i data-lucide="trophy"></i> أفضل المسوّقين</div>
            <a href="marketers.html" class="btn btn-ghost btn-sm">عرض الكل</a>
          </div>
          <div id="topMarketersWrap">
            <div class="skeleton" style="height:14px;margin-bottom:12px;"></div>
            <div class="skeleton" style="height:14px;width:80%;margin-bottom:12px;"></div>
            <div class="skeleton" style="height:14px;width:60%;"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title"><i data-lucide="clock-3"></i> آخر الإحالات</div>
            <a href="referrals.html" class="btn btn-ghost btn-sm">عرض الكل</a>
          </div>
          <div id="recentReferralsWrap">
            <div class="skeleton" style="height:14px;margin-bottom:12px;"></div>
            <div class="skeleton" style="height:14px;width:80%;margin-bottom:12px;"></div>
            <div class="skeleton" style="height:14px;width:60%;"></div>
          </div>
        </div>
      </div>

    </div><!-- /page-body -->
  </main>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="../js/app.js"></script>
<script>
lucide.createIcons();

(function() {
  if (!Auth.requireAdmin()) return;

  const user = Auth.getUser() || {};
  const name = user.name || user.fullName || user.email || 'المشرف';
  const initials = name.charAt(0) || 'م';
  document.getElementById('greetName').textContent    = name;
  document.getElementById('sidebarName').textContent  = name;
  document.getElementById('sidebarEmail').textContent = user.email || '';
  document.getElementById('sidebarAvatar').textContent  = initials;
  document.getElementById('topbarAvatar').textContent   = initials;

  // Mobile sidebar
  const sidebar  = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  document.getElementById('mobileMenuBtn').onclick = () => { sidebar.classList.toggle('open'); backdrop.classList.toggle('open'); };
  backdrop.onclick = () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); };

  document.getElementById('logoutBtn').onclick = () => { Auth.clearSession(); window.location.replace('login.html'); };
  document.getElementById('refreshBtn').onclick = () => loadStats();

  function renderStats(s) {
    const pending = s.pendingMarketers ?? 0;
    if (pending > 0) {
      const pb = document.getElementById('pendingBadge');
      pb.textContent = pending; pb.style.display = 'inline';
    }
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon green"><i data-lucide="users"></i></div>
        <div class="stat-info">
          <div class="stat-label">إجمالي المسوّقين</div>
          <div class="stat-value">${(s.totalMarketers ?? 0).toLocaleString('ar')}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i data-lucide="user-check"></i></div>
        <div class="stat-info">
          <div class="stat-label">المسوّقون النشطون</div>
          <div class="stat-value">${(s.activeMarketers ?? 0).toLocaleString('ar')}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon gold"><i data-lucide="clock"></i></div>
        <div class="stat-info">
          <div class="stat-label">طلبات معلقة</div>
          <div class="stat-value">${(s.pendingMarketers ?? 0).toLocaleString('ar')}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon blue"><i data-lucide="link-2"></i></div>
        <div class="stat-info">
          <div class="stat-label">إجمالي الإحالات</div>
          <div class="stat-value">${(s.totalReferrals ?? 0).toLocaleString('ar')}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple"><i data-lucide="calendar"></i></div>
        <div class="stat-info">
          <div class="stat-label">إحالات هذا الشهر</div>
          <div class="stat-value">${(s.monthlyReferrals ?? 0).toLocaleString('ar')}</div>
        </div>
      </div>`;
    lucide.createIcons({ root: document.getElementById('statsGrid') });
  }

  function renderTopMarketers(list) {
    const wrap = document.getElementById('topMarketersWrap');
    if (!list?.length) { wrap.innerHTML = '<div class="empty-state"><p>لا توجد بيانات بعد</p></div>'; return; }
    const max = Math.max(...list.map(m => m.referralCount || 0), 1);
    wrap.innerHTML = list.slice(0,5).map((m, i) => {
      const pct = Math.round(((m.referralCount||0)/max)*100);
      const rankClass = i < 3 ? `rank-${i+1}` : '';
      const rankLabel = i + 1;
      return `<div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--gray-100);">
        <span class="rank-badge ${rankClass}">${rankLabel}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(m.name||'—')}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
            <span class="code-pill">${escapeHtml(m.referralCode||m.code||'—')}</span>
            <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
          </div>
        </div>
        <div style="text-align:center;min-width:42px;">
          <div style="font-size:20px;font-weight:900;color:var(--green);">${m.referralCount||0}</div>
          <div style="font-size:10px;color:var(--gray-500);">إحالة</div>
        </div>
      </div>`;
    }).join('');
  }

  function renderRecentReferrals(list) {
    const wrap = document.getElementById('recentReferralsWrap');
    if (!list?.length) { wrap.innerHTML = '<div class="empty-state"><p>لا توجد إحالات حديثة</p></div>'; return; }
    wrap.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>المتجر</th><th>المسوّق</th><th>التاريخ</th></tr></thead>
      <tbody>${list.slice(0,8).map(r => `<tr>
        <td><div style="display:flex;align-items:center;gap:10px;">
          <div class="avatar avatar-green" style="width:32px;height:32px;font-size:13px;">${escapeHtml((r.storeName||r.businessName||r.name||'—').charAt(0))}</div>
          <span style="font-weight:600;font-size:13px;">${escapeHtml(r.storeName||r.businessName||r.name||'—')}</span>
        </div></td>
        <td style="font-size:13px;color:var(--gray-700);">${escapeHtml(r.marketer?.name||r.marketerName||'—')}</td>
        <td><span class="badge badge-gray">${formatDate(r.createdAt||r.date)}</span></td>
      </tr>`).join('')}</tbody></table></div>`;
  }

  async function loadStats() {
    const btn = document.getElementById('refreshBtn');
    btn.innerHTML = '<i data-lucide="loader-2" class="spin"></i>';
    lucide.createIcons({ root: btn });
    try {
      const stats = await apiFetch('/referral/stats');
      renderStats(stats);
      renderTopMarketers(stats.topMarketers || []);
      renderRecentReferrals(stats.recentReferrals || []);
    } catch(err) {
      showToast('تعذّر تحميل الإحصائيات: ' + (err.message || ''), 'error');
    } finally {
      btn.innerHTML = '<i data-lucide="refresh-cw"></i>';
      lucide.createIcons({ root: btn });
    }
  }

  loadStats();
  startPendingPolling();
})();
</script>
</body>
</html>
