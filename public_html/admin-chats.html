<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>المحادثات | وجيز</title>
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <script src="js/config.js?v=b84e6b6a"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: #f1f5f9; color: #1e293b; }
        .page-header { background: linear-gradient(135deg, #04553A, #0A6E47); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 20px rgba(10,135,84,.25); }
        .page-header h1 { color: #fff; font-size: 1.3rem; font-weight: 800; }
        .page-header a { color: rgba(255,255,255,.85); text-decoration: none; font-size: .9rem; display: flex; align-items: center; gap: 6px; }
        .main { max-width: 1100px; margin: 0 auto; padding: 20px 14px 60px; }
        .notice { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 12px; padding: 11px 14px; font-size: .85rem; margin-bottom: 16px; display: flex; gap: 9px; align-items: flex-start; }
        .row-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: box-shadow .15s, transform .15s; }
        .row-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.07); transform: translateY(-1px); }
        .row-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .parties { font-weight: 800; font-size: .95rem; flex: 1; min-width: 180px; }
        .parties span { color: #64748b; font-weight: 600; }
        .preview { color: #475569; font-size: .86rem; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chip { font-size: .7rem; font-weight: 800; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
        .chip-count { background: #eef2ff; color: #4338ca; }
        .chip-img { background: #fef3c7; color: #b45309; }
        .chip-time { background: #f1f5f9; color: #64748b; }
        .chip-status { background: #dcfce7; color: #166534; }
        .empty { text-align: center; padding: 50px 20px; color: #94a3b8; }
        .thread { max-height: 60vh; overflow-y: auto; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; }
        .bub-row { display: flex; margin-bottom: 8px; }
        .bub { max-width: 78%; border-radius: 12px; padding: 8px 11px; }
        .bub .who { font-size: .68rem; font-weight: 800; margin-bottom: 2px; }
        .bub .txt { font-size: .85rem; white-space: pre-wrap; word-break: break-word; }
        .bub img { max-width: 180px; border-radius: 10px; margin-top: 6px; display: block; cursor: pointer; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.6); display: none; align-items: center; justify-content: center; z-index: 999; padding: 14px; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 18px; padding: 18px; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; }
        .modal h2 { font-size: 1.05rem; margin-bottom: 12px; }
        .btn { padding: 9px 18px; border: none; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: .9rem; cursor: pointer; }
        .btn-close { background: #f1f5f9; color: #475569; }
        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .btn-danger:hover { background: #fecaca; }
        .btn:disabled { opacity: .55; cursor: default; }
    </style>
    <link rel="stylesheet" href="css/admin-mobile.css?v=d3e81a45">
    <script src="js/admin-mobile.js?v=d3e81a45"></script>
</head>

<body>
    <div class="page-header">
        <h1><i class="fas fa-comments"></i> المحادثات</h1>
        <a href="admin.html"><i class="fas fa-arrow-right"></i> لوحة التحكم</a>
    </div>

    <div class="main">
        <div class="notice">
            <i class="fas fa-shield-halved" style="margin-top:2px;"></i>
            <div>
                محتوى المحادثات خاص بين العميل والكابتن. كل اطّلاع يُسجَّل في سجل التدقيق باسمك،
                وصور المحادثات تُحذف تلقائياً بعد <strong id="ttlHours">48</strong> ساعة.
            </div>
        </div>
        <div id="list"><div class="empty"><i class="fas fa-spinner fa-spin fa-2x"></i></div></div>
    </div>

    <div class="modal-overlay" id="threadModal">
        <div class="modal">
            <h2 id="threadTitle">المحادثة</h2>
            <div class="thread" id="thread"></div>
            <div style="margin-top:12px;display:flex;justify-content:space-between;gap:10px;">
                <!-- 🗑️ الحذف لا رجعة فيه — التأكيد يذكر ما سيُمحى بالعدد -->
                <button class="btn btn-danger" id="deleteChatBtn" onclick="deleteChat()">
                    <i class="fas fa-trash"></i> حذف المحادثة
                </button>
                <button class="btn btn-close" onclick="closeThread()">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- SweetAlert2 مطلوب لنافذة تأكيد الحذف (كانت الدالة ترمي على Swal غير معرّفة) -->
    <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'admin-login.html';
        const BASE = window.API_URL || 'https://wajeezsd.com';
        const hdr = () => ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' });

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const imgUrl = (u) => (window.getFullImageUrl ? window.getFullImageUrl(u) : u);

        // المحادثة المفتوحة حالياً — يعتمد عليها زر الحذف
        let openOrderId = null;
        let openMessagesCount = 0;
        let openImagesCount = 0;

        const STATUS = {
            pending: 'قيد الانتظار', scheduled: 'مجدول', accepted: 'مقبول',
            picked_up: 'قيد التوصيل', delivered: 'مكتمل', cancelled: 'ملغي'
        };

        const relTime = (iso) => {
            const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
            if (mins < 1) return 'الآن';
            if (mins < 60) return `قبل ${mins} د`;
            const h = Math.floor(mins / 60);
            if (h < 24) return `قبل ${h} س`;
            return new Date(iso).toLocaleDateString('ar-SD', { day: '2-digit', month: '2-digit' });
        };

        async function loadList() {
            const box = document.getElementById('list');
            try {
                const res = await fetch(`${BASE}/api/admin/chats`, { headers: hdr() });
                if (res.status === 403) {
                    box.innerHTML = '<div class="empty">لا تملك صلاحية قراءة المحادثات (view_chats).</div>';
                    return;
                }
                if (!res.ok) throw new Error('failed');
                const rows = await res.json();
                if (!rows.length) {
                    box.innerHTML = '<div class="empty"><i class="fas fa-inbox fa-2x"></i><p style="margin-top:10px;">لا محادثات بعد</p></div>';
                    return;
                }
                box.innerHTML = rows.map(r => `
                    <div class="row-card" onclick="openThread('${r.orderId}')">
                        <div class="row-top">
                            <div class="parties">
                                ${esc(r.client?.name || 'عميل')}
                                <span>↔</span>
                                ${esc(r.captain?.name || 'بلا كابتن')}
                            </div>
                            <span class="chip chip-status">${STATUS[r.status] || r.status}</span>
                            <span class="chip chip-count">${r.count} رسالة</span>
                            ${r.images ? `<span class="chip chip-img"><i class="fas fa-image"></i> ${r.images}</span>` : ''}
                            <span class="chip chip-time">${relTime(r.lastAt)}</span>
                        </div>
                        <div class="preview">${esc(r.preview) || '—'}</div>
                    </div>
                `).join('');
            } catch (e) {
                box.innerHTML = '<div class="empty">فشل تحميل المحادثات</div>';
            }
        }

        async function openThread(orderId) {
            const modal = document.getElementById('threadModal');
            const thread = document.getElementById('thread');
            thread.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i></div>';
            modal.classList.add('active');
            openOrderId = orderId;
            openMessagesCount = 0;
            openImagesCount = 0;
            try {
                const res = await fetch(`${BASE}/api/admin/chats/${orderId}`, { headers: hdr() });
                if (!res.ok) throw new Error('failed');
                const data = await res.json();
                openMessagesCount = (data.messages || []).length;
                openImagesCount = (data.messages || []).filter(m => m.imageUrl).length;
                document.getElementById('ttlHours').textContent = data.imageTtlHours || 48;
                document.getElementById('threadTitle').textContent =
                    `طلب #${String(orderId).slice(-6).toUpperCase()} — `
                    + `${data.order?.client?.name || 'عميل'} ↔ ${data.order?.captain?.name || 'بلا كابتن'}`;

                const clientId = data.order?.client?._id ? String(data.order.client._id) : '';
                thread.innerHTML = (data.messages || []).map(m => {
                    const isClient = String(m.sender?._id || '') === clientId;
                    const time = new Date(m.createdAt).toLocaleString('ar-SD',
                        { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    // الصورة المحذوفة بعد 48 ساعة: نوضّح السبب بدل صورة مكسورة
                    const media = m.imageUrl
                        ? `<img src="${imgUrl(m.imageUrl)}" alt="صورة" onclick="window.open(this.src)">`
                        : (m.imageExpiredAt
                            ? `<div style="font-size:.72rem;color:#94a3b8;margin-top:5px;">
                                 <i class="fas fa-image"></i> حُذفت الصورة بعد ${data.imageTtlHours || 48} ساعة</div>`
                            : '');
                    const txt = (m.text || '').trim();
                    return `
                    <div class="bub-row" style="justify-content:${isClient ? 'flex-start' : 'flex-end'};">
                        <div class="bub" style="background:${isClient ? '#fff' : '#e0f2fe'};border:1px solid ${isClient ? '#e2e8f0' : '#bae6fd'};">
                            <div class="who" style="color:${isClient ? '#475569' : '#0369a1'};">
                                ${esc(m.sender?.name || (isClient ? 'العميل' : 'الكابتن'))}
                                <span style="color:#94a3b8;font-weight:600;"> · ${time}</span>
                            </div>
                            ${txt ? `<div class="txt">${esc(txt)}</div>` : ''}
                            ${media}
                        </div>
                    </div>`;
                }).join('') || '<div class="empty">لا رسائل</div>';
            } catch (e) {
                thread.innerHTML = '<div class="empty">فشل تحميل المحادثة</div>';
            }
        }

        function closeThread() {
            document.getElementById('threadModal').classList.remove('active');
            openOrderId = null;
        }

        // ═══════════════════════════════════════════════════════
        // 🗑️ حذف المحادثة من قاعدة البيانات
        // عملية لا رجعة فيها: تُمحى الرسائل وصورها من القرص وإشعاراتها. لذلك
        // التأكيد يذكر العدد الفعلي، ويُطلب تأكيد ثانٍ بكتابة كلمة "حذف".
        // ═══════════════════════════════════════════════════════
        async function deleteChat() {
            if (!openOrderId) return;
            const count = openMessagesCount;

            const first = await Swal.fire({
                icon: 'warning',
                title: 'حذف المحادثة نهائياً؟',
                html: `سيُمحى <b>${count}</b> رسالة${openImagesCount ? ` و<b>${openImagesCount}</b> صورة` : ''} `
                    + `من قاعدة البيانات، ولا يمكن استرجاعها.<br>`
                    + `<span style="color:#64748b;font-size:.85rem;">`
                    + `تُحذف المحادثة عند الطرفين، ويُسجَّل الحذف باسمك في سجل التدقيق.</span>`,
                input: 'text',
                inputPlaceholder: 'اكتب: حذف',
                showCancelButton: true,
                confirmButtonText: 'حذف نهائي',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#b91c1c',
                inputValidator: (v) => (String(v || '').trim() !== 'حذف' ? 'اكتب كلمة «حذف» للتأكيد' : null)
            });
            if (!first.isConfirmed) return;

            const btn = document.getElementById('deleteChatBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحذف';
            try {
                const res = await fetch(`${BASE}/api/admin/chats/${openOrderId}`, {
                    method: 'DELETE', headers: hdr()
                });
                const data = await res.json().catch(() => ({}));
                if (res.status === 403) {
                    Swal.fire('غير مصرح', 'تحتاج صلاحية حذف المحادثات (manage_chats).', 'warning');
                    return;
                }
                if (!res.ok) throw new Error(data.message || 'failed');
                closeThread();
                await loadList();
                Swal.fire('تم الحذف', data.message || 'حُذفت المحادثة', 'success');
            } catch (e) {
                Swal.fire('فشل الحذف', e.message || 'حاول مجدداً', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-trash"></i> حذف المحادثة';
            }
        }

        loadList();
    </script>
</body>

</html>
