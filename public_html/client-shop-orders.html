<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>طلباتي | وجيز</title>

    <!--
        📦 هذه الصفحة تقاعدت — دُمجت طلبات المتاجر في «طلباتي».

        السبب: client-my-orders.html كانت تعرض طلبات المتاجر أصلاً وبكامل
        إجراءاتها (المحادثة، إعادة الطلب، رفع إيصال الدفع)، لأن
        GET /api/orders/my-orders يدمج Order و ShopOrder في قائمة واحدة
        مرتّبة. فكان للعميل مكانان لطلب واحد، ولا سبيل لمعرفة أيّهما
        يحمل طلبه إلا بفتح الاثنين.

        ولماذا تحويلٌ لا حذف: الإشعارات المُرسَلة قبل هذا التحديث تحمل هذا
        الرابط داخل أجهزة المستخدمين، والعامل الخدمي المُخزَّن على أجهزتهم
        يوجّه إليه كذلك حتى يُحدَّث. حذف الملف كان سيحوّل كل نقرة على إشعارٍ
        قديم إلى صفحة 404.

        ⏳ يمكن حذفها بعد أن تنقضي دورة تحديث كاملة (شهر تقريباً بعد نشر
        1.4.0)، حين لا يبقى جهازٌ يحمل الوجهة القديمة.
    -->
    <link rel="canonical" href="/client-my-orders.html">
    <meta name="robots" content="noindex">

    <script>
        // ↪️ التحويل قبل أي رسم: نقل معامل highlight كما هو — بطاقة طلب
        //    المتجر في «طلباتي» تحمل المعرّف نفسه (id="order-<shopOrderId>")
        //    فيُبرَز الطلب المقصود تماماً كما كان.
        //
        //    replace لا assign: لو بقيت الصفحة في سجلّ التصفّح لعاد زرّ
        //    الرجوع بالمستخدم إليها فحوّلته من جديد — حلقةٌ لا مخرج منها.
        (function () {
            var qs = window.location.search || '';
            window.location.replace('client-my-orders.html' + qs);
        })();
    </script>
</head>
<body style="font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#64748b;">
    <!-- يظهر لحظةً واحدة فقط إن تأخّر التحويل، أو لمن عطّل الجافاسكربت -->
    <p>جارٍ فتح <a href="client-my-orders.html">طلباتي</a>…</p>
</body>
</html>
