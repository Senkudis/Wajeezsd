<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدردشة | وصل-لي</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 15px;
            z-index: 100;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%230a8754' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            position: relative;
            font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .message.sent {
            align-self: flex-start;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-top-right-radius: 0;
        }

        .message.received {
            align-self: flex-end;
            background: white;
            color: var(--dark);
            border-top-left-radius: 0;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 5px;
            display: block;
            text-align: left;
        }

        .message.sent .message-time {
            text-align: right;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-area {
            background: white;
            padding: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            background: #ccc;
        }

        .status-dot.online {
            background: #28a745;
            box-shadow: 0 0 5px #28a745;
        }

        .typing-indicator {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: none;
            margin-bottom: 10px;
        }
    </style>
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css">
</head>

<body>

    <!-- Header -->
    <div class="chat-header d-flex align-items-center gap-3 shadow-sm">
        <button onclick="goBack()" class="btn btn-light rounded-circle shadow-sm" style="width: 40px; height: 40px;"><i
                class="bi bi-arrow-right"></i></button>

        <div class="position-relative">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center"
                style="width: 45px; height: 45px;">
                <i class="bi bi-person-fill fs-5"></i>
            </div>
            <span id="statusDot" class="status-dot position-absolute bottom-0 end-0 border border-white"></span>
        </div>

        <div class="flex-grow-1">
            <h6 class="mb-0 fw-bold">المحادثة</h6>
            <small id="statusText" class="text-muted" style="font-size: 0.75rem;">جاري الاتصال...</small>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container" id="chatContainer">
        <div class="text-center py-5">
            <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
            <p class="text-muted small mt-2">جاري تحميل الرسائل...</p>
        </div>
    </div>

    <!-- Typing Indicator -->
    <div id="typingIndicator" class="typing-indicator mx-3">✍️ الطرف الآخر يكتب...</div>

    <!-- Input Area -->
    <div class="input-area d-flex gap-2 shadow-lg">
        <input type="text" id="messageInput" class="form-control rounded-pill bg-light border-0 py-2 ps-4"
            placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()" class="btn btn-primary rounded-circle shadow-sm hover-scale"
            style="width: 45px; height: 45px;">
            <i class="bi bi-send-fill" style="transform: rotate(180deg);"></i>
        </button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const receiverId = urlParams.get('receiverId');
        const userStored = localStorage.getItem('user');

        if (!userStored) { window.location.href = 'client-login.html'; throw new Error("No Auth"); }

        const user = JSON.parse(userStored);
        const userId = String(user.id || user._id).trim();
        const userName = user.name || "مستخدم";

        if (!orderId || !receiverId) { alert("رابط خطأ"); window.history.back(); }

        let socket = null;
        let isConnected = false;
        let typingTimeout = null;

        function initSocket() {
            socket = io({ reconnection: true });

            socket.on('connect', () => {
                isConnected = true;
                updateStatus(true);
                socket.emit('user_join', userId);
            });

            socket.on('disconnect', () => {
                isConnected = false;
                updateStatus(false);
            });

            socket.on('new_message', (message) => {
                addMessageToUI(message);
                const senderId = (message.sender && typeof message.sender === 'object') ? message.sender._id : message.sender;
                if (senderId !== userId) playNotificationSound();
            });

            socket.on('user_typing', (data) => {
                if (data.userId === receiverId) {
                    document.getElementById('typingIndicator').style.display = 'block';
                    scrollToBottom();
                }
            });

            socket.on('user_stop_typing', (data) => {
                if (data.userId === receiverId) document.getElementById('typingIndicator').style.display = 'none';
            });

            socket.on('message_sent', (data) => {
                if (data.success) {
                    document.getElementById('messageInput').value = '';
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('messageInput').focus();
                }
            });
        }

        function playNotificationSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function updateStatus(online) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (online) { dot.classList.add('online'); text.textContent = 'متصل'; }
            else { dot.classList.remove('online'); text.textContent = 'جاري الاتصال...'; }
        }

        function addMessageToUI(msg) {
            const container = document.getElementById('chatContainer');
            if (container.querySelector('.text-center')) container.innerHTML = '';

            let senderIdString = "";
            if (msg.sender && typeof msg.sender === 'object') {
                senderIdString = String(msg.sender._id || msg.sender.id);
            } else {
                senderIdString = String(msg.sender);
            }
            senderIdString = senderIdString.trim();
            const myIdString = userId.trim();
            const isMe = senderIdString === myIdString;

            const div = document.createElement('div');
            div.className = `message ${isMe ? 'sent' : 'received'}`;

            const time = new Date(msg.createdAt || Date.now()).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

            let checkIcon = '';
            if (isMe) {
                const checkColor = msg.isRead ? '#ffffff' : 'rgba(255,255,255,0.6)';
                checkIcon = `<i class="bi bi-check-all ms-1" style="font-size: 14px; color: ${checkColor};"></i>`;
            }

            div.innerHTML = `
                ${msg.text}
                <span class="message-time">
                    ${time} ${checkIcon}
                </span>
            `;

            container.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
        }

        async function loadMessages() {
            try {
                const token = localStorage.getItem('token') || localStorage.getItem('clientToken') || localStorage.getItem('captainToken');
                const res = await fetch(`/api/chat/${orderId}`, { headers: window.Auth.getAuthHeader() });
                const messages = await res.json();
                const container = document.getElementById('chatContainer');

                container.innerHTML = '';
                if (messages.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5 opacity-50">
                            <i class="bi bi-chat-dots fs-1 mb-2 d-block"></i>
                            <p>لا توجد رسائل سابقة. ابدأ المحادثة!</p>
                        </div>`;
                } else {
                    messages.forEach(msg => addMessageToUI(msg));
                }
            } catch (err) { console.error(err); }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            if (!isConnected) return alert('لا يوجد اتصال');

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;

            const messageData = {
                sender: userId,
                receiver: receiverId,
                order: orderId,
                text: text,
                senderName: userName
            };

            socket.emit('send_message', messageData);
        }

        const input = document.getElementById('messageInput');
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        input.addEventListener('input', () => {
            if (isConnected) {
                socket.emit('typing', { senderId: userId, receiverId: receiverId });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('stop_typing', { senderId: userId, receiverId: receiverId });
                }, 1000);
            }
        });

        function goBack() { window.history.back(); }

        initSocket();
        loadMessages();
    </script>
    <!-- Auth Helper & App Core -->
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
