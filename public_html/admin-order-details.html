<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="js/admin-guard.js?v=b336cfda" data-perm="view_orders"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تفاصيل الطلب | وجيز</title>
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <script src="js/console-cleaner.js?v=d257b4ad"></script>
    <script src="js/config.js?v=977449f7"></script>
    <script src="js/admin-cache-buster.js?v=355a130e"></script>
    <script src="js/auth-helper.js?v=c97361b3"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; direction: rtl; color: #1e293b; min-height: 100vh; }

        .od-container { max-width: 900px; margin: 0 auto; padding: 24px 20px; }

        .od-back {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 18px; border-radius: 10px;
            background: white; border: 1px solid #e2e8f0;
            color: #64748b; font-weight: 700; font-size: 13px;
            cursor: pointer; margin-bottom: 20px; transition: all 0.2s;
        }
        .od-back:hover { border-color: #6366f1; color: #6366f1; }

        .od-header {
            background: white; border-radius: 16px; padding: 24px;
            border: 1px solid #e2e8f0; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
        }
        .od-header-right h1 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
        .od-header-right p { font-size: 13px; color: #64748b; }
        .od-status-badge {
            padding: 8px 18px; border-radius: 10px; font-weight: 800; font-size: 14px;
        }
        .od-status-badge.pending { background: rgba(245,158,11,0.12); color: #b45309; }
        .od-status-badge.accepted { background: rgba(99,102,241,0.12); color: #4f46e5; }
        .od-status-badge.picked_up { background: rgba(6,182,212,0.12); color: #0891b2; }
        .od-status-badge.delivered { background: rgba(16,185,129,0.12); color: #059669; }
        .od-status-badge.cancelled { background: rgba(239,68,68,0.12); color: #dc2626; }
        .od-status-badge.scheduled { background: rgba(139,92,246,0.12); color: #7c3aed; }

        .od-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .od-grid { grid-template-columns: 1fr; } }

        .od-card {
            background: white; border-radius: 14px; padding: 20px;
            border: 1px solid #e2e8f0;
        }
        .od-card-title {
            font-size: 13px; font-weight: 800; color: #64748b;
            margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .od-card-title i {
            width: 28px; height: 28px; border-radius: 8px;
            background: rgba(99,102,241,0.1); color: #6366f1;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
        }

        .od-field { margin-bottom: 12px; }
        .od-field label { font-size: 11px; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 2px; }
        .od-field span { font-size: 14px; font-weight: 700; color: #1e293b; }

        .od-map { width: 100%; height: 250px; border-radius: 12px; overflow: hidden; margin-top: 12px; }

        .od-timeline { padding: 0; list-style: none; }
        .od-timeline li {
            position: relative; padding: 0 30px 20px 0;
            border-right: 2px solid #e2e8f0;
        }
        .od-timeline li:last-child { border-right: none; padding-bottom: 0; }
        .od-timeline li::before {
            content: ''; position: absolute; right: -6px; top: 4px;
            width: 10px; height: 10px; border-radius: 50%;
            background: #6366f1; border: 2px solid white;
            box-shadow: 0 0 0 2px #6366f1;
        }
        .od-timeline li.done::before { background: #10b981; box-shadow: 0 0 0 2px #10b981; }
        .od-timeline li.active::before { background: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.3); }
        .od-timeline li.cancelled::before { background: #ef4444; box-shadow: 0 0 0 2px #ef4444; }
        .od-timeline li .tl-title { font-size: 13px; font-weight: 700; color: #94a3b8; }
        .od-timeline li.done .tl-title, .od-timeline li.active .tl-title { color: #1e293b; }
        .od-timeline li.cancelled .tl-title { color: #ef4444; }
        .od-timeline li .tl-time { font-size: 11px; color: #94a3b8; }

        .od-actions {
            display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px;
        }
        .od-btn {
            padding: 10px 20px; border-radius: 10px; font-weight: 700;
            font-size: 13px; border: none; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s; font-family: inherit;
        }
        .od-btn-primary { background: #6366f1; color: white; }
        .od-btn-primary:hover { background: #4f46e5; }
        .od-btn-danger { background: #ef4444; color: white; }
        .od-btn-warning { background: #f59e0b; color: #1e293b; }
        .od-btn-ghost { background: white; border: 1px solid #e2e8f0; color: #64748b; }

        .od-loading { text-align: center; padding: 60px; color: #6366f1; }
        .od-loading i { font-size: 32px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .od-img-preview {
            max-width: 200px; border-radius: 10px; margin-top: 8px;
            cursor: pointer; transition: transform 0.2s;
        }
        .od-img-preview:hover { transform: scale(1.05); }
body.dark-mode { background: #111827 !important; color: #f9fafb !important; }
body.dark-mode .od-back { background: #1f2937 !important; border-color: #374151 !important; color: #9ca3af !important; }
body.dark-mode .od-header { background: #1f2937 !important; border-color: #374151 !important; color: #f9fafb !important; }
body.dark-mode .od-card { background: #1f2937 !important; border-color: #374151 !important; color: #f9fafb !important; }
body.dark-mode .od-field span { color: #d1d5db !important; }
body.dark-mode .od-btn-ghost { background: #1f2937 !important; border-color: #374151 !important; color: #9ca3af !important; }
    </style>
    <script src="js/safe-area.js?v=8b338400"></script>
    <script src="js/ui-states.js?v=ab12c7ad"></script>
    <link rel="stylesheet" href="css/admin-panel.css?v=68b59909">
    <link rel="stylesheet" href="css/dark-mode.css?v=432e909e">
    <link rel="stylesheet" href="css/admin-mobile.css?v=9f8d7083">
    <script src="js/admin-mobile.js?v=5b949b76"></script>
    <script src="js/theme-manager.js?v=ef048761"></script>
    <script src="js/admin-alerts.js?v=197ebabe"></script>
    <script src="js/admin-palette.js?v=5e60d8d8"></script>
</head>
<body>

<div class="od-container" id="mainContainer">
    <div class="od-loading" id="loadingState">
        <i class="fas fa-spinner fa-spin"></i>
        <p style="margin-top:12px;font-weight:700;">جاري تحميل تفاصيل الطلب...</p>
    </div>
</div>

<!-- Google Maps — key served centrally from env via /api/config -->
<script src="js/maps-loader.js?v=9c3cdf9b"></script>
<script src="js/map-markers.js?v=34f3acc0"></script>
<script>loadGoogleMaps({ need: ['routes'] });</script>
<!-- SweetAlert2 -->
<script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>

<script>
const token = localStorage.getItem('adminToken') || localStorage.getItem('token');
let userObj = null;
try { userObj = JSON.parse(localStorage.getItem('user')); } catch(e) {}
if (!token || !userObj || (userObj.role !== 'admin' && userObj.role !== 'sub_admin')) {
    window.location.href = 'admin-login.html';
}

const BASE = window.API_URL || 'https://wajeezsd.com';
const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

// 🖼️ Helper: build full image URL from relative path or absolute URL
function getFullImageUrl(url) {
    if (!url) return '';
    if (url.startsWith('data:image')) return url;
    if (url.startsWith('http://') || url.startsWith('https://')) return url;
    const base = (window.API_URL && window.API_URL !== '') ? window.API_URL : 'https://wajeezsd.com';
    const clean = url.replace(/\\/g, '/');
    const withSlash = clean.startsWith('/') ? clean : '/' + clean;
    // على السيرفر الحي، الصور موجودة تحت /api/uploads
    const isLocal = base.includes('localhost') || base.includes('127.0.0.1');
    if (!isLocal && withSlash.startsWith('/uploads')) return base + '/api' + withSlash;
    return base + withSlash;
}

const orderId = new URLSearchParams(window.location.search).get('id');
if (!orderId) { document.getElementById('mainContainer').innerHTML = '<p style="text-align:center;padding:40px;">لم يتم تحديد طلب</p>'; }

const statusMap = {
    pending: 'قيد الانتظار', accepted: 'مقبول', picked_up: 'قيد التوصيل',
    delivered: 'مكتمل', cancelled: 'ملغي', scheduled: 'مجدول'
};
const distanceMap = { short: 'قريب', medium: 'متوسط', long: 'بعيد', custom: 'مخصص' };

async function loadOrder() {
    try {
        const res = await fetch(`${BASE}/api/admin/orders/${orderId}`, { headers });
        if (!res.ok) throw new Error('Failed');
        const order = await res.json();
        if (!order) throw new Error('Not found');
        renderOrder(order);
    } catch(e) {
        document.getElementById('mainContainer').innerHTML = `
            <button class="od-back" onclick="history.back()"><i class="fas fa-arrow-right"></i> رجوع</button>
            <div style="text-align:center;padding:40px;"><p style="font-weight:700;color:#ef4444;">فشل تحميل الطلب</p></div>
        `;
    }
}

// ⏱️ بطاقة الخط الزمني — من o.timeline الذي يبنيه السيرفر (طوابع الانتقالات)
// 🔒 كل حقل يكتبه العميل أو الكابتن (عناوين، أسماء جهات الاتصال، الملاحظات،
//    نصّ الشكوى) يُعرَض في جلسة الأدمن ومعها adminToken في localStorage.
//    حقنه خاماً = استيلاء كامل على اللوحة بطلب واحد.
//    مُعرَّفة في نطاق الملف لا داخل renderOrder: renderTimelineCard تستعملها أيضاً.
const esc = (v) => window.escapeHtml ? window.escapeHtml(v == null ? '' : v)
                                     : String(v == null ? '' : v);

function renderTimelineCard(o) {
    const tl = o.timeline;
    if (!tl || !Array.isArray(tl.steps) || !tl.steps.length) return '';
    const fmt = (iso) => {
        if (!iso) return 'بانتظار';
        try { return new Date(iso).toLocaleString('ar-SA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
        catch (_) { return '—'; }
    };
    const items = tl.steps.map(s => {
        const cls = s.cancelled ? 'cancelled' : (s.done ? (s.key === tl.current ? 'active done' : 'done') : '');
        return `<li class="${cls}">
            <div class="tl-title">${esc(s.label)}</div>
            <div class="tl-time">${fmt(s.at)}</div>
        </li>`;
    }).join('');
    const eta = (o.eta && o.eta.text && !['delivered', 'cancelled'].includes(o.status))
        ? `<div style="margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:#4338ca;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;">
             <i class="fas fa-clock"></i> زمن الوصول المتوقّع ~${o.eta.text}${o.eta.distanceKm != null ? ` · ${o.eta.distanceKm} كم` : ''}
           </div>` : '';
    return `
        <div class="od-card" style="margin-bottom:16px;">
            <div class="od-card-title"><i class="fas fa-stream" style="color:#6366f1;"></i> الخط الزمني للطلب</div>
            ${eta}
            <ul class="od-timeline">${items}</ul>
        </div>`;
}

// 💬 بطاقة عروض المفاوضة — الإدارة كانت لا ترى العروض إطلاقاً، فلا تعرف لماذا
// بقي طلب "قيد الانتظار" طويلاً: أهو مهمَل أم أن العميل يماطل في عروض وصلته؟
function renderNegotiationsCard(o) {
    const list = Array.isArray(o.negotiations) ? o.negotiations : [];
    if (!list.length) return '';

    const label = {
        pending: ['قيد انتظار العميل', '#b45309', '#fef3c7'],
        accepted: ['مقبول', '#166534', '#dcfce7'],
        rejected: ['مرفوض', '#991b1b', '#fee2e2'],
        expired: ['انتهت مدته', '#475569', '#e2e8f0'],
        withdrawn: ['سحبه الكابتن', '#475569', '#e2e8f0']
    };
    const now = Date.now();
    // الأحدث أولاً، والعروض المفتوحة قبل المنتهية
    const sorted = [...list].sort((a, b) => {
        const openA = a.status === 'pending' && (!a.expiresAt || new Date(a.expiresAt) > now);
        const openB = b.status === 'pending' && (!b.expiresAt || new Date(b.expiresAt) > now);
        return (openB ? 1 : 0) - (openA ? 1 : 0);
    });
    const openCount = sorted.filter(n =>
        n.status === 'pending' && (!n.expiresAt || new Date(n.expiresAt) > now)).length;

    const rows = sorted.map(n => {
        // العرض المنتهي زمنياً يظل pending حتى يمرّ عليه المجدول، فنعرض حقيقته
        const stale = n.status === 'pending' && n.expiresAt && new Date(n.expiresAt) <= now;
        const [txt, fg, bg] = label[stale ? 'expired' : n.status] || label.pending;
        const diff = (Number(n.proposedPrice) || 0) - (Number(n.originalPrice) || 0);
        const diffTxt = diff === 0 ? '' :
            `<span style="font-size:11.5px;font-weight:800;color:${diff > 0 ? '#dc2626' : '#16a34a'};">
                ${diff > 0 ? '+' : ''}${diff} ج.س</span>`;
        const when = n.expiresAt
            ? new Date(n.expiresAt).toLocaleTimeString('ar-SD', { hour: '2-digit', minute: '2-digit' })
            : '—';
        return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e2e8f0;">
            <div style="min-width:0;flex:1;">
                <div style="font-size:13.5px;font-weight:700;color:#1e293b;">
                    ${window.escapeHtml ? window.escapeHtml(n.captainName || 'كابتن') : (n.captainName || 'كابتن')}
                </div>
                <div style="font-size:11px;color:#94a3b8;font-weight:700;">
                    ${n.captainRating ? '⭐ ' + Number(n.captainRating).toFixed(1) : 'كابتن جديد'}
                    · تنتهي ${when}
                </div>
            </div>
            <div style="text-align:center;min-width:96px;">
                <div style="font-size:15px;font-weight:800;color:#0f172a;">${n.proposedPrice} ج.س</div>
                <div style="font-size:10.5px;color:#94a3b8;">الأصلي ${n.originalPrice ?? o.price} ${diffTxt}</div>
            </div>
            <span style="font-size:10.5px;font-weight:800;border-radius:99px;padding:3px 10px;
                background:${bg};color:${fg};white-space:nowrap;">${txt}</span>
        </div>`;
    }).join('');

    return `
        <div class="od-card" style="margin-bottom:16px;">
            <div class="od-card-title">
                <i class="fas fa-comments-dollar" style="color:#d97706;"></i> عروض المفاوضة
                <span style="font-size:12px;font-weight:800;color:#b45309;background:#fef3c7;border-radius:99px;padding:3px 10px;margin-right:8px;">
                    ${openCount} مفتوح من ${list.length}
                </span>
            </div>
            ${rows}
        </div>`;
}

// 🧭 الطلب المحمّل حالياً — يحتاجه محرّر المسار (الإحداثيات والسعر والمدينة)
let currentOrder = null;

function renderOrder(o) {
    currentOrder = o;
    const container = document.getElementById('mainContainer');
    const createdDate = new Date(o.createdAt).toLocaleString('ar-SA');

    container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
            <button class="od-back" onclick="history.back()" style="margin-bottom:0;"><i class="fas fa-arrow-right"></i> رجوع للوحة التحكم</button>
            <button class="admin-icon-btn header-theme-toggle" data-theme-toggle title="تبديل الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <div class="od-header">
            <div class="od-header-right">
                <h1><i class="fas fa-receipt" style="color:var(--primary, #048c5b);"></i> طلب #${o._id.slice(-6).toUpperCase()}</h1>
                <p>تم الإنشاء: ${createdDate}</p>
            </div>
            <span class="od-status-badge ${o.status}">${statusMap[o.status] || o.status}</span>
        </div>

        <div class="od-grid">
            <!-- Client Info -->
            <div class="od-card">
                <div class="od-card-title"><i class="fas fa-user"></i> بيانات العميل</div>
                <div class="od-field"><label>الاسم</label><span>${esc(o.client?.name) || '—'}</span></div>
                <div class="od-field"><label>الهاتف</label><span dir="ltr">${esc(o.client?.phone) || '—'}</span></div>
            </div>

            <!-- Captain Info -->
            <div class="od-card">
                <div class="od-card-title"><i class="fas fa-motorcycle"></i> بيانات الكابتن</div>
                ${o.captain ? `
                    <div class="od-field"><label>الاسم</label><span>${esc(o.captain.name)}</span></div>
                    <div class="od-field"><label>الهاتف</label><span dir="ltr">${esc(o.captain.phone) || '—'}</span></div>
                ` : '<p style="color:#94a3b8;font-size:13px;">لم يتم تعيين كابتن بعد</p>'}
            </div>

            <!-- Pickup -->
            <div class="od-card">
                <div class="od-card-title"><i class="fas fa-map-pin" style="color:#10b981;"></i> نقطة الاستلام</div>
                <div class="od-field"><label>العنوان</label><span>${esc(o.pickup?.address) || '—'}</span></div>
                <div class="od-field"><label>اسم جهة الاتصال</label><span>${esc(o.pickup?.contactName) || '—'}</span></div>
                <div class="od-field"><label>هاتف جهة الاتصال</label><span dir="ltr">${esc(o.pickup?.contactPhone) || '—'}</span></div>
            </div>

            <!-- Dropoff -->
            <div class="od-card">
                <div class="od-card-title"><i class="fas fa-flag-checkered" style="color:#ef4444;"></i> نقطة التسليم</div>
                <div class="od-field"><label>العنوان</label><span>${esc(o.dropoff?.address) || '—'}</span></div>
                <div class="od-field"><label>اسم المستلم</label><span>${esc(o.dropoff?.receiverName) || '—'}</span></div>
                <div class="od-field"><label>هاتف المستلم</label><span dir="ltr">${esc(o.dropoff?.receiverPhone) || '—'}</span></div>
            </div>
        </div>

        ${(o.isMultiStop && Array.isArray(o.stops) && o.stops.length >= 2) ? `
        <!-- 🧭 Multi-stop trip stations -->
        <div class="od-card" style="margin-bottom:16px;">
            <div class="od-card-title">
                <i class="fas fa-route" style="color:#0ea5e9;"></i> محطات الرحلة متعددة النقاط
                <span style="font-size:12px;font-weight:800;color:#0ea5e9;background:#e0f2fe;border-radius:99px;padding:3px 10px;margin-right:8px;">
                    ${o.stops.filter(s=>s.done).length} / ${o.stops.length} اكتملت
                </span>
            </div>
            ${o.stops.map((s, i) => `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;${i < o.stops.length - 1 ? 'border-bottom:1px dashed #e2e8f0;' : ''}">
                <span style="width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;
                    background:${s.done ? '#dcfce7' : (s.type === 'pickup' ? '#dbeafe' : '#fee2e2')};color:${s.done ? '#16a34a' : (s.type === 'pickup' ? '#2563eb' : '#dc2626')};">
                    ${s.done ? '<i class="fas fa-check"></i>' : (i + 1)}
                </span>
                <div style="min-width:0;flex:1;">
                    <div style="font-size:11px;color:#94a3b8;font-weight:700;">${s.type === 'pickup' ? 'استلام' : 'تسليم'}${s.contactName ? ' — ' + esc(s.contactName) : ''}${s.contactPhone ? ' — ' + esc(s.contactPhone) : ''}</div>
                    <div style="font-size:13.5px;font-weight:700;color:#1e293b;">${esc(s.address) || '—'}</div>
                </div>
                <span style="font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 9px;
                    background:${s.done ? '#dcfce7' : '#fef3c7'};color:${s.done ? '#166534' : '#b45309'};">
                    ${s.done ? ('تمت' + (s.doneAt ? ' — ' + new Date(s.doneAt).toLocaleTimeString('ar-SD', { hour: '2-digit', minute: '2-digit' }) : '')) : 'قادمة'}
                </span>
            </div>`).join('')}
        </div>` : ''}

        <!-- 💬 عروض المفاوضة -->
        ${renderNegotiationsCard(o)}

        <!-- 💬 محادثة العميل والكابتن — تُحمَّل بطلب صريح لا تلقائياً -->
        <div class="od-card" style="margin-bottom:16px;">
            <div class="od-card-title">
                <i class="fas fa-comments" style="color:#0ea5e9;"></i> محادثة العميل والكابتن
            </div>
            <div id="chatViewer">
                <p style="color:#64748b;font-size:12.5px;margin:0 0 10px;">

                </p>
                <button class="od-btn od-btn-primary" onclick="loadChat('${o._id}')">
                    <i class="fas fa-eye"></i> عرض المحادثة
                </button>
            </div>

        <!-- ⏱️ Status timeline -->
        ${renderTimelineCard(o)}

        <!-- Pricing & Details -->

                <div class="od-card-title"><i class="fas fa-coins"></i> التسعير</div>

                <div class="od-field"><label>صافي الكابتن</label><span>${o.netRevenue || (o.price - (o.appFee || 0))} ج.س</span></div>
                <div class="od-field"><label>نوع المسافة</label><span>${distanceMap[o.distanceType] || o.distanceType}</span></div>
                <div class="od-field"><label>نوع الطلب</label><span>${o.orderType === 'shop' ? '🛒 طلب من محل' : '📦 توصيل عادي'}</span></div>
            </div>

            <div class="od-card">
                <div class="od-card-title"><i class="fas fa-info-circle"></i> تفاصيل إضافية</div>
                <div class="od-field"><label>ملاحظات</label><span>${esc(o.details) || 'لا توجد'}</span></div>
                ${o.shopName ? `<div class="od-field"><label>المحل</label><span>${esc(o.shopName)}</span></div>` : ''}
                ${o.items && o.items.length ? `<div class="od-field"><label>العناصر</label><span>${esc(o.items.join('، '))}</span></div>` : ''}
                ${o.scheduledAt ? `<div class="od-field"><label>موعد التسليم</label><span>${new Date(o.scheduledAt).toLocaleString('ar-SA')}</span></div>` : ''}
                ${o.rating?.score ? `<div class="od-field"><label>التقييم</label><span>⭐ ${o.rating.score}/5 ${o.rating.comment ? '— ' + esc(o.rating.comment) : ''}</span></div>` : ''}
                ${o.complaint?.text ? `<div class="od-field"><label>شكوى</label><span style="color:#ef4444;">${esc(o.complaint.text)} (${esc(o.complaint.status)})</span></div>` : ''}
            </div>
        </div>

        <!-- Images -->
        ${o.parcelImage || o.receiptImage ? `
        <div class="od-card" style="margin-bottom:20px;">
            <div class="od-card-title"><i class="fas fa-image"></i> الصور المرفقة</div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                ${o.parcelImage ? `<img src="${esc(getFullImageUrl(o.parcelImage))}" class="od-img-preview" data-lightbox alt="صورة الطرد" onerror="this.style.display='none'">` : ''}
                ${o.receiptImage ? `<img src="${esc(getFullImageUrl(o.receiptImage))}" class="od-img-preview" data-lightbox alt="إيصال الدفع" onerror="this.style.display='none'">` : ''}
            </div>
        </div>` : ''}

        <!-- Map -->
        ${hasMappableRoute(o) ? `
        <div class="od-card" style="margin-bottom:20px;">
            <div class="od-card-title"><i class="fas fa-route"></i> مسار التوصيل</div>
            <div class="od-map" id="orderMap"></div>
            <div id="orderRouteSummary" style="padding:8px 4px 0;font-size:12px;color:#64748b;"></div>
        </div>` : `
        <!-- ⚠️ طرفٌ بلا إحداثيات: الصمت هنا كان يترك الأدمن يظنّ أن الخريطة
             معطّلة، بينما المشكلة في بيانات الطلب نفسه. -->
        <div class="od-card" style="margin-bottom:20px;">
            <div class="od-card-title"><i class="fas fa-route"></i> مسار التوصيل</div>
            <div style="padding:16px;border-radius:12px;background:#fef3c7;border:1px solid #fde68a;color:#92400e;font-size:13px;line-height:1.9;">
                <b><i class="fas fa-triangle-exclamation"></i> تعذّر رسم المسار</b><br>
                ${missingCoordLabels(o).length
                    ? `لا توجد إحداثيات محفوظة لـ <b>${missingCoordLabels(o).join(' و')}</b>.`
                    : 'إحداثيات الطلب غير مكتملة.'}
                العنوان النصّي أعلاه هو المرجع، وللكابتن الاتصال بالعميل لتحديد الموقع.
            </div>
        </div>`}

        <!-- Actions -->
        <div class="od-card">
            <div class="od-card-title"><i class="fas fa-tools"></i> إجراءات الإدارة</div>
            <div class="od-actions">
                <button class="od-btn od-btn-primary" onclick="changeStatus('${o._id}')"><i class="fas fa-exchange-alt"></i> تغيير الحالة</button>

                ${!['delivered','cancelled'].includes(o.status) ? `<button class="od-btn" style="background:#0ea5e9;color:#fff;" onclick="openRouteEditor()"><i class="fas fa-route"></i> تعديل المسار</button>` : ''}

    // Init map if coordinates exist

}

/* ══════════════════════════════════════════════════════════════
   🧭 محرّر مسار الرحلة

   يسمح بإضافة محطة أو حذفها أو إعادة ترتيبها، ويُظهر أثر كل تغيير على
   السعر **قبل** الحفظ.

   ⚠️ السعر لا يُحسب هنا إطلاقاً: كل تسعيرة تأتي من
   POST /orders/:id/route-quote، وهو يستدعي utils/tripPricing — نفس
   الدالّة التي يسعّر بها العميل عند إنشاء الطلب. حسابٌ في الواجهة كان
   سيبدو صحيحاً اليوم ثم ينحرف أوّل ما يتغيّر رسمُ النقطة الإضافية في
   الإعدادات، فيرى الأدمن رقماً ويحفظ الخادمُ غيره.
   ══════════════════════════════════════════════════════════════ */

let routeDraft = [];
let routeQuote = null;
let routeQuoteTimer = 0;

function openRouteEditor() {
    const o = currentOrder;
    if (!o) return;

    // المصدر: stops إن وُجدت، وإلا نبني محطتين من pickup/dropoff
    const base = (Array.isArray(o.stops) && o.stops.length >= 2)
        ? o.stops
        : [
            { type: 'pickup',  address: (o.pickup && o.pickup.address) || '', lat: o.pickup && o.pickup.lat, lng: o.pickup && o.pickup.lng,
              contactName: (o.pickup && o.pickup.contactName) || '', contactPhone: (o.pickup && o.pickup.contactPhone) || '' },
            { type: 'dropoff', address: (o.dropoff && o.dropoff.address) || '', lat: o.dropoff && o.dropoff.lat, lng: o.dropoff && o.dropoff.lng,
              contactName: (o.dropoff && o.dropoff.receiverName) || '', contactPhone: (o.dropoff && o.dropoff.receiverPhone) || '' }
          ];

    routeDraft = base.map(s => ({
        type: s.type === 'pickup' ? 'pickup' : 'dropoff',
        address: s.address || '', lat: s.lat, lng: s.lng,
        contactName: s.contactName || '', contactPhone: s.contactPhone || '',
        note: s.note || '', done: !!s.done
    }));

    document.getElementById('routeModal').style.display = 'flex';
    renderRouteDraft();
}

function closeRouteEditor() {
    document.getElementById('routeModal').style.display = 'none';
    routeDraft = []; routeQuote = null;
}

function addRouteStop(type) {
    if (routeDraft.length >= 12) { alert('أقصى عدد محطات هو 12'); return; }
    routeDraft.push({ type, address: '', lat: null, lng: null, contactName: '', contactPhone: '', note: '', done: false });
    renderRouteDraft();
}

function removeRouteStop(i) {
    // 🔒 محطة أنجزها الكابتن لا تُحذف — أنجز عملاً ثم يُمحى أثره.
    //    والخادم يرفضها أيضاً؛ المنع هنا لئلا يكتشف الأدمن ذلك بعد الحفظ.
    if (routeDraft[i] && routeDraft[i].done) {
        alert('لا يمكن حذف محطة أنجزها الكابتن');
        return;
    }
    if (routeDraft.length <= 2) { alert('المسار يحتاج محطتين على الأقل'); return; }
    routeDraft.splice(i, 1);
    renderRouteDraft();
}

function moveRouteStop(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= routeDraft.length) return;
    const tmp = routeDraft[i]; routeDraft[i] = routeDraft[j]; routeDraft[j] = tmp;
    renderRouteDraft();
}

function setRouteField(i, field, value) {
    if (!routeDraft[i]) return;
    routeDraft[i][field] = (field === 'lat' || field === 'lng')
        ? (value === '' ? null : Number(value))
        : value;
    if (field === 'lat' || field === 'lng') scheduleRouteQuote();
}

function renderRouteDraft() {
    const box = document.getElementById('routeStops');
    box.innerHTML = routeDraft.map((s, i) => `
        <div style="border:1.5px solid ${s.done ? '#bbf7d0' : '#e2e8f0'};border-radius:12px;padding:10px;margin-bottom:10px;background:${s.done ? '#f0fdf4' : '#fff'};">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                <span style="width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0;
                    background:${s.type === 'pickup' ? '#dbeafe' : '#fee2e2'};color:${s.type === 'pickup' ? '#2563eb' : '#dc2626'};">${i + 1}</span>
                <select onchange="setRouteField(${i},'type',this.value)" ${s.done ? 'disabled' : ''}
                    style="border:1px solid #e2e8f0;border-radius:8px;padding:5px 8px;font-family:inherit;font-weight:700;font-size:12.5px;">
                    <option value="pickup" ${s.type === 'pickup' ? 'selected' : ''}>استلام</option>
                    <option value="dropoff" ${s.type === 'dropoff' ? 'selected' : ''}>تسليم</option>
                </select>
                ${s.done ? '<span style="font-size:11px;font-weight:800;color:#166534;background:#dcfce7;border-radius:99px;padding:2px 9px;">أنجزها الكابتن</span>' : ''}
                <span style="margin-inline-start:auto;display:flex;gap:4px;">
                    <button type="button" onclick="moveRouteStop(${i},-1)" style="border:1px solid #e2e8f0;background:#fff;border-radius:7px;width:28px;height:28px;cursor:pointer;">↑</button>
                    <button type="button" onclick="moveRouteStop(${i},1)" style="border:1px solid #e2e8f0;background:#fff;border-radius:7px;width:28px;height:28px;cursor:pointer;">↓</button>
                    <button type="button" onclick="removeRouteStop(${i})" ${s.done ? 'disabled' : ''}
                        style="border:1px solid #fecaca;background:#fff;color:#dc2626;border-radius:7px;width:28px;height:28px;cursor:pointer;${s.done ? 'opacity:.4;' : ''}">✕</button>
                </span>
            </div>
            <input value="${esc(s.address)}" oninput="setRouteField(${i},'address',this.value)" placeholder="العنوان"
                style="width:100%;border:1px solid #e2e8f0;border-radius:9px;padding:8px;font-family:inherit;font-size:13px;margin-bottom:6px;">
            <div style="display:flex;gap:6px;">
                <input value="${s.lat == null ? '' : s.lat}" oninput="setRouteField(${i},'lat',this.value)" placeholder="خط العرض" dir="ltr" inputmode="decimal"
                    style="flex:1;min-width:0;border:1px solid #e2e8f0;border-radius:9px;padding:8px;font-family:inherit;font-size:12.5px;">
                <input value="${s.lng == null ? '' : s.lng}" oninput="setRouteField(${i},'lng',this.value)" placeholder="خط الطول" dir="ltr" inputmode="decimal"
                    style="flex:1;min-width:0;border:1px solid #e2e8f0;border-radius:9px;padding:8px;font-family:inherit;font-size:12.5px;">
            </div>
        </div>`).join('');

    scheduleRouteQuote();
}

/** تسعيرةٌ مُهدَّأة: كل حرفٍ في حقل الإحداثيات لا يستحقّ نداء شبكة */
function scheduleRouteQuote() {
    clearTimeout(routeQuoteTimer);
    routeQuoteTimer = setTimeout(fetchRouteQuote, 350);
}

async function fetchRouteQuote() {
    const out = document.getElementById('routePricing');
    const ready = routeDraft.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));
    if (ready.length < 2) {
        out.innerHTML = '<span style="color:#b45309;">أدخل إحداثيات محطتين على الأقل لحساب السعر</span>';
        routeQuote = null;
        return;
    }
    try {
        const res = await fetch(`${BASE}/api/admin/orders/${currentOrder._id}/route-quote`, {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
            body: JSON.stringify({ stops: routeDraft })
        });
        const data = await res.json();
        routeQuote = data.pricing;
        if (!routeQuote) { out.textContent = '—'; return; }

        const oldPrice = currentOrder.price;
        const diff = routeQuote.calculatedPrice - oldPrice;
        const sign = diff > 0 ? '+' : '';
        out.innerHTML = `
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>المسافة</span><b>${routeQuote.distanceKm.toFixed(2)} كم</b></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>نقاط إضافية</span><b>${routeQuote.extraStops}</b></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;border-top:1px dashed #e2e8f0;margin-top:4px;padding-top:6px;">
                <span>تسعيرة التطبيق</span><b style="color:#0369a1;">${routeQuote.calculatedPrice} ج.س</b></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;">
                <span>السعر الحالي</span><b>${oldPrice} ج.س</b></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;">
                <span>الفرق</span><b style="color:${diff > 0 ? '#dc2626' : (diff < 0 ? '#16a34a' : '#64748b')};">${sign}${diff} ج.س</b></div>
            <div style="font-size:11.5px;color:#64748b;margin-top:6px;">
                الحدود المسموحة: ${routeQuote.minAllowedPrice} – ${routeQuote.maxAllowedPrice} ج.س</div>`;

        const pf = document.getElementById('routePriceInput');
        if (pf && !pf.dataset.touched) pf.value = routeQuote.calculatedPrice;
    } catch (e) {
        out.innerHTML = '<span style="color:#dc2626;">تعذّر حساب السعر</span>';
        routeQuote = null;
    }
}

async function saveRouteEdit() {
    const btn = document.getElementById('routeSaveBtn');
    const missing = routeDraft.some(s => !Number.isFinite(s.lat) || !Number.isFinite(s.lng) || !String(s.address || '').trim());
    if (missing) { alert('كل محطة تحتاج عنواناً وإحداثيات صحيحة'); return; }

    const pf = document.getElementById('routePriceInput');
    const price = pf && pf.value !== '' ? Number(pf.value) : undefined;

    btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
    try {
        const res = await fetch(`${BASE}/api/admin/orders/${currentOrder._id}/route`, {
            method: 'PUT',
            headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
            body: JSON.stringify({ stops: routeDraft, price })
        });
        const data = await res.json();
        if (!res.ok) { alert(data.message || 'فشل حفظ المسار'); return; }
        closeRouteEditor();
        location.reload();
    } catch (e) {
        alert('فشل الاتصال بالسيرفر');
    } finally {
        btn.disabled = false; btn.textContent = 'حفظ المسار';
    }
}

/**
 * نقاط المسار بترتيب الزيارة.
 * ⚠️ للرحلات متعددة النقاط المصدرُ هو o.stops. أما pickup/dropoff فهما مجرّد مرآة لأول
 * استلام وآخر تسليم (عقد models/Order.js) — الاعتماد عليهما وحدهما كان يُسقط كلَّ المحطات
 * الوسطى من الخريطة، فتظهر رحلةٌ بخمس محطات للأدمن كنقطتين وخطٍّ مستقيم بينهما.
 */
/**
 * 🧭 إحداثيات صالحة للرسم على الخريطة.
 *
 * ⚠️ العطل الذي يُغلقه: فحص `lat != null` وحده كان يمرّر حالتين تُنتجان دبوساً
 * كاذباً:
 *   • lng مفقود تماماً — لم يكن يُفحص إطلاقاً.
 *   • lat = lng = 0 — رقمٌ صالح لكنه ليس موقعاً، بل نقطة تقاطع خطّي الأصل في
 *     خليج غينيا. رُصد فعلاً في الإنتاج: طلبٌ استلامه في السودان وتسليمه
 *     يُرسم في المحيط الأطلسي، ويفشل حساب المسار بلا سبب ظاهر للأدمن.
 *
 * الصفران معاً يعنيان «بلا موقع» لا موقعاً في المحيط — ولا مدينة نخدمها تقترب
 * منهما، فرفضهما آمن.
 */
function validCoord(lat, lng) {
    // ⚠️ الرفض الصريح أولاً: Number(null) و Number('') يساويان صفراً لا NaN،
    // فقيمة مفقودة كانت تمرّ كخط طولٍ صفر (على خطّ غرينتش).
    if (lat === null || lat === undefined || lat === '' ||
        lng === null || lng === undefined || lng === '') return false;
    if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) return false;
    lat = Number(lat); lng = Number(lng);
    if (lat === 0 && lng === 0) return false;          // "Null Island" — إحداثيات غائبة
    return Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
}

function routePoints(o) {
    if (o.isMultiStop && Array.isArray(o.stops) && o.stops.length >= 2) {
        return o.stops
            .filter(s => validCoord(s.lat, s.lng))
            .map((s, i) => ({
                lat: s.lat, lng: s.lng,
                type: s.type, done: !!s.done,
                label: `${s.type === 'pickup' ? 'استلام' : 'تسليم'} ${i + 1}`,
                address: s.address || ''
            }));
    }
    const pts = [];
    if (validCoord(o.pickup?.lat,  o.pickup?.lng))  pts.push({ lat: o.pickup.lat,  lng: o.pickup.lng,  type: 'pickup',  done: false, label: 'الاستلام', address: o.pickup.address  || '' });
    if (validCoord(o.dropoff?.lat, o.dropoff?.lng)) pts.push({ lat: o.dropoff.lat, lng: o.dropoff.lng, type: 'dropoff', done: false, label: 'التسليم',  address: o.dropoff.address || '' });
    return pts;
}

/** أيّ طرفٍ من الرحلة بلا إحداثيات — يُقال للأدمن صراحةً بدل خريطةٍ ناقصة بصمت */
function missingCoordLabels(o) {
    if (o.isMultiStop && Array.isArray(o.stops) && o.stops.length >= 2) {
        const bad = o.stops.filter(s => !validCoord(s.lat, s.lng)).length;
        return bad ? [`${bad} محطة بلا إحداثيات`] : [];
    }
    const out = [];
    if (!validCoord(o.pickup?.lat,  o.pickup?.lng))  out.push('الاستلام');
    if (!validCoord(o.dropoff?.lat, o.dropoff?.lng)) out.push('التسليم');
    return out;
}

function hasMappableRoute(o) {
    return routePoints(o).length >= 2;
}

function initOrderMap(o) {
    if (!window.google?.maps) { setTimeout(() => initOrderMap(o), 500); return; }
    const el = document.getElementById('orderMap');
    if (!el) return;

    const pts = routePoints(o);
    if (pts.length < 2) return;

    const map = new google.maps.Map(el, {
        center: { lat: pts[0].lat, lng: pts[0].lng }, zoom: 13,
        disableDefaultUI: true, zoomControl: true,
        styles: [{ featureType: 'poi', stylers: [{ visibility: 'off' }] }]
    });

    // دبابيس مرقّمة بترتيب الزيارة: أزرق = استلام، أحمر = تسليم، رمادي = محطة تمّت.
    // (نفس دلالة الألوان في شاشة الكابتن — الأدمن والكابتن يجب أن يريا الرحلة نفسها)
    pts.forEach((p, i) => {
        new google.maps.Marker({
            position: { lat: p.lat, lng: p.lng },
            map,
            title: `${p.label}${p.address ? ' — ' + p.address : ''}${p.done ? ' (تمّت)' : ''}`,
            label: { text: String(i + 1), color: '#fff', fontWeight: '800', fontSize: '12px' },
            zIndex: 2,
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 13,
                fillColor: p.done ? '#94a3b8' : (p.type === 'pickup' ? '#2563eb' : '#dc2626'),
                fillOpacity: 1,
                strokeColor: '#fff',
                strokeWeight: 2
            }
        });
    });

    const bounds = new google.maps.LatLngBounds();
    pts.forEach(p => bounds.extend({ lat: p.lat, lng: p.lng }));
    map.fitBounds(bounds, 50);

    const summary = document.getElementById('orderRouteSummary');

    // المسار الحقيقي على الطرق عبر كل المحطات بالترتيب.
    // ⚠️ بلا optimizeWaypoints: الترتيب المخزَّن هو المعتمد فعلاً في التنفيذ، والأدمن يجب
    // أن يرى ما سيسلكه الكابتن لا مساراً أمثل افتراضياً.
    new google.maps.DirectionsService().route({
        origin:      { lat: pts[0].lat, lng: pts[0].lng },
        destination: { lat: pts[pts.length - 1].lat, lng: pts[pts.length - 1].lng },
        waypoints:   pts.slice(1, -1).map(p => ({ location: { lat: p.lat, lng: p.lng }, stopover: true })),
        optimizeWaypoints: false,
        travelMode: google.maps.TravelMode.DRIVING
    }).then(res => {
        new google.maps.DirectionsRenderer({
            map, directions: res,
            suppressMarkers: true,                 // دبابيسنا المرقّمة أوضح من A/B/C
            polylineOptions: { strokeColor: '#6366f1', strokeWeight: 5, strokeOpacity: 0.85 }
        });
        const legs = res.routes[0].legs;
        const km  = legs.reduce((s, l) => s + l.distance.value, 0) / 1000;
        const min = legs.reduce((s, l) => s + l.duration.value, 0) / 60;
        if (summary) summary.textContent = `${pts.length} محطات • ${km.toFixed(1)} كم • ~${Math.round(min)} دقيقة على الطرق`;
    }).catch(() => {
        // تعذّر Directions (المفتاح/الشبكة) — لا نترك الخريطة بلا مسار: خطٌّ مستقيم يمرّ
        // بكل المحطات بالترتيب. أضعف من مسار الطرق، لكنه لا يُخفي محطةً كما كان يحدث.
        new google.maps.Polyline({
            path: pts.map(p => ({ lat: p.lat, lng: p.lng })),
            map, strokeColor: '#6366f1', strokeWeight: 3, strokeOpacity: 0.7
        });
        if (summary) summary.textContent = `${pts.length} محطات — تعذّر حساب مسار الطرق (خط تقريبي)`;
    });
}

async function changeStatus(id) {

        showCancelButton: true, confirmButtonText: 'تحديث', cancelButtonText: 'إلغاء'
    });

    try {
        const res = await fetch(`${BASE}/api/admin/orders/${id}`, {

        });

}

// ========================================
// 💬 عارض المحادثة (قراءة فقط)
// لا يُحمَّل تلقائياً مع الصفحة: قراءة رسائل خاصة يجب أن تكون فعلاً مقصوداً من
// الأدمن لا أثراً جانبياً لفتح طلب — والسيرفر يسجّل كل طلب في سجل التدقيق.
// ========================================
async function loadChat(id) {
    const box = document.getElementById('chatViewer');
    box.innerHTML = '<div style="text-align:center;padding:18px;"><i class="fas fa-spinner fa-spin"></i></div>';
    try {
        const res = await fetch(`${BASE}/api/admin/chats/${id}`, { headers });
        if (res.status === 403) {
            box.innerHTML = '<p style="color:#b45309;font-size:13px;margin:0;">لا تملك صلاحية قراءة المحادثات (view_chats).</p>';
            return;
        }
        if (!res.ok) throw new Error('failed');
        const data = await res.json();
        const msgs = data.messages || [];
        if (!msgs.length) {
            box.innerHTML = '<p style="color:#94a3b8;font-size:13px;margin:0;">لا رسائل في هذا الطلب.</p>';
            return;
        }

        const clientId = data.order?.client?._id ? String(data.order.client._id) : '';
        const rows = msgs.map(m => {
            const senderId = m.sender && m.sender._id ? String(m.sender._id) : '';
            const isClient = senderId === clientId;
            const who = m.sender?.name || (isClient ? 'العميل' : 'الكابتن');
            const time = new Date(m.createdAt).toLocaleString('ar-SD', {
                day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
            });
            // الصورة بعد 48 ساعة: الملف محذوف وimageExpiredAt مضبوط — نوضّح ذلك
            // بدل عرض صورة مكسورة تبدو كخلل في اللوحة
            const media = m.imageUrl
                ? `<div style="margin-top:6px;"><img src="${getFullImageUrl(m.imageUrl)}"
                       data-lightbox alt="صورة"
                       style="max-width:170px;border-radius:10px;cursor:pointer;display:block;"
                       onerror="this.replaceWith(document.createTextNode('تعذّر تحميل الصورة'))"></div>`
                : (m.imageExpiredAt
                    ? `<div style="margin-top:6px;font-size:11.5px;color:#94a3b8;">
                         <i class="fas fa-image"></i> حُذفت الصورة بعد ${data.imageTtlHours || 48} ساعة</div>`
                    : '');
            const text = (m.text || '').trim();
            return `
            <div style="display:flex;justify-content:${isClient ? 'flex-start' : 'flex-end'};margin-bottom:8px;">
                <div style="max-width:78%;background:${isClient ? '#f1f5f9' : '#e0f2fe'};
                            border-radius:12px;padding:8px 11px;">
                    <div style="font-size:11px;font-weight:800;color:${isClient ? '#475569' : '#0369a1'};">
                        ${window.escapeHtml ? window.escapeHtml(who) : who}
                        <span style="color:#94a3b8;font-weight:600;"> · ${time}</span>
                    </div>
                    ${text ? `<div style="font-size:13.5px;color:#1e293b;white-space:pre-wrap;word-break:break-word;">${window.escapeHtml ? window.escapeHtml(text) : text}</div>` : ''}
                    ${media}
                </div>
            </div>`;
        }).join('');

        const images = msgs.filter(m => m.imageUrl).length;
        box.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:#64748b;">
                <span>${msgs.length} رسالة${images ? ` · ${images} صورة` : ''}</span>
                <span>العميل يميناً · الكابتن يساراً</span>
            </div>
            <div style="max-height:420px;overflow-y:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;">
                ${rows}
            </div>
            <div style="margin-top:10px;">
                <button class="od-btn od-btn-danger" onclick="deleteChat('${id}', ${msgs.length}, ${images})">
                    <i class="fas fa-trash"></i> حذف المحادثة من قاعدة البيانات
                </button>
            </div>`;
    } catch (e) {
        box.innerHTML = '<p style="color:#ef4444;font-size:13px;margin:0;">فشل تحميل المحادثة.</p>';
    }
}

// 🗑️ حذف المحادثة — لا رجعة فيه، فالتأكيد يذكر العدد ويطلب كتابة «حذف»
async function deleteChat(id, count, images) {
    const r = await Swal.fire({
        icon: 'warning',
        title: 'حذف المحادثة نهائياً؟',
        html: `سيُمحى <b>${count}</b> رسالة${images ? ` و<b>${images}</b> صورة` : ''} `
            + `من قاعدة البيانات، ولا يمكن استرجاعها.<br>`
            + `<span style="color:#64748b;font-size:.85rem;">`
            + `تُحذف عند الطرفين، ويُسجَّل الحذف باسمك في سجل التدقيق.</span>`,
        input: 'text',
        inputPlaceholder: 'اكتب: حذف',
        showCancelButton: true,
        confirmButtonText: 'حذف نهائي',
        cancelButtonText: 'إلغاء',
        confirmButtonColor: '#b91c1c',
        inputValidator: (v) => (String(v || '').trim() !== 'حذف' ? 'اكتب كلمة «حذف» للتأكيد' : null)
    });
    if (!r.isConfirmed) return;

    try {
        const res = await fetch(`${BASE}/api/admin/chats/${id}`, { method: 'DELETE', headers });
        const data = await res.json().catch(() => ({}));
        if (res.status === 403) {
            Swal.fire('غير مصرح', 'تحتاج صلاحية حذف المحادثات (manage_chats).', 'warning');
            return;
        }
        if (!res.ok) throw new Error(data.message || 'failed');
        Swal.fire('تم الحذف', data.message || 'حُذفت المحادثة', 'success');
        document.getElementById('chatViewer').innerHTML =
            '<p style="color:#94a3b8;font-size:13px;margin:0;">حُذفت المحادثة.</p>';
    } catch (e) {
        Swal.fire('فشل الحذف', e.message || 'حاول مجدداً', 'error');
    }
}

// 🔄 تبديل الكابتن على طلب نشط
async function reassignCaptain(orderId) {
    // 1. Fetch active captains
    let captains = [];
    try {
        const res = await fetch(`${BASE}/api/admin/captains`, { headers });
        if (res.ok) {
            const data = await res.json();
            captains = (data.captains || data).filter(c => c.isActive && c.approvalStatus === 'approved');
        }
    } catch(e) {}

    if (!captains.length) {
        Swal.fire('تنبيه', 'لا يوجد كباتن متاحين حالياً', 'warning');
        return;
    }

    // 2. Build select dropdown
    const optionsHtml = captains.map(c =>
        `<option value="${c._id}">${c.name} — ${c.phone || 'لا يوجد رقم'} ${c.vehicleType ? '(' + c.vehicleType + ')' : ''}</option>`
    ).join('');

    const { value: newCaptainId, isConfirmed } = await Swal.fire({
        title: '🔄 تبديل الكابتن',
        html: `
            <p style="color:#64748b;font-size:13px;margin-bottom:14px;">
                اختر الكابتن الجديد. سيُبلَّغ الكابتن الحالي بنقل الطلب ويُبلَّغ الكابتن الجديد بالتعيين.
            </p>
            <select id="captainSelectModal" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid #e2e8f0;font-family:Cairo,sans-serif;font-size:14px;font-weight:700;color:#1e293b;">
                <option value="">— اختر كابتن —</option>
                ${optionsHtml}
            </select>`,
        showCancelButton: true,
        confirmButtonText: 'تحويل الطلب 🚀',
        cancelButtonText: 'إلغاء',
        confirmButtonColor: '#8b5cf6',
        cancelButtonColor: '#64748b',
        preConfirm: () => {
            const val = document.getElementById('captainSelectModal').value;
            if (!val) { Swal.showValidationMessage('يرجى اختيار كابتن'); return false; }
            return val;
        }
    });

    if (!isConfirmed || !newCaptainId) return;

    try {
        const res = await fetch(`${BASE}/api/admin/orders/${orderId}/reassign-captain`, {
            method: 'PUT',
            headers,
            body: JSON.stringify({ newCaptainId })
        });
        const data = await res.json();
        if (res.ok) {
            Swal.fire({
                title: '✅ تم التبديل بنجاح',
                text: data.message,
                icon: 'success',
                confirmButtonColor: '#8b5cf6'
            }).then(() => loadOrder());
        } else {
            Swal.fire('خطأ', data.message, 'error');
        }
    } catch(e) {
        Swal.fire('خطأ', 'فشل الاتصال بالسيرفر', 'error');
    }
}
