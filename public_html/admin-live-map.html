<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخريطة المباشرة | وصل-لي</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .map-header {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .map-header h1 {
            font-size: 20px;
            margin: 0;
            color: #2c3e50;
        }

        .stats-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            min-width: 200px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .stat-icon.online {
            background: #d4edda;
            color: #155724;
        }

        .stat-icon.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .back-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
        }

        .captain-popup {
            text-align: center;
            padding: 10px;
        }

        .captain-popup h5 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }

        .captain-popup .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .captain-popup .status.available {
            background: #d4edda;
            color: #155724;
        }

        .captain-popup .status.busy {
            background: #fff3cd;
            color: #856404;
        }
    </style>
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css">
</head>

<body>
    <div class="map-header">
        <h1><i class="bi bi-geo-alt-fill text-primary"></i> الخريطة المباشرة للكباتن</h1>
        <small class="text-muted">تحديث فوري لمواقع الكباتن النشطين</small>
    </div>

    <div class="stats-panel">
        <div class="stat-item">
            <div class="stat-icon online">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <div>
                <div style="font-size: 24px; font-weight: bold; color: #27ae60;" id="onlineCount">0</div>
                <small class="text-muted">متصل</small>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-icon offline">
                <i class="bi bi-x-circle-fill"></i>
            </div>
            <div>
                <div style="font-size: 24px; font-weight: bold; color: #e74c3c;" id="offlineCount">0</div>
                <small class="text-muted">غير متصل</small>
            </div>
        </div>
    </div>

    <button class="btn btn-primary back-btn" onclick="window.location.href='admin.html'">
        <i class="bi bi-arrow-right"></i> العودة للوحة التحكم
    </button>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>

    <script src="js/admin-live-map.js"></script>
    <!-- Auth Helper & App Core -->
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
