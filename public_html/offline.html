<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل | وصل-لي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a8754 0%, #065f3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .offline-container {
            text-align: center;
            color: white;
            padding: 40px;
        }

        .offline-icon {
            font-size: 120px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .retry-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            background: white;
            color: #0a8754;
            border: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .retry-btn:hover {
            transform: scale(1.05);
        }
    </style>
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css">
</head>

<body>
    <div class="offline-container">
        <i class="bi bi-wifi-off offline-icon"></i>
        <h1 class="display-4 fw-bold mb-3">غير متصل بالإنترنت</h1>
        <p class="lead mb-4">يبدو أنك غير متصل بالإنترنت. تحقق من اتصالك وحاول مرة أخرى.</p>
        <button class="retry-btn" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise me-2"></i>
            إعادة المحاولة
        </button>
    </div>
    <!-- Auth Helper & App Core -->
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
