<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المحادثات | وجيز</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.4">
    <style>
        body {
            background: #f8fafc;
            margin: 0;
            padding: 0;
        }

        /* ===== Header ===== */
        .conv-header {
            background: linear-gradient(135deg, #04553A, #0d9d63);
            color: white;
            padding: 16px;
            padding-top: calc(16px + var(--sat, env(safe-area-inset-top, 0px)));
        }

        /* ===== Conversations List ===== */
        .conv-list {
            height: calc(100vh - 160px);
            overflow-y: auto;
            scrollbar-width: none;
        }
        .conv-list::-webkit-scrollbar { display: none; }

        /* ===== Conversation Item ===== */
        .conversation-item {
            transition: all 0.2s ease;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
        }
        .conversation-item:active { background: #f0fdf4; }

        /* ===== Avatar ===== */
        .avatar-circle {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #04553A, #25d366);
            color: white;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* ===== Status Dot ===== */
        .status-dot {
            width: 12px;
            height: 12px;
            border: 2px solid white;
            position: absolute;
            bottom: 0;
            right: 0;
            border-radius: 50%;
        }

        /* ===== Text ===== */
        .conv-name       { font-weight: 800; font-size: 14px; color: #1e293b; }
        .conv-last-msg   { font-size: 12px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .conv-time       { font-size: 10px; color: #94a3b8; white-space: nowrap; }
        .unread-badge    { background: #04553A; color: white; border-radius: 99px; font-size: 10px; font-weight: 800; padding: 2px 7px; min-width: 20px; text-align: center; }

        /* ===== Empty State ===== */
        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-state i  { font-size: 3rem; display: block; margin-bottom: 12px; }
        .empty-state p  { font-size: 14px; }
    </style>
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css?v=97af4497">
    <script src="js/config.js?v=b84e6b6a"></script>
    <script src="js/fetch-retry.js?v=069d96ba"></script>
    <script src="js/auth-helper.js?v=849c502f"></script>
    <link rel="stylesheet" href="css/dark-mode.css?v=f21a3ab5">
</head>

<body>

    <!-- ===== Header ===== -->
    <div class="conv-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px;">💬</div>
                <div>
                    <div style="font-weight: 800; font-size: 17px;">المحادثات</div>
                    <div style="font-size: 11px; opacity: 0.7;" id="conv-count">تحميل...</div>
                </div>
            </div>
            <a href="client-my-orders.html" style="background: rgba(255,255,255,0.15); color: white; border-radius: 99px; padding: 8px 16px; font-size: 12px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px;">
                <i class="bi bi-box2"></i> طلباتي
            </a>
        </div>
    </div>

    <!-- ===== Conversations Wrapper ===== -->
    <div style="max-width: 600px; margin: 0 auto; background: white; min-height: calc(100vh - 160px);" id="convListWrapper">

        <!-- Search Bar -->
        <div style="padding: 12px 16px; border-bottom: 1px solid #f0f0f0; background: white; position: sticky; top: 0; z-index: 10;">
            <div style="background: #f8fafc; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 8px;">
                <i class="bi bi-search" style="color:#94a3b8;"></i>
                <input type="text" id="conv-search" placeholder="بحث في المحادثات..."
                    style="border:none;background:transparent;outline:none;font-size:13px;font-family:Cairo,sans-serif;width:100%;"
                    oninput="filterConversations(this.value)">
            </div>
        </div>

        <!-- List -->
        <div id="conversationsContent" class="conv-list">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-success spinner-border-sm mb-2" role="status"></div>
                <p class="small">جاري تحميل المحادثات...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="mobile-nav-glass">
        <a href="client-orders.html" class="nav-item-link">
            <i class="bi bi-house-door-fill"></i>
        </a>
        <a href="client-my-orders.html" class="nav-item-link">
            <i class="bi bi-box2"></i>
        </a>
        <a href="notifications.html" class="nav-item-link">
            <i class="bi bi-bell-fill"></i>
        </a>
        <a href="#" onclick="logout()" class="nav-item-link">
            <i class="bi bi-box-arrow-right"></i>
        </a>
    </nav>

    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="notification-toast.js"></script>
    <script>
        const token = localStorage.getItem('token') || localStorage.getItem('clientToken') || localStorage.getItem('captainToken');
        let user = null;
        try { user = JSON.parse(localStorage.getItem('user')); } catch(e) {}

        if (!token || !user) { window.location.href = 'client-login.html'; throw new Error('No auth'); }

        let socket = null;
        let activeUsers = {};
        let allConversations = [];

        // تهريب إلزامي: الاسم ونص آخر رسالة يكتبهما الطرف الآخر ويُحقنان في innerHTML
        const esc = window.escapeHtml || ((s) => String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));

        // ===== Socket =====
        function initSocket() {
            const serverUrl = (typeof API_URL !== 'undefined') ? API_URL : 'https://wajeezsd.com';
            socket = io(serverUrl, {
                reconnection: true,
                transports: ['polling', 'websocket'],
                auth: { token: localStorage.getItem('token') }
            });
            socket.on('connect', () => {
                socket.emit('user_join', user.id);
            });
            socket.on('user_status', (data) => {
                activeUsers[data.userId] = data.status;
                renderConversations(allConversations);
            });
            socket.on('new_message_notification', (data) => {
                if (data.receiver === user.id) {
                    loadConversations();
                }
            });
        }

        // ===== Render conversations =====
        function renderConversations(conversations) {
            const container = document.getElementById('conversationsContent');

            if (!conversations || conversations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-chat-square-dots"></i>
                        <p>لا توجد محادثات نشطة</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            conversations.forEach(conv => {
                const isOnline = activeUsers[conv.userId] === 'online';
                const initials = conv.user.name
                    ? conv.user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)
                    : '??';

                const timeStr = conv.lastMessageTime
                    ? new Date(conv.lastMessageTime).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' })
                    : 'الآن';

                const item = document.createElement('div');
                item.className = 'conversation-item';
                item.onclick = () => openConversation(conv);

                item.innerHTML = `
                    <div class="position-relative">
                        <div class="avatar-circle">${initials}</div>
                        <span class="status-dot ${isOnline ? 'bg-success' : 'bg-secondary'}"></span>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
                            <div class="conv-name">${esc(conv.user.name)}</div>
                            <div class="conv-time">${timeStr}</div>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                            <!-- ⚠️ الاسم ونص آخر رسالة يكتبهما مستخدم آخر: بلا تهريب
                                 تُنفَّذ رسالة تحوي <img onerror=...> في جهاز من يفتح القائمة -->
                            <div class="conv-last-msg">${conv.lastSender === user.id ? '<i class="bi bi-check2-all" style="color:#04553A"></i> ' : ''}${esc(conv.lastMessage) || '...'}</div>
                            ${conv.unreadCount > 0 ? `<div class="unread-badge">${conv.unreadCount}</div>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // ===== Filter =====
        function filterConversations(query) {
            const filtered = allConversations.filter(c =>
                c.user.name.toLowerCase().includes(query.toLowerCase())
            );
            renderConversations(filtered);
        }

        // ===== Load conversations from API =====
        async function loadConversations() {
            try {
                const apiBase = (typeof API_URL !== 'undefined') ? API_URL : 'https://wajeezsd.com';
                const headers = (window.Auth && window.Auth.getAuthHeader)
                    ? window.Auth.getAuthHeader()
                    : { 'Authorization': `Bearer ${token}` };

                const res = await fetchWithRetry(`${apiBase}/api/chat/conversations`, { headers });
                const conversations = await res.json();

                allConversations = conversations;

                // Update count in header
                const countEl = document.getElementById('conv-count');
                if (countEl) countEl.textContent = `${conversations.length} محادثة نشطة`;

                renderConversations(conversations);
            } catch (err) {
                console.error(err);
            }
        }

        // ===== Open conversation (always navigate on mobile-first) =====
        function openConversation(conv) {
            window.location.href = `chat.html?orderId=${conv.orderId}&receiverId=${conv.userId}`;
        }

        function logout() {
            if (window.Auth) {
                window.Auth.logout();
            } else {
                localStorage.clear();
                window.location.href = 'client-login.html';
            }
        }

        initSocket();
        loadConversations();
        setInterval(loadConversations, 10000);
    </script>
    <!-- Auth Helper already loaded in head -->
    <script src="js/geo.js?v=3f3df042"></script>
    <script type="module" src="js/app-core.js?v=064b92a3"></script>
    <script type="module" src="js/native-notifications.js?v=76150d71"></script>
    <script src="js/theme-manager.js?v=a33a528b"></script>
</body>

</html>
