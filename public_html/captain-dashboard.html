    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/sweetalert2@11'></script>
    <script src="notification-toast.js"></script>

    <script>
        // --- 1. GLOBAL VARIABLES & AUTH ---
        // استخدام Auth Helper للتحقق
        if (!window.Auth || !window.Auth.isAuthenticated()) {
            window.location.href = 'captain-login.html';
        }

        const token = window.Auth.getToken(); // استخدام التوكن من الهيلبر

        let userId = localStorage.getItem('userId');
        let gpsInterval = null;
        let isWorking = false;

        // --- 2. ONBOARDING & PERMISSIONS ---
        async function checkOnboarding(force = false) {
            // If already asked this session and not forced by user, skip
            if (!force && sessionStorage.getItem('workStatusAsked')) {
                return;
            }

            if (!("geolocation" in navigator)) {
                return Swal.fire('خطأ', 'المتصفح لا يدعم تحديد الموقع', 'error');
            }

            // Check Permissions
            try {
                const permission = await navigator.permissions.query({ name: 'geolocation' });
                if (permission.state === 'denied') {
                    return Swal.fire('تنبيه', 'يجب تفعيل الموقع للعمل', 'warning');
                }
            } catch (e) { console.log(e); }

            sessionStorage.setItem('workStatusAsked', 'true');

            Swal.fire({
                title: 'هل تريد العمل الآن؟ 🚗',
                text: 'سيتم تفعيل استقبال الطلبات',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'نعم، أنا جاهز ✅',
                cancelButtonText: 'لا، لاحقاً ❌',
                confirmButtonColor: '#0a8754',
                cancelButtonColor: '#7f8c8d',
                allowOutsideClick: false
            }).then((result) => {
                if (result.isConfirmed) {
                    toggleStatus(true);
                } else if (result.dismiss === Swal.DismissReason.cancel) {
                    toggleStatus(false);
                }
            });
        }

        // --- 3. TOGGLE STATUS & UI ---
        async function toggleStatus(forceState = null) {
            try {
                const res = await fetch(`${API_URL}/api/captain/toggle-availability`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ isActive: forceState })
                });

                if (res.ok) {
                    const data = await res.json();
                    isWorking = data.isActive;
                    updateUI(isWorking);

                    if (isWorking) {
                        startLocationTracking();
                        if (forceState !== null) Swal.fire('تم التفعيل', 'أنت الآن متصل وتستقبل الطلبات', 'success');
                    } else {
                        stopLocationTracking();
                    }
                }
            } catch (err) {
                console.error("Status toggle error", err);
            }
        }

        function updateUI(active) {
            const badge = document.getElementById('availabilityToggle');
            if (badge) {
                if (active) {
                    badge.className = 'btn btn-success text-white rounded-pill px-3 py-2 fw-bold shadow-sm d-flex align-items-center gap-2';
                    badge.innerHTML = '<i class="bi bi-wifi"></i> <span>متصل</span>';
                } else {
                    badge.className = 'btn btn-secondary text-white rounded-pill px-3 py-2 fw-bold shadow-sm d-flex align-items-center gap-2';
                    badge.innerHTML = '<i class="bi bi-wifi-off"></i> <span>غير متصل</span>';
                }
            }
        }

        // --- 4. GPS TRACKING VIA CAPTAIN SERVICE ---
        async function startLocationTracking() {
            // ✅ FIX: captain-service.js is loaded as type="module" (deferred)
            // So window.CaptainService may not be available immediately.
            // Retry up to 3 seconds waiting for it.
            let retries = 0;
            while (!window.CaptainService && retries < 15) {
                await new Promise(r => setTimeout(r, 200));
                retries++;
            }

            if (window.CaptainService) {
                await window.CaptainService.startTracking(userId);
            } else {
                console.error("❌ CaptainService failed to load after retries — falling back to web tracking");
                // Fallback: direct web geolocation
                if (navigator.geolocation && window.socket) {
                    navigator.geolocation.watchPosition(
                        (pos) => {
                            window.socket.emit('update_location', {
                                userId,
                                lat: pos.coords.latitude,
                                lng: pos.coords.longitude
                            });
                        },
                        (err) => console.error('GPS Error:', err),
                        { enableHighAccuracy: true }
                    );
                }
            }
        }

        async function stopLocationTracking() {
            if (window.CaptainService) {
                await window.CaptainService.stopTracking();
            }
        }

        // Legacy function removed, handled by service
        function sendLocation() { /* ... */ }

        // --- 5. FETCH STATISTICS ---
        async function fetchStats() {
            try {
                const res = await fetch(`${API_URL}/api/captain/stats`, {
                    headers: window.Auth.getAuthHeader()
                });

                if (!res.ok) throw new Error('Failed to fetch stats');

                const data = await res.json();

                // Update DOM safely
                if (document.getElementById('completedOrders'))
                    document.getElementById('completedOrders').innerText = data.completedCount || 0;

                if (document.getElementById('totalEarnings'))
                    document.getElementById('totalEarnings').innerText = (data.earnings || 0) + ' ج.س';

                // ✅ Update Availability Toggle State
                if (typeof data.isActive !== 'undefined') {
                    isWorking = data.isActive;
                    updateUI(isWorking);
                    // ✅ FIX: Auto-restart tracking if captain was already online
                    if (isWorking) {
                        startLocationTracking();
                    }
                }

                // Rating Logic
                const ratingCount = data.ratingCount || 0;
                const badge = document.getElementById('rating-badge');

                if (ratingCount === 0) {
                    if (document.getElementById('rating-val')) document.getElementById('rating-val').innerText = '-';
                    if (badge) {
                        badge.className = 'badge bg-secondary';
                        badge.innerText = 'لم يتم التقييم';
                    }
                } else {
                    const rating = parseFloat(data.rating || 0).toFixed(1);
                    if (document.getElementById('rating-val')) document.getElementById('rating-val').innerText = rating;

                    if (badge) {
                        if (rating >= 4.5) {
                            badge.className = 'badge bg-success';
                            badge.innerText = 'ممتاز 🌟';
                        } else if (rating >= 3) {
                            badge.className = 'badge bg-warning text-dark';
                            badge.innerText = 'جيد';
                        } else {
                            badge.className = 'badge bg-danger';
                            badge.innerText = 'يحتاج تحسين';
                        }
                    }
                }
            } catch (error) {
                console.error("Stats Error:", error);
            }
        }

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', () => {
            // ✅ FIX: أنشئ Socket مبكراً مع reconnection قوي
            const serverUrl = (typeof API_URL !== 'undefined') ? API_URL : 'https://wassili.site';
            window.socket = io(serverUrl, {
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                transports: ['websocket', 'polling']
            });

            window.socket.on('connect', () => {
                console.log('✅ Captain socket connected:', window.socket.id);
                if (userId) window.socket.emit('user_join', userId);
                // ✅ أرسل الموقع الأخير فوراً بعد إعادة الاتصال
                if (isWorking && window.CaptainService && window.CaptainService.lastLocation) {
                    const { lat, lng } = window.CaptainService.lastLocation;
                    window.socket.emit('update_location', { userId, lat, lng });
                    console.log('📍 Resent location after reconnect');
                }
            });

            window.socket.on('disconnect', (reason) => {
                console.warn('⚠️ Captain socket disconnected:', reason);
            });

            window.socket.on('connect_error', (err) => {
                console.error('❌ Socket error:', err.message);
            });

            fetchStats();
            checkOnboarding();

            // Initialize notification socket
            if (userId && typeof initNotificationSocket === 'function') {
                initNotificationSocket(userId);
            }

            // Set Captain Name
            const name = localStorage.getItem('captainName');
            if (name) {
                document.getElementById('captainName').innerText = `مرحباً بك، ${name.split(' ')[0]} 👋`;
            }
        });
    </script>

    <!-- 🚨 SOS Emergency Button -->
    <button id="sos-btn"
        style="position:fixed;bottom:80px;left:20px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#e74c3c 0%,#c0392b 100%);color:white;border:3px solid white;font-size:28px;box-shadow:0 5px 25px rgba(231,76,60,0.5);cursor:pointer;z-index:1000;"
        onclick="triggerSOS()">🚨</button>
    <script>
        async function triggerSOS() { if (!confirm('⚠️ هل أنت في حالة طوارئ؟')) return; const btn = document.getElementById('sos-btn'); btn.disabled = true; btn.innerHTML = '⏳'; navigator.geolocation.getCurrentPosition(async (p) => { try { const res = await fetch(`${API_URL}/api/emergency/alert`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ lat: p.coords.latitude, lng: p.coords.longitude }) }); if (res.ok) { btn.style.background = '#27ae60'; btn.innerHTML = '✅'; alert('✅ تم إرسال التنبيه!'); setTimeout(() => { btn.disabled = false; btn.innerHTML = '🚨'; btn.style.background = 'linear-gradient(135deg,#e74c3c 0%,#c0392b 100%)' }, 3000) } } catch (e) { btn.disabled = false; btn.innerHTML = '🚨'; alert('❌ خطأ في الإرسال') } }, () => { btn.disabled = false; btn.innerHTML = '🚨'; alert('❌ خطأ GPS') }, { enableHighAccuracy: true }) }
    </script>
