<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مهامي الجارية | وجيز</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.4">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css?v=97af4497">
    <link rel="stylesheet" href="css/enhanced-styles.css?v=3dc00ed1">
    <link rel="stylesheet" href="css/dark-mode.css?v=7df0a5e8">
    <script src="js/config.js?v=b84e6b6a"></script>
    <script src="js/fetch-retry.js?v=069d96ba"></script>
    <script src="js/theme-manager.js?v=a33a528b"></script>
    <script src="js/auth-helper.js?v=849c502f"></script>
    <script src="js/geo.js?v=3f3df042"></script>
    <script src="js/maps-loader.js?v=c382a678"></script>
    <script src="vendor/image-compression/browser-image-compression.js"></script>

    <style>
        /* ───── مهامّ أصغر وأنظف (توحيد مع صفحة "طلباتي") ───── */
        #missions-container .card { border-radius: 15px !important; box-shadow: 0 2px 10px rgba(15,23,42,0.06) !important; }
        #missions-container .card .p-3 { padding: 10px !important; }
        #missions-container .card .p-2 { padding: 8px !important; }
        #missions-container .card .mb-3 { margin-bottom: 9px !important; }
        #missions-container .card .fs-5 { font-size: 0.95rem !important; }
        #missions-container .card .btn { font-size: 13px !important; }
        #missions-container .card img { max-height: 140px !important; }
    </style>
</head>

<body class="bg-light">

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white rounded-circle p-2 shadow-sm">
                        <i class="bi bi-list-check text-warning fs-4"></i>
                    </div>
                    <div>
                        <h2 class="h6 fw-bold mb-0 text-white">مهامي الحالية</h2>
                        <p class="small text-white-50 mb-0">تابع طلباتك النشطة</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Missions Container -->
    <div class="container mt-3">
        <div id="missions-container" class="d-flex flex-column gap-3">
            <div class="text-center py-5">
                <div class="spinner-border text-light" role="status"></div>
                <p class="mt-2 text-white fw-bold">جاري تحميل المهام...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="mobile-nav-glass">
        <a href="captain-dashboard.html" class="nav-item-link">
            <i class="bi bi-house-door-fill"></i>
        </a>
        <a href="captain-orders.html" class="nav-item-link">
            <i class="bi bi-bicycle"></i>
        </a>
        <a href="captain-missions.html" class="nav-item-link active">
            <i class="bi bi-card-checklist"></i>
        </a>
        <a href="captain-notifications.html" class="nav-item-link">
            <i class="bi bi-bell-fill"></i>
        </a>
        <a href="captain-profile.html" class="nav-item-link">
            <i class="bi bi-person-circle"></i>
        </a>
    </nav>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="notification-toast.js"></script>

    <script>
        // Check Auth
        if (!window.Auth || !window.Auth.isAuthenticated()) {
            // Identify login page based on context or generic
            // window.location.href = "client-login.html"; // handled by specific pages usually
        }
        const token = window.Auth.getToken();
        const userId = localStorage.getItem('userId');
        if (!token) window.location.href = 'captain-login.html';

        if (userId) {
            initNotificationSocket(userId);

            // ✅ BUG #16: Direct socket init — no setInterval polling
            const socket = io(API_URL, {
                transports: ['polling', 'websocket'],
                auth: { token: localStorage.getItem('token') }
            });
            socket.on('connect', () => {
                if (userId) socket.emit('user_join', userId);
            });
            socket.on('order_status_updated', () => fetchMissions());
            socket.on('new_order_available', () => fetchMissions());
        }

        // ⏱️ كتلة ETA + الخط الزمني المصغّر للكابتن (أنماط inline — مستقلة عن CSS الصفحة)
        function missionProgressHtml(order) {
            let html = '';
            if (order.eta && order.eta.text && !['delivered', 'cancelled'].includes(order.status)) {
                html += `<div style="display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#04553A,#0a7a54);color:#fff;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:800;margin-bottom:10px;">
                    <i class="bi bi-clock-history"></i> زمن التوصيل المتوقّع ~${order.eta.text}${order.eta.distanceKm != null ? ` · ${order.eta.distanceKm} كم` : ''}
                </div>`;
            }
            const tl = order.timeline;
            if (tl && Array.isArray(tl.steps) && tl.steps.length) {
                const fmt = (iso) => { if (!iso) return ''; try { return new Date(iso).toLocaleTimeString('ar-SD', { hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; } };
                html += `<div style="display:flex;margin-bottom:12px;">${tl.steps.map((s, i) => {
                    const last = i === tl.steps.length - 1;
                    const color = s.cancelled ? '#ef4444' : (s.done ? '#22c55e' : '#cbd5e1');
                    const active = s.key === tl.current && !s.cancelled;
                    const bg = s.cancelled ? '#ef4444' : (active ? '#04553A' : (s.done ? '#22c55e' : '#fff'));
                    const fg = (s.done || active || s.cancelled) ? '#fff' : '#94a3b8';
                    const icon = s.cancelled ? '<i class="bi bi-x"></i>' : (s.done ? '<i class="bi bi-check"></i>' : '');
                    const lineColor = s.done ? '#22c55e' : '#e2e8f0';
                    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;position:relative;">
                        ${!last ? `<div style="position:absolute;top:9px;left:calc(50% + 10px);right:calc(-50% + 10px);height:2px;background:${lineColor};"></div>` : ''}
                        <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${color};background:${bg};color:${fg};display:flex;align-items:center;justify-content:center;font-size:10px;z-index:1;">${icon}</div>
                        <div style="font-size:9px;font-weight:700;color:${(s.done || active) ? '#04553A' : '#94a3b8'};margin-top:3px;text-align:center;">${s.label}</div>
                        <div style="font-size:8.5px;font-weight:700;color:#94a3b8;min-height:10px;">${fmt(s.at)}</div>
                    </div>`;
                }).join('')}</div>`;
            }
            return html;
        }

        async function fetchMissions() {
            try {
                const response = await fetchWithRetry(`${API_URL}/api/orders/my-missions`, {
                    headers: window.Auth.getAuthHeader()
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const orders = await response.json();
                // تُقرأ من خريطة المسار وزر إعادة الترتيب — تفادياً لجلب الطلب مرة أخرى عند كل نقرة
                window._missions = orders;
                const container = document.getElementById('missions-container');
                container.innerHTML = '';

                if (!Array.isArray(orders) || orders.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-clipboard-check fs-1 text-secondary opacity-50 mb-3"></i>
                            <p class="text-muted fw-bold">ليس لديك مهام جارية حالياً</p>
                            <a href="captain-orders.html" class="btn btn-primary rounded-pill px-4 shadow-sm">تصفح الطلبات</a>
                        </div>`;
                    return;
                }

                orders.forEach(order => {
                    // ✅ استخدام الإحداثيات إذا متوفرة، وإلا العنوان النصي
                    const isMulti = order.isMultiStop && Array.isArray(order.stops) && order.stops.length >= 2;
                    const undoneCount = isMulti ? order.stops.filter(s => !s.done).length : 0;

                    const isErrand = order.orderType === 'errand';
                    const eq = (order.errand && order.errand.quoteStatus) || 'none';

                    let actionBtn = '';
                    if (order.status === 'accepted' && isErrand && eq !== 'confirmed') {
                        // 🛍️ errand: أدخِل سعر البضاعة وانتظر تأكيد العميل قبل الشراء
                        if (eq === 'quoted') {
                            actionBtn = `
                            <div class="alert alert-info py-2 mb-2 rounded-3 small fw-bold text-center">
                                <i class="bi bi-hourglass-split me-1"></i> بانتظار تأكيد العميل للسعر (${order.errand.goodsQuote} ج.س)
                            </div>
                            <button class="btn btn-outline-primary w-100 py-2 fw-bold mb-2 rounded-3" onclick="openErrandQuote('${order._id}', ${order.errand.goodsQuote || ''})">
                                <i class="bi bi-pencil-square me-1"></i> تعديل السعر
                            </button>`;
                        } else {
                            actionBtn = `
                            <button class="btn btn-primary w-100 py-2 fw-bold mb-2 shadow-sm rounded-3" onclick="openErrandQuote('${order._id}', '')">
                                <i class="bi bi-cash-coin me-2"></i> أدخِل سعر البضاعة
                            </button>`;
                        }
                    } else if (order.status === 'accepted') {
                        const buyLabel = isErrand ? 'صوّر البضاعة وأكّد الشراء' : `صوّر الطلبية وأكّد ${isMulti ? 'أول استلام' : 'الاستلام'}`;
                        actionBtn = `
                        <button class="btn btn-warning w-100 py-2 fw-bold text-dark mb-2 shadow-sm rounded-3" onclick="openPickupPhotoModal('${order._id}')">
                            <i class="bi bi-camera-fill me-2"></i> ${buyLabel}
                        </button>`;
                    } else if (order.status === 'picked_up') {
                        if (isMulti && undoneCount > 1) {
                            // لسه في نقاط لم تكتمل — التسليم النهائي بعدها
                            actionBtn = `
                            <button class="btn btn-secondary w-100 py-2 fw-bold mb-2 rounded-3" disabled>
                                <i class="bi bi-hourglass-split me-2"></i> أكمل باقي النقاط (${undoneCount - 1}) ثم أكّد التسليم النهائي
                            </button>`;
                        } else {
                            actionBtn = `
                            <button class="btn btn-success w-100 py-2 fw-bold mb-2 shadow-sm rounded-3" onclick="markDelivered('${order._id}')">
                                <i class="bi bi-check-circle-fill me-2"></i> ${isMulti ? 'تم تسليم النقطة الأخيرة' : 'تم التسليم (استلام الكاش)'}
                            </button>`;
                        }
                    }

                    // 🧭 قائمة المحطات للتوصيل متعدد النقاط (بدل كتلتي الاستلام/التسليم)
                    const locationBlock = isMulti ? `
                        <div class="mb-3">
                            <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 rounded-pill mb-2">
                                <i class="bi bi-signpost-split-fill me-1"></i>رحلة متعددة النقاط — أكمل النقاط بالترتيب
                            </span>

                            <!-- 🗺️ الرحلة ككل: خريطة المسار الكامل + اقتراح ترتيب أقصر من موقع الكابتن -->
                            <div class="d-flex gap-2 mb-2">
                                <button class="btn btn-sm btn-primary rounded-pill flex-fill fw-bold py-2"
                                        onclick="openRouteMap('${order._id}')">
                                    <i class="bi bi-map-fill me-1"></i> عرض المسار كامل
                                </button>
                                ${undoneCount >= 2 ? `
                                <button class="btn btn-sm btn-outline-primary rounded-pill flex-fill fw-bold py-2"
                                        onclick="suggestRoute('${order._id}')">
                                    <i class="bi bi-shuffle me-1"></i> رتّب لي أفضل مسار
                                </button>` : ''}
                            </div>

                            ${order.stops.map((s, i) => {
                                const isP = s.type === 'pickup';
                                const isLastUndone = !s.done && undoneCount === 1;
                                let btn;
                                if (s.done) {
                                    btn = `<span class="badge bg-success rounded-pill"><i class="bi bi-check-lg"></i> تم</span>`;
                                } else if (order.status === 'picked_up' && !isLastUndone) {
                                    // 🔒 نُمرّر _id المحطة (أمتن من الفهرس)، مع الفهرس احتياطاً إن غاب
                                    const ref = s._id || i;
                                    btn = `<button class="btn btn-sm btn-outline-success rounded-pill px-2 py-1" style="font-size:0.72rem;" onclick="markStopDone('${order._id}', '${ref}')">تأكيد</button>`;
                                } else if (isLastUndone) {
                                    btn = `<span class="badge bg-warning text-dark rounded-pill">الأخيرة</span>`;
                                } else {
                                    btn = `<span class="badge bg-light text-muted border rounded-pill">بالانتظار</span>`;
                                }
                                return `<div class="d-flex align-items-start gap-2 bg-white p-2 rounded border border-light mb-2 ${s.done ? 'opacity-75' : ''}">
                                    <i class="bi ${isP ? 'bi-geo-alt-fill text-primary' : 'bi-flag-fill text-danger'} mt-1"></i>
                                    <div class="w-100" style="min-width:0;">
                                        <div class="d-flex justify-content-between align-items-start gap-2">
                                            <div style="min-width:0;">
                                                <small class="text-muted d-block" style="font-size:0.72rem;">${isP ? 'استلام' : 'تسليم'} ${i + 1}:</small>
                                                <strong class="text-dark d-block" style="font-size:0.9rem;">${s.address || ''}</strong>
                                            </div>
                                            ${btn}
                                        </div>
                                        <div class="d-flex gap-2 mt-1 flex-wrap">
                                            ${s.contactName ? `<span class="badge bg-light text-dark border"><i class="bi bi-person"></i> ${s.contactName}</span>` : ''}
                                            ${s.contactPhone ? `<a href="tel:${s.contactPhone}" class="text-decoration-none badge bg-success"><i class="bi bi-telephone-fill"></i> اتصل</a>` : ''}
                                            <button class="btn btn-sm btn-outline-primary rounded-pill px-2 py-0 nav-btn" style="font-size:0.72rem;"
                                                data-type="${s.type}" data-lat="${s.lat || ''}" data-lng="${s.lng || ''}" data-addr="${(s.address || '').replace(/"/g, '&quot;')}" onclick="openMapsNav(this)">
                                                <i class="bi bi-geo-alt-fill"></i> اتجاهات
                                            </button>
                                        </div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>` : null;

                    const html = `
                        <div class="card glass-card border-0 card-hover overflow-hidden">
                            <div class="card-body p-0">
                                <div class="p-3 bg-light border-bottom d-flex justify-content-between align-items-center">
                                    <span class="badge bg-primary rounded-pill">#${order._id.slice(-4)}</span>
                                    <span class="text-success fw-bold">${order.price} ج.س</span>
                                </div>
                                
                                <div class="p-3">
                                    ${missionProgressHtml(order)}
                                    ${locationBlock !== null ? locationBlock : `
                                    <div class="mb-3">
                                        <!-- قسم الاستلام مع زر الخريطة -->
                                        <div class="d-flex align-items-start gap-2 mb-3 bg-white p-2 rounded border border-light">
                                            <i class="bi bi-geo-alt-fill text-primary mt-1 fs-5"></i>
                                            <div class="w-100">
                                                <div class="d-flex justify-content-between align-items-start">
                                                    <div>
                                                        <small class="text-muted d-block" style="font-size: 0.75rem;">استلام من:</small>
                                                        <strong class="text-dark d-block mb-1">${order.pickup.address}</strong>
                                                    </div>
                                                    <button
                                                        class="btn btn-sm btn-primary text-white border-0 rounded-pill px-2 py-1 nav-btn"
                                                        data-type="pickup"
                                                        data-lat="${order.pickup.lat || ''}"
                                                        data-lng="${order.pickup.lng || ''}"
                                                        data-addr="${(order.pickup.address || '').replace(/"/g, '&quot;')}"
                                                        onclick="openMapsNav(this)">
                                                        <i class="bi bi-geo-alt-fill"></i> اتجاهات
                                                    </button>
                                                </div>
                                                <div class="d-flex gap-2 mt-2">
                                                    ${order.pickup.contactName ? `<span class="badge bg-light text-dark border"><i class="bi bi-person"></i> ${order.pickup.contactName}</span>` : ''}
                                                    <a href="tel:${order.pickup.contactPhone}" class="text-decoration-none badge bg-success"><i class="bi bi-telephone-fill"></i> اتصل</a>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <!-- قسم التسليم مع زر الخريطة -->
                                        <div class="d-flex align-items-start gap-2 bg-white p-2 rounded border border-light">
                                            <i class="bi bi-flag-fill text-danger mt-1 fs-5"></i>
                                            <div class="w-100">
                                                <div class="d-flex justify-content-between align-items-start">
                                                    <div>
                                                        <small class="text-muted d-block" style="font-size: 0.75rem;">تسليم إلى:</small>
                                                        <strong class="text-dark d-block mb-1">${order.dropoff.address}</strong>
                                                    </div>
                                                    <button
                                                        class="btn btn-sm btn-danger text-white border-0 rounded-pill px-2 py-1 nav-btn"
                                                        data-type="dropoff"
                                                        data-lat="${order.dropoff.lat || ''}"
                                                        data-lng="${order.dropoff.lng || ''}"
                                                        data-addr="${(order.dropoff.address || '').replace(/"/g, '&quot;')}"
                                                        data-from-lat="${order.pickup.lat || ''}"
                                                        data-from-lng="${order.pickup.lng || ''}"
                                                        data-from-addr="${(order.pickup.address || '').replace(/"/g, '&quot;')}"
                                                        onclick="openMapsNav(this)">
                                                        <i class="bi bi-flag-fill"></i> اتجاهات
                                                    </button>
                                                </div>
                                                <div class="d-flex gap-2 mt-2">
                                                    ${order.dropoff.receiverName ? `<span class="badge bg-light text-dark border"><i class="bi bi-person"></i> ${order.dropoff.receiverName}</span>` : ''}
                                                    <a href="tel:${order.dropoff.receiverPhone}" class="text-decoration-none badge bg-success"><i class="bi bi-telephone-fill"></i> اتصل</a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>`}

                                    ${isErrand && Array.isArray(order.items) && order.items.length ? `
                                    <div class="p-2 rounded mb-3" style="background:#f5f3ff;border:1px solid #ddd6fe;">
                                        <div class="fw-bold mb-1" style="color:#6d28d9;font-size:0.85rem;">
                                            <i class="bi bi-bag-check-fill me-1"></i> المطلوب شراؤه${order.errand && order.errand.budget ? ` — ميزانية تقديرية: ${order.errand.budget} ج.س` : ''}
                                        </div>
                                        <ul class="mb-0 ps-3" style="font-size:0.9rem;color:#1e293b;">
                                            ${order.items.map(it => `<li>${(it || '').toString().replace(/[<>]/g, '')}</li>`).join('')}
                                        </ul>
                                    </div>` : ''}

                                    ${order.details ? `
                                    <div class="bg-light p-2 rounded mb-3 border border-light">
                                        <div class="d-flex gap-2">
                                            <i class="bi bi-info-circle text-primary mt-1"></i>
                                            <p class="mb-0 small text-secondary">${order.details || ''}</p>
                                        </div>
                                    </div>` : ''}

                                    ${actionBtn}
                                    
                                    ${order.parcelImage ? `
                                    <div class="position-relative mb-2 mt-2">
                                        <img src="${getFullImageUrl(order.parcelImage)}" 
                                             class="w-100 rounded-3 object-fit-cover shadow-sm"
                                             style="height: 160px; cursor:pointer;"
                                             data-order-id="${order._id}"
                                             onclick="viewMissionParcelImage(this)"
                                             onerror="this.parentElement.style.display='none'"
                                             alt="صورة الطرد">
                                        <span class="position-absolute top-0 start-0 m-2 badge bg-dark bg-opacity-75 rounded-pill small">
                                            <i class="bi bi-image me-1"></i> صورة الطرد
                                        </span>
                                    </div>` : ''}
                                    
                                    <button class="btn btn-outline-primary w-100 py-2 fw-bold rounded-3" onclick="openChat('${order._id}', '${order.client._id || order.client}')">
                                        <i class="bi bi-chat-dots-fill me-2"></i> محادثة العميل
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            } catch (error) {
                // ✅ FIX: منع ظهور "Failed to fetch" الخام للمستخدم
                const container = document.getElementById('missions-container');
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-wifi-off fs-1 text-warning opacity-75 mb-3"></i>
                        <p class="text-white fw-bold mb-3">عفواً، يوجد ضعف في شبكة الإنترنت أو تأخر في استجابة الخادم. يرجى تحديث الصفحة.</p>
                        <button class="btn btn-light rounded-pill px-4" onclick="fetchMissions()">
                            <i class="bi bi-arrow-clockwise me-2"></i>إعادة المحاولة
                        </button>
                    </div>`;
                console.error('[fetchMissions]', error);
            }
        }

        // =============================================
        // 📸 نافذة التصوير — صورة إثبات الاستلام
        // =============================================
        let _proofOrderId = null;
        let _proofImageUrl = null;

        function openPickupPhotoModal(orderId) {
            _proofOrderId = orderId;
            _proofImageUrl = null;
            document.getElementById('proofPreviewImg').src = '';
            document.getElementById('proofPreviewSection').classList.add('d-none');
            document.getElementById('proofUploadSection').classList.remove('d-none');
            document.getElementById('confirmPickupBtn').disabled = true;
            document.getElementById('proofFileInput').value = '';
            const modal = new bootstrap.Modal(document.getElementById('pickupPhotoModal'));
            modal.show();
        }

        function checkAuthState() {
            if (!window.Auth || !window.Auth.getToken()) {
                window.location.href = 'captain-login.html';
                return false;
            }
            return true;
        }

        // 🖼️ Helper: build full image URL
        function getFullImageUrl(url) {
            if (!url) return '';
            if (url.startsWith('data:image')) return url;
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            const base = (window.API_URL && window.API_URL !== '') ? window.API_URL : 'https://wajeezsd.com';
            const clean = url.replace(/\\/g, '/');
            const withSlash = clean.startsWith('/') ? clean : '/' + clean;
            // على السيرفر الحي، الصور موجودة تحت /api/uploads
            const isLocal = base.includes('localhost') || base.includes('127.0.0.1');
            if (!isLocal && withSlash.startsWith('/uploads')) return base + '/api' + withSlash;
            return base + withSlash;
        }

                    document.getElementById('proofPreviewSection').classList.remove('d-none');

                        maxSizeMB: 0.3,

                    };

        // ========================================
        // 🗺️ فتح Google Maps بالاتجاهات المباشرة
        // ========================================
        function openMapsNav(btn) {
            const type = btn.dataset.type;
            const lat = btn.dataset.lat;
            const lng = btn.dataset.lng;
            const addr = btn.dataset.addr;

            const dest = (lat && lng)
                ? `${lat},${lng}`
                : encodeURIComponent(addr || '');

            if (type === 'pickup') {
                // ⚠️ كانت { timeout: 5000 } بلا enableHighAccuracy — أي نقطة انطلاق من موقع
                // شبكة خشن (±كيلومترات)، فتبدأ ملاحة جوجل من شارع خاطئ. WajeezGeo.getPrecise
                // ينتظر تقارب الـ GPS (≤6ث هنا حتى لا نؤخّر فتح الملاحة) ويعطي أدقّ قراءة.
                window.WajeezGeo.getPrecise({ minAccuracy: 50, maxWait: 6000 })
                    .then((fix) => {
                        const origin = `${fix.lat},${fix.lng}`;
                        window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving`, '_blank');
                    })
                    .catch(() => {
                        // بلا موقع: دع جوجل يحدّد نقطة الانطلاق بنفسه
                        window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`, '_blank');
                    });
            } else {
                const fromLat = btn.dataset.fromLat;
                const fromLng = btn.dataset.fromLng;
                const fromAddr = btn.dataset.fromAddr;
                const origin = (fromLat && fromLng)
                    ? `${fromLat},${fromLng}`
                    : encodeURIComponent(fromAddr || '');
                window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving`, '_blank');
            }
        }

        // ================================================================
        // 🗺️ خريطة المسار الكامل — الكابتن يرى الرحلة ككل قبل أن يتحرّك
        //
        // كانت الشاشة قائمةً نصية فقط: زر «اتجاهات» لكل محطة على حدة يفتح Google Maps
        // لنقطة واحدة. فلا يرى الكابتن شكل الرحلة ولا أين تقع النقاط من بعضها.
        // هنا نرسم المسار الحقيقي على الطرق عبر Directions API، بترتيب المحطات المخزَّن،
        // انطلاقاً من موقع الكابتن الفعلي.
        // ================================================================
        let _routeMap = null;
        let _routeRenderer = null;

        async function openRouteMap(orderId) {
            const order = (window._missions || []).find(o => o._id === orderId);
            if (!order || !Array.isArray(order.stops)) return;

            const remaining = order.stops.filter(s => !s.done && Number.isFinite(s.lat) && Number.isFinite(s.lng));
            if (remaining.length === 0) {
                Swal.fire({ icon: 'info', text: 'كل المحطات مكتملة', confirmButtonColor: '#04553A' });
                return;
            }

            const modalEl = document.getElementById('routeMapModal');
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);

            // ⚠️ الخريطة لا تُنشأ إلا بعد اكتمال فتح المودال: عنصر مخفي ارتفاعه صفر
            // فتُرسم الخريطة رمادية فارغة ولا يظهر المسار.
            const shown = modalEl.classList.contains('show')
                ? Promise.resolve()
                : new Promise(res => modalEl.addEventListener('shown.bs.modal', res, { once: true }));
            modal.show();

            const summaryEl = document.getElementById('routeSummary');
            summaryEl.innerHTML = '<span class="text-muted"><i class="bi bi-hourglass-split"></i> جاري تحديد موقعك ورسم المسار…</span>';

            try {
                // need: 'routes' ⇐ DirectionsService/Renderer ليستا ضمن معامل libraries في الرابط،
                // ومع loading=async لا تتوفّران إلا باستيراد مكتبة routes صراحةً.
                await loadGoogleMaps({ libraries: 'geometry', need: ['routes'] });
                await shown;

                // نقطة الانطلاق = موقع الكابتن الفعلي، لا أول محطة — وإلا فالمسار المعروض ليس مساره
                let origin = null;
                try {
                    origin = await window.WajeezGeo.getPrecise({ minAccuracy: 50, maxWait: 8000 });
                } catch (_) {
                    origin = { lat: remaining[0].lat, lng: remaining[0].lng };   // بلا GPS: ابدأ من أول محطة
                }

                const mapEl = document.getElementById('routeMapCanvas');
                if (!_routeMap) {
                    _routeMap = new google.maps.Map(mapEl, {
                        center: { lat: origin.lat, lng: origin.lng },
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false,
                        fullscreenControl: false
                    });
                    _routeRenderer = new google.maps.DirectionsRenderer({
                        map: _routeMap,
                        suppressMarkers: true,     // نرسم دبابيسنا المرقّمة بدلاً من A/B/C
                        polylineOptions: { strokeColor: '#04553A', strokeWeight: 5, strokeOpacity: 0.85 }
                    });
                } else {
                    _routeRenderer.setMap(_routeMap);
                    _routeMap.setCenter({ lat: origin.lat, lng: origin.lng });
                }
                google.maps.event.trigger(_routeMap, 'resize');

                // ⚠️ لا optimizeWaypoints هنا: جوجل لا يفهم قيد «كل الاستلامات قبل أي تسليم»،
                // فقد يعيد ترتيباً يسلّم طرداً قبل استلامه. الترتيب يحسمه زر «رتّب لي أفضل مسار»
                // (utils/routeOptimizer.js) الذي يحترم القيد؛ هنا نرسم الترتيب المعتمد كما هو.
                const service = new google.maps.DirectionsService();
                const result = await service.route({
                    origin: { lat: origin.lat, lng: origin.lng },
                    destination: { lat: remaining[remaining.length - 1].lat, lng: remaining[remaining.length - 1].lng },
                    waypoints: remaining.slice(0, -1).map(s => ({
                        location: { lat: s.lat, lng: s.lng },
                        stopover: true
                    })),
                    optimizeWaypoints: false,
                    travelMode: google.maps.TravelMode.DRIVING
                });

                _routeRenderer.setDirections(result);

                // دبابيس مرقّمة بترتيب الزيارة + تمييز الاستلام عن التسليم
                (window._routeMarkers || []).forEach(m => m.setMap && m.setMap(null));
                window._routeMarkers = [];

                window._routeMarkers.push(new google.maps.Marker({
                    map: _routeMap,
                    position: { lat: origin.lat, lng: origin.lng },
                    title: 'موقعك الحالي',
                    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#0d6efd', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 }
                }));

                remaining.forEach((s, i) => {
                    const isPickup = s.type === 'pickup';
                    window._routeMarkers.push(new google.maps.Marker({
                        map: _routeMap,
                        position: { lat: s.lat, lng: s.lng },
                        label: { text: String(i + 1), color: '#fff', fontWeight: 'bold', fontSize: '13px' },
                        title: `${isPickup ? 'استلام' : 'تسليم'}: ${s.address || ''}`,
                        // أزرق = استلام، أحمر = تسليم — نفس دلالة الألوان في القائمة النصية أسفل
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 13,
                            fillColor: isPickup ? '#0d6efd' : '#dc3545',
                            fillOpacity: 1,
                            strokeColor: '#fff',
                            strokeWeight: 2
                        }
                    }));
                });

                // المسافة والزمن الحقيقيان على الطرق (مجموع كل المقاطع)
                const legs = result.routes[0].legs;
                const totalKm  = legs.reduce((s, l) => s + l.distance.value, 0) / 1000;
                const totalMin = legs.reduce((s, l) => s + l.duration.value, 0) / 60;

                summaryEl.innerHTML = `
                    <div class="d-flex justify-content-around text-center">
                        <div><small class="text-muted d-block">المسافة</small><strong>${totalKm.toFixed(1)} كم</strong></div>
                        <div><small class="text-muted d-block">الزمن التقريبي</small><strong>${Math.round(totalMin)} دقيقة</strong></div>
                        <div><small class="text-muted d-block">المحطات</small><strong>${remaining.length}</strong></div>
                    </div>`;
            } catch (err) {
                console.error('route map failed:', err);
                // سبب الفشل مهم للكابتن: «لا يوجد طريق» ≠ «انقطاع اتصال» ≠ «خلل في المفتاح»
                const code = (err && (err.code || err.status)) || '';
                let reason = 'تحقق من الاتصال وحاول مجدداً';
                if (code === 'ZERO_RESULTS')        reason = 'لا يوجد طريق بري يربط هذه النقاط';
                else if (code === 'OVER_QUERY_LIMIT') reason = 'تجاوزنا حد الطلبات مؤقتاً — أعد المحاولة بعد قليل';
                else if (code === 'REQUEST_DENIED')   reason = 'خدمة الخرائط مرفوضة — راجع الإدارة';
                summaryEl.innerHTML = `<span class="text-danger"><i class="bi bi-exclamation-triangle"></i> تعذّر رسم المسار — ${reason}</span>`;
            }
        }

        // ================================================================
        // 🔀 اقتراح ترتيب أقصر — من موقع الكابتن الفعلي.
        // القرار للكابتن: هو يعرف الطريق المقطوع والاتجاه الواحد والزحمة، لا الخوارزمية.
        // ================================================================
        async function suggestRoute(orderId) {
            try {
                Swal.fire({ title: 'جاري تحديد موقعك…', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

                const fix = await window.WajeezGeo.getPrecise({ minAccuracy: 50, maxWait: 10000 });

                const res = await fetchWithRetry(`${API_URL}/api/orders/${orderId}/stops/suggest-route`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat: fix.lat, lng: fix.lng })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'تعذّر حساب أفضل مسار');

                if (!data.changed) {
                    Swal.fire({ icon: 'success', title: 'ترتيبك ممتاز أصلاً', text: 'ما لقينا مساراً أقصر من الحالي.', confirmButtonColor: '#04553A' });
                    return;
                }

                const listHtml = data.stops
                    .filter(s => !s.done)
                    .map((s, i) => `<div style="text-align:right;padding:4px 0;border-bottom:1px solid #eee;">
                        <b>${i + 1}.</b> <span style="color:${s.type === 'pickup' ? '#0d6efd' : '#dc3545'}">
                        ${s.type === 'pickup' ? 'استلام' : 'تسليم'}</span> — ${s.address || ''}</div>`)
                    .join('');

                const confirmed = await Swal.fire({
                    title: `توفير ${data.savedKm} كم`,
                    html: `<div style="font-size:0.9rem;">
                             <div class="mb-2 text-muted">الحالي: ${data.currentKm} كم &nbsp;→&nbsp; المقترح: <b>${data.optimizedKm} كم</b></div>
                             ${listHtml}
                           </div>`,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'اعتمد هذا الترتيب',
                    cancelButtonText: 'خلّيك على الحالي',
                    confirmButtonColor: '#04553A'
                });
                if (!confirmed.isConfirmed) return;

                const applyRes = await fetchWithRetry(`${API_URL}/api/orders/${orderId}/stops/reorder`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order: data.order })
                });
                const applyData = await applyRes.json();
                if (!applyRes.ok) throw new Error(applyData.message || 'تعذّر حفظ الترتيب');

                await Swal.fire({ icon: 'success', title: 'تم تحديث المسار', timer: 1400, showConfirmButton: false });
                fetchMissions();
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'تعذّر الترتيب', text: err.message, confirmButtonColor: '#04553A' });
            }
        }

        fetchMissions();
    </script>

         🗺️ Modal: المسار الكامل للرحلة متعددة النقاط
    ============================================= -->
    <div class="modal fade" id="routeMapModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg mx-2">
            <div class="modal-content border-0 rounded-4 overflow-hidden shadow-lg">
                <div class="modal-header border-0" style="background:linear-gradient(135deg,#04553A,#0a8754);color:white;">
                    <h5 class="modal-title fw-bold"><i class="bi bi-map-fill me-2"></i>المسار الكامل</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="routeMapCanvas" style="width:100%;height:60vh;min-height:320px;background:#eee;"></div>
                    <div id="routeSummary" class="p-3 border-top bg-light small"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- WhatsApp Subscription Modal -->


    <!-- =============================================
         📸 Modal: صورة إثبات الاستلام
    ============================================= -->
    <div class="modal fade" id="pickupPhotoModal" tabindex="-1" aria-labelledby="pickupPhotoModalLabel"
        data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered mx-3">
            <div class="modal-content border-0 rounded-4 overflow-hidden shadow-lg">

                <!-- Header -->
                <div class="modal-header border-0 pb-0"
                    style="background:linear-gradient(135deg,#f59e0b,#d97706);color:white;">
                    <h5 class="modal-title fw-bold" id="pickupPhotoModalLabel">
                        <i class="bi bi-camera-fill me-2"></i>صوّر الطلبية قبل الاستلام
                    </h5>
                </div>

                <!-- Body -->
                <div class="modal-body p-4">

                    <!-- تعليمات -->
                    <div class="alert alert-warning border-0 rounded-3 mb-3 py-2 px-3" style="font-size:13px;">
                        <i class="bi bi-info-circle-fill me-1"></i>
                        التقط صورة واضحة للطلبية/الشحنة قبل الاستلام. ستُرسل للعميل وللإدارة.
                    </div>

                    <!-- منطقة رفع الصورة -->
                    <div id="proofUploadSection">
                        <label for="proofFileInput"
                            class="d-flex flex-column align-items-center justify-content-center gap-3 p-4 rounded-4 border border-2 border-dashed border-warning"
                            style="cursor:pointer;background:rgba(245,158,11,0.05);min-height:160px;">
                            <i class="bi bi-camera-fill text-warning" style="font-size:3rem;"></i>
                            <div class="text-center">
                                <div class="fw-bold text-dark">اضغط لفتح الكاميرا</div>
                                <small class="text-muted">أو اختر صورة من المعرض</small>
                            </div>
                        </label>
                        <input type="file" id="proofFileInput" accept="image/*" capture="environment" class="d-none">
                    </div>

                    <!-- معاينة الصورة بعد التقاطها -->
                    <div id="proofPreviewSection" class="d-none">
                        <div class="position-relative">
                            <img id="proofPreviewImg" src="" alt="صورة الإثبات"
                                class="w-100 rounded-3 object-fit-cover shadow-sm" style="max-height:220px;">
                            <span class="badge bg-success position-absolute bottom-0 start-0 m-2 rounded-pill px-2 py-1">
                                <i class="bi bi-check-circle-fill me-1"></i> جاهزة للإرسال
                            </span>
                        </div>
                        <!-- زر إعادة التصوير -->
                        <button type="button" class="btn btn-outline-secondary w-100 mt-3 rounded-3 fw-bold"
                            onclick="retakeProofPhoto()">
                            <i class="bi bi-arrow-repeat me-2"></i>إعادة التصوير
                        </button>
                    </div>

                    <!-- حالة الرفع -->
                    <div id="proofUploadStatus" class="d-none text-center mt-2 fw-bold small text-secondary"></div>
                </div>

                <!-- Footer -->
                <div class="modal-footer border-0 pt-0 flex-column gap-2 px-4 pb-4">
                    <!-- زر التأكيد الرئيسي -->
                    <button type="button" id="confirmPickupBtn"
                        class="btn btn-warning w-100 py-3 fw-bold rounded-3 shadow-sm text-dark"
                        style="font-size:1rem;" disabled onclick="confirmPickupWithProof()">
                        <i class="bi bi-check-circle-fill me-2"></i> تم الاستلام — أرسل الصورة وأكّد
                    </button>
                    <!-- زر الإلغاء -->
                    <button type="button" class="btn btn-outline-secondary w-100 rounded-3"
                        data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-1"></i> إلغاء
                    </button>
                </div>

            </div>
        </div>
    </div>
