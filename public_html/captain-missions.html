<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهامي الجارية | وَصِّلِي</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css">
    <script src="js/config.js"></script>
</head>

<body class="pb-5 mb-5 bg-light">

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white rounded-circle p-2 shadow-sm">
                        <i class="bi bi-list-check text-warning fs-4"></i>
                    </div>
                    <div>
                        <h2 class="h5 fw-bold mb-0 text-white">مهامي الحالية</h2>
                        <p class="small text-white-50 mb-0">تابع طلباتك النشطة</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Missions Container -->
    <div class="container" style="margin-top: -30px;">
        <div id="missions-container" class="d-flex flex-column gap-3">
            <div class="text-center py-5">
                <div class="spinner-border text-light" role="status"></div>
                <p class="mt-2 text-white fw-bold">جاري تحميل المهام...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="mobile-nav-glass">
        <a href="captain-dashboard.html" class="nav-item-link">
            <i class="bi bi-house-door-fill"></i>
        </a>
        <a href="captain-orders.html" class="nav-item-link">
            <i class="bi bi-bicycle"></i>
        </a>
        <a href="captain-missions.html" class="nav-item-link active">
            <i class="bi bi-card-checklist"></i>
        </a>
        <a href="captain-notifications.html" class="nav-item-link">
            <i class="bi bi-bell-fill"></i>
        </a>
        <a href="captain-profile.html" class="nav-item-link">
            <i class="bi bi-person-circle"></i>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="notification-toast.js"></script>

    <script>
        // Check Auth
        if (!window.Auth || !window.Auth.isAuthenticated()) {
            // Identify login page based on context or generic
            // window.location.href = "client-login.html"; // handled by specific pages usually
        }
        const token = window.Auth.getToken();
        const userId = localStorage.getItem('userId');
        if (!token) window.location.href = 'captain-login.html';

        if (userId) {
            initNotificationSocket(userId);
        }

        async function fetchMissions() {
            try {
                const response = await fetch(`${API_URL}/api/orders/my-missions`, {
                    headers: window.Auth.getAuthHeader()
                });
                const orders = await response.json();
                const container = document.getElementById('missions-container');
                container.innerHTML = '';

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-clipboard-check fs-1 text-secondary opacity-50 mb-3"></i>
                            <p class="text-muted fw-bold">ليس لديك مهام جارية حالياً</p>
                            <a href="captain-orders.html" class="btn btn-primary rounded-pill px-4 shadow-sm">تصفح الطلبات</a>
                        </div>`;
                    return;
                }

                orders.forEach(order => {
                    // إنشاء روابط خرائط جوجل الديناميكية
                    // نستخدم encodeURIComponent لضمان أن العنوان العربي يفتح في الخرائط بشكل صحيح
                    const pickupMapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.pickup.address)}`;
                    const dropoffMapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.dropoff.address)}`;

                    let actionBtn = '';
                    if (order.status === 'accepted') {
                        actionBtn = `
                        <button class="btn btn-warning w-100 py-2 fw-bold text-dark mb-2 shadow-sm rounded-3" onclick="markPickup('${order._id}')">
                            <i class="bi bi-box-seam me-2"></i> تأكيد استلام الشحنة
                        </button>`;
                    } else if (order.status === 'picked_up') {
                        actionBtn = `
                        <button class="btn btn-success w-100 py-2 fw-bold mb-2 shadow-sm rounded-3" onclick="markDelivered('${order._id}')">
                            <i class="bi bi-check-circle-fill me-2"></i> تم التسليم (استلام الكاش)
                        </button>`;
                    }

                    const html = `
                        <div class="card glass-card border-0 card-hover overflow-hidden">
                            <div class="card-body p-0">
                                <div class="p-3 bg-light border-bottom d-flex justify-content-between align-items-center">
                                    <span class="badge bg-primary rounded-pill">#${order._id.slice(-4)}</span>
                                    <span class="text-success fw-bold">${order.price} ج.س</span>
                                </div>
                                
                                <div class="p-3">
                                    <div class="mb-3">
                                        <!-- قسم الاستلام مع زر الخريطة -->
                                        <div class="d-flex align-items-start gap-2 mb-3 bg-white p-2 rounded border border-light">
                                            <i class="bi bi-geo-alt-fill text-primary mt-1 fs-5"></i>
                                            <div class="w-100">
                                                <div class="d-flex justify-content-between align-items-start">
                                                    <div>
                                                        <small class="text-muted d-block" style="font-size: 0.75rem;">استلام من:</small>
                                                        <strong class="text-dark d-block mb-1">${order.pickup.address}</strong>
                                                    </div>
                                                    <a href="${pickupMapLink}" target="_blank" class="btn btn-sm btn-outline-primary shadow-sm" style="min-width: 80px;">
                                                        <i class="bi bi-map-fill"></i> خريطة
                                                    </a>
                                                </div>
                                                <div class="d-flex gap-2 mt-2">
                                                    <span class="badge bg-light text-dark border"><i class="bi bi-person"></i> ${order.pickup.contactName}</span>
                                                    <a href="tel:${order.pickup.contactPhone}" class="text-decoration-none badge bg-success"><i class="bi bi-telephone-fill"></i> اتصل</a>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <!-- قسم التسليم مع زر الخريطة -->
                                        <div class="d-flex align-items-start gap-2 bg-white p-2 rounded border border-light">
                                            <i class="bi bi-flag-fill text-danger mt-1 fs-5"></i>
                                            <div class="w-100">
                                                <div class="d-flex justify-content-between align-items-start">
                                                    <div>
                                                        <small class="text-muted d-block" style="font-size: 0.75rem;">تسليم إلى:</small>
                                                        <strong class="text-dark d-block mb-1">${order.dropoff.address}</strong>
                                                    </div>
                                                    <a href="${dropoffMapLink}" target="_blank" class="btn btn-sm btn-outline-danger shadow-sm" style="min-width: 80px;">
                                                        <i class="bi bi-map-fill"></i> خريطة
                                                    </a>
                                                </div>
                                                <div class="d-flex gap-2 mt-2">
                                                    <span class="badge bg-light text-dark border"><i class="bi bi-person"></i> ${order.dropoff.receiverName}</span>
                                                    <a href="tel:${order.dropoff.receiverPhone}" class="text-decoration-none badge bg-success"><i class="bi bi-telephone-fill"></i> اتصل</a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="bg-light p-2 rounded mb-3 border border-light">
                                        <div class="d-flex gap-2">
                                            <i class="bi bi-info-circle text-primary mt-1"></i>
                                            <p class="mb-0 small text-secondary">${order.details}</p>
                                        </div>
                                    </div>

                                    ${actionBtn}
                                    
                                    <button class="btn btn-outline-primary w-100 py-2 fw-bold rounded-3" onclick="openChat('${order._id}', '${order.client}')">
                                        <i class="bi bi-chat-dots-fill me-2"></i> محادثة العميل
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            } catch (error) { console.error(error); }
        }

        async function markPickup(id) {
            const res = await fetch(`/api/orders/${id}/pickup`, { method: 'PUT', headers: window.Auth.getAuthHeader() });
            if (res.ok) fetchMissions();
        }

        async function markDelivered(id) {
            if (!confirm("هل سلمت الطلب؟")) return;
            const res = await fetch(`/api/orders/${id}/deliver`, { method: 'PUT', headers: window.Auth.getAuthHeader() });
            if (res.ok) fetchMissions();
        }

        function openChat(orderId, clientId) {
            window.location.href = `chat.html?orderId=${orderId}&receiverId=${clientId}`;
        }

        fetchMissions();
    </script>

    <!-- WhatsApp Subscription Modal -->

    <!-- Auth Helper & App Core -->
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
