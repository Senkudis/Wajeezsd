<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تتبع الطلب | وجيز</title>

    <!-- ⚡ AMP-level Resource Hints for Mobile Speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=3.4">

    <style>
        :root {
            --primary: #048c5b;
            --primary-gradient: #0A6E47;
            --accent: #f59e0b;
        }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f0f4f8;
            margin: 0;
        }

        .map-container {
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* ⚠️ اللوحة fixed خارج تدفّق الصفحة، وكانت بلا أي حدّ لارتفاعها: كلما زادت محطات
           الرحلة طالت اللوحة وابتلعت الخريطة تحتها حتى لم يبقَ منها إلا شريط ضيق.
           الآن: سقف للارتفاع + تمرير داخلي ⇒ الخريطة تحتفظ دائماً بأكثر من نصف الشاشة. */
        .info-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            max-height: 45vh;   /* الخريطة تحتفظ بأكثر من نصف الشاشة دائماً */
            display: flex;              /* حتى تتمدّد البطاقة وتتمرّر داخلها لا خارجها */
            flex-direction: column;
        }

        .tracking-card {
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 0 16px calc(16px + var(--sab, env(safe-area-inset-bottom, 0px)));
            box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
            /* المحتوى الزائد (محطات كثيرة) يتمرّر داخل البطاقة بدل أن يطيلها فوق الخريطة */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;   /* لا يسحب الخريطة خلفه عند نهاية التمرير */
            min-height: 0;                  /* ضروري: عنصر flex يرفض الانكماش دون محتواه بدونها */
        }

        /* المقبض يبقى ملتصقاً بأعلى البطاقة أثناء التمرير — مؤشّر بصري أن ما تحته يتمرّر */
        .drag-handle {
            position: sticky;
            top: 0;
            background: white;
            z-index: 2;
        }

        /* Drag Handle */
        .drag-handle {
            width: 40px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 99px;
            margin: 8px auto 12px;
        }


        /* ===== Step Progress Bar ===== */
        .status-steps {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0 12px;
        }
        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            position: relative;
        }
        .step-item:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 14px;
            left: calc(50% + 14px);
            right: calc(-50% + 14px);
            height: 2px;
            background: #e2e8f0;
            z-index: 0;
            transition: background 0.4s;
        }
        .step-item.done:not(:last-child)::after { background: #22c55e; }
        .step-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2.5px solid #e2e8f0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #94a3b8;
            z-index: 1;
            position: relative;
            transition: all 0.4s;
        }
        .step-item.done .step-circle {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }
        .step-item.active .step-circle {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 0 4px rgba(4,85,58,0.15);
            animation: stepPulse 2s ease-in-out infinite;
        }
        @keyframes stepPulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(4,85,58,0.15); }
            50%       { box-shadow: 0 0 0 8px rgba(4,85,58,0.08); }
        }
        .step-label {
            font-size: 9px;
            font-weight: 700;
            color: #94a3b8;
            text-align: center;
        }
        .step-item.done .step-label,
        .step-item.active .step-label { color: var(--primary); }

        /* Captain Card */
        .captain-card {
            display: flex; align-items: center; gap: 12px;
            background: #f8fafc; border-radius: 14px;
            padding: 12px; margin: 12px 0;
        }
        .captain-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #25d366);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 18px; font-weight: 800;
        }

        /* 🛰️ حيوية التتبّع — الفرق بين «يتحرّك الآن» و«مؤشّرٍ جامد يبدو حيّاً».
           كان العميل يرى دبّوس الكابتن ولا يعرف إن كان حيّاً أصلاً: بلا هذه
           الشارة يفسّر الجمود بأن الكابتن واقفٌ أو مهمل، والسبب غالباً أن
           التحديث انقطع. */
        .track-live {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; font-weight: 800; border-radius: 20px;
            padding: 2px 9px; white-space: nowrap;
        }
        .track-live .dot {
            width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
            background: currentColor;
        }
        .track-live.live   { background: #dcfce7; color: #15803d; }
        .track-live.stale  { background: #fef3c7; color: #b45309; }
        .track-live.off    { background: #f1f5f9; color: #64748b; }
        .track-live.live .dot { animation: trackPulse 1.6s ease-out infinite; }
        @keyframes trackPulse {
            0%   { box-shadow: 0 0 0 0 rgba(21,128,61,.55); }
            70%  { box-shadow: 0 0 0 7px rgba(21,128,61,0); }
            100% { box-shadow: 0 0 0 0 rgba(21,128,61,0); }
        }
        /* شريطٌ تفسيري يظهر فقط حين ينقطع التحديث فعلاً */
        .track-hint {
            display: none; align-items: flex-start; gap: 8px;
            background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
            border-radius: 12px; padding: 9px 12px; margin-top: 10px;
            font-size: 12px; font-weight: 600; line-height: 1.6;
        }
        .track-hint.show { display: flex; }
        body.dark-mode .track-hint { background: #3b2f14; border-color: #92400e; color: #fde68a; }
        body.dark-mode .track-live.off { background: #1e293b; color: #94a3b8; }

        /* Route Summary — vertical with connector */
        .route-row { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-top: 1px solid #f1f5f9; }
        .route-point-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
        .route-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
        .route-icon.pickup  { background: #dcfce7; color: #16a34a; }
        .route-icon.dropoff { background: #fee2e2; color: #dc2626; }
        .route-addr { color: #374151; font-weight: 600; flex: 1; font-size: 12px; }
        .route-connector { width: 2px; height: 12px; background: #e2e8f0; margin: 2px 0 2px 14px; }

        .step-time { font-size: 9px; color: #94a3b8; font-weight: 700; margin-top: 2px; min-height: 11px; }
        .step-item.done .step-time, .step-item.active .step-time { color: var(--primary); }
        .captain-rating { font-size: 11px; color: #f59e0b; font-weight: 800; }
        .captain-trips {
            font-size: 10.5px; font-weight: 800; color: #0369a1;
            background: #e0f2fe; padding: 1px 7px; border-radius: 99px;
        }

        /* 💚 إكرامية الكابتن */
        .tip-box {
            margin-top: 12px; padding: 12px 14px;
            background: #f0fdf4; border: 1.5px solid #bbf7d0;
            border-radius: 12px;
        }
        .tip-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .tip-title { font-size: 13px; font-weight: 800; color: #065f46; display: flex; align-items: center; gap: 6px; }
        .tip-sub   { font-size: 10.5px; color: #16a34a; font-weight: 600; margin-top: 2px; }
        .tip-current {
            font-size: 13px; font-weight: 800; color: #065f46; white-space: nowrap;
            background: #dcfce7; border-radius: 99px; padding: 3px 10px;
        }
        .tip-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
        .tip-chip {
            border: 1.5px solid #bbf7d0; background: #fff; color: #065f46;
            font-size: 12px; font-weight: 700; border-radius: 99px;
            padding: 6px 13px; cursor: pointer; transition: all .15s;
            font-family: 'Cairo', sans-serif;
        }
        .tip-chip:active { transform: scale(.95); }
        .tip-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .tip-chip.clear  { border-color: #fecaca; color: #b91c1c; }
        .tip-chip[disabled] { opacity: .55; pointer-events: none; }

        /* ═══════════ إعادة التصميم: الخريطة هي البطل، واللوحة تجيب «متى يصل؟» أولاً ═══════════ */
        :root { --ink: #0f172a; --muted: #64748b; --line: #eef2f0; --brand-deep: #04553A; }

        /* شريط علوي: رجوع + الوضع الليلي في أزرار عائمة متطابقة (44px) — يحلّ محل الزر العائم العام فوق اللوحة */
        .topbar-btn {
            position: absolute; top: calc(14px + var(--sat, env(safe-area-inset-top, 0px))); z-index: 1001;
            width: 44px; height: 44px; border-radius: 50%; border: none; background: #fff; color: var(--ink);
            display: flex; align-items: center; justify-content: center; font-size: 1.15rem; text-decoration: none;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .16); transition: transform .15s;
        }
        .topbar-btn:active { transform: scale(.92); }
        .topbar-btn.back { right: 16px; }
        .topbar-btn.theme { left: 16px; }

        /* «اعرض المسار كاملاً» يطفو فوق اللوحة مباشرةً — يتبعها حين تتمدّد */
        .recenter-btn {
            position: absolute; left: 16px; bottom: calc(100% + 12px);
            width: 44px; height: 44px; border-radius: 14px; border: none; background: #fff; color: var(--brand-deep);
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .16);
        }

        .info-panel { max-height: 54vh; transition: max-height .3s ease; }
        .info-panel.expanded { max-height: 86vh; }
        .tracking-card { border-radius: 26px 26px 0 0; padding-top: 0; }
        .drag-handle { width: 44px; height: 5px; margin: 0 auto; background: #d6dde3; cursor: pointer; }
        .handle-hit { position: sticky; top: 0; z-index: 3; background: inherit; padding: 10px 0 12px; cursor: pointer; }

        /* البطل: الحالة بخطٍّ كبير، وزمن الوصول رقماً بارزاً بجانبها */
        .hero { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .hero-text { flex: 1; min-width: 0; }
        .hero-title { font-size: 19px; font-weight: 800; color: var(--ink); line-height: 1.35; margin: 0; }
        .hero-sub { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 3px; }
        .eta-chip {
            flex-shrink: 0; min-width: 76px; text-align: center; border-radius: 16px; padding: 8px 10px;
            background: linear-gradient(160deg, var(--primary), var(--brand-deep)); color: #fff;
            box-shadow: 0 8px 20px rgba(4, 140, 91, .28);
        }
        .eta-chip .eta-num { display: block; font-size: 24px; font-weight: 900; line-height: 1.1; }
        .eta-chip .eta-unit { display: block; font-size: 11px; font-weight: 700; opacity: .9; }
        .eta-chip.done { background: linear-gradient(160deg, #16a34a, #15803d); }
        .eta-chip.done .eta-num { font-size: 22px; }

        /* مراحل الطلب: نصٌّ مقروء (11px) وخطّ وصلٍ يتبع اتجاه القراءة RTL */
        .status-steps { padding: 2px 0 14px; }
        .step-item:not(:last-child)::after { left: auto; right: auto; inset-inline-start: calc(50% + 16px); inset-inline-end: calc(-50% + 16px); top: 15px; }
        .step-circle { width: 30px; height: 30px; font-size: 13px; }
        .step-label { font-size: 11px; }
        .step-time { font-size: 10px; }

        /* الكابتن: صورة أوضح وزرّا تواصل متساويان */
        .captain-card { padding: 12px; gap: 12px; border: 1px solid var(--line); background: #fbfcfb; }
        .captain-avatar { width: 50px; height: 50px; font-size: 20px; flex-shrink: 0; box-shadow: 0 0 0 3px #fff, 0 0 0 4px #d1fae5; }
        .captain-name { font-weight: 800; font-size: 15px; color: var(--ink); }
        .captain-actions { display: flex; gap: 8px; }
        .contact-btn {
            width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; text-decoration: none; border: none;
        }
        .contact-btn.call { background: var(--primary); color: #fff; box-shadow: 0 6px 14px rgba(4, 140, 91, .28); }
        .contact-btn.chat { background: #e8f5ee; color: var(--brand-deep); }

        .route-row { padding: 12px 0; border-top: 1px solid var(--line); }
        .route-addr { font-size: 13px; color: #334155; }
        .route-point-row .route-kind { display: block; font-size: 11px; color: #94a3b8; font-weight: 700; }

        /* المبلغ المطلوب: سطرٌ واحد واضح بدل حشره داخل شريطٍ ملوّن */
        .price-row {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            border-top: 1px solid var(--line); padding: 12px 0 2px;
        }
        .price-row .lbl { font-size: 13px; color: var(--muted); font-weight: 700; }
        .price-row .val { font-size: 18px; font-weight: 900; color: var(--ink); }
        .price-row .val small { font-size: 12px; font-weight: 700; color: var(--muted); }

        body.dark-mode .topbar-btn, body.dark-mode .recenter-btn { background: #1e293b; color: #e2e8f0; }
        body.dark-mode .hero-title, body.dark-mode .captain-name, body.dark-mode .price-row .val { color: #f1f5f9; }
        body.dark-mode .captain-card { background: #1e293b; border-color: #334155; }
        body.dark-mode .contact-btn.chat { background: #14352a; color: #6ee7b7; }
        body.dark-mode .route-row, body.dark-mode .price-row { border-color: #334155; }
        body.dark-mode .drag-handle { background: #475569; }
        /* dark-mode.css يلوّن .contact-btn.call لصفحةٍ أخرى بتدرّجٍ أزرق — نحدّد النطاق ليبقى أخضر الهوية */
        body.dark-mode .captain-actions .contact-btn.call { background: var(--primary) !important; color: #fff !important; }
        body.dark-mode .captain-actions .contact-btn.chat { background: #14352a; color: #6ee7b7; }
        body.dark-mode .step-circle { background: #1e293b; border-color: #334155; color: #94a3b8; }
        body.dark-mode .captain-trips { background: #0c3550; color: #7dd3fc; }
        body.dark-mode .track-live.live { background: #12382a; color: #6ee7b7; }
        body.dark-mode .track-live.stale { background: #3b2f14; color: #fcd34d; }
        body.dark-mode .tip-box { background: #102a20; border-color: #1f5a41; }
        body.dark-mode .tip-title, body.dark-mode .tip-current { color: #a7f3d0; }
        body.dark-mode .tip-current { background: #14532d; }
        body.dark-mode .tip-sub { color: #6ee7b7; }
        body.dark-mode .tip-chip { background: #0f172a; border-color: #1f5a41; color: #a7f3d0; }
        body.dark-mode .tip-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        body.dark-mode .tip-chip.clear { border-color: #7f1d1d; color: #fca5a5; }
        body.dark-mode .route-addr { color: #e2e8f0; }
        /* المراحل القادمة باهتة والمكتملة/الحالية خضراء — كانت القادمة أسطع منها في الوضع الليلي */
        /* .status-steps يرفع الخصوصية فوق «[class*="status-"] *» العامة في dark-mode.css */
        body.dark-mode .status-steps .step-label, body.dark-mode .status-steps .step-time { color: #94a3b8; }
        body.dark-mode .step-item.done .step-label, body.dark-mode .step-item.active .step-label,
        body.dark-mode .step-item.done .step-time, body.dark-mode .step-item.active .step-time { color: #34d399; }
        body.dark-mode .step-item:not(:last-child)::after { background: #334155; }
        body.dark-mode .step-item.done:not(:last-child)::after { background: #22c55e; }
        body.dark-mode .step-item.done .step-circle { background: #22c55e; border-color: #22c55e; color: #fff; }
        body.dark-mode .step-item.active .step-circle { background: var(--primary); border-color: var(--primary); color: #fff; }
        .route-connector { margin: 2px 0; margin-inline-start: 14px; }
        .tip-chip { min-height: 44px; padding: 8px 14px; }
        .price-row { border-top: none; padding: 4px 2px 12px; }
    </style>

<body class="bg-light">

    <!-- Back Button (role-aware: التاجر يعود لطلبات متجره) -->
    <a href="client-my-orders.html" class="topbar-btn back" id="backBtn" aria-label="رجوع">
        <i class="bi bi-arrow-right"></i>
    </a>
    <!-- زرّ الوضع الليلي هنا يمنع theme-manager من رسم زرّه العائم فوق اللوحة -->
    <button type="button" class="topbar-btn theme" data-theme-toggle aria-label="الوضع الليلي">
        <i class="bi bi-moon-stars-fill"></i>
    </button>

    <!-- Map -->
    <div class="map-container">
        <div id="map" style="display: block; width: 100%; height: 100%;"></div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel" id="infoPanel">
        <button type="button" class="recenter-btn" id="recenterBtn" aria-label="عرض المسار كاملاً" onclick="fitAll()">
            <i class="bi bi-bullseye"></i>
        </button>
        <div class="tracking-card">
            <!-- المقبض: لمسةٌ توسّع اللوحة أو تطويها -->
            <div class="handle-hit" onclick="togglePanel()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePanel();}"
                 role="button" tabindex="0" aria-expanded="false" aria-label="توسيع التفاصيل">
                <div class="drag-handle"></div>
            </div>

            <!-- البطل: الحالة + زمن الوصول -->
            <div class="hero">
                <div class="hero-text">
                    <h1 class="hero-title" id="order-status">جاري التحميل…</h1>
                    <div class="hero-sub" id="hero-sub"></div>
                </div>
                <div class="eta-chip" id="eta-container" style="display:none;">
                    <span class="eta-num" id="eta-text">—</span>
                    <span class="eta-unit" id="eta-unit">دقيقة</span>
                </div>
            </div>

            <!-- Step Progress Bar -->
            <div class="status-steps" id="status-steps">
                <div class="step-item" id="step-pending">
                    <div class="step-circle"><i class="bi bi-clock"></i></div>
                    <div class="step-label">انتظار</div>
                    <div class="step-time" id="time-placed"></div>
                </div>
                <div class="step-item" id="step-accepted">
                    <div class="step-circle"><i class="bi bi-person-check"></i></div>
                    <div class="step-label">قُبل</div>

                             الجديد الذي لم يُقيَّم بعد لكنه أنجز رحلات فعلاً -->
                        <span class="captain-trips" id="captain-trips" style="display:none;"></span>

                </div>

            <!-- 🧭 Multi-stop progress list (replaces routeRow when order.isMultiStop) -->
            <div id="stopsProgress" style="display:none;"></div>


            <!-- 💚 إكرامية الكابتن — تظهر للعميل صاحب الطلب قبل التسليم فقط -->
            <div class="tip-box" id="tipBox" style="display:none;">
                <div class="tip-head">
                    <div>
                        <div class="tip-title"><i class="bi bi-heart-fill"></i> إكرامية للكابتن</div>
                        <div class="tip-sub">تصل الكابتن كاملة بلا خصم، وتُدفع نقداً مع الأجرة</div>

    <!-- Scripts -->
    <script src="js/maps-loader.js?v=9c3cdf9b"></script>
    <script src="js/map-markers.js?v=34f3acc0"></script>
    <script src="js/marker-motion.js?v=c86d7e75"></script>
    <script>loadGoogleMaps({ libraries: 'geometry,marker', need: ['routes'], callback: 'initTrackingMap' });</script>
    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="notification-toast.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const token = localStorage.getItem('token')
            || localStorage.getItem('clientToken')
            || localStorage.getItem('merchantToken')
            || localStorage.getItem('captainToken')
            || localStorage.getItem('adminToken');
        const userId = localStorage.getItem('userId');

        // 🏪 الصفحة تخدم العميل والتاجر — التاجر يعود لطلبات متجره
        let _userRole = '';
        try { _userRole = (JSON.parse(localStorage.getItem('user') || '{}').role || ''); } catch (e) {}
        const homePage = _userRole === 'merchant' ? 'merchant-orders.html' : 'client-my-orders.html';
        const backBtnEl = document.getElementById('backBtn');
        if (backBtnEl) backBtnEl.href = homePage;

        if (!token || !orderId) window.location.href = homePage;

        let map;
        let captainMarker = null;
        let pickupMarker = null;
        let dropoffMarker = null;
        let currentOrder = null;

        // ===== Professional Map Icons =====
        const SVG_PICKUP = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg width="42" height="42" viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg"><circle cx="21" cy="21" r="18" fill="var(--primary)" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.3))"/><text x="21" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">A</text></svg>');
        const SVG_DROPOFF = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg width="42" height="42" viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg"><circle cx="21" cy="21" r="18" fill="#dc3545" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.3))"/><text x="21" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">B</text></svg>');
        const SVG_CAPTAIN = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
                <defs>
                    <filter id="shadow2" x="-30%" y="-30%" width="160%" height="160%">
                        <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
                    </filter>
                    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
                    </filter>
                </defs>
                <circle cx="50" cy="50" r="44" fill="#ffffff" filter="url(#shadow2)"/>
                <circle cx="50" cy="50" r="40" fill="none" stroke="#10b981" stroke-width="4"/>
                <circle cx="50" cy="50" r="40" fill="#f0fdf4" opacity="0.5"/>
                <path d="M 34 62 L 45 54 L 62 54 L 70 62" fill="none" stroke="#4b5563" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 62 54 L 56 42" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
                <rect x="25" y="32" width="20" height="22" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
                <path d="M 25 38 L 45 38" stroke="#d97706" stroke-width="1.5"/>
                <path d="M 35 32 L 35 44" stroke="#d97706" stroke-width="1.5"/>
                <path d="M 42 54 L 46 38 L 56 38 L 54 54 Z" fill="#1f2937" />
                <circle cx="54" cy="32" r="7" fill="#111827" />
                <path d="M 54 28 Q 62 28 60 34 L 54 34 Z" fill="#60a5fa" />
                <circle cx="34" cy="62" r="12" fill="none" stroke="#1f2937" stroke-width="6"/>
                <circle cx="34" cy="62" r="5" fill="#d1d5db"/>
                <circle cx="70" cy="62" r="12" fill="none" stroke="#1f2937" stroke-width="6"/>
                <circle cx="70" cy="62" r="5" fill="#d1d5db"/>
                <circle cx="76" cy="52" r="4" fill="#fde047" filter="url(#glow2)"/>
                <path d="M 16 45 L 8 45" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
                <path d="M 12 55 L 4 55" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
                <path d="M 18 68 L 10 68" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
            </svg>`);

        let directionsService = null;
        let directionsRenderer = null;

        // ستايل خريطة هادئ: تختفي المحلات والمواصلات فيبرز المسار والكابتن. نسخةٌ للوضع الليلي.
        const MAP_STYLE_LIGHT = [
            { featureType: 'poi.business', stylers: [{ visibility: 'off' }] },
            { featureType: 'poi', elementType: 'labels.icon', stylers: [{ saturation: -60 }, { lightness: 15 }] },
            { featureType: 'transit', stylers: [{ visibility: 'off' }] },
            { featureType: 'landscape', elementType: 'geometry', stylers: [{ color: '#f3f5f2' }] },
            { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
            { featureType: 'road.arterial', elementType: 'geometry', stylers: [{ color: '#fbfbf8' }] },
            { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#fde9b8' }] },
            { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#7b8794' }] },
            { featureType: 'road.local', elementType: 'labels', stylers: [{ visibility: 'simplified' }] },
            { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#cfe6f2' }] },
            { featureType: 'administrative', elementType: 'labels.text.fill', stylers: [{ color: '#5b6773' }] }
        ];
        const MAP_STYLE_DARK = [
            { elementType: 'geometry', stylers: [{ color: '#1b2430' }] },
            { elementType: 'labels.text.fill', stylers: [{ color: '#94a3b8' }] },
            { elementType: 'labels.text.stroke', stylers: [{ color: '#1b2430' }] },
            { featureType: 'poi.business', stylers: [{ visibility: 'off' }] },
            { featureType: 'poi', elementType: 'geometry', stylers: [{ color: '#202c39' }] },
            { featureType: 'transit', stylers: [{ visibility: 'off' }] },
            { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#2b3746' }] },
            { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#3b4a5c' }] },
            { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0f1d2b' }] }
        ];
        function mapStyleFor() {
            return document.body.classList.contains('dark-mode') ? MAP_STYLE_DARK : MAP_STYLE_LIGHT;
        }

        // لوحة المعلومات: لمسة المقبض توسّعها أو تطويها، ثم تُعاد مواءمة الخريطة للمساحة الظاهرة
        window.togglePanel = function () {
            const panel = document.getElementById('infoPanel');
            const expanded = panel.classList.toggle('expanded');
            const hit = document.querySelector('.handle-hit');
            if (hit) hit.setAttribute('aria-expanded', String(expanded));
            // عند الطيّ فقط: اللوحة الموسّعة تغطّي الخريطة أصلاً، ولا داعي لإعادة التقريب تحتها
            if (!expanded) setTimeout(fitAll, 320);
        };

        // مواءمة الخريطة مع المساحة الظاهرة فوق اللوحة. الحشو السفلي محدود: مع لوحةٍ موسّعة
        // كان يقارب ارتفاع الشاشة فتنكمش الخريطة إلى مستوى مدينة وتتراكب النقاط.
        function fitTo(bounds) {
            if (!map || !bounds || bounds.isEmpty()) return;
            const panel = document.getElementById('infoPanel');
            const panelH = panel ? Math.ceil(panel.getBoundingClientRect().height) : 280;
            const h = map.getDiv().clientHeight || window.innerHeight;
            const bottom = Math.max(120, Math.min(panelH + 70, h - 90 - 160));
            map.fitBounds(bounds, { top: 90, bottom, left: 50, right: 50 });
        }

        // يُظهر الاستلام والتسليم والكابتن معاً فوق اللوحة
        window.fitAll = function () {
            if (!map || typeof google === 'undefined') return;
            const b = new google.maps.LatLngBounds();
            [pickupMarker, dropoffMarker, captainMarker].forEach(m => { if (m && m.getMap() && m.getPosition()) b.extend(m.getPosition()); });
            fitTo(b);
        };

        window.initTrackingMap = function() {
            if (typeof google === 'undefined' || !google.maps || !google.maps.Map || typeof google.maps.Map !== 'function') {
                setTimeout(window.initTrackingMap, 500);
                return;
            }
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 15.6067, lng: 32.5317 },
                zoom: 13,
                disableDefaultUI: true,
                zoomControl: false,
                gestureHandling: 'greedy',
                clickableIcons: false,
                styles: mapStyleFor()
            });
            // تبديل الوضع الليلي يغيّر ستايل الخريطة معه (مراقبٌ واحد مهما أُعيدت التهيئة)
            if (!window._mapThemeObserver) {
                window._mapThemeObserver = new MutationObserver(() => map && map.setOptions({ styles: mapStyleFor() }));
                window._mapThemeObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });
            }

            // Initialize Directions API for real street routes
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                suppressMarkers: true,  // Keep our custom pickup/dropoff markers
                // ⚠️ كان strokeColor = 'var(--primary)' — Maps لا تفهم متغيّرات CSS فيُرسم المسار بلونٍ خاطئ
                polylineOptions: { strokeColor: '#048c5b', strokeWeight: 6, strokeOpacity: 0.9 }
            });
            directionsRenderer.setMap(map);

            if (currentOrder) updateUI(currentOrder);
            else fetchOrder();
        };

        document.addEventListener('DOMContentLoaded', fetchOrder);

        // Draw real street route between pickup and dropoff (called once after order loads)
        // 🧭 waypoints: نقاط وسطية اختيارية للتوصيل متعدد النقاط
        function drawRouteOnStreets(pickup, dropoff, waypoints) {
            if (!directionsService || !directionsRenderer) return;
            // 🧭 lng كان لا يُفحص إطلاقاً، والصفران يمرّان كموقعٍ صالح في المحيط
            if (!validCoord(pickup?.lat, pickup?.lng) || !validCoord(dropoff?.lat, dropoff?.lng)) return;

            const req = {
                origin: { lat: pickup.lat, lng: pickup.lng },
                destination: { lat: dropoff.lat, lng: dropoff.lng },
                travelMode: google.maps.TravelMode.DRIVING
            };
            if (Array.isArray(waypoints) && waypoints.length) {
                req.waypoints = waypoints
                    .filter(p => p && p.lat && p.lng)
                    .map(p => ({ location: { lat: p.lat, lng: p.lng }, stopover: true }));
                req.optimizeWaypoints = false;
            }

            directionsService.route(req, (result, status) => {
                if (status === google.maps.DirectionsStatus.OK) {
                    directionsRenderer.setDirections(result);
                    console.log('✅ Real street route drawn on tracking map');
                } else {
                    console.warn('⚠️ Directions failed, status:', status);
                }
            });
        }

        // ⏱️ ETA Calculation
        // يعرض زمن الوصول في البطل: رقمٌ كبير + وحدة، والمسافة في السطر الفرعي
        function setEta(minutes, distKm) {
            const chip = document.getElementById('eta-container');
            chip.style.display = 'block';
            chip.classList.remove('done');
            const n = Math.max(1, Math.round(Number(minutes) || 0));
            document.getElementById('eta-text').textContent = n;
            document.getElementById('eta-unit').textContent = n <= 2 ? (n === 1 ? 'دقيقة' : 'دقيقتان') : (n <= 10 ? 'دقائق' : 'دقيقة');
            if (distKm != null && Number.isFinite(Number(distKm))) {
                const d = Number(distKm);
                const accepted = currentOrder && currentOrder.status === 'accepted';
                const target = accepted ? 'عن نقطة الاستلام' : 'عن نقطة التسليم';
                let sub = `يبعد ${d < 1 ? (d * 1000).toFixed(0) + ' م' : d.toFixed(1) + ' كم'} ${target}`;
                // قبل الاستلام: العميل يسأل «متى يصل طلبي؟» لا «متى يصل الكابتن للمحل؟»
                const trip = currentOrder && currentOrder.eta && Number(currentOrder.eta.max || currentOrder.eta.minutes);
                if (accepted && Number.isFinite(trip)) sub += ` · يصل التسليم خلال ~${n + Math.round(trip)} دقيقة`;
                document.getElementById('hero-sub').textContent = sub;
            }
        }

        function updateETA(captainLat, captainLng) {
            // بعد التسليم أو الإلغاء لا معنى لزمن وصول — البطل يعرض النتيجة
            if (!currentOrder || !['accepted', 'picked_up'].includes(currentOrder.status)) return;
            // قبل الاستلام يتّجه الكابتن إلى نقطة الاستلام، لا إلى العميل
            const goal = currentOrder.status === 'accepted' ? currentOrder.pickup : currentOrder.dropoff;
            if (!goal) return;
            const dropLat = goal.lat;
            const dropLng = goal.lng;
            if (!dropLat || !dropLng) return;

            // المسافة حسابٌ خالص لا يحتاج الخريطة. كان `if (google && …)` يرمي
            // ReferenceError حين يصل الطلب قبل تحميل الخريطة (والخريطة تنتظر
            // مفتاحها من الخادم فتتأخّر غالباً)، وبلا مكتبة geometry كانت تُعرض
            // مسافةٌ وهمية ثابتة (1 كم).
            const distMeters = MarkerMotion.meters(
                { lat: Number(captainLat), lng: Number(captainLng) },
                { lat: Number(dropLat), lng: Number(dropLng) }
            );

            const distKm = (distMeters / 1000) * 1.4; // Tortuosity multiplier
            const vehicleType = currentOrder.captain && currentOrder.captain.vehicleType;
            const avgSpeedKmh = (window.VehicleTypes ? window.VehicleTypes.speed(vehicleType) : 25);
            const etaMinutes = Math.ceil((distKm / avgSpeedKmh) * 60);

            setEta(etaMinutes, distKm);
        }

        // ===== Status Steps Logic =====
        /**
         * 🧭 إحداثيات صالحة للرسم.
         * ⚠️ الفحص السابق `if (order.pickup?.lat)` كان يمرّر طلباً بلا `lng` إطلاقاً
         * (لم يكن يُفحص)، ويمرّر lat=lng=0 — وهي ليست موقعاً بل نقطة الأصل في خليج
         * غينيا. رُصد في الإنتاج: طلبٌ استلامه في السودان وتسليمه يُرسم في المحيط.
         */
        function validCoord(lat, lng) {
            // ⚠️ الرفض الصريح أولاً: Number(null) و Number('') يساويان صفراً لا NaN،
            // فقيمة مفقودة كانت تمرّ كخط طولٍ صفر (على خطّ غرينتش).
            if (lat === null || lat === undefined || lat === '' ||
                lng === null || lng === undefined || lng === '') return false;
            const a = Number(lat), b = Number(lng);
            if (!Number.isFinite(a) || !Number.isFinite(b)) return false;
            if (a === 0 && b === 0) return false;
            return Math.abs(a) <= 90 && Math.abs(b) <= 180;
        }

        const STATUS_ORDER = ['pending', 'accepted', 'picked_up', 'delivered'];
        // ⚠️ 'scheduled' خارج STATUS_ORDER عمداً: لم تبدأ الرحلة بعد، فلا خطوة
        // مكتملة. لكن غياب نصّها كان يترك العنوان فارغاً — طلبٌ حيّ بلا أي بيان.
        const STATUS_LABELS = {
            'pending':   'نبحث لك عن كابتن',
            'scheduled': 'طلب مجدول',
            'accepted':  'الكابتن في الطريق للاستلام',
            'picked_up': 'الكابتن في الطريق إليك',
            'delivered': 'تم التوصيل',
            'cancelled': 'تم إلغاء الطلب'
        };
        // السطر الفرعي قبل أن تُعرف المسافة الحيّة
        const STATUS_SUBS = {
            'pending':   'سيصلك إشعار فور قبول كابتن لطلبك',
            'scheduled': 'يُنشر للكباتن في موعده',
            'accepted':  'قبل الكابتن طلبك ويتّجه لنقطة الاستلام',
            'picked_up': 'استلم الكابتن طلبك وهو في الطريق',
            'delivered': 'شكراً لاستخدامك وجيز',
            'cancelled': ''
        };

        function updateStatusSteps(status) {
            const currentIdx = STATUS_ORDER.indexOf(status);
            STATUS_ORDER.forEach((s, i) => {
                const el = document.getElementById(`step-${s}`);
                if (!el) return;
                el.classList.remove('done', 'active');
                if (i < currentIdx) el.classList.add('done');
                else if (i === currentIdx) el.classList.add('active');
            });
            document.getElementById('order-status').textContent = STATUS_LABELS[status] || status;
            const sub = document.getElementById('hero-sub');
            if (sub) sub.textContent = STATUS_SUBS[status] || '';
            const chip = document.getElementById('eta-container');
            if (status === 'delivered' && chip) {
                chip.style.display = 'block'; chip.classList.add('done');
                document.getElementById('eta-text').innerHTML = '<i class="bi bi-check-lg"></i>';
                document.getElementById('eta-unit').textContent = 'وصل';
            } else if (!['accepted', 'picked_up'].includes(status) && chip) {
                chip.style.display = 'none';
            }
        }

        // ⏱️ يعرض أوقات انتقالات الحالة تحت كل مرحلة (الخط الزمني من السيرفر)
        function renderTimeline(order) {
            const tl = order.timeline;
            if (!tl || !Array.isArray(tl.steps)) return;
            const fmt = (iso) => {
                if (!iso) return '';
                try {
                    return new Date(iso).toLocaleTimeString('ar-SD-u-nu-latn', { hour: '2-digit', minute: '2-digit' });
                } catch (_) { return ''; }
            };
            // مفاتيح السيرفر (placed) تُقابل عنصر الواجهة (pending)
            const map = { placed: 'time-placed', accepted: 'time-accepted', picked_up: 'time-picked_up', delivered: 'time-delivered' };
            tl.steps.forEach(step => {
                const id = map[step.key];
                const el = id && document.getElementById(id);
                if (el) el.textContent = step.done && step.at ? fmt(step.at) : '';
            });
        }

        // ===== حركة الكابتن على الخريطة =====
        //
        // js/marker-motion.js — المصدر الواحد لخرائط العميل والإدارة. كانت
        // الحركة هنا تسارعاً ثم تباطؤاً خلال ثانيتين ثم وقوفاً حتى القراءة
        // التالية (كل ٣–٥ ث)، فيمشي الكابتن «ركضةً ووقفة». الآن تستغرق الحركة
        // الفاصلَ بين القراءتين بسرعةٍ ثابتة فيبدو سيراً متّصلاً، والقرص يدور
        // بأقصر زاوية، والقفزات البعيدة تُنقل فوراً.
        let captainMover = null;

        /**
         * 💓 هالةٌ نابضة تحت القرص.
         *
         * على خريطةٍ فيها مسارٌ ونقطتان، تضيع نقطةٌ ثالثة ساكنة. النبض
         * يجعل العين تجدها في لحظة، ويقول ضمناً «هذا حيّ يتحرّك الآن» —
         * وهو ما يأتي العميل إلى الشاشة ليتأكّد منه.
         *
         * دائرةٌ واحدة يتغيّر نصف قطرها وشفافيّتها، لا عنصر DOM: تبقى
         * ملتصقة بالإحداثيات مهما حُرّكت الخريطة أو غُيّر تقريبها.
         */
        let captainPulse = null;
        let pulseRaf = 0;

        function addCaptainPulse(lat, lng) {
            if (captainPulse || typeof google === 'undefined') return;
            captainPulse = new google.maps.Circle({
                map, center: { lat, lng },
                strokeColor: '#04553A', strokeOpacity: 0.5, strokeWeight: 2,
                fillColor: '#04553A', fillOpacity: 0.16,
                radius: 30, clickable: false, zIndex: 998
            });

            // «تقليل الحركة» في إعدادات الهاتف: حلقةٌ ثابتة تدلّ على الكابتن بلا نبض
            if (window.MarkerMotion && MarkerMotion.reducedMotion()) return;

            const T0 = performance.now();
            let lastTick = 0;
            const tick = (now) => {
                if (!captainPulse) return;
                // ٣٠ إطاراً في الثانية تكفي لنبضةٍ بطيئة — نصف عمل المعالج على الهواتف الضعيفة
                if (now - lastTick >= 33) {
                    lastTick = now;
                    const cycle = ((now - T0) % 2200) / 2200;      // نبضة كل 2.2 ثانية
                    // تحديثٌ واحد للدائرة لا ثلاثة — كلّ نداءٍ يعيد رسمها
                    captainPulse.setOptions({
                        radius: 26 + cycle * 62,
                        fillOpacity: 0.17 * (1 - cycle),
                        strokeOpacity: 0.5 * (1 - cycle),
                        center: captainMarker ? captainMarker.getPosition() : captainPulse.getCenter()
                    });
                }
                pulseRaf = requestAnimationFrame(tick);
            };
            pulseRaf = requestAnimationFrame(tick);
        }

        // توقّف النبض عند إخفاء الصفحة — لا نُشغّل rAF في الخلفية بلا فائدة
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (pulseRaf) cancelAnimationFrame(pulseRaf);
                pulseRaf = 0;
            } else if (captainPulse && !pulseRaf) {
                const pos = captainMarker && captainMarker.getPosition();
                captainPulse.setMap(null); captainPulse = null;
                if (pos) addCaptainPulse(pos.lat(), pos.lng());
            }
        });

        /** أيقونة القرص بالاتجاه ونوع وسيلة الكابتن — MarkerMotion يخبّئها لكل ٤° */
        function captainIconFor(heading) {
            if (typeof WajeezMarkers === 'undefined' || !WajeezMarkers.captainPuck) {
                return { url: SVG_CAPTAIN, scaledSize: new google.maps.Size(54, 54), anchor: new google.maps.Point(27, 27) };
            }
            return WajeezMarkers.captainPuck(currentOrder?.captain?.vehicleType || 'motorcycle', heading);
        }

        async function fetchOrder() {
            try {
                const res = await fetchWithRetry(`${API_URL}/api/orders/${orderId}`, { headers: window.Auth.getAuthHeader() });
                if (!res.ok) {
                    Swal.fire('خطأ', 'الطلب غير موجود أو لا يمكن الوصول إليه', 'error').then(() => window.location.href = homePage);
                    return;
                }
                const order = await res.json();
                currentOrder = order;
                updateUI(order);
                startCaptainPolling();
            } catch (err) {
                console.error('Fetch order error:', err);
                Swal.fire('خطأ', 'فشل تحميل بيانات الطلب', 'error');
            }
        }

        // 🧭 قائمة تقدّم المحطات (توصيل متعدد النقاط) — يرى العميل أي نقطة اكتملت لحظياً
        function renderStopsProgress(order) {
            const box = document.getElementById('stopsProgress');
            const routeRow = document.getElementById('routeRow');
            if (!box) return;
            const isMulti = order.isMultiStop && Array.isArray(order.stops) && order.stops.length >= 2;
            if (!isMulti) { box.style.display = 'none'; if (routeRow) routeRow.style.display = ''; return; }

            if (routeRow) routeRow.style.display = 'none';
            box.style.display = 'block';

            const doneCount = order.stops.filter(s => s.done).length;
            const esc = (s) => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            box.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                    <span style="font-weight:800;font-size:13px;color:#334155;">
                        <i class="bi bi-signpost-split-fill" style="color:#0ea5e9;"></i> رحلة متعددة النقاط
                    </span>
                    <span style="font-size:11.5px;font-weight:800;color:#0ea5e9;background:#e0f2fe;border-radius:99px;padding:3px 10px;">
                        ${doneCount} / ${order.stops.length} اكتملت
                    </span>
                </div>
                ${order.stops.map((s, i) => {
                    const isP = s.type === 'pickup';
                    return `
                    <div style="display:flex;align-items:flex-start;gap:10px;padding:7px 0;${i < order.stops.length - 1 ? 'border-bottom:1px dashed #e2e8f0;' : ''}${s.done ? 'opacity:0.65;' : ''}">
                        <div class="route-icon ${isP ? 'pickup' : 'dropoff'}" style="width:30px;height:30px;font-size:0.85rem;flex-shrink:0;">
                            ${s.done ? '<i class="bi bi-check-lg"></i>' : `<i class="bi ${isP ? 'bi-geo-alt-fill' : 'bi-flag-fill'}"></i>`}
                        </div>
                        <div style="min-width:0;flex:1;">
                            <div style="font-size:11px;color:#94a3b8;font-weight:700;">${isP ? 'استلام' : 'تسليم'} ${i + 1}${s.contactName ? ' — ' + esc(s.contactName) : ''}</div>
                            <div style="font-size:13px;font-weight:700;color:#1e293b;${s.done ? 'text-decoration:line-through;' : ''}">${esc(s.address)}</div>
                        </div>
                        ${s.done
                            ? '<span style="font-size:10.5px;font-weight:800;color:#16a34a;background:#dcfce7;border-radius:99px;padding:2px 9px;align-self:center;">تمت</span>'
                            : '<span style="font-size:10.5px;font-weight:800;color:#b45309;background:#fef3c7;border-radius:99px;padding:2px 9px;align-self:center;">قادمة</span>'}
                    </div>`;
                }).join('')}`;
        }

        // 🛍️ errand: نافذة موافقة العميل على سعر البضاعة (مرة واحدة لكل سعر)
        let _errandPromptedFor = null;
        async function promptErrandQuote(order) {
            const key = `${order._id}:${order.errand.goodsQuote}`;
            if (_errandPromptedFor === key) return; // لا تُكرّر لنفس السعر
            _errandPromptedFor = key;

            const amount = order.errand.goodsQuote;
            const budget = order.errand.budget;
            const overBudget = budget && amount > budget;
            const budgetHtml = overBudget
                ? `<div style="font-size:12.5px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:7px 10px;margin-top:8px;font-weight:700;">
                     <i class="bi bi-exclamation-triangle-fill"></i> أعلى من ميزانيتك (${budget} ج.س) بمقدار ${amount - budget} ج.س</div>`
                : (budget ? `<div style="font-size:12px;color:#16a34a;margin-top:6px;"><i class="bi bi-check-circle-fill"></i> ضمن ميزانيتك (${budget} ج.س)</div>` : '');
            const result = await Swal.fire({
                title: 'سعر طلبك جاهز',
                html: `<div style="font-size:14px;color:#475569;">سعر البضاعة من <b>${(order.shopName || 'المحل')}</b>:</div>
                       <div style="font-size:30px;font-weight:900;color:${overBudget ? '#b91c1c' : '#4f46e5'};margin:8px 0;">${amount} ج.س</div>
                       <div style="font-size:12.5px;color:#94a3b8;">أجرة التوصيل (${order.price} ج.س) تُضاف عند الاستلام.</div>
                       ${budgetHtml}`,
                showCancelButton: true,
                confirmButtonText: 'وافق وابدأ الشراء',
                cancelButtonText: 'رفض',
                confirmButtonColor: '#16a34a',
                cancelButtonColor: '#dc3545',
                allowOutsideClick: false
            });

            const accept = result.isConfirmed;
            if (!accept && !result.dismiss) return; // أُغلقت بلا اختيار
            // لو ضغط "رفض" (cancel) نؤكّد لأنه يُلغي الطلب
            if (!accept) {
                const conf = await Swal.fire({
                    title: 'رفض السعر؟', text: 'سيُلغى الطلب.', icon: 'warning',
                    showCancelButton: true, confirmButtonText: 'نعم، ارفض', cancelButtonText: 'تراجع',
                    confirmButtonColor: '#dc3545'
                });
                if (!conf.isConfirmed) { _errandPromptedFor = null; return; } // أعد الفرصة
            }

            try {
                const res = await fetchWithRetry(`${API_URL}/api/orders/${order._id}/errand/respond`, {
                    method: 'PUT',
                    headers: { ...window.Auth.getAuthHeader(), 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accept })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    Swal.fire({ icon: accept ? 'success' : 'info', title: accept ? 'تم التأكيد' : 'تم الإلغاء', text: data.message || '', timer: 2200, showConfirmButton: false });
                    fetchOrder();
                } else {
                    _errandPromptedFor = null;
                    Swal.fire('خطأ', data.message || 'تعذّر إرسال ردّك', 'error');
                }
            } catch (e) {
                _errandPromptedFor = null;
                Swal.fire('خطأ', 'تعذّر الاتصال، حاول مجدداً', 'error');
            }
        }

        // ============================================================
        // 💚 إكرامية الكابتن
        //
        // تُعرض قبل التسليم وحده: الدفع نقديٌّ، وإكراميةٌ تُطلب بعد أن فارق
        // الكابتنُ البابَ لا سبيل لتحصيلها. الحدّ الأقصى يأتي من إعدادات
        // المدينة (price-config) لا ثابتاً في الصفحة، وصفرٌ منه = الميزة
        // معطّلة في هذه المدينة فلا يظهر الصندوق أصلاً.
        // ============================================================
        const TIP_PRESETS = [500, 1000, 2000];
        let _maxTip = null;        // null = لم يُحمّل بعد
        let _tipBusy = false;

        async function loadTipConfig() {
            if (_maxTip !== null) return _maxTip;
            try {
                const res = await fetchWithRetry(`${API_URL}/api/orders/price-config`, { headers: window.Auth.getAuthHeader() });
                const cfg = res.ok ? await res.json() : {};
                _maxTip = Number(cfg.maxTipAmount ?? 20000);
            } catch (e) {
                // 🛟 تعذّر جلب الإعداد ⇒ سقفٌ افتراضي لا تعطيلٌ للميزة: الخادم
                //    يرفض التجاوز على أي حال، والعميل لا يُحرم لعطبٍ في الشبكة.
                _maxTip = 20000;
            }
            return _maxTip;
        }

        function renderTipBox(order) {
            const box = document.getElementById('tipBox');
            if (!box) return;

            // 👤 العميل صاحب الطلب وحده — الصفحة نفسها تخدم التاجر والكابتن
            const clientId = order.client && (order.client._id || order.client);
            const isOwner = userId && clientId && String(clientId) === String(userId);
            const OPEN = ['pending', 'scheduled', 'accepted', 'picked_up'];

            if (!isOwner || !OPEN.includes(order.status) || !_maxTip) {
                box.style.display = 'none';
                return;
            }

            const current = Number(order.tip?.amount) || 0;
            box.style.display = 'block';

            const badge = document.getElementById('tipCurrent');
            badge.style.display = current > 0 ? 'block' : 'none';
            badge.textContent = current > 0 ? `${current.toLocaleString('en-US')} ج.س` : '';

            const options = TIP_PRESETS.filter(v => v <= _maxTip);
            let html = options.map(v => `
                <button type="button" class="tip-chip ${current === v ? 'active' : ''}"
                        onclick="setTip(${v})">${v.toLocaleString('en-US')}</button>`).join('');
            html += `<button type="button" class="tip-chip" onclick="promptCustomTip()">مبلغ آخر</button>`;
            if (current > 0) {
                html += `<button type="button" class="tip-chip clear" onclick="setTip(0)">إلغاء</button>`;
            }
            document.getElementById('tipChips').innerHTML = html;
        }

        window.setTip = async function (amount) {
            if (_tipBusy) return;
            _tipBusy = true;
            document.querySelectorAll('#tipChips .tip-chip').forEach(b => b.setAttribute('disabled', 'disabled'));
            try {
                const res = await fetchWithRetry(`${API_URL}/api/orders/${orderId}/tip`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', ...window.Auth.getAuthHeader() },
                    body: JSON.stringify({ amount })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || 'تعذّر تحديث الإكرامية');

                // ✍️ نُحدّث النسخة المحلية بدل إعادة جلب الطلب كاملاً — الصندوق
                //    يُعاد رسمه فوراً فلا يرى العميل حالةً قديمة لثانية.
                if (currentOrder) currentOrder.tip = { amount: data.tip };
                renderTipBox(currentOrder || {});

                if (amount > 0) {
                    Swal.fire({ icon: 'success', title: 'شكراً لك', text: data.message,
                                timer: 1800, showConfirmButton: false });
                }
            } catch (e) {
                Swal.fire('تعذّر', e.message || 'حاول مجدداً', 'error');
                renderTipBox(currentOrder || {});
            } finally {
                _tipBusy = false;
            }
        };

        window.promptCustomTip = async function () {
            const { value } = await Swal.fire({
                title: 'إكرامية الكابتن',
                input: 'number',
                inputLabel: `من 0 إلى ${Number(_maxTip).toLocaleString('en-US')} ج.س`,
                inputAttributes: { min: 0, max: _maxTip, step: 100, inputmode: 'numeric' },
                inputValue: Number(currentOrder?.tip?.amount) || '',
                showCancelButton: true,
                confirmButtonText: 'تأكيد',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: 'var(--primary)',
                inputValidator: (v) => {
                    const n = Number(v);
                    if (!Number.isFinite(n) || n < 0) return 'أدخل مبلغاً صحيحاً';
                    if (n > _maxTip) return `أقصى إكرامية ${Number(_maxTip).toLocaleString('en-US')} ج.س`;
                    return null;
                }
            });
            if (value !== undefined && value !== '') setTip(Math.round(Number(value)));
        };

        function updateUI(order) {
            // Update status steps
            updateStatusSteps(order.status);
            // ⏱️ أوقات المراحل (الخط الزمني)
            renderTimeline(order);

            // 🛍️ errand: سعر البضاعة بانتظار تأكيد العميل → اعرض نافذة الموافقة
            if (order.orderType === 'errand' && order.errand && order.errand.quoteStatus === 'quoted') {
                promptErrandQuote(order);
            }

            // ⏱️ ETA من السيرفر — يملأ الفجوة قبل ظهور موقع الكابتن الحيّ.
            // بمجرد وصول موقع الكابتن، updateETA (أدق) يستبدل هذه القيمة.
            // قبل الاستلام بلا موقعٍ حيّ لا نعرف كم يبعد الكابتن عن الاستلام، فلا نخترع رقماً:
            // السطر الفرعي يذكر مدّة الرحلة فقط. بعد الاستلام مدّة الرحلة تقريبٌ معقول للوصول.
            if (order.eta && Number.isFinite(Number(order.eta.max || order.eta.minutes))
                && !(order.captain && order.captain.currentLocation)) {
                const tripMax = Number(order.eta.max || order.eta.minutes);
                if (order.status === 'picked_up') {
                    setEta(tripMax, null);
                    document.getElementById('hero-sub').textContent = `مدّة المشوار ${order.eta.text}`;
                } else if (order.status === 'accepted') {
                    document.getElementById('hero-sub').textContent = `بعد الاستلام يستغرق المشوار ${order.eta.text}`;
                }
            }

            // Price — الإجمالي المستحق نقداً يشمل الإكرامية، فالعميل يرى ما سيدفعه فعلاً
            const _tipAmt = Number(order.tip?.amount) || 0;
            if (order.price) {
                const due = Math.max(0, (Number(order.price) || 0) - (Number(order.discountAmount) || 0)) + _tipAmt;
                document.getElementById('order-price').innerHTML = `${due.toLocaleString('en-US')} <small>ج.س</small>`;
            }

            // 💚 صندوق الإكرامية
            loadTipConfig().then(() => renderTipBox(order));

            document.getElementById('pickup-txt').textContent = order.pickup?.address || '—';
            document.getElementById('dropoff-txt').textContent = order.dropoff?.address || '—';

            // 🧭 توصيل متعدد النقاط: اعرض قائمة المحطات بتقدّمها بدل ملخص النقطتين
            renderStopsProgress(order);

            let bounds = null;
            if (map && typeof google !== 'undefined' && google.maps) {
                bounds = new google.maps.LatLngBounds();

                if (validCoord(order.pickup?.lat, order.pickup?.lng)) {
                    const pos = new google.maps.LatLng(order.pickup.lat, order.pickup.lng);
                    if (!pickupMarker) {
                        pickupMarker = new google.maps.Marker({
                            position: pos, map, title: 'نقطة الاستلام',
                            icon: (typeof WajeezMarkers !== 'undefined') ? WajeezMarkers.pickup() : { url: SVG_PICKUP, scaledSize: new google.maps.Size(42, 42), anchor: new google.maps.Point(21, 21) }
                        });
                    }
                    bounds.extend(pos);
                }
                if (validCoord(order.dropoff?.lat, order.dropoff?.lng)) {
                    const pos = new google.maps.LatLng(order.dropoff.lat, order.dropoff.lng);
                    if (!dropoffMarker) {
                        dropoffMarker = new google.maps.Marker({
                            position: pos, map, title: 'نقطة التسليم',
                            icon: (typeof WajeezMarkers !== 'undefined') ? WajeezMarkers.dropoff() : { url: SVG_DROPOFF, scaledSize: new google.maps.Size(42, 42), anchor: new google.maps.Point(21, 21) }
                        });
                    }
                    bounds.extend(pos);
                }

                // Draw real street route between pickup → dropoff
                if (order.pickup?.lat && order.dropoff?.lat) {
                    const midStops = (order.isMultiStop && Array.isArray(order.stops) && order.stops.length > 2)
                        ? order.stops.slice(1, -1)
                        : null;
                    drawRouteOnStreets(order.pickup, order.dropoff, midStops);
                }
            }

            // Captain info
            if (order.captain) {
                const captainEl = document.getElementById('captain-info');
                captainEl.style.display = 'flex';
                document.getElementById('captain-name').textContent = order.captain.name || 'الكابتن';
                document.getElementById('captain-vehicle').textContent = order.captain.vehicleType
                    ? window.VehicleTypes.label(order.captain.vehicleType) : '—';

                // ⭐ تقييم الكابتن الظاهر — يُطمئن العميل قبل/أثناء التوصيل
                const ratingEl = document.getElementById('captain-rating');
                if (ratingEl) {
                    const rc = order.captain.ratingCount || 0;
                    if (rc > 0 && order.captain.averageRating) {
                        ratingEl.style.display = '';
                        ratingEl.innerHTML = `<i class="bi bi-star-fill" style="color:#f59e0b"></i> ${Number(order.captain.averageRating).toFixed(1)} (${Number(rc)})`;
                    } else {
                        ratingEl.style.display = 'none';
                    }
                }

                // 🏁 عدد الرحلات المكتملة — الكابتن الجديد بلا تقييم قد يكون أنجز
                // رحلات كثيرة، فالتقييم وحده يظلمه ويحرم العميل من إشارة خبرة صادقة
                const tripsEl = document.getElementById('captain-trips');
                if (tripsEl) {
                    const trips = Number(order.captain.completedTrips) || 0;
                    if (trips > 0) {
                        tripsEl.style.display = '';
                        tripsEl.textContent = trips >= 1000
                            ? `${(trips / 1000).toFixed(1).replace(/\.0$/, '')} ألف رحلة`
                            : `${trips} رحلة`;
                    } else {
                        tripsEl.style.display = 'none';
                    }
                }

                // 📷 Captain profile photo
                const avatarEl = document.getElementById('captain-avatar');
                const photo = order.captain.documents && order.captain.documents.profilePhoto;
                if (photo) {
                    const photoUrl = (photo.startsWith('http') ? '' : API_URL) + photo;
                    avatarEl.textContent = '';
                    avatarEl.style.backgroundImage = `url('${photoUrl}')`;
                    avatarEl.style.backgroundSize = 'cover';
                    avatarEl.style.backgroundPosition = 'center';
                } else {
                    avatarEl.style.backgroundImage = '';
                    avatarEl.textContent = (order.captain.name || 'ك')[0];
                }

                // Call button
                if (order.captain.phone) {
                    document.getElementById('captain-call-btn').href = 'tel:' + order.captain.phone;
                }

                // Chat button
                document.getElementById('captain-chat-btn').href = `chat.html?orderId=${orderId}&receiverId=${order.captain._id || order.captain}`;

                // Captain location
                const loc = order.captain.currentLocation;
                if (loc && loc.lat && loc.lng) {
                    placeCaptainMarker(loc.lat, loc.lng);
                    if (bounds) bounds.extend(new google.maps.LatLng(loc.lat, loc.lng));
                    updateETA(loc.lat, loc.lng);
                    // fixedAt = لحظة القياس (نسخ قديمة ترسل updatedAt فقط)
                    const fixedAt = loc.fixedAt || loc.updatedAt;
                    markCaptainFix(fixedAt ? Date.now() - new Date(fixedAt).getTime() : 0);
                } else {
                    renderTrackingFreshness();
                }

            }

            // ⚠️ كانت المواءمة داخل «if (order.captain)» فقط: الطلب المنتظر — أول خريطةٍ يراها العميل
            //    بعد الطلب — لم تُواءم أبداً فتخرج نقطة الاستلام من الشاشة.
            if (bounds && !bounds.isEmpty()) fitTo(bounds);
            if (captainMarker && !['accepted', 'picked_up'].includes(order.status)) captainMarker.setMap(null);
        }

        // ── 🛰️ حيوية التتبّع ─────────────────────────────────────────────
        // لحظة آخر **قياس** لموقع الكابتن (لا لحظة وصوله للخادم).
        let _lastFixAt = null;
        let _freshTimer = null;

        const FRESH_MS = 60 * 1000;        // دون الدقيقة: يتحرّك الآن
        const STALE_MS = 5 * 60 * 1000;    // فوق الخمس: التحديث منقطع فعلاً

        function _ageText(ms) {
            const m = Math.round(ms / 60000);
            if (m < 1) return 'الآن';
            if (m === 1) return 'قبل دقيقة';
            if (m === 2) return 'قبل دقيقتين';
            if (m <= 10) return `قبل ${m} دقائق`;
            return `قبل ${m} دقيقة`;
        }

        /**
         * يضبط شارة الحيوية والشريط التفسيري.
         * القاعدة: لا نُظهر «مباشر» إلا إذا كان القياس حديثاً فعلاً — المؤشّر
         * الجامد الذي يبدو حيّاً هو أصل شكوى «التتبّع ما شغال».
         */
        function renderTrackingFreshness() {
            const badge = document.getElementById('track-live');
            const text = document.getElementById('track-live-text');
            const hint = document.getElementById('track-hint');
            const hintText = document.getElementById('track-hint-text');
            if (!badge || !text) return;
            // «يتحرّك الآن» تخصّ رحلةً جارية فقط
            if (currentOrder && !['accepted', 'picked_up'].includes(currentOrder.status)) {
                badge.style.display = 'none';
                if (hint) hint.classList.remove('show');
                return;
            }

            badge.style.display = 'inline-flex';
            badge.classList.remove('live', 'stale', 'off');

            if (_lastFixAt == null) {
                badge.classList.add('off');
                text.textContent = 'بانتظار إشارة الكابتن';
                if (hint) hint.classList.remove('show');
                return;
            }

            const age = Date.now() - _lastFixAt;
            if (age <= FRESH_MS) {
                badge.classList.add('live');
                text.textContent = 'يتحرّك الآن';
                if (hint) hint.classList.remove('show');
            } else if (age <= STALE_MS) {
                badge.classList.add('stale');
                text.textContent = `آخر تحديث ${_ageText(age)}`;
                if (hint) hint.classList.remove('show');
            } else {
                badge.classList.add('off');
                text.textContent = `آخر تحديث ${_ageText(age)}`;
                if (hint && hintText) {
                    hintText.textContent = 'انقطع تحديث موقع الكابتن — قد تكون شبكته ضعيفة. '
                        + 'الطلب ماضٍ، والموقع المعروض هو آخر ما وصلنا. اتصل به إن طال الأمر.';
                    hint.classList.add('show');
                }
            }
        }

        /** يُسجَّل عند كل قراءة: عمرها بالمللي ثانية (0 = لحظية) */
        function markCaptainFix(fixAgeMs) {
            const age = Number(fixAgeMs);
            _lastFixAt = Date.now() - (Number.isFinite(age) && age >= 0 ? age : 0);
            renderTrackingFreshness();
            // النصّ يشيخ وحده: بلا مؤقّت تبقى «يتحرّك الآن» مكتوبةً بعد انقطاعه
            if (!_freshTimer) _freshTimer = setInterval(renderTrackingFreshness, 15000);
        }

        function placeCaptainMarker(lat, lng) {
            // ⚠️ الطلب يصل قبل الخريطة غالباً. كان إنشاء الدبّوس هنا يرمي
            //    «google is not defined» فيظهر للعميل «فشل تحميل بيانات الطلب»
            //    وطلبه سليم. initTrackingMap يعيد رسم الطلب فور جاهزية الخريطة.
            if (!map || typeof google === 'undefined') return;
            if (captainMarker && captainMover) {
                captainMover.moveTo({ lat, lng });
                return;
            }
            captainMarker = new google.maps.Marker({
                position: { lat, lng }, map, zIndex: 999,
                // قرصٌ دوّار بأيقونة وسيلة الكابتن — لا دبوس ثابت بدراجة هوائية
                icon: captainIconFor(null)
            });
            captainMover = MarkerMotion.create(captainMarker, { iconFor: captainIconFor });
            addCaptainPulse(lat, lng);
        }

        if (userId) {
            const socket = io(API_URL, {
                transports: ['websocket', 'polling'],
                auth: { token: localStorage.getItem('token') }
            });

            socket.on('connect', () => {
                console.log('✅ Tracking socket connected');
                socket.emit('user_join', userId);
            });

            // ✅ Real-time captain location (sent by server when captain moves)
            socket.on('captain_location_updated', (data) => {
                if (data.orderId && data.orderId.toString() === orderId.toString()) {
                    const { lat, lng } = data;
                    placeCaptainMarker(lat, lng);
                    updateETA(lat, lng);
                    markCaptainFix(data.fixAge);
                }
            });

            // ✅ Order status change (server emits this on accept/pickup/deliver)
            socket.on('order_status_updated', (data) => {
                if (data && String(data.orderId) === String(orderId)) {
                    fetchOrder(); // Re-fetch to update UI
                }
            });

            // 🛍️ errand: وصل سعر البضاعة من الكابتن → أعد الجلب ليظهر نافذة التأكيد
            socket.on('errand_quote', (data) => {
                if (data && String(data.orderId) === String(orderId)) {
                    _errandPromptedFor = null; // اسمح بإظهار النافذة للسعر الجديد
                    fetchOrder();
                }
            });

            // Also listen for generic new_notification that might contain order updates
            socket.on('new_notification', (data) => {
                if (data && (data.type === 'order_update' || data.type === 'order_accepted') && currentOrder) {
                    fetchOrder();
                }
            });
        }

        let captainPollInterval = null;

        function startCaptainPolling() {
            if (captainPollInterval) return;
            captainPollInterval = setInterval(async () => {
                if (!currentOrder || !currentOrder.captain) return;
                const captainId = currentOrder.captain._id || currentOrder.captain;
                if (!captainId) return;

                // Stop polling if order is delivered/cancelled
                if (!['accepted', 'picked_up'].includes(currentOrder.status)) {
                    clearInterval(captainPollInterval);
                    captainPollInterval = null;
                    return;
                }

                try {
                    const res = await fetchWithRetry(`${API_URL}/api/captain/${captainId}/location`, {
                        headers: window.Auth.getAuthHeader()
                    });
                    if (!res.ok) return;
                    const loc = await res.json();
                    if (loc.lat && loc.lng) {
                        placeCaptainMarker(loc.lat, loc.lng);
                        updateETA(loc.lat, loc.lng);
                    }
                } catch (e) {
                    console.error('Captain poll error:', e);
                }
            }, 5000); // Every 5 seconds
        }
    </script>
