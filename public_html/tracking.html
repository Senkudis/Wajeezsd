<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع الطلب | وصل-لي</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a8754">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f8f9fa;
        }

        .map-container {
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .info-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 600px;
            margin: 0 auto;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1001;
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: var(--dark);
            text-decoration: none;
            transition: transform 0.2s;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .sim-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1001;
        }
    </style>
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css">
    <script src="js/config.js"></script>
</head>

<body class="bg-light">

    <!-- Back Button -->
    <a href="client-my-orders.html" class="back-btn fs-5">
        <i class="bi bi-arrow-right"></i>
    </a>

    <!-- Map -->
    <div class="map-container">
        <div id="map"></div>

        <!-- Simulation Button -->
        <button onclick="simulateMovement()" class="btn btn-warning shadow-sm fw-bold sim-btn rounded-pill">
            <i class="bi bi-play-fill me-1"></i> محاكاة
        </button>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
        <div class="card glass-card border-0 shadow-lg">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
                    <div class="d-flex align-items-center gap-2">
                        <div class="bg-primary bg-opacity-10 p-2 rounded-circle text-primary">
                            <i class="bi bi-box-seam-fill"></i>
                        </div>
                        <h6 class="fw-bold mb-0">حالة الطلب</h6>
                    </div>
                    <span id="order-status" class="badge bg-secondary rounded-pill px-3 py-2">جاري التحميل...</span>
                </div>

                <div id="captain-info" class="d-none bg-light rounded-3 p-2 mb-3 d-flex align-items-center gap-3">
                    <div class="bg-white rounded-circle p-1 shadow-sm">
                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="40" height="40"
                            class="rounded-circle object-fit-cover">
                    </div>
                    <div>
                        <h6 class="fw-bold mb-0 text-dark" id="captain-name">اسم الكابتن</h6>
                        <small class="text-muted" id="captain-vehicle">نوع المركبة</small>
                    </div>
                    <a href="#" class="btn btn-success btn-sm ms-auto rounded-circle"
                        style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;"><i
                            class="bi bi-telephone-fill"></i></a>
                </div>

                <div class="row g-2 text-center">
                    <div class="col-6 position-relative">
                        <div class="d-flex align-items-center justify-content-center gap-1 text-primary mb-1">
                            <i class="bi bi-geo-alt-fill"></i> <small class="fw-bold">الاستلام</small>
                        </div>
                        <div class="badge bg-white text-dark border shadow-sm text-truncate w-100" id="pickup-txt">...
                        </div>
                    </div>
                    <div class="col-6 border-start border-light ps-2">
                        <div class="d-flex align-items-center justify-content-center gap-1 text-danger mb-1">
                            <i class="bi bi-flag-fill"></i> <small class="fw-bold">التسليم</small>
                        </div>
                        <div class="badge bg-white text-dark border shadow-sm text-truncate w-100" id="dropoff-txt">...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="notification-toast.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const token = localStorage.getItem('token') || localStorage.getItem('clientToken');
        const userId = localStorage.getItem('userId');

        if (!token || !orderId) window.location.href = 'client-my-orders.html';

        // Map Init
        const map = L.map('map', { zoomControl: false }).setView([15.6067, 32.5317], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Icons
        const pickupIcon = L.divIcon({
            html: '<div style="background:#0a8754; width:30px; height:30px; border-radius:50%; border:3px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center;"><i class="bi bi-geo-alt-fill text-white" style="font-size:16px;"></i></div>',
            className: 'custom-pin', iconSize: [30, 30], iconAnchor: [15, 15]
        });

        const dropoffIcon = L.divIcon({
            html: '<div style="background:#dc3545; width:30px; height:30px; border-radius:50%; border:3px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center;"><i class="bi bi-flag-fill text-white" style="font-size:16px;"></i></div>',
            className: 'custom-pin', iconSize: [30, 30], iconAnchor: [15, 15]
        });

        const captainIcon = L.divIcon({
            html: '<div style="background:white; padding:5px; border-radius:50%; box-shadow:0 3px 6px rgba(0,0,0,0.2); border: 2px solid #0a8754; width:40px; height:40px; display:flex; justify-content:center; align-items:center;"><i class="bi bi-scooter" style="color:#0a8754; font-size:22px;"></i></div>',
            className: 'captain-marker',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        let captainMarker = null;
        let currentOrder = null;

        async function fetchOrder() {
            try {
                const res = await fetch(`${API_URL}/api/orders/my-orders`, { headers: window.Auth.getAuthHeader() });
                const orders = await res.json();
                const order = orders.find(o => o._id === orderId);

                if (!order) {
                    Swal.fire('خطأ', 'الطلب غير موجود', 'error').then(() => window.location.href = 'client-my-orders.html');
                    return;
                }

                currentOrder = order;
                updateUI(order);
            } catch (err) { console.error(err); }
        }

        function updateUI(order) {
            const mb = document.getElementById('order-status');
            const mapStatus = { 'pending': '⏳ في الانتظار', 'accepted': '🚀 جاري التوصيل', 'picked_up': '📦 تم الاستلام', 'delivered': '✅ تم التوصيل' };
            const colors = { 'pending': 'bg-warning text-dark', 'accepted': 'bg-primary', 'picked_up': 'bg-info text-dark', 'delivered': 'bg-success' };

            mb.innerText = mapStatus[order.status] || order.status;
            mb.className = `badge ${colors[order.status] || 'bg-secondary'} rounded-pill px-3 py-2`;

            document.getElementById('pickup-txt').innerText = order.pickup.address;
            document.getElementById('dropoff-txt').innerText = order.dropoff.address;

            if (order.pickup.lat) L.marker([order.pickup.lat, order.pickup.lng], { icon: pickupIcon }).addTo(map).bindPopup('الاستلام');
            if (order.dropoff.lat) L.marker([order.dropoff.lat, order.dropoff.lng], { icon: dropoffIcon }).addTo(map).bindPopup('الوجهة');

            if (order.pickup.lat && order.dropoff.lat) {
                const group = new L.featureGroup([
                    L.marker([order.pickup.lat, order.pickup.lng]),
                    L.marker([order.dropoff.lat, order.dropoff.lng])
                ]);
                map.fitBounds(group.getBounds(), { padding: [50, 150] }); // More padding at bottom for card
            }

            if (order.captain) {
                document.getElementById('captain-info').classList.remove('d-none');
                document.getElementById('captain-info').classList.add('d-flex');
                document.getElementById('captain-name').innerText = order.captain.name;
                if (order.captain.vehicleType) document.getElementById('captain-vehicle').innerText = order.captain.vehicleType;
            }
        }

        if (userId) {
            const socket = io();
            socket.emit('user_join', userId);

            socket.on('captain_location_updated', (data) => {
                if (data.orderId === orderId) {
                    const { lat, lng } = data;
                    if (captainMarker) captainMarker.setLatLng([lat, lng]);
                    else captainMarker = L.marker([lat, lng], { icon: captainIcon }).addTo(map).bindPopup('الكابتن').openPopup();
                }
            });

            socket.on('order_status_updated', (data) => {
                if (data.orderId === orderId) location.reload();
            });

            socket.on('captain_status_changed', (data) => {
                if (currentOrder && currentOrder.captain && currentOrder.captain._id === data.userId && !data.isActive) {
                    if (captainMarker) { map.removeLayer(captainMarker); captainMarker = null; }
                }
            });
        }

        fetchOrder();

        let simInterval;
        function simulateMovement() {
            if (!currentOrder || !currentOrder.pickup.lat || !currentOrder.dropoff.lat) return Swal.fire('تنبيه', 'لا توجد بيانات كافية', 'warning');
            if (simInterval) clearInterval(simInterval);

            let progress = 0;
            const start = { lat: currentOrder.pickup.lat, lng: currentOrder.pickup.lng };
            const end = { lat: currentOrder.dropoff.lat, lng: currentOrder.dropoff.lng };

            if (!captainMarker) captainMarker = L.marker([start.lat, start.lng], { icon: captainIcon }).addTo(map).bindPopup('الكابتن (تجربة)').openPopup();
            else captainMarker.setLatLng([start.lat, start.lng]);

            const steps = 100;
            simInterval = setInterval(() => {
                progress++;
                const lat = start.lat + (end.lat - start.lat) * (progress / steps);
                const lng = start.lng + (end.lng - start.lng) * (progress / steps);
                captainMarker.setLatLng([lat, lng]);
                if (progress >= steps) { clearInterval(simInterval); Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'تم الوصول (تجربة)', timer: 2000, showConfirmButton: false }); }
            }, 50);
        }
    </script>
    <!-- Auth Helper & App Core -->
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
