<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الملف الشخصي | كابتن</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.4">

    <link rel="stylesheet" href="css/mobile-overrides.css?v=e9a74842">
    <link rel="stylesheet" href="css/enhanced-styles.css?v=c7becdb9">
    <link rel="stylesheet" href="css/dark-mode.css?v=afc716b6">
    <!-- نظام تصميم الكابتن — يعرّف .captain-nav (شريط التنقل السفلي).
         بعد dark-mode.css عمداً كي تفوز قواعده الليلية. -->
    <link rel="stylesheet" href="css/captain-ui.css?v=29690076">
    <script src="js/config.js?v=977449f7"></script>
    <script src="js/vehicle-types.js?v=933c2c4e"></script>

    <script src="js/auth-helper.js?v=c97361b3"></script>
    <script src="js/safe-area.js?v=176d6050"></script>
</head>

<body class="bg-light">

    <!-- Header Section -->
    <div class="app-header text-center pb-3">
        <div class="container pt-2">
            <!-- الصورة قابلة للضغط لتغييرها — الحاوية position-relative لتثبيت زر الكاميرا -->
            <div class="position-relative d-inline-block mb-3">
                <div class="bg-white rounded-circle p-1 shadow-lg position-relative" style="width: 100px; height: 100px;">
                    <div id="profileAvatar" role="button" tabindex="0"
                        aria-label="تغيير الصورة الشخصية"
                        class="w-100 h-100 rounded-circle bg-light d-flex align-items-center justify-content-center text-primary overflow-hidden"
                        style="cursor:pointer;">
                        <i class="bi bi-person-fill display-4"></i>
                    </div>

                    <!-- طبقة تقدّم الرفع — inset:4px يطابق p-1 فتنطبق على دائرة
                         الصورة تماماً لا على الإطار الأبيض حولها -->
                    <div id="photoBusy"
                        class="position-absolute rounded-circle d-none align-items-center justify-content-center"
                        style="inset:4px;background:rgba(0,0,0,.5);">
                        <div class="spinner-border spinner-border-sm text-white" role="status">
                            <span class="visually-hidden">جارٍ الرفع</span>
                        </div>
                    </div>
                </div>

                <!-- زر الكاميرا: هدف لمس مستقل ٣٤px، فلا يعتمد المستخدم على تخمين
                     أن الصورة نفسها قابلة للضغط.
                     z-index أعلى من طبقة التقدّم — الطبقة داخل الإطار والزر خارجه،
                     وبدونه يظهر الزر نصفه مطموساً أثناء الرفع. -->
                <button type="button" id="photoBtn"
                    class="btn btn-light rounded-circle shadow position-absolute d-flex align-items-center justify-content-center p-0 border-0"
                    style="width:34px;height:34px;bottom:0;left:0;z-index:2;"
                    aria-label="تغيير الصورة الشخصية">
                    <i class="bi bi-camera-fill text-primary" style="font-size:15px;"></i>
                </button>

                <input type="file" id="photoInput" accept="image/*" hidden>
            </div>
            <h2 class="h4 fw-bold text-white mb-1 skeleton mx-auto w-50" id="name" style="min-height: 1.5rem;">جاري
                التحميل...</h2>

            <div id="dateWrapper"
                class="d-none badge bg-white bg-opacity-25 backdrop-blur text-white px-3 py-2 rounded-pill fw-normal mt-2">
                <i class="bi bi-calendar3 me-1"></i> <span id="date">...</span>
            </div>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="container stats-grid mt-3">
        <div class="card glass-card border-0 text-center p-3">
            <i class="bi bi-box-seam-fill fs-2 text-primary mb-2"></i>
            <h3 class="h4 fw-bold text-dark mb-0 skeleton mx-auto w-50" id="orders">0</h3>
            <p class="small text-muted mb-0">الطلبات المكتملة</p>
        </div>
        <div class="card glass-card border-0 text-center p-3">
            <i class="bi bi-wallet-fill fs-2 text-success mb-2"></i>
            <h3 class="h4 fw-bold text-dark mb-0 skeleton mx-auto w-50" id="revenue">0</h3>
            <p class="small text-muted mb-0">إجمالي الأرباح</p>
        </div>
    </div>

    <!-- Info Section -->
    <div class="container mt-4 mb-5 pb-5">
        <h5 class="fw-bold mb-3 text-secondary px-2">معلومات الحساب</h5>

        <div class="card glass-card border-0 overflow-hidden">
            <div class="list-group list-group-flush bg-transparent">
                <!-- Phone -->
                <div class="list-group-item bg-transparent border-light p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-primary bg-opacity-10 p-2 rounded text-primary">
                            <i class="bi bi-telephone-fill"></i>
                        </div>
                        <div class="flex-grow-1">
                            <small class="text-muted d-block">رقم الهاتف</small>
                            <span class="fw-bold text-dark skeleton w-50 d-block" id="phone" dir="ltr">...</span>
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="list-group-item bg-transparent border-light p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-success bg-opacity-10 p-2 rounded text-success">
                            <i class="bi bi-envelope-fill"></i>
                        </div>
                        <div class="flex-grow-1">
                            <small class="text-muted d-block">البريد الإلكتروني</small>
                            <span class="fw-bold text-dark skeleton w-75 d-block text-break" id="email"
                                style="font-size: 0.9rem;">...</span>
                        </div>
                    </div>
                </div>

                <!-- Vehicle -->
                <div class="list-group-item bg-transparent border-light p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-warning bg-opacity-10 p-2 rounded text-warning">
                                <i class="bi bi-ev-front-fill"></i>
                            </div>
                            <div>
                                <small class="text-muted d-block">نوع المركبة</small>
                                <span class="fw-bold text-dark skeleton w-50 d-block" id="vehicle-text">...</span>
                            </div>
                        </div>
                        <span class="badge bg-secondary rounded-pill skeleton" id="vehicle-tag">...</span>
                    </div>
                </div>
            </div>

            <div class="p-3 pb-0">
                <button class="btn btn-outline-primary w-100 fw-bold py-3 rounded-3 hover-scale"
                    onclick="shareApp('captain-profile')">
                    <i class="bi bi-share-fill me-2"></i> شارك التطبيق
                </button>
            </div>

            <div class="p-3 pb-3">
                <!-- إعادة الجولة الترحيبية — وعدت بها الخطوة الأخيرة من جولة
                     الكابتن نصّاً ("من صفحة حسابك")، فكان وعداً بلا تنفيذ -->
                <button class="btn btn-outline-success w-100 fw-bold py-3 rounded-3 hover-scale mb-2"
                    onclick="replayTour()">
                    <i class="bi bi-play-circle me-2"></i> إعادة الجولة الترحيبية
                </button>
                <button class="btn btn-outline-danger w-100 fw-bold py-3 rounded-3 hover-scale" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i> تسجيل الخروج
                </button>
            </div>
        </div>

        <!-- ⚠️ كان الرقم مكتوباً هنا يدوياً (2.0.0 بينما التطبيق 1.0.9) — فاحص الإصدار
             لا يرى ملفات HTML، فبقي الخطأ سنوات. الآن يُقرأ من APP_VERSION فلا يفترقان. -->
        <div class="text-center mt-4 text-muted small">
            <!-- حذف الحساب مخفي أسفل الصفحة -->
            <a href="#" class="d-inline-block text-danger text-decoration-none small mb-3" onclick="event.preventDefault(); openDeleteAccount()">
                <i class="bi bi-person-x me-1"></i> حذف الحساب نهائياً
            </a><br>
            الإصدار <span data-app-version>—</span>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="captain-nav">
        <a href="captain-dashboard.html">
            <i class="bi bi-house-door-fill"></i><span>الرئيسية</span>
        </a>
        <a href="captain-orders.html">
            <i class="bi bi-bicycle"></i><span>الطلبات</span>
        </a>
        <a href="captain-missions.html">
            <i class="bi bi-card-checklist"></i><span>مهامي</span>
        </a>
        <a href="captain-notifications.html">
            <i class="bi bi-bell-fill"></i><span>الإشعارات</span>
        </a>
        <a href="captain-profile.html" class="active">
            <i class="bi bi-person-circle"></i><span>حسابي</span>
        </a>
    </nav>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="js/delete-account.js?v=5fc26bb0"></script>

    <script>
        // Check Auth
        if (!window.Auth || !window.Auth.isAuthenticated()) {
            // Identify login page based on context or generic
            // window.location.href = "client-login.html"; // handled by specific pages usually
        }
        const token = window.Auth.getToken();
        if (!token) window.location.href = 'captain-login.html';

        async function loadProfileData() {
            try {
                const res = await fetchWithRetry(`${API_URL}/api/captain/profile-details`, {
                    headers: window.Auth.getAuthHeader()
                });

                if (res.ok) {
                    const data = await res.json();

                    // Remove skeleton class
                    document.querySelectorAll('.skeleton').forEach(el => {
                        el.classList.remove('skeleton');
                        el.style.width = 'auto'; // Reset width override
                    });
                    document.getElementById('dateWrapper').classList.remove('d-none');
                    document.getElementById('dateWrapper').classList.add('d-inline-flex');

                    // 🖼️ صورة البروفايل
                    if (data.profilePhoto) renderAvatar(data.profilePhoto);

                    // Update contents
                    // ⚠️ كل قيمة محروسة: `data.totalEarnings.toLocaleString()` كان يرمي
                    // TypeError لو غاب الحقل، فيسقط تحميل البروفايل كله إلى نافذة خطأ
                    // عامة — والاسم والهاتف الموجودان فعلاً لا يُعرضان.
                    document.getElementById('name').innerText = data.name || '—';
                    document.getElementById('email').innerText = data.email || '—';
                    document.getElementById('phone').innerText = data.phone || '—';
                    document.getElementById('orders').innerText = Number(data.totalOrders || 0).toLocaleString('en-US');
                    document.getElementById('revenue').innerText =
                        Number(data.totalEarnings || 0).toLocaleString('en-US') + ' ج.س';

                    // Vehicle Logic — من المصدر المركزي vehicle-types.js
                    const vehicleText = data.vehicleType ? window.VehicleTypes.iconLabel(data.vehicleType) : 'غير محدد';
                    document.getElementById('vehicle-text').innerText = vehicleText;
                    document.getElementById('vehicle-tag').innerText = data.vehicleType ? data.vehicleType.toUpperCase() : 'N/A';

                    // Date Logic — تاريخ غير صالح كان يُطبع «انضممت في undefined NaN»
                    const date = new Date(data.joinDate);
                    const wrapper = document.getElementById('dateWrapper');
                    if (data.joinDate && !isNaN(date.getTime())) {
                        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
                        document.getElementById('date').innerText = `انضممت في ${months[date.getMonth()]} ${date.getFullYear()}`;
                    } else if (wrapper) {
                        wrapper.classList.add('d-none');
                        wrapper.classList.remove('d-inline-flex');
                    }

                } else if (res.status === 401 || res.status === 403) {
                    // جلسة منتهية: الرسالة العامة كانت تُقرأ كعطل في التطبيق
                    window.Auth.logout('captain-login.html');
                    return;
                } else {
                    throw new Error('Failed to load');
                }
            } catch (err) {
                console.error("Profile Error:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ',
                    text: 'حدث خطأ في تحميل البيانات',
                    confirmButtonText: 'حسناً',
                    confirmButtonColor: '#e74c3c'
                });
            }
        }

        // الجولة تعيش في اللوحة لا هنا: خطواتها تُشير إلى عناصرها.
        // نمسح علامة الإتمام ثم ننقل الكابتن إليها فتبدأ من جديد.
        function replayTour() {
            try { window.WajeezTour && window.WajeezTour.reset('captain_v1'); } catch (e) {}
            window.location.href = 'captain-dashboard.html';
        }

        function logout() {
            Swal.fire({
                title: 'تسجيل الخروج؟',
                text: "هل أنت متأكد من تسجيل الخروج؟",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                cancelButtonColor: '#95a5a6',
                confirmButtonText: 'نعم، خروج',
                cancelButtonText: 'إلغاء'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    // ✅ Set offline immediately via dedicated logout endpoint
                    try {
                        await fetchWithRetry(`${API_URL}/api/captain/logout`, {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + token,
                                'Content-Type': 'application/json'
                            }
                        });
                    } catch (e) { console.error("Logout status update failed", e); }

                    if (window.Auth) {
                        window.Auth.logout('captain-login.html');
                    } else {
                        localStorage.clear();
                        window.location.href = 'captain-login.html';
                    }
                }
            });
        }

        // ══════════════════════════════════════════════════════════
        // 🖼️ الصورة الشخصية — يرفعها الكابتن بنفسه
        // ══════════════════════════════════════════════════════════
        // نفس الصورة تظهر في ثلاثة أماكن: هذه الصفحة، وشاشة تتبّع الطلب عند
        // العميل، وبطاقة الفريق العامة على team.wajeezsd.com. مصدرها واحد
        // (documents.profilePhoto) فلا تحتاج مزامنة بين الثلاثة.

        const PHOTO_MAX_BYTES = 5 * 1024 * 1024; // نفس حدّ السيرفر

        /** يرسم الصورة داخل الدائرة، ويعود للأيقونة الافتراضية إن فشل تحميلها. */
        function renderAvatar(pathOrUrl) {
            const avatar = document.getElementById('profileAvatar');
            if (!avatar) return;

            const url = window.getFullImageUrl ? window.getFullImageUrl(pathOrUrl) : pathOrUrl;
            const img = document.createElement('img');
            img.alt = '';
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
            // معالج الخطأ يُربط بالكود لا بسمة onerror نصية: الصيغة النصية كانت
            // تستبدل محتوى الحاوية كلها فتمحو معها زر الكاميرا وطبقة التقدّم.
            img.onerror = () => { avatar.innerHTML = '<i class="bi bi-person-fill display-4"></i>'; };
            img.src = url;

            avatar.innerHTML = '';
            avatar.appendChild(img);
        }

        function setPhotoBusy(busy) {
            const layer = document.getElementById('photoBusy');
            const btn = document.getElementById('photoBtn');
            if (layer) layer.classList.toggle('d-none', !busy);
            if (layer) layer.classList.toggle('d-flex', busy);
            if (btn) btn.disabled = busy;
        }

        async function uploadProfilePhoto(file) {
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                Swal.fire({ icon: 'error', title: 'الملف ليس صورة', confirmButtonText: 'حسناً' });
                return;
            }
            // الفحص هنا قبل الرفع: على بيانات الجوال، اكتشاف الحجم بعد رفع
            // خمسة ميغابايت كاملة يعني إهدارها مرتين — مرة للرفع ومرة للإعادة.
            if (file.size > PHOTO_MAX_BYTES) {
                Swal.fire({
                    icon: 'error',
                    title: 'الصورة كبيرة جداً',
                    text: 'الحد الأقصى ٥ ميغابايت. اختر صورة أصغر أو التقطها بجودة أقل.',
                    confirmButtonText: 'حسناً'
                });
                return;
            }

            // معاينة فورية من الملف المحلي: الرفع على شبكة ضعيفة قد يستغرق ثوانيَ،
            // وبقاء الصورة القديمة طوالها يجعل الكابتن يظن أن الضغطة لم تُسجَّل.
            const localPreview = URL.createObjectURL(file);
            renderAvatar(localPreview);
            setPhotoBusy(true);

            try {
                const form = new FormData();
                form.append('photo', file);

                // بلا Content-Type: المتصفح يضبطه مع حدّ multipart الصحيح،
                // وضبطه يدوياً يُفسد الطلب.
                const res = await fetch(`${API_URL}/api/upload/profile-photo`, {
                    method: 'POST',
                    headers: window.Auth.getAuthHeader(),
                    body: form
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || 'تعذّر رفع الصورة');

                // الرابط العائد من السيرفر هو الصورة المضغوطة المحفوظة فعلاً
                renderAvatar(data.url);

                Swal.fire({
                    icon: 'success',
                    title: 'تم تحديث صورتك',
                    text: 'ستظهر للعملاء وفي صفحة فريق وجيز.',
                    toast: true, position: 'top', showConfirmButton: false, timer: 2800
                });
            } catch (err) {
                // فشل الرفع ⇒ نعيد الصورة المحفوظة سابقاً لا المعاينة المحلية،
                // وإلا ظنّ الكابتن أن صورته حُفظت وهي لم تُحفظ.
                await loadProfileData();
                Swal.fire({
                    icon: 'error',
                    title: 'لم تُحفظ الصورة',
                    text: err.message || 'تحقّق من اتصالك ثم أعد المحاولة.',
                    confirmButtonText: 'حسناً'
                });
            } finally {
                setPhotoBusy(false);
                URL.revokeObjectURL(localPreview);
                // تصفير القيمة يسمح باختيار نفس الملف مرة أخرى بعد فشل
                document.getElementById('photoInput').value = '';
            }
        }

        (function bindPhotoUpload() {
            const input = document.getElementById('photoInput');
            const openPicker = () => input.click();

            document.getElementById('photoBtn').addEventListener('click', openPicker);
            document.getElementById('profileAvatar').addEventListener('click', openPicker);
            document.getElementById('profileAvatar').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPicker(); }
            });

            input.addEventListener('change', (e) => uploadProfilePhoto(e.target.files[0]));
        })();

        // Init
        loadProfileData();
    </script>
    <!-- Auth Helper & App Core -->
    <script src="js/geo.js?v=3f3df042"></script>
    <script src="js/share-app.js?v=fcdd5cd2"></script>
    <script type="module" src="js/app-core.js?v=b00fecf0"></script>
    <script type="module" src="js/native-notifications.js?v=c076999e"></script>
    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="notification-toast.js"></script>
    <script src="js/tour.js?v=d6d632d6"></script>
</body>
