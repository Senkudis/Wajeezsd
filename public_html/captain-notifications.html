<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الإشعارات | كابتن وجيز</title>

    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.4">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css?v=b6fff3fa">
    <link rel="stylesheet" href="css/enhanced-styles.css?v=3dc00ed1">
    <link rel="stylesheet" href="css/dark-mode.css?v=c9324219">

    <script src="js/theme-manager.js?v=01cb92bf"></script>

</head>

<body class="bg-light">

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white rounded-circle p-2 shadow-sm">
                        <i class="bi bi-bell-fill text-warning fs-4"></i>
                    </div>
                    <div>
                        <h2 class="h6 fw-bold mb-0 text-white">الإشعارات</h2>
                        <p class="small text-white-50 mb-0">آخر التنبيهات والتحديثات</p>
                    </div>
                </div>
                <!-- ✅ زر تحديد الكل كمقروء -->
                <button id="markAllReadBtn" onclick="markAllAsRead()" class="btn btn-sm btn-light rounded-pill px-3" style="font-size:12px; font-weight:700; color:#04553A; white-space:nowrap;">
                    <i class="bi bi-check2-all me-1"></i>تحديد الكل كمقروء
                </button>
            </div>
        </div>
    </div>

    <!-- Notifications Container -->
    <div class="container mt-3">
        <div id="notificationsList" class="d-flex flex-column gap-2">
            <div class="text-center py-5">
                <div class="spinner-border text-light" role="status"></div>
                <p class="mt-2 text-white fw-bold">جاري تحميل الإشعارات...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="mobile-nav-glass">
        <a href="captain-dashboard.html" class="nav-item-link">
            <i class="bi bi-house-door-fill"></i>
        </a>
        <a href="captain-orders.html" class="nav-item-link">
            <i class="bi bi-bicycle"></i>
        </a>
        <a href="captain-missions.html" class="nav-item-link">
            <i class="bi bi-card-checklist"></i>
        </a>
        <a href="captain-notifications.html" class="nav-item-link active">
            <i class="bi bi-bell-fill"></i>
        </a>
        <a href="captain-profile.html" class="nav-item-link">
            <i class="bi bi-person-circle"></i>
        </a>
    </nav>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        // ✅ Fix: Secure Auth Check (DOM Ready)
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'captain-login.html';
                return;
            }

            loadNotifications(token);
        });

        async function loadNotifications(token) {
            try {
                const res = await fetchWithRetry(`${API_URL}/api/notifications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    window.location.href = 'captain-login.html';
                    return;
                }

                const data = await res.json();
                // Handle both array and object response formats
                const notifications = Array.isArray(data) ? data : (data.notifications || data.data || []);
                const list = document.getElementById('notificationsList');
                list.innerHTML = '';

                if (!notifications || notifications.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-bell-slash fs-1 text-secondary opacity-50 mb-3"></i>
                            <p class="text-muted fw-bold">لا توجد إشعارات جديدة</p>
                        </div>`;
                    return;
                }

                notifications.forEach(n => {
                    // ✅ FIX: استخدم n.type أولاً (أدق) ثم n.title كـ fallback
                    const type = n.type || 'system';

                    const iconMap = {
                        'order_accepted': { icon: 'bi-box-seam-fill', color: '#198754', bg: '#e8f5e9' },
                        'order_completed': { icon: 'bi-check-circle-fill', color: '#198754', bg: '#e8f5e9' },
                        'order_update': { icon: 'bi-arrow-repeat', color: '#fd7e14', bg: '#fff3e0' },
                        'chat': { icon: 'bi-chat-dots-fill', color: '#6f42c1', bg: '#f3e8ff' },
                        'system': { icon: 'bi-bell-fill', color: '#0dcaf0', bg: '#e0f7fa' },
                    };

                    let mapped = iconMap[type] || iconMap['system'];
                    if (type === 'system') {
                        if (n.title.includes('طلب جديد') || n.title.includes('طلب'))
                            mapped = iconMap['order_accepted'];
                        else if (n.title.includes('اكتمل') || n.title.includes('توصيل'))
                            mapped = iconMap['order_completed'];
                        else if (n.title.includes('إلغاء') || n.title.includes('رفض'))
                            mapped = { icon: 'bi-x-circle-fill', color: '#dc3545', bg: '#fdecea' };
                        else if (n.title.includes('رصيد') || n.title.includes('محفظة'))
                            mapped = { icon: 'bi-wallet-fill', color: '#ffc107', bg: '#fff8e1' };
                        else if (n.title.includes('رسالة'))
                            mapped = iconMap['chat'];
                    }

                    const unreadBorder = !n.isRead ? 'border-start border-4 border-warning' : '';
                    const unreadDot = !n.isRead ? '<span class="position-absolute top-0 end-0 p-1 bg-danger border border-white rounded-circle mt-2 me-2" style="width:10px;height:10px;"></span>' : '';

                    list.innerHTML += `
                        <div class="card border-0 overflow-hidden position-relative mb-2 shadow-sm ${unreadBorder}" onclick="markAsRead('${n._id}', this)" style="cursor:pointer;">
                            <div class="card-body p-3 d-flex gap-3 align-items-center">
                                <div class="flex-shrink-0 d-flex align-items-center justify-content-center rounded-circle"
                                     style="width:46px;height:46px;background:${mapped.bg};border:2px solid ${mapped.color}30;">
                                    <i class="bi ${mapped.icon} fs-5" style="color:${mapped.color};"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-start mb-1">
                                        <h6 class="fw-bold text-dark mb-0 lh-sm">${n.title}</h6>
                                        <small class="text-muted ms-2 text-nowrap" style="font-size:0.72rem;">
                                            ${new Date(n.createdAt).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}
                                        </small>
                                    </div>
                                    <p class="text-secondary small mb-0 lh-sm">${n.message}</p>
                                </div>
                                ${unreadDot}
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                document.getElementById('notificationsList').innerHTML = '<p class="text-center text-danger fw-bold py-5">حدث خطأ في تحميل البيانات</p>';
            }
        }

        async function markAsRead(id, element) {
            element.classList.remove('border-start', 'border-4', 'border-warning');
            const dot = element.querySelector('.position-absolute');
            if (dot) dot.remove();

            await fetchWithRetry(`${window.API_URL}/api/notifications/${id}/read`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            }).catch(() => {});
        }

        // ✅ دالة تحديد الكل كمقروء — كابتن
        async function markAllAsRead() {
            const btn = document.getElementById('markAllReadBtn');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>جاري...'; }
            try {
                await fetchWithRetry(`${window.API_URL}/api/notifications/mark-all-read`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                document.querySelectorAll('.border-start.border-warning').forEach(el => {
                    el.classList.remove('border-start', 'border-4', 'border-warning');
                });
                document.querySelectorAll('.position-absolute.bg-danger.rounded-circle').forEach(dot => dot.remove());
                if (window.renderUnreadBadge) window.renderUnreadBadge(0);
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check2-all me-1"></i>تم التحديد ✔'; }
                setTimeout(() => {
                    if (btn) btn.innerHTML = '<i class="bi bi-check2-all me-1"></i>تحديد الكل كمقروء';
                }, 2000);
            } catch (err) {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check2-all me-1"></i>تحديد الكل كمقروء'; }
            }
        }
    </script>

    <!-- WhatsApp Subscription Modal -->

    <!-- Auth Helper & App Core -->

    <script src="vendor/socket.io/socket.io.min.js"></script>

    <script src="js/native-notifications.js?v=0a4fcfda"></script>
</body>

</html>
