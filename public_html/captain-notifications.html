<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الإشعارات | كابتن وجيز</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.4">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css?v=baddc97b">
    <link rel="stylesheet" href="css/enhanced-styles.css?v=3dc00ed1">
    <link rel="stylesheet" href="css/dark-mode.css?v=c977d598">
    <!-- نظام تصميم الكابتن — يعرّف .captain-nav (شريط التنقل السفلي).
         بعد dark-mode.css عمداً كي تفوز قواعده الليلية. -->
    <link rel="stylesheet" href="css/captain-ui.css?v=29690076">
    <!-- شاشة الإشعارات الموحّدة — بعد dark-mode.css عمداً (انظر رأس الملف) -->
    <link rel="stylesheet" href="css/notifications-ui.css?v=e0ebecde">
    <script src="js/config.js?v=6706269c"></script>
    <script src="js/fetch-retry.js?v=069d96ba"></script>
    <script src="js/theme-manager.js?v=286ae5ac"></script>
    <script src="js/auth-helper.js?v=bf5c4a16"></script>
    <script src="js/safe-area.js?v=176d6050"></script>
    <style>
        body { background: var(--wn-bg) !important; }
    </style>
</head>

<body class="bg-light">

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-1">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <div class="header-brand-badge">
                        <i class="bi bi-bell-fill text-white" style="font-size: 1.4rem;"></i>
                    </div>
                    <div>
                        <h2 class="h5 fw-bold mb-0 text-white">إشعارات الكابتن</h2>
                        <div class="live-status-pill">
                            <span class="pulse-dot"></span>
                            <span id="headerSubtitle">كل جديدك وتحديثاتك هنا</span>
                        </div>
                    </div>
                </div>
                <img src="logo-mark-white.png" alt="وجيز" style="height:42px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.15));">
            </div>
        </div>
    </div>

    <div class="wn-wrap">
        <div class="wn-toolbar" id="wnToolbar" hidden>
            <button type="button" class="wn-chip" id="chipAll" aria-pressed="true" data-filter="all">الكل</button>
            <button type="button" class="wn-chip" id="chipUnread" aria-pressed="false" data-filter="unread">
                غير المقروء<span class="wn-chip-count" id="unreadCount">0</span>
            </button>
            <button type="button" class="wn-mark-all" id="markAllReadBtn">
                <i class="bi bi-check2-all me-1"></i>تحديد الكل كمقروء
            </button>
        </div>

        <div id="notificationsList"></div>
    </div>

    <div class="wn-toast" id="wnToast" role="status" aria-live="polite"></div>

    <!-- Bottom Navigation -->
    <nav class="captain-nav">
        <a href="captain-dashboard.html">
            <i class="bi bi-house-door-fill"></i><span>الرئيسية</span>
        </a>
        <a href="captain-orders.html">
            <i class="bi bi-bicycle"></i><span>الطلبات</span>
        </a>
        <a href="captain-missions.html">
            <i class="bi bi-card-checklist"></i><span>مهامي</span>
        </a>
        <a href="captain-notifications.html" class="active">
            <i class="bi bi-bell-fill"></i><span>الإشعارات</span>
        </a>
        <a href="captain-profile.html">
            <i class="bi bi-person-circle"></i><span>حسابي</span>
        </a>
    </nav>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/notifications-ui.js?v=dd0a61e9"></script>
    <script>
        WajeezNotifications.init({
            loginUrl: 'captain-login.html',
            guestTitle: 'سجّل الدخول لعرض إشعاراتك',
            guestText: 'ستصلك هنا الطلبات الجديدة وتنبيهات المحفظة والمهام.',
            emptyTitle: 'لا توجد إشعارات بعد',
            emptyText: 'سنخبرك هنا فور توفّر طلب جديد أو تحديث على مهمتك.'
        });
    </script>
    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="notification-toast.js"></script>
    <!-- type="module" كبقية الصفحات: كملفَّين عاديَّين تتسرّب كل تعريفاتهما
         العليا إلى النطاق العام فتصطدم بأسماء notifications-ui.js -->
    <script type="module" src="js/app-core.js?v=eabc83fd"></script>
    <script type="module" src="js/native-notifications.js?v=c076999e"></script>
</body>

</html>
