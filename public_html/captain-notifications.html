<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات | كابتن وصل-لي</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css">
    <script src="js/config.js"></script>
</head>

<body class="pb-5 mb-5 bg-light">

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white rounded-circle p-2 shadow-sm">
                        <i class="bi bi-bell-fill text-warning fs-4"></i>
                    </div>
                    <div>
                        <h2 class="h5 fw-bold mb-0 text-white">الإشعارات</h2>
                        <p class="small text-white-50 mb-0">آخر التنبيهات والتحديثات</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notifications Container -->
    <div class="container" style="margin-top: -30px;">
        <div id="notificationsList" class="d-flex flex-column gap-2">
            <div class="text-center py-5">
                <div class="spinner-border text-light" role="status"></div>
                <p class="mt-2 text-white fw-bold">جاري تحميل الإشعارات...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="mobile-nav-glass">
        <a href="captain-dashboard.html" class="nav-item-link">
            <i class="bi bi-house-door-fill"></i>
        </a>
        <a href="captain-orders.html" class="nav-item-link">
            <i class="bi bi-bicycle"></i>
        </a>
        <a href="captain-missions.html" class="nav-item-link">
            <i class="bi bi-card-checklist"></i>
        </a>
        <a href="captain-notifications.html" class="nav-item-link active">
            <i class="bi bi-bell-fill"></i>
        </a>
        <a href="captain-profile.html" class="nav-item-link">
            <i class="bi bi-person-circle"></i>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ✅ Fix: Secure Auth Check (DOM Ready)
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'captain-login.html';
                return;
            }

            loadNotifications(token);
        });

        async function loadNotifications(token) {
            try {
                const res = await fetch(`${API_URL}/api/notifications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    window.location.href = 'captain-login.html';
                    return;
                }

                const notifications = await res.json();
                const list = document.getElementById('notificationsList');
                list.innerHTML = '';

                if (!notifications || notifications.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-bell-slash fs-1 text-secondary opacity-50 mb-3"></i>
                            <p class="text-muted fw-bold">لا توجد إشعارات جديدة</p>
                        </div>`;
                    return;
                }

                notifications.forEach(n => {
                    let icon = 'bi-info-circle-fill';
                    let iconColor = 'text-primary';
                    let bgIcon = 'bg-primary';

                    if (n.title.includes('طلب جديد')) {
                        icon = 'bi-box-seam-fill';
                        iconColor = 'text-success';
                        bgIcon = 'bg-success';
                    }
                    if (n.title.includes('إلغاء')) {
                        icon = 'bi-x-circle-fill';
                        iconColor = 'text-danger';
                        bgIcon = 'bg-danger';
                    }
                    if (n.title.includes('رصيد') || n.title.includes('محفظة')) {
                        icon = 'bi-wallet-fill';
                        iconColor = 'text-warning';
                        bgIcon = 'bg-warning';
                    }

                    const unreadClass = !n.isRead ? 'border-primary' : '';
                    const unreadDot = !n.isRead ? '<span class="position-absolute top-0 end-0 p-1 bg-danger border border-white rounded-circle mt-2 me-2"></span>' : '';

                    list.innerHTML += `
                        <div class="card glass-card border-0 card-hover overflow-hidden position-relative mb-2 ${unreadClass ? 'border-start border-4' : ''}" onclick="markAsRead('${n._id}', this)">
                            <div class="card-body p-3 d-flex gap-3 align-items-start">
                                <div class="rounded-circle ${bgIcon} bg-opacity-10 p-2 ${iconColor} flex-shrink-0">
                                    <i class="bi ${icon} fs-4"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-start mb-1">
                                        <h6 class="fw-bold text-dark mb-0">${n.title}</h6>
                                        <small class="text-muted" style="font-size: 0.75rem;">
                                            ${new Date(n.createdAt).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}
                                        </small>
                                    </div>
                                    <p class="text-secondary small mb-0 lh-sm">${n.message}</p>
                                </div>
                                ${unreadDot}
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                document.getElementById('notificationsList').innerHTML = '<p class="text-center text-danger fw-bold py-5">حدث خطأ في تحميل البيانات</p>';
            }
        }

        async function markAsRead(id, element) {
            // Remove unread styles immediately for better UX
            element.classList.remove('border-start', 'border-4', 'border-primary');
            const dot = element.querySelector('.position-absolute');
            if (dot) dot.remove();

            await fetch(`/api/notifications/${id}/read`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
        }
    </script>

    <!-- WhatsApp Subscription Modal -->

    <!-- Auth Helper & App Core -->
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
