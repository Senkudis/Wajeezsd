    <style>
        :root {
            --primary-color: #0a8754;
            --bg-color: #f4f6f8;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            padding-bottom: 90px;
        }

        /* --- Strict English Numbers --- */
        input[type="tel"],
        input[type="number"],
        .english-num,
        .price-input {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            direction: ltr !important;
            unicode-bidi: bidi-override !important;
            text-align: right;
        }

        .price-input {
            text-align: center !important;
        }

        /* --- Enhanced Header --- */
        .app-header {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(10, 135, 84, 0.1);
            backdrop-filter: blur(10px);
        }

        /* Menu Toggle Button */
        .menu-toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(10, 135, 84, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .menu-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(10, 135, 84, 0.4);
        }

        .menu-toggle-btn:active {
            transform: scale(0.95);
        }

        /* Logo Container */
        .logo-container {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .app-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            box-shadow: 0 4px 12px rgba(10, 135, 84, 0.2);
            object-fit: cover;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .app-logo:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 6px 16px rgba(10, 135, 84, 0.3);
        }

        /* Logo Pulse Effect */
        .logo-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary-color);
            opacity: 0.3;
            animation: pulse 2s infinite;
            z-index: 1;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0;
            }
        }

        /* Header Text */
        .header-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .greeting-text {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: -0.3px;
        }

        .subtitle-text {
            font-size: 0.75rem;
            color: #6c757d;
            font-weight: 500;
        }

        /* Notification Button */
        .notification-btn {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #495057;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .notification-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(10, 135, 84, 0.3);
        }

        .notification-btn:active {
            transform: scale(0.95);
        }

        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 10px;
            height: 10px;
            background: #dc3545;
            border: 2px solid white;
            border-radius: 50%;
            animation: badge-pulse 1.5s infinite;
        }

        @keyframes badge-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        /* --- Cards & Inputs --- */
        .section-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
            margin-bottom: 15px;
            border: 1px solid #eee;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #555;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-control {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            background-color: white;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(10, 135, 84, 0.1);
        }

        .map-btn {
            background: #e8f5e9;
            color: var(--primary-color);
            border: 1px dashed var(--primary-color);
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .map-btn:active {
            transform: scale(0.98);
        }

        /* --- Map Modal --- */
        #mapModal .modal-body {
            padding: 0;
            height: 60vh;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .modal-locate-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        /* --- Pricing Section --- */
        .price-input {
            background: #f0fdf4 !important;
            border: 2px solid #0a8754 !important;
            color: #0a8754 !important;
            font-weight: 800 !important;
            font-size: 1.3rem !important;
        }

        /* --- Submit Button --- */
        .btn-submit {
            background: #0a8754;
            color: white;
            font-weight: 800;
            padding: 16px;
            border-radius: 50px;
            width: 100%;
            border: none;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(10, 135, 84, 0.3);
            transition: 0.3s;
        }

        .btn-submit:disabled {
            background: #ccc;
            box-shadow: none;
        }
    </style>

        </div>

    <script>
        // Update greeting with user name if logged in
        document.addEventListener('DOMContentLoaded', () => {
            const userName = localStorage.getItem('userName');
            if (userName) {
                document.getElementById('greeting').innerHTML = `مرحباً ${userName} 👋`;
            }
        });
    </script>

    <div class="container">
        <input type="hidden" id="pickup-lat">
        <input type="hidden" id="pickup-lng">
        <input type="hidden" id="dropoff-lat">
        <input type="hidden" id="dropoff-lng">

        <div class="section-card route-card px-3 pt-4 pb-3">
            <div class="route-container">
                <div class="route-timeline">
                    <div class="timeline-dot pickup-dot"></div>
                    <div class="timeline-line"></div>
                    <div class="timeline-dot dropoff-dot"></div>
                </div>

                <div class="route-inputs w-100">

                    <div class="mb-4 position-relative">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="text-muted small fw-bold">من وين؟ (موقع الاستلام)</label>
                            <button class="btn btn-sm btn-outline-success border-0 py-0 px-2 fw-bold"
                                onclick="openMapModal('pickup')">
                                <i class="bi bi-map-fill me-1"></i>تحديد من الخريطة
                            </button>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" class="form-control location-input" id="pickup-addr"
                                placeholder="الموقع غير محدد (أو اكتب العنوان هنا)">
                            <span class="input-icon text-success"><i class="bi bi-geo-alt-fill"></i></span>
                        </div>
                        <div class="row g-2 mt-1">
                            <div class="col-7">
                                <input type="text" id="pickup-name" class="form-control form-control-sm bg-white"
                                    placeholder="اسم المرسل / المحل">
                            </div>
                            <div class="col-5">
                                <input type="tel" id="pickup-phone"
                                    class="form-control form-control-sm bg-white english-num" placeholder="رقم الهاتف">
                            </div>
                        </div>
                    </div>

                    <div class="mb-0 position-relative">
                        <div class="d-flex justify-content-between align-items-center mb-1">

                            <button class="btn btn-sm btn-outline-danger border-0 py-0 px-2 fw-bold"
                                onclick="openMapModal('dropoff')">
                                <i class="bi bi-map-fill me-1"></i>تحديد من الخريطة
                            </button>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" class="form-control location-input" id="dropoff-addr"
                                placeholder="الوجهة غير محدد (أو اكتب العنوان هنا)">
                            <span class="input-icon text-danger"><i class="bi bi-flag-fill"></i></span>
                        </div>
                        <div class="row g-2 mt-1">
                            <div class="col-7">
                                <input type="text" id="dropoff-name" class="form-control form-control-sm bg-white"
                                    placeholder="اسم المستلم">
                            </div>
                            <div class="col-5">
                                <input type="tel" id="dropoff-phone"
                                    class="form-control form-control-sm bg-white english-num" placeholder="رقم الهاتف">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">
                <i class="bi bi-box-seam-fill"></i> تفاصيل الطلب
            </div>
            <textarea id="details" class="form-control mb-3" rows="2"
                placeholder="وصف للأغراض (مثلاً: كيس ملابس، مستندات...)" maxlength="500"></textarea>

            <label class="btn btn-outline-secondary w-100 border-dashed py-2 rounded-3" for="parcel-image">
                <i class="bi bi-camera me-2"></i> صورة للطرد (اختياري)
            </label>
            <input type="file" id="parcel-image" class="d-none" accept="image/*" onchange="previewImage(this)">

            <div id="img-preview" class="mt-2 d-none position-relative">
                <img src="" class="rounded-3 object-fit-cover w-100" style="height: 120px;">
                <button class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1"
                    onclick="clearImage()">×</button>
            </div>
        </div>

        <div class="section-card bg-light border-0">
            <label class="section-title text-success mb-2">
                <i class="bi bi-cash-stack"></i> تقدير السعر
            </label>

            <select id="distance-type" class="form-select mb-3 border-success text-success fw-bold"

                <option value="">كم تبعد المسافة تقريباً؟</option>
                <option value="short">🚲 قريب (نفس الحي) - 3000 ج</option>
                <option value="medium">🛵 وسط (حي مجاور) - 6000 ج</option>
                <option value="long">🏎️ بعيد (مشوار طويل) - 10000 ج</option>
                <option value="custom">✍️ سعر خاص (أدخل يدوياً)</option>
            </select>

            <div class="input-group mb-3">
                <span class="input-group-text bg-white border-success border-end-0 text-success fw-bold">ج.س</span>
                <input type="number" id="price" class="form-control price-input" lang="en" dir="ltr" placeholder="0">
            </div>

            <button id="submit-btn" class="btn-submit" onclick="createOrder()">
                <i class="bi bi-rocket-takeoff-fill me-2"></i> اطلب الكابتن الآن
            </button>
        </div>

    </div>

    <div class="modal fade" id="locationPickerModal" tabindex="-1" aria-hidden="true">

                </div>
                <div class="modal-footer border-0 p-3"

            </div>
        </div>

    <script>
        // Update Menu User State
        function updateMenuState() {
            const uName = localStorage.getItem('userName');
            if (uName) {
                document.getElementById('menu-username').innerText = uName;
                document.getElementById('menu-login-btn').classList.add('d-none');
                document.getElementById('menu-logout-btn').classList.remove('d-none');
                // Also update greeting if element exists
                const greetingEl = document.getElementById('greeting');
                if (greetingEl) greetingEl.innerHTML = `مرحباً ${uName} 👋`;
            }
        }

        document.addEventListener('DOMContentLoaded', updateMenuState);
        // Force update when showing page (fixes back button issues)
        window.addEventListener('pageshow', updateMenuState);
    </script>

    <script>
        // Fix gray map issue when modal opens
        document.getElementById('locationPickerModal').addEventListener('shown.bs.modal', function () {
            // Trigger window resize event
            window.dispatchEvent(new Event('resize'));

            // Force Leaflet to recalculate map size
            // The map variable might be called 'map' or 'pickerMap' depending on your home.js implementation
            if (typeof map !== 'undefined' && map) {
                setTimeout(() => map.invalidateSize(), 100);
            }
            if (typeof pickerMap !== 'undefined' && pickerMap) {
                setTimeout(() => pickerMap.invalidateSize(), 100);
            }
        });
    </script>
