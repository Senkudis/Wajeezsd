    <!-- ✅ Role-Based Session Redirect: يعمل قبل أي شيء آخر -->
    <script>
        (function () {
            try {
                const token = localStorage.getItem('token');
                if (!token) return; // زائر — اعرض الصفحة الطبيعية

                // تحقق من انتهاء الـ Token
                const parts = token.split('.');
                if (parts.length === 3) {
                    const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                    if (payload.exp && payload.exp < Date.now() / 1000) {
                        // Token منتهي — احذفه واعرض الصفحة
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        return;
                    }
                }

                const userStr = localStorage.getItem('user');
                if (!userStr) return;
                const user = JSON.parse(userStr);
                const role = (user.role || '').toLowerCase();

                if (role === 'captain') {
                    window.location.replace('captain-dashboard.html');
                } else if (role === 'admin') {
                    window.location.replace('admin.html');
                }
                // العميل العادي يبقى في index.html
            } catch (e) {
                // أي خطأ → اعرض الصفحة الطبيعية
            }
        })();
    </script>

        /* --- Map Modal --- */

        }

            width: 100%;
            height: 100%;

        .center-marker-overlay {
            position: absolute;
            top: 50%;
            left: 50%;

            z-index: 900;
            pointer-events: none;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));

        .modal-locate-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        /* --- Premium Loading Splash Screen --- */
        .app-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, #064e32 0%, #0a8754 40%, #0d9d63 70%, #065f3a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* Subtle animated background pattern */
        .app-splash::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(255, 255, 255, 0.04) 0%, transparent 50%);
            animation: splash-bg-shift 6s ease-in-out infinite;
        }

        .app-splash.loaded {
            opacity: 0;
            transform: scale(1.05);
            visibility: hidden;
            pointer-events: none;
        }

        /* Glass card behind logo */
        .splash-logo-card {
            position: relative;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 32px 40px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2), 0 0 80px rgba(10, 135, 84, 0.15);
            animation: splash-card-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        .splash-logo {
            width: 180px;
            height: auto;
            filter: drop-shadow(0 4px 20px rgba(255, 255, 255, 0.2));
            animation: splash-logo-glow 3s ease-in-out infinite;
        }

        .splash-text {
            color: white;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            margin-top: 28px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
            opacity: 0;
            animation: splash-text-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .splash-subtitle {
            color: rgba(255, 255, 255, 0.75);
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 6px;
            opacity: 0;
            animation: splash-text-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        /* Progress bar */
        .splash-progress {
            width: 160px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            margin-top: 32px;
            overflow: hidden;
            opacity: 0;
            animation: splash-text-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
        }

        .splash-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.5));
            border-radius: 10px;
            animation: splash-progress-fill 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
        }

        @keyframes splash-card-in {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes splash-text-in {
            to {
                opacity: 1;
            }
        }

        @keyframes splash-logo-glow {

            0%,
            100% {
                filter: drop-shadow(0 4px 20px rgba(255, 255, 255, 0.2));
            }

            50% {
                filter: drop-shadow(0 4px 30px rgba(255, 255, 255, 0.35));
            }
        }

        @keyframes splash-progress-fill {
            0% {
                width: 0%;
            }

            50% {
                width: 70%;
            }

            100% {
                width: 100%;
            }
        }

        @keyframes splash-bg-shift {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(2%, 1%) rotate(1deg);
            }
        }

        /* --- Parcel Image Upload Button --- */
        .parcel-upload-btn {

            border-radius: 14px;

            font-size: 0.9rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .parcel-upload-btn i {
            font-size: 1.4rem;
            color: var(--primary-color);
        }

        .parcel-upload-btn:hover {
            border-color: var(--primary-color);
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2c3e50;
        }

        /* Captain marker pulse animation on map */
        @keyframes captain-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(10, 135, 84, 0.4);
            }

            70% {
                box-shadow: 0 0 0 12px rgba(10, 135, 84, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(10, 135, 84, 0);
            }
        }

        .captain-map-marker {
            background: none !important;
            border: none !important;
        }

    <script>
        // Update greeting with user name if logged in
        document.addEventListener('DOMContentLoaded', () => {
            const userName = localStorage.getItem('userName');
            if (userName) {
                document.getElementById('greeting').innerHTML = `مرحباً ${userName}`;
            }
            // Dismiss splash screen & mark as shown
            const splash = document.getElementById('appSplash');
            if (splash) {
                setTimeout(() => {
                    splash.classList.add('loaded');
                    sessionStorage.setItem('splashShown', '1');
                }, 1000);
            }
        });
    </script>

    <script>
        // Update Menu User State
        function updateMenuState() {
            const uName = localStorage.getItem('userName');
            if (uName) {
                document.getElementById('menu-username').innerText = uName;
                document.getElementById('menu-login-btn').classList.add('d-none');
                document.getElementById('menu-logout-btn').classList.remove('d-none');
                // Also update greeting if element exists
                const greetingEl = document.getElementById('greeting');
                if (greetingEl) greetingEl.innerHTML = `مرحباً ${uName} `;
            }
        }

        // ✅ دالة تسجيل الخروج
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('userId');
            localStorage.removeItem('userName');
            localStorage.removeItem('captainName');
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminName');
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', updateMenuState);
        // Force update when showing page (fixes back button issues)
        window.addEventListener('pageshow', updateMenuState);
    </script>

    <script>
        // Show/hide confirm button overlay with modal
        const locModal = document.getElementById('locationPickerModal');
        const confirmOverlay = document.getElementById('confirmLocationOverlay');

        locModal.addEventListener('shown.bs.modal', function () {
            confirmOverlay.style.display = 'block';
            // Fix gray map issue
            window.dispatchEvent(new Event('resize'));
            if (typeof map !== 'undefined' && map && map.invalidateSize) {
                setTimeout(() => map.invalidateSize(), 100);
                setTimeout(() => map.invalidateSize(), 500);
            }
            // ✅ Start captain marker auto-refresh
            if (typeof startCaptainRefresh === 'function') startCaptainRefresh();
        });

        locModal.addEventListener('hide.bs.modal', function () {
            confirmOverlay.style.display = 'none';
            // ✅ Stop captain marker refresh
            if (typeof stopCaptainRefresh === 'function') stopCaptainRefresh();
        });
    </script>
