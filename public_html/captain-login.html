    <!-- ✅ إذا الكابتن مسجّل بالفعل، خذه مباشرةً للـ dashboard -->
    <script>
        (function () {
            try {
                const token = localStorage.getItem('token');
                if (!token) return;
                const parts = token.split('.');
                if (parts.length === 3) {
                    const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                    if (payload.exp && payload.exp < Date.now() / 1000) return; // منتهي
                }
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                if (user.role === 'captain') window.location.replace('captain-dashboard.html');
            } catch (e) { }
        })();
    </script>

<body class="bg-light">

    <div class="auth-container">
        <div class="auth-box glass-card card-hover p-4 p-md-5">
            <div class="text-center mb-4">
                <a href="index.html" class="d-inline-block transition-transform hover-scale">
                    <img src="logo-mark-white.png" alt="شعار وجيز" height="80"
                        style="object-fit:contain; background:var(--primary); border-radius:24px; padding:12px; display:block; box-shadow: 0 6px 20px rgba(4,85,58,0.25);">
                </a>
            </div>

            <h2 class="text-center mb-4 fw-bold text-dark">
                <i class="bi bi-scooter text-success ms-2"></i>
                دخول الكابتن
            </h2>

            <div id="alert-box" class="alert d-none align-items-center mb-4" role="alert"></div>

            <div class="mb-3 text-end">
                <label for="email" class="form-label fw-bold small text-muted">
                    <i class="bi bi-envelope-fill text-primary ms-1"></i> البريد الإلكتروني
                </label>
                <input type="email" id="email" class="form-control form-control-lg" placeholder="name@example.com"
                    dir="ltr">
            </div>

            <div class="mb-4 text-end">
                <label for="password" class="form-label fw-bold small text-muted">
                    <i class="bi bi-lock-fill text-primary ms-1"></i> كلمة المرور
                </label>
                <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••">
            </div>

            <button class="btn btn-primary w-100 py-3 mb-3 fw-bold shadow-sm" onclick="login()">
                <i class="bi bi-box-arrow-in-left ms-2"></i> تسجيل الدخول
            </button>

            <div class="text-center mt-4 border-top pt-3">
                <a href="index.html" class="text-secondary small text-decoration-none hover-primary">
                    <i class="bi bi-house-door-fill ms-1"></i> العودة للرئيسية
                </a>
            </div>
        </div>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        function showAlert(msg, type) {
            const box = document.getElementById('alert-box');
            box.className = 'alert d-flex align-items-start gap-2 mb-3';
            box.classList.remove('d-none');
            box.classList.add('d-flex');

            if (type === 'success') {
                box.classList.add('alert-success');
                box.innerHTML = `<i class="bi bi-check-circle-fill fs-5 me-2 ms-2"></i> <div>${msg}</div>`;
            } else {
                box.classList.add('alert-danger');
                box.innerHTML = `<i class="bi bi-exclamation-triangle-fill fs-5 me-2 ms-2"></i> <div>${msg}</div>`;
            }
        }

        // — عداد تنازلي عند حظر Rate Limit —
        let _countdownTimer = null;
        function startRateLimitCountdown(seconds, btn, originalBtnText) {
            if (_countdownTimer) clearInterval(_countdownTimer);
            let remaining = seconds;

            const showAlert429 = (s) => {
                const m = Math.floor(s / 60);
                const sec = s % 60;
                const timeStr = m > 0
                    ? `${m}:${String(sec).padStart(2, '0')} دقيقة`
                    : `${sec} ثانية`;
                showAlert(`⛔ تجاوزت عدد المحاولات. تستطيع المحاولة مجدداً خلال: <strong>${timeStr}</strong>`, 'error');
                btn.innerHTML = `⏳ انتظر ${timeStr}`;
                btn.disabled = true;
            };

            showAlert429(remaining);
            _countdownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(_countdownTimer);
                    _countdownTimer = null;
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                    showAlert('✅ يمكنك المحاولة الآن', 'success');
                } else {
                    showAlert429(remaining);
                }
            }, 1000);
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('button[onclick="login()"]');

            document.getElementById('alert-box').classList.add('d-none');

            if (!email || !password) {
                showAlert("يرجى إدخال البريد الإلكتروني وكلمة المرور", "error");
                return;
            }

            // Loading state
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></span> جاري التحقق...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    if (data.user.role === 'captain') {
                        showAlert("تم تسجيل الدخول بنجاح! جاري التوجيه...", "success");

                        // 🌍 Sync city from server (admin is the source of truth)
                        if (typeof CityService !== 'undefined' && data.user.city) CityService.setCity(data.user.city);

                        // استخدام المساعد الموحد
                        window.Auth.setAuth(data.token, data.user);

                        // استخدام replace بدلاً من href لمنع الرجوع لصفحة تسجيل الدخول
                        setTimeout(() => {
                            window.location.replace('captain-dashboard.html');
                        }, 800);
                    } else {
                        showAlert("عذراً، هذا الحساب ليس مسجلاً ككابتن", "error");
                        btn.innerHTML = originalBtnText;
                        btn.disabled = false;
                    }
                } else {
                    if (res.status === 429 && data.retryAfter) {
                        startRateLimitCountdown(data.retryAfter, btn, originalBtnText);
                    } else {
                        showAlert(data.message || 'بيانات الدخول غير صحيحة', "error");
                        btn.innerHTML = originalBtnText;
                        btn.disabled = false;
                    }
                }
            } catch (err) {
                console.error(err);
                // عنوان الـ API لا يعني الكابتن ولا يساعده — الرسالة له، والتفصيل للسجل
                showAlert('تعذّر الاتصال بالخادم. تحقّق من الإنترنت وحاول مجدداً.', "error");
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }

        // ⚠️ Enter كان يستدعي login() دائماً — حتى أثناء عدّ حظر المحاولات
        // التنازلي، فيُستهلك الحدّ من جديد والزر معطّل أمام عين الكابتن.
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            const btn = document.querySelector('button[onclick="login()"]');
            if (btn && btn.disabled) return;
            login();
        });
    </script>
