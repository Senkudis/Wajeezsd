<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>دخول العملاء | وصل-لي</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a8754">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* Unused Animation Styles Removed */
    </style>
    <link rel="stylesheet" href="css/mobile-overrides.css">
    <link rel="stylesheet" href="css/enhanced-styles.css">

    <script src="js/config.js"></script>
</head>

<body class="bg-light">

    <div class="auth-container">
        <div class="auth-box glass-card card-hover p-4 p-md-5">
            <div class="text-center mb-4">
                <a href="index.html" class="d-inline-block transition-transform hover-scale">
                    <img src="logo-transparent.png" alt="شعار وصل-لي" height="70" class="app-logo"
                        style="object-fit:contain;">
                </a>
            </div>

            <h2 class="text-center mb-4 fw-bold text-dark">
                <i class="bi bi-person-check-fill text-primary ms-2"></i>
                أهلاً بك!
            </h2>

            <div id="alert-box" class="alert d-none align-items-center mb-4" role="alert"></div>

            <div class="mb-3 text-end">
                <label for="email" class="form-label fw-bold small text-muted">
                    <i class="bi bi-envelope-fill text-primary ms-1"></i> البريد الإلكتروني
                </label>
                <input type="email" id="email" class="form-control form-control-lg" placeholder="name@example.com"
                    dir="ltr">
            </div>

            <div class="mb-4 text-end">
                <label for="password" class="form-label fw-bold small text-muted">
                    <i class="bi bi-lock-fill text-primary ms-1"></i> كلمة المرور
                </label>
                <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••">
            </div>

            <button class="btn btn-primary w-100 py-3 mb-3 fw-bold shadow-sm" onclick="login()">
                <i class="bi bi-box-arrow-in-right ms-2"></i> تسجيل الدخول
            </button>

            <div class="text-center mt-4">

                <div class="mb-4">
                    <p class="text-muted mb-2">ليس لديك حساب؟</p>
                    <a href="client-register.html" class="btn btn-outline-primary w-100 py-2 fw-bold">
                        <i class="bi bi-person-plus-fill me-2"></i> إنشاء حساب جديد
                    </a>
                </div>

                <div class="border-top pt-3 mt-3">
                    <a href="index.html" class="text-secondary small text-decoration-none">
                        <i class="bi bi-house-door-fill ms-1"></i> العودة للرئيسية
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // دالة لإظهار التنبيهات الملونة
        function showAlert(msg, type) {
            const box = document.getElementById('alert-box');
            box.classList.remove('d-none', 'alert-success', 'alert-danger');
            box.classList.add('d-flex');

            if (type === 'success') {
                box.classList.add('alert-success');
                box.innerHTML = `<i class="bi bi-check-circle-fill fs-5 me-2 ms-2"></i> <div>${msg}</div>`;
            } else {
                box.classList.add('alert-danger');
                box.innerHTML = `<i class="bi bi-exclamation-triangle-fill fs-5 me-2 ms-2"></i> <div>${msg}</div>`;
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('button[onclick="login()"]');

            document.getElementById('alert-box').classList.add('d-none');

            if (!email || !password) {
                showAlert("يرجى ملء جميع الحقول", "error");
                return;
            }

            // Loading state
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></span> جاري التحقق...';
            btn.disabled = true;

            console.log(`Attempting to connect to: ${API_URL}`);

            try {
                // ✅ استخدام الرابط مع /api
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    if (data.user.role === 'client' || data.user.role === 'customer') {
                        showAlert("تم تسجيل الدخول بنجاح!", "success");

                        console.log("📥 Login Response Data:", data);

                        if (!data.user.phone) {
                            console.error("⚠️ تحذير هام: كائن المستخدم لا يحتوي على رقم هاتف.");
                        }

                        // استخدام المساعد الموحد للتخزين
                        window.Auth.setAuth(data.token, data.user);

                        // استخدام replace بدلاً من href لمنع الرجوع لصفحة تسجيل الدخول
                        setTimeout(() => {
                            window.location.replace('client-my-orders.html');
                        }, 800);
                    } else {
                        showAlert("عذراً، هذا الحساب ليس حساب عميل", "error");
                        btn.innerHTML = originalBtnText;
                        btn.disabled = false;
                    }
                } else {
                    showAlert(data.message || 'بيانات الدخول غير صحيحة', "error");
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                showAlert(`خطأ في الاتصال: ${err.message}\n${API_URL}`, "error");
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>

    <script src="/sw-register.js"></script>
    <script src="/install-prompt.js"></script>



    <script src="js/theme-manager.js"></script>
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
