<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الإشعارات | وجيز</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.4">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css?v=e9a74842">
    <link rel="stylesheet" href="css/enhanced-styles.css?v=ce667195">
    <link rel="stylesheet" href="css/dark-mode.css?v=432e909e">
    <link rel="stylesheet" href="css/tour.css?v=92063527">
    <link rel="stylesheet" href="css/splash.css?v=3e93bd55">
    <!-- شاشة الإشعارات الموحّدة — بعد dark-mode.css عمداً (انظر رأس الملف) -->
    <link rel="stylesheet" href="css/notifications-ui.css?v=ef58ac3d">
    <script src="js/console-cleaner.js?v=d257b4ad"></script>
    <script src="js/config.js?v=21463b97"></script>
    <script src="js/fetch-retry.js?v=dfd06a9d"></script>
    <script src="js/auth-helper.js?v=c97361b3"></script>
    <script src="js/safe-area.js?v=8b338400"></script>
    <script src="js/ui-states.js?v=fbce8d4e"></script>
    <style>
        body { background: var(--wn-bg) !important; }
    </style>
</head>

<body class="bg-light">

    <!-- Loading Splash Screen (only on first app open) -->
    <script>
        if (!sessionStorage.getItem('splashShown')) {
            document.write('<div class="app-splash" id="appSplash">' +
                '<div class="splash-logo-card">' +
                '<img src="logo-transparent.png" alt="وجيز" class="splash-logo app-logo">' +
                '</div>' +
                '<div class="splash-text">وجيز</div>' +
                '<div class="splash-subtitle">خدمة التوصيل الذكية</div>' +
                '<div class="splash-progress"><div class="splash-progress-bar"></div></div>' +
                '</div>');
        }
    </script>
    <script>window.addEventListener('DOMContentLoaded', () => { const s = document.getElementById('appSplash'); if (s) { setTimeout(() => { s.classList.add('loaded'); sessionStorage.setItem('splashShown', '1') }, 800) } });</script>

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-1">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <div class="header-brand-badge">
                        <i class="bi bi-bell-fill text-white" style="font-size: 1.4rem;" aria-hidden="true"></i>
                    </div>
                    <div>
                        <h2 class="h5 fw-bold mb-0 text-white">الإشعارات</h2>
                        <div class="live-status-pill">
                            <span class="pulse-dot" aria-hidden="true"></span>
                            <span id="headerSubtitle">كل جديدك وتحديثاتك هنا</span>
                        </div>
                    </div>
                </div>
                <img src="logo-mark-white.png" alt="وجيز" style="height:42px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.15));">
            </div>
        </div>
    </div>

    <div class="wn-wrap">
        <div class="wn-toolbar" id="wnToolbar" role="group" aria-label="تصفية الإشعارات" hidden>
            <button type="button" class="wn-chip" id="chipAll" aria-pressed="true" data-filter="all">الكل</button>
            <button type="button" class="wn-chip" id="chipUnread" aria-pressed="false" data-filter="unread">
                غير المقروء<span class="wn-chip-count" id="unreadCount" aria-label="لا إشعارات غير مقروءة">0</span>
            </button>
            <button type="button" class="wn-mark-all" id="markAllReadBtn">
                <i class="bi bi-check2-all me-1" aria-hidden="true"></i>تحديد الكل كمقروء
            </button>
        </div>

        <div id="notificationsList" role="region" aria-label="الإشعارات" aria-live="polite"></div>
    </div>

    <div class="wn-toast" id="wnToast" role="status" aria-live="polite"></div>

    <!-- Bottom Navigation: Built immediately to avoid flash -->
    <div id="mobile-nav-container">
        <nav class="mobile-nav-glass" aria-label="التنقل الرئيسي">
            <a href="index.html" class="nav-item-link">
                <i class="bi bi-house-door" aria-hidden="true"></i>
                <span>الرئيسية</span>
            </a>
            <a href="client-order.html" class="nav-item-link">
                <i class="bi bi-shop" aria-hidden="true"></i>
                <span>تسوق</span>
            </a>
            <a href="client-my-orders.html" class="nav-item-link">
                <i class="bi bi-box-seam" aria-hidden="true"></i>
                <span>طلباتي</span>
            </a>
            <a href="notifications.html" class="nav-item-link active" aria-current="page">
                <i class="bi bi-bell-fill" aria-hidden="true"></i>
                <span>الإشعارات</span>
            </a>
        </nav>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/notifications-ui.js?v=2546c1a5"></script>
    <script>
        WajeezNotifications.init({
            loginUrl: 'client-login.html',
            registerUrl: 'client-register.html',
            guestTitle: 'سجّل الدخول لعرض إشعاراتك',
            guestText: 'ستصلك هنا تحديثات طلباتك ورسائل الكابتن.',
            emptyTitle: 'لا توجد إشعارات بعد',
            emptyText: 'سنخبرك هنا فور قبول طلبك أو وصول رسالة من الكابتن.'
        });

        function logout() {
            if (window.Auth) { window.Auth.logout(); }
            else { localStorage.clear(); window.location.href = 'client-login.html'; }
        }
    </script>
    <!-- Auth Helper & App Core -->
    <script src="js/theme-manager.js?v=ef048761"></script>
    <script src="js/input-hardener.js?v=95c0e89c"></script>
<script src="js/app-core.js?v=f32d6356"></script>
    <script src="js/native-notifications.js?v=6426d1e7"></script>
    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="notification-toast.js"></script>
    <script src="js/tour.js?v=d6d632d6"></script>
    <script src="js/tour-pages.js?v=52558c28"></script>
</body>

</html>
