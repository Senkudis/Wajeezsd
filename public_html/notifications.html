<head>

    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.4">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css?v=b6fff3fa">
    <link rel="stylesheet" href="css/enhanced-styles.css?v=3dc00ed1">
    <link rel="stylesheet" href="css/dark-mode.css?v=c9324219">
    <link rel="stylesheet" href="css/splash.css?v=83fac690">

</head>

<body class="bg-light">

    <!-- Loading Splash Screen (only on first app open) -->
    <script>
        if (!sessionStorage.getItem('splashShown')) {
            document.write('<div class="app-splash" id="appSplash">' +
                '<div class="splash-logo-card">' +
                '<img src="logo-transparent.png" alt="وجيز" class="splash-logo app-logo">' +
                '</div>' +
                '<div class="splash-text">وجيز</div>' +
                '<div class="splash-subtitle">خدمة التوصيل الذكية</div>' +
                '<div class="splash-progress"><div class="splash-progress-bar"></div></div>' +
                '</div>');
        }
    </script>
    <script>window.addEventListener('DOMContentLoaded', () => { const s = document.getElementById('appSplash'); if (s) { setTimeout(() => { s.classList.add('loaded'); sessionStorage.setItem('splashShown', '1') }, 800) } });</script>

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-transparent border-0 shadow-none p-0">
                        <i class="bi bi-bell-fill text-white" style="font-size: 1.5rem;"></i>
                    </div>
                    <div>
                        <h2 class="h5 fw-bold mb-0 text-white">الإشعارات</h2>
                        <p class="small text-white-50 mb-0">كل جديدك هنا</p>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <!-- ✅ زر تحديد الكل كمقروء -->
                    <button id="markAllReadBtn" onclick="markAllAsRead()" class="btn btn-sm btn-light rounded-pill px-3" style="font-size:12px; font-weight:700; color:#04553A; white-space:nowrap;">
                        <i class="bi bi-check2-all me-1"></i>تحديد الكل كمقروء
                    </button>
                    <img src="logo-mark-white.png" alt="وجيز" style="height:44px;width:auto;object-fit:contain;">
                </div>
            </div>
        </div>
    </div>

    <!-- Notifications List -->
    <div class="container pt-4">
        <div id="notificationsList" class="d-flex flex-column gap-2">
            <div class="text-center py-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-2 text-muted fw-bold">جاري تحميل الإشعارات...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation: Built immediately to avoid flash -->
    <div id="mobile-nav-container">
        <nav class="mobile-nav-glass">
            <a href="index.html" class="nav-item-link">
                <i class="bi bi-house-door"></i>
                <span>الرئيسية</span>
            </a>
            <a href="client-order.html" class="nav-item-link">
                <i class="bi bi-shop"></i>
                <span>تسوق</span>
            </a>
            <a href="client-my-orders.html" class="nav-item-link">
                <i class="bi bi-box-seam"></i>
                <span>طلباتي</span>
            </a>
            <a href="notifications.html" class="nav-item-link active">
                <i class="bi bi-bell-fill"></i>
                <span>الإشعارات</span>
            </a>
        </nav>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        // ✅ Fix Bug #2: Notifications Page Authentication
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const list = document.getElementById('notificationsList');

            if (!token) {
                // User is Guest - Show Login/Register Buttons
                list.innerHTML = `
                <div class="text-center py-5" id="guest-view">
                    <div class="mb-4">
                        <i class="bi bi-bell-slash" style="font-size: 4rem; color: #dee2e6;"></i>
                    </div>
                    <h5 class="fw-bold text-dark mb-2">لا توجد إشعارات</h5>
                    <p class="text-muted mb-4">يجب عليك تسجيل الدخول لعرض إشعاراتك</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="client-login.html" class="btn btn-success rounded-pill px-4">
                            <i class="bi bi-box-arrow-in-right me-2"></i>تسجيل الدخول
                        </a>
                        <a href="client-register.html" class="btn btn-outline-success rounded-pill px-4">
                            <i class="bi bi-person-plus me-2"></i>إنشاء حساب
                        </a>
                    </div>
                </div>`;
            } else {
                // Logged in - Load Notifications handled below
                loadNotifications();
            }
        });

        async function loadNotifications(page = 1, append = false) {
            const token = window.Auth.getToken();
            const list = document.getElementById('notificationsList');
            const loadMoreId = 'btn-load-more';

            const oldBtn = document.getElementById(loadMoreId);
            if (oldBtn) oldBtn.remove();

            if (!append) {
                list.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-success" role="status"></div>
                    <p class="mt-2 text-muted fw-bold">جاري تحميل الإشعارات...</p>
                </div>`;
            }

            try {
                // 🟢 Fixed: Remove /api prefix
                const baseUrl = window.API_URL || '';
                const res = await fetchWithRetry(`${baseUrl}/api/notifications?page=${page}&limit=20`, {
                    headers: window.Auth.getAuthHeader()
                });

                const data = await res.json();
                // Handle both array (legacy) and object (paginated) responses just in case
                const notifications = Array.isArray(data) ? data : (data.notifications || []);
                const currentPage = data.currentPage || 1;
                const totalPages = data.totalPages || 1;

                if (!append) list.innerHTML = '';

                if (notifications.length === 0 && !append) {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-bell-slash fs-1 text-secondary opacity-50 mb-3"></i>
                            <p class="text-muted fw-bold">لا توجد إشعارات جديدة حالياً</p>
                        </div>`;
                    return;
                }

                notifications.forEach(n => {
                    // ✅ FIX: استخدم n.type أولاً (أدق) ثم n.title كـ fallback
                    const type = n.type || 'system';
                    let icon, iconColor, bgColor, borderColor;

                    const iconMap = {
                        'order_accepted': { icon: 'bi-bicycle', color: '#0d6efd', bg: '#e8f0fe' },
                        'order_completed': { icon: 'bi-check-circle-fill', color: '#198754', bg: '#e8f5e9' },
                        'order_update': { icon: 'bi-arrow-repeat', color: '#fd7e14', bg: '#fff3e0' },
                        'chat': { icon: 'bi-chat-dots-fill', color: '#6f42c1', bg: '#f3e8ff' },
                        'chat_message': { icon: 'bi-chat-dots-fill', color: '#6f42c1', bg: '#f3e8ff' },
                        'system': { icon: 'bi-bell-fill', color: '#0dcaf0', bg: '#e0f7fa' },
                    };

                    // Fallback من العنوان لو النوع system
                    let mapped = iconMap[type] || iconMap['system'];
                    if (type === 'system') {
                        if (n.title.includes('توصيل') || n.title.includes('اكتمل'))
                            mapped = iconMap['order_completed'];
                        else if (n.title.includes('قبول') || n.title.includes('كابتن'))
                            mapped = iconMap['order_accepted'];
                        else if (n.title.includes('رسالة') || n.title.includes('chat'))
                            mapped = iconMap['chat'];
                        else if (n.title.includes('إلغاء') || n.title.includes('رفض'))
                            mapped = { icon: 'bi-x-circle-fill', color: '#dc3545', bg: '#fdecea' };
                    }

                    const unreadBorder = !n.isRead ? 'border-start border-4 border-primary' : '';
                    const unreadDot = !n.isRead ? '<span class="position-absolute top-0 end-0 p-1 bg-danger border border-white rounded-circle mt-2 me-2" style="width:10px;height:10px;"></span>' : '';

                    list.insertAdjacentHTML('beforeend', `
            <div class="card border-0 card-hover overflow-hidden position-relative mb-2 shadow-sm ${unreadBorder}" onclick="markAsRead('${n._id}', this, '${n.type}', '${n.relatedId || ''}')" style="cursor:pointer;">
                <div class="card-body p-3 d-flex gap-3 align-items-center">
                    <div class="flex-shrink-0 d-flex align-items-center justify-content-center rounded-circle"
                         style="width:46px;height:46px;background:${mapped.bg};border:2px solid ${mapped.color}30;">
                        <i class="bi ${mapped.icon} fs-5" style="color:${mapped.color};"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <h6 class="fw-bold text-dark mb-0 lh-sm">${n.title}</h6>
                            <small class="text-muted ms-2 text-nowrap" style="font-size:0.72rem;">
                                ${new Date(n.createdAt).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}
                            </small>
                        </div>
                        <p class="text-secondary small mb-0 lh-sm">${n.message}</p>
                    </div>
                    ${unreadDot}
                </div>
            </div>
            `);
                });

                // Load More Button
                if (currentPage < totalPages) {
                    list.insertAdjacentHTML('beforeend', `
                    <div id="${loadMoreId}" class="text-center py-2">
                        <button class="btn btn-sm btn-outline-light rounded-pill px-4" onclick="loadNotifications(${currentPage + 1}, true)">
                            عرض المزيد (+20)
                        </button>
                    </div>`);
                }

            } catch (err) {
                console.error(err);
                if (!append) list.innerHTML = '<p class="text-center text-danger fw-bold py-5">حدث خطأ في التحميل</p>';
            }
        }

        async function markAsRead(id, element, type, relatedId) {
            element.classList.remove('border-start', 'border-4', 'border-primary');
            const dot = element.querySelector('.position-absolute');
            if (dot) dot.remove();

            const baseUrl = window.API_URL || '';
            await fetchWithRetry(`${baseUrl}/api/notifications/${id}/read`, {
                method: 'PUT',
                headers: window.Auth.getAuthHeader()
            }).catch(() => {});

            // 💬 Deep-link: redirect to chat if it is a chat notification
            if ((type === 'chat_message' || type === 'chat') && relatedId) {
                window.location.href = `chat.html?orderId=${relatedId}`;
            }
        }

        // ✅ دالة تحديد الكل كمقروء
        async function markAllAsRead() {
            const btn = document.getElementById('markAllReadBtn');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>جاري...'; }
            try {
                const baseUrl = window.API_URL || '';
                await fetchWithRetry(`${baseUrl}/api/notifications/mark-all-read`, {
                    method: 'PUT',
                    headers: window.Auth.getAuthHeader()
                });
                // إزالة كل مؤشرات غير مقروء من الصفحة بشكل مرئي
                document.querySelectorAll('.border-start.border-primary').forEach(el => {
                    el.classList.remove('border-start', 'border-4', 'border-primary');
                });
                document.querySelectorAll('.position-absolute.bg-danger.rounded-circle').forEach(dot => dot.remove());
                // تحديث شارة التنقّل
                if (window.renderUnreadBadge) window.renderUnreadBadge(0);
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check2-all me-1"></i>تم التحديد ✔'; }
                setTimeout(() => {
                    if (btn) btn.innerHTML = '<i class="bi bi-check2-all me-1"></i>تحديد الكل كمقروء';
                }, 2000);
            } catch (err) {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check2-all me-1"></i>تحديد الكل كمقروء'; }
                console.error('خطأ في تحديد الكل كمقروء:', err);
            }
        }



        function logout() {
            if (window.Auth) {
                window.Auth.logout();
            } else {
                localStorage.clear();
                window.location.href = 'client-login.html';
            }
        }
    </script>
    <!-- Auth Helper & App Core -->
    <script src="js/theme-manager.js?v=01cb92bf"></script>
    <script src="js/app-core.js?v=6f651ead"></script>
    <script src="js/native-notifications.js?v=b7e21c45"></script>
    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="notification-toast.js"></script>
</body>

</html>
