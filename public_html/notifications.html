<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات | وصل-لي</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script src="js/config.js"></script>
</head>

<body class="pb-5 mb-5 bg-light">

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white rounded-circle p-2 shadow-sm">
                        <i class="bi bi-bell-fill text-primary fs-4"></i>
                    </div>
                    <div>
                        <h2 class="h5 fw-bold mb-0 text-white">الإشعارات</h2>
                        <p class="small text-white-50 mb-0">كل جديدك هنا</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notifications List -->
    <div class="container" style="margin-top: -30px;">
        <div id="notificationsList" class="d-flex flex-column gap-2">
            <div class="text-center py-5">
                <div class="spinner-border text-light" role="status"></div>
                <p class="mt-2 text-white fw-bold">جاري تحميل الإشعارات...</p>
            </div>
        </div>
    </div>

    <!-- Static Bottom Navigation -->
    <nav class="mobile-nav-glass">
        <a href="index.html" class="nav-item-link">
            <i class="bi bi-house-door-fill"></i>
            <span class="small d-block">الرئيسية</span>
        </a>
        <a href="client-my-orders.html" class="nav-item-link">
            <i class="bi bi-box-seam"></i>
            <span class="small d-block">طلباتي</span>
        </a>
        <a href="notifications.html" class="nav-item-link active">
            <i class="bi bi-bell"></i>
            <span class="small d-block">الإشعارات</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ✅ Fix Bug #2: Notifications Page Authentication
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const list = document.getElementById('notificationsList');

            if (!token) {
                // User is Guest - Show Login/Register Buttons
                list.innerHTML = `
                <div class="text-center py-5" id="guest-view">
                    <div class="mb-4">
                        <i class="bi bi-bell-slash" style="font-size: 4rem; color: #dee2e6;"></i>
                    </div>
                    <h5 class="fw-bold text-dark mb-2">لا توجد إشعارات</h5>
                    <p class="text-muted mb-4">يجب عليك تسجيل الدخول لعرض إشعاراتك</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="client-login.html" class="btn btn-primary rounded-pill px-4">
                            <i class="bi bi-box-arrow-in-right me-2"></i>تسجيل الدخول
                        </a>
                        <a href="client-register.html" class="btn btn-outline-primary rounded-pill px-4">
                            <i class="bi bi-person-plus me-2"></i>إنشاء حساب
                        </a>
                    </div>
                </div>`;
            } else {
                // Logged in - Load Notifications handled below
                loadNotifications();
            }
        });

        async function loadNotifications(page = 1, append = false) {
            const token = window.Auth.getToken();
            const list = document.getElementById('notificationsList');
            const loadMoreId = 'btn-load-more';

            const oldBtn = document.getElementById(loadMoreId);
            if (oldBtn) oldBtn.remove();

            if (!append) {
                list.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-light" role="status"></div>
                    <p class="mt-2 text-white fw-bold">جاري تحميل الإشعارات...</p>
                </div>`;
            }

            try {
                // 🟢 Fixed: Remove /api prefix
                const baseUrl = window.API_URL || '';
                const res = await fetch(`${baseUrl}/api/notifications?page=${page}&limit=20`, {
                    headers: window.Auth.getAuthHeader()
                });

                const data = await res.json();
                // Handle both array (legacy) and object (paginated) responses just in case
                const notifications = Array.isArray(data) ? data : (data.notifications || []);
                const currentPage = data.currentPage || 1;
                const totalPages = data.totalPages || 1;

                if (!append) list.innerHTML = '';

                if (notifications.length === 0 && !append) {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-bell-slash fs-1 text-secondary opacity-50 mb-3"></i>
                            <p class="text-muted fw-bold">لا توجد إشعارات جديدة حالياً</p>
                        </div>`;
                    return;
                }

                notifications.forEach(n => {
                    let icon = 'bi-info-circle-fill';
                    let iconColor = 'text-primary';
                    let bgIcon = 'bg-primary';

                    if (n.title.includes('توصيل')) {
                        icon = 'bi-check-circle-fill';
                        iconColor = 'text-success';
                        bgIcon = 'bg-success';
                    }
                    if (n.title.includes('قبول')) {
                        icon = 'bi-bicycle';
                        iconColor = 'text-info';
                        bgIcon = 'bg-info';
                    }

                    const unreadClass = !n.isRead ? 'border-primary' : '';
                    const unreadDot = !n.isRead ? '<span class="position-absolute top-0 end-0 p-1 bg-danger border border-white rounded-circle mt-2 me-2"></span>' : '';

                    list.insertAdjacentHTML('beforeend', `
            <div class="card glass-card border-0 card-hover overflow-hidden position-relative mb-2 ${unreadClass ? 'border-start border-4' : ''}" onclick="markAsRead('${n._id}', this)">
                <div class="card-body p-3 d-flex gap-3 align-items-start">
                    <div class="rounded-circle ${bgIcon} bg-opacity-10 p-2 ${iconColor} flex-shrink-0">
                        <i class="bi ${icon} fs-4"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <h6 class="fw-bold text-dark mb-0">${n.title}</h6>
                            <small class="text-muted" style="font-size: 0.75rem;">
                                ${new Date(n.createdAt).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}
                            </small>
                        </div>
                        <p class="text-secondary small mb-0 lh-sm">${n.message}</p>
                    </div>
                    ${unreadDot}
                </div>
            </div>
            `);
                });

                // Load More Button
                if (currentPage < totalPages) {
                    list.insertAdjacentHTML('beforeend', `
                    <div id="${loadMoreId}" class="text-center py-2">
                        <button class="btn btn-sm btn-outline-light rounded-pill px-4" onclick="loadNotifications(${currentPage + 1}, true)">
                            عرض المزيد (+20)
                        </button>
                    </div>`);
                }

            } catch (err) {
                console.error(err);
                if (!append) list.innerHTML = '<p class="text-center text-danger fw-bold py-5">حدث خطأ في التحميل</p>';
            }
        }

        async function markAsRead(id, element) {
            element.classList.remove('border-start', 'border-4', 'border-primary');
            const dot = element.querySelector('.position-absolute');
            if (dot) dot.remove();

            await fetch(`/api/notifications/${id}/read`, {
                method: 'PUT',
                headers: window.Auth.getAuthHeader()
            });
        }



        function logout() {
            if (confirm('تسجيل خروج؟')) {
                localStorage.clear();
                window.location.href = 'client-login.html';
            }
        }
    </script>
    <!-- Auth Helper & App Core -->
    <script src="js/theme-manager.js"></script>
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
