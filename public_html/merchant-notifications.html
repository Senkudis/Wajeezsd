<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الإشعارات | وجيز</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="css/merchant-ui.css?v=fca49c8f">
    <link rel="stylesheet" href="css/dark-mode.css?v=e5ed27be">
    <!-- شاشة الإشعارات الموحّدة — بعد dark-mode.css عمداً (انظر رأس الملف) -->
    <link rel="stylesheet" href="css/notifications-ui.css?v=eabd9895">
    <script src="js/config.js?v=b84e6b6a"></script>
    <script src="js/safe-area.js?v=176d6050"></script>
    <script src="js/fetch-retry.js?v=069d96ba"></script>
    <script src="js/auth-helper.js?v=bf5c4a16"></script>
    <style>
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; margin: 0; }
        body { background: var(--wn-bg); min-height: 100vh; padding-bottom: 80px; }

        /* ترويسة التاجر تحتفظ بهويته الداكنة — الاختلاف بين الأدوار في
           الترويسة والتنقّل، أما بطاقة الإشعار فموحّدة في notifications-ui.css */
        .notif-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white; padding: 20px 16px 24px;
            padding-top: calc(20px + var(--sat, 0px));
            position: relative; overflow: hidden;
        }
        .notif-header::before {
            content: ''; position: absolute; top: -40px; left: -40px;
            width: 160px; height: 160px;
            background: rgba(245,158,11,0.15); border-radius: 50%;
        }
        .notif-header::after {
            content: ''; position: absolute; bottom: -30px; right: -20px;
            width: 120px; height: 120px;
            background: rgba(245,158,11,0.1); border-radius: 50%;
        }
        .notif-header h1 {
            font-size: 1.3rem; font-weight: 800; margin: 0;
            position: relative; z-index: 1;
            display: flex; align-items: center; gap: 10px;
        }
        .notif-header .subtitle {
            font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px;
            position: relative; z-index: 1;
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="notif-header">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1>
                <i class="bi bi-bell-fill" style="color:#fbbf24;"></i>
                الإشعارات
            </h1>
            <div class="subtitle" id="headerSubtitle">كل التحديثات والتنبيهات الخاصة بمتجرك</div>
        </div>
        <a href="merchant-dashboard.html" style="color:rgba(255,255,255,0.7);font-size:1.3rem;text-decoration:none;position:relative;z-index:1;">
            <i class="bi bi-arrow-right"></i>
        </a>
    </div>
</div>

<div class="wn-wrap">
    <div class="wn-toolbar" id="wnToolbar" hidden>
        <button type="button" class="wn-chip" id="chipAll" aria-pressed="true" data-filter="all">الكل</button>
        <button type="button" class="wn-chip" id="chipUnread" aria-pressed="false" data-filter="unread">
            غير المقروء<span class="wn-chip-count" id="unreadCount">0</span>
        </button>
        <button type="button" class="wn-mark-all" id="markAllReadBtn">
            <i class="bi bi-check2-all me-1"></i>تحديد الكل كمقروء
        </button>
    </div>

    <div id="notificationsList"></div>
</div>

<div class="wn-toast" id="wnToast" role="status" aria-live="polite"></div>

<!-- Bottom Nav -->
<nav class="merchant-nav">
    <a href="merchant-dashboard.html">
        <i class="bi bi-house-door-fill"></i>
        <span>الرئيسية</span>
    </a>
    <a href="merchant-orders.html">
        <i class="bi bi-bag-check-fill"></i>
        <span>الطلبات</span>
    </a>
    <a href="merchant-conversations.html" style="position:relative;">
        <i class="bi bi-chat-dots-fill"></i>
        <span>رسائل</span>
        <span id="navConvBadge" style="display:none;position:absolute;top:2px;right:50%;transform:translateX(60%);background:#ef4444;color:white;font-size:0.55rem;font-weight:700;padding:1px 5px;border-radius:10px;"></span>
    </a>
    <a href="merchant-notifications.html" class="active" style="position:relative;">
        <i class="bi bi-bell-fill"></i>
        <span>إشعارات</span>
        <span id="navNotifBadge" style="display:none;position:absolute;top:2px;right:50%;transform:translateX(60%);background:#ef4444;color:white;font-size:0.55rem;font-weight:700;padding:1px 5px;border-radius:10px;"></span>
    </a>
    <a href="client-login.html" onclick="event.preventDefault(); window.Auth ? window.Auth.logout('client-login.html') : (localStorage.clear(), window.location.href='client-login.html');">
        <i class="bi bi-box-arrow-right"></i>
        <span>خروج</span>
    </a>
</nav>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
<script src="vendor/socket.io/socket.io.min.js"></script>
<script src="notification-toast.js"></script>
<script src="js/notifications-ui.js?v=4a4a1297"></script>
<script>
    WajeezNotifications.init({
        loginUrl: 'client-login.html',
        guestTitle: 'سجّل الدخول لعرض إشعاراتك',
        guestText: 'ستصلك هنا طلبات متجرك وتنبيهات المخزون والتسويات.',
        emptyTitle: 'لا توجد إشعارات بعد',
        emptyText: 'سنخبرك هنا فور وصول طلب جديد أو تحديث على متجرك.',
        subtitleIdle: 'كل التحديثات والتنبيهات الخاصة بمتجرك'
    });

    // شارة التنقّل السفلي — الوحدة المشتركة تستدعي renderUnreadBadge،
    // وهذه الصفحة تملك شارتها الخاصة داخل شريط التاجر
    window.renderUnreadBadge = function (count) {
        const b = document.getElementById('navNotifBadge');
        if (!b) return;
        b.textContent = count > 99 ? '99+' : count;
        b.style.display = count > 0 ? 'inline-block' : 'none';
    };
</script>
<script src="js/theme-manager.js?v=a33a528b"></script>
</body>
</html>
