    <style>
        /* ───── 🔍 لوحة البحث عن كابتن (حالة الانتظار) ───── */
        .searching-panel {
            background: linear-gradient(135deg, #064e3b, #04553A);
            border-radius: 16px; padding: 15px 14px; color: #fff;
            text-align: center; position: relative; overflow: hidden;
        }
        .searching-panel::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.18), transparent 60%);
            pointer-events: none;
        }
        /* 🏬 نسخة "بانتظار موافقة المتجر" — لون كهرماني لتمييزها عن بحث الكابتن */
        .searching-panel--merchant { background: linear-gradient(135deg, #92400e, #b45309); }
        .searching-panel--merchant .radar-core { color: #b45309; }
        .radar {
            position: relative; width: 64px; height: 64px; margin: 2px auto 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .radar .ring {
            position: absolute; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.55);
            animation: radarPulse 2.2s ease-out infinite;
        }
        .radar .ring:nth-child(2) { animation-delay: 0.7s; }
        .radar .ring:nth-child(3) { animation-delay: 1.4s; }
        @keyframes radarPulse {
            0%   { width: 20px; height: 20px; opacity: 0.9; }
            100% { width: 64px; height: 64px; opacity: 0; }
        }
        .radar .radar-core {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.95); color: #04553A;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; z-index: 2; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }
        .searching-title { font-weight: 800; font-size: 14.5px; margin-bottom: 3px; }
        .searching-sub { font-size: 11.5px; opacity: 0.92; line-height: 1.6; }
        .typing-dots span {
            display: inline-block; width: 6px; height: 6px; margin: 0 2px;
            background: #fff; border-radius: 50%; opacity: 0.5;
            animation: typingDot 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingDot { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
        .searching-progress {
            height: 4px; border-radius: 99px; background: rgba(255,255,255,0.25);
            overflow: hidden; margin: 10px 8px 2px;
        }
        .searching-progress::after {
            content: ''; display: block; height: 100%; width: 40%;
            background: rgba(255,255,255,0.95); border-radius: 99px;
            animation: progressSlide 1.6s ease-in-out infinite;
        }
        @keyframes progressSlide {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }

        /* ───── 💬 بطاقات عروض الكباتن ───── */
        .offers-header {
            font-weight: 800; font-size: 14px; color: #04553A;
            display: flex; align-items: center; gap: 6px; margin: 4px 2px 10px;
        }
        .offers-header .badge-count {
            background: #04553A; color: #fff; border-radius: 99px;
            font-size: 11px; padding: 2px 9px; font-weight: 800;
        }
        .offer-card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
            padding: 12px; margin-bottom: 10px; box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            animation: offerIn 0.35s ease both;
        }
        @keyframes offerIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .offer-top { display: flex; align-items: center; gap: 10px; }
        .offer-avatar {
            width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #04553A, #25d366); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 18px; background-size: cover; background-position: center;
        }
        .offer-name { font-weight: 800; font-size: 14px; color: #1f2937; line-height: 1.2; }
        .offer-meta { font-size: 11.5px; color: #6b7280; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
        .offer-meta .star { color: #f59e0b; }
        .offer-price-box { text-align: center; flex-shrink: 0; }
        .offer-price-box .lbl { font-size: 10px; color: #9ca3af; font-weight: 700; }
        .offer-price-box .val { font-size: 18px; font-weight: 800; color: #04553A; line-height: 1; }
        .offer-countdown {
            font-size: 11px; font-weight: 700; color: #b45309;
            background: #fffbeb; border-radius: 99px; padding: 2px 9px;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .offer-actions { display: flex; gap: 8px; margin-top: 11px; }
        .offer-actions .btn { border-radius: 99px; font-weight: 800; font-size: 13px; padding: 7px; }

        /* ───── بطاقة الطلب المدمجة (تصميم أنظف وأصغر) ───── */
        #orders-list { gap: 12px !important; }
        .o-card {
            background: #fff; border: 1px solid #eef1f4; border-radius: 16px;
            box-shadow: 0 2px 10px rgba(15,23,42,0.05); overflow: hidden;
        }
        body.dark-mode .o-card { background: #1e293b; border-color: #334155; }
        .o-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 14px 8px;
        }
        .o-status { font-size: 11.5px; font-weight: 800; padding: 5px 11px; border-radius: 99px; }
        .o-id { font-size: 11px; font-weight: 700; color: #94a3b8; direction: ltr; letter-spacing: .4px; }
        .o-body { padding: 0 14px 12px; }
        .o-route {
            background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 12px; padding: 9px 11px;
        }
        body.dark-mode .o-route { background: #0f172a; border-color: #334155; }
        .o-route-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; min-width: 0; }
        .o-route-row i { font-size: 13px; flex-shrink: 0; }
        .o-ic-from { color: #04553A; }
        .o-ic-to { color: #ef4444; }
        .o-route-lbl { color: #94a3b8; font-weight: 700; margin-left: 3px; }
        .o-route-txt {
            font-weight: 700; color: #1f2937;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
        }
        body.dark-mode .o-route-txt { color: #e2e8f0; }
        .o-route-connector { width: 1.5px; height: 11px; background: #cbd5e1; margin: 2px 0 2px 6px; }
        .o-detail {
            font-size: 12.5px; color: #334155; margin-top: 8px; line-height: 1.5;
            background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 10px; padding: 8px 11px;
        }
        body.dark-mode .o-detail { background: #0f172a; border-color: #334155; color: #cbd5e1; }
        .o-detail-lbl { color: #94a3b8; font-weight: 700; }
        .o-cost { margin-top: 9px; border-top: 1px dashed #e2e8f0; padding-top: 9px; }
        body.dark-mode .o-cost { border-color: #334155; }
        .o-cost-main { display: flex; justify-content: space-between; align-items: center; }
        .o-cost-main > span:first-child { font-size: 12.5px; color: #64748b; font-weight: 700; }
        .o-cost-total { font-size: 16px; font-weight: 800; color: #04553A; }
        body.dark-mode .o-cost-total { color: #34d399; }
        .o-cost-sub { display: flex; justify-content: space-between; font-size: 11.5px; color: #94a3b8; margin-top: 4px; }
        .o-actions { margin-top: 10px; }
        .o-actions .btn { font-size: 13px; }
        .o-actions:empty { display: none; margin-top: 0; }
    </style>

    <script>
        // ✅ تعريف رابط السيرفر يدوياً كاحتياط في حال فشل تحميل config.js
        const SERVER_URL = (typeof API_URL !== 'undefined') ? API_URL : 'https://wajeezsd.com';

        // 🛡️ escapeHtml معرفة في config.js ومتاحة عالمياً
        const escapeHtml = window.escapeHtml || function(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        };

        // 🖥️ Helper to build full image URL from relative path or absolute URL
        const getFullImageUrl = window.getFullImageUrl || function(url) {
            if (!url) return '';
            return url;
        };

        // ───── 🔍 لوحة "جاري البحث عن كابتن" المتحركة (حالة الانتظار) ─────
        function renderSearchingPanel() {
            return `
            <div class="searching-panel mb-2">
                <div class="radar">
                    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
                    <div class="radar-core"><i class="bi bi-bicycle"></i></div>
                </div>
                <div class="searching-title">جاري البحث عن أقرب كابتن لك</div>
                <div class="searching-sub">
                    أرسلنا طلبك للكباتن القريبين منك<br>
                    ستصلك عروض الأسعار خلال لحظات — يمكنك اختيار الأنسب
                </div>
                <div class="searching-progress"></div>
                <div class="typing-dots mt-2"><span></span><span></span><span></span></div>
            </div>`;
        }

        // ───── 🏬 لوحة "بانتظار موافقة المتجر" (طلب المتجر وصل للتاجر ولم يُقبل بعد) ─────
        function renderMerchantWaitingPanel() {
            return `
            <div class="searching-panel searching-panel--merchant mb-2">
                <div class="radar">
                    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
                    <div class="radar-core"><i class="bi bi-shop"></i></div>
                </div>
                <div class="searching-title">طلبك وصل للمتجر</div>
                <div class="searching-sub">
                    بانتظار موافقة المتجر على طلبك<br>
                    سيبدأ البحث عن كابتن بعد أن يجهّز المتجر طلبك
                </div>
                <div class="searching-progress"></div>
                <div class="typing-dots mt-2"><span></span><span></span><span></span></div>
            </div>`;
        }

        // ───── 💬 بطاقات عروض الكباتن الاحترافية ─────
        function renderOffersHtml(negotiations, respondId) {
            const cards = negotiations.map(n => {
                const photo = n.captainPhoto ? ((n.captainPhoto.startsWith('http') ? '' : (window.API_URL || '')) + n.captainPhoto) : '';
                const avatar = photo
                    ? `<div class="offer-avatar" style="background-image:url('${photo}')"></div>`
                    : `<div class="offer-avatar">${escapeHtml((n.captainName || 'ك')[0])}</div>`;
                const rating = (typeof n.captainRating === 'number' && n.captainRating > 0)
                    ? `<span><i class="bi bi-star-fill star"></i> ${n.captainRating.toFixed(1)} <span style="color:#9ca3af;">(${n.captainRatingCount || 0})</span></span>`
                    : `<span style="color:#04553A;"><i class="bi bi-stars"></i> كابتن جديد</span>`;
                const vehicle = (n.captainVehicle && window.VehicleTypes)
                    ? `<span>${window.VehicleTypes.iconLabel(n.captainVehicle)}</span>` : '';
                const countdown = n.expiresAt
                    ? `<span class="offer-countdown" data-expires="${n.expiresAt}"><i class="bi bi-clock"></i> <span class="cd-text">—</span></span>` : '';
                return `
                <div class="offer-card">
                    <div class="offer-top">
                        ${avatar}
                        <div style="flex:1;min-width:0;">
                            <div class="offer-name">${escapeHtml(n.captainName || 'كابتن')}</div>
                            <div class="offer-meta">${rating} ${vehicle}</div>
                        </div>
                        <div class="offer-price-box">
                            <div class="lbl">عرضه</div>
                            <div class="val">${escapeHtml(n.proposedPrice)}</div>
                            <div class="lbl">ج.س</div>
                        </div>
                    </div>
                    ${countdown ? `<div class="mt-2">${countdown}</div>` : ''}
                    <div class="offer-actions">
                        <button class="btn btn-success flex-grow-1" onclick="respondToNegotiation('${respondId}', 'accept', '${n.captainId}')"><i class="bi bi-check-lg me-1"></i> قبول العرض</button>
                        <button class="btn btn-outline-danger" style="flex:0 0 40%;" onclick="respondToNegotiation('${respondId}', 'reject', '${n.captainId}')"><i class="bi bi-x-lg me-1"></i> رفض</button>
                    </div>
                </div>`;
            }).join('');
            const header = `<div class="offers-header"><i class="bi bi-hand-thumbs-up-fill"></i> وصلك <span class="badge-count">${negotiations.length}</span> عرض — اختر الأنسب لك</div>`;
            return header + cards;
        }

        // ⏱️ مؤقّت تنازلي حي لعروض الكباتن (يحدّث كل ثانية)
        setInterval(() => {
            document.querySelectorAll('.offer-countdown[data-expires]').forEach(el => {
                const ms = new Date(el.dataset.expires) - new Date();
                const txt = el.querySelector('.cd-text');
                if (!txt) return;
                if (ms <= 0) { el.style.color = '#dc2626'; el.style.background = '#fef2f2'; txt.textContent = 'انتهى العرض'; return; }
                const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
                txt.textContent = `ينتهي خلال ${m}:${String(s).padStart(2, '0')}`;
            });
        }, 1000);

        // ✅ التحقق من حالة الدخول
        function checkAuthState() {
            const token = localStorage.getItem('token');
            const ordersList = document.getElementById('orders-list');

            if (token) {
                return false; // المستخدم مسجل دخول
            } else {
                // المستخدم زائر
                if (ordersList) {
                    ordersList.innerHTML = `
                        <div class="text-center py-5" id="guest-view">
                            <div class="mb-4">
                                <i class="bi bi-box-seam" style="font-size: 4rem; color: #dee2e6;"></i>
                            </div>
                            <h5 class="fw-bold text-dark mb-2">لا توجد طلبات</h5>
                            <p class="text-muted mb-4">يجب عليك تسجيل الدخول أو إنشاء حساب لعرض طلباتك</p>
                            <div class="d-flex gap-2 justify-content-center">
                                <a href="client-login.html" class="btn btn-success rounded-pill px-4">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>تسجيل الدخول
                                </a>
                                <a href="client-register.html" class="btn btn-outline-success rounded-pill px-4">
                                    <i class="bi bi-person-plus me-2"></i>إنشاء حساب
                                </a>
                            </div>
                        </div>
                    `;
                }
                return true; // Is a guest
            }
        }

        // تشغيل الفحص فوراً
        const isGuest = checkAuthState();

        // سحب التوكن من الذاكرة المحلية مباشرة
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');

        // ✅ هيدر ثابت للطلبات
        const authHeaders = {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };

        if (!isGuest && token) {

            const getStatusName = (s) => ({
                'chat_initiated': 'محادثة مع التاجر',
                'pending': 'في الانتظار',
                'negotiating': 'جاري التفاوض',
                'accepted': 'جاري التنفيذ',
                'picked_up': 'تم الاستلام',
                'delivered': 'تم التوصيل',
                'cancelled': 'ملغي'
            }[s] || s);

            const getStatusBadge = (s) => ({
                'chat_initiated': 'bg-info text-dark',
                'pending': 'bg-warning text-dark',
                'negotiating': 'bg-info text-dark',
                'accepted': 'bg-primary',
                'picked_up': 'bg-info text-dark',
                'delivered': 'bg-success',
                'cancelled': 'bg-danger'
            }[s] || 'bg-secondary');

            // اسم الحالة المعروض — واعٍ بطلبات المتجر عبر realShopStatus
            // حتى لا يظهر "في الانتظار" العام بينما الطلب فعلياً عند المتجر.
            const getDisplayStatusName = (order) => {
                if (order.orderType === 'shop' && order.realShopStatus) {
                    return ({
                        'chat_initiated': 'محادثة مع التاجر',
                        'shop_pending':   'بانتظار موافقة المتجر',
                        'shop_preparing': 'المتجر يُجهّز طلبك',
                        'ready_for_pickup': 'جاري البحث عن كابتن',
                        'captain_assigned': 'كابتن في الطريق للمتجر',
                        'picked_up':      'الطلب مع الكابتن',
                        'delivered':      'تم التوصيل',
                        'cancelled':      'ملغي'
                    }[order.realShopStatus] || getStatusName(order.status));
                }
                return getStatusName(order.status);
            };

            const ratedOrders = new Set();
            let currentPage = 1;
            let currentTotalPages = 1;

            async function loadOrders(page = 1, append = false) {
                const list = document.getElementById('orders-list');
                const loadMoreBtnId = 'load-more-btn-container';

                const existingBtn = document.getElementById(loadMoreBtnId);
                if (existingBtn) existingBtn.remove();

                if (!append) {
                    list.innerHTML = Array(3).fill(0).map(() => `
            <div class="skeleton-card skeleton">
                <div class="skeleton-avatar skeleton"></div>
                <div class="skeleton-card-body">
                    <div class="skeleton-title skeleton"></div>
                    <div class="skeleton-text skeleton"></div>
                    <div class="skeleton-text skeleton" style="width: 80%"></div>
                    <div class="skeleton-btn skeleton mt-2"></div>
                </div>
            </div>`).join('');
                }

                try {
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/my-orders?page=${page}&limit=10`, {
                        method: 'GET',
                        headers: authHeaders
                    });

                    if (!res.ok) {
                        throw new Error(`Server Error: ${res.status}`);
                    }

                    const data = await res.json();
                    const orders = data.orders || [];
                    currentPage = data.currentPage || 1;
                    currentTotalPages = data.totalPages || 1;

                    if (!append) list.innerHTML = '';

                    if (orders.length === 0 && !append) {
                        list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-box-seam fs-1 text-secondary opacity-50 mb-3"></i>
                            <p class="text-muted fw-bold">لم تقم بأي طلبات بعد</p>
                            <a href="index.html" class="btn btn-primary rounded-pill px-4 shadow-sm">ابدأ طلب جديد</a>
                        </div>`;
                        return;
                    }

                    orders.forEach(order => {
                        if (order.isRated) ratedOrders.add(order._id);
                        const badgeClass = getStatusBadge(order.status);

                        let activeBtns = '';
                        if (order.status === 'pending') {
                            if (order.orderType === 'shop') {
                                // 🐛 إصلاح: طلب المتجر في حالة shop_pending = "بانتظار موافقة المتجر"،
                                // وليس بحثاً عن كابتن. لا نعرض رادار الكابتن هنا — البحث عن كابتن
                                // يبدأ فقط بعد أن يجهّز المتجر الطلب (ready_for_pickup).
                                activeBtns = renderMerchantWaitingPanel();
                                activeBtns += `<button class="btn btn-outline-danger w-100 rounded-pill fw-bold mt-2" onclick="cancelOrder('${order._id}')"><i class="bi bi-x-circle me-1"></i> إلغاء الطلب</button>`;
                            } else {
                                // طلب توصيل عادي → اعرض عروض الكباتن أو لوحة البحث عن كابتن
                                const pendingNegotiations = (order.negotiations || []).filter(n => {
                                    if (n.status !== 'pending') return false;
                                    if (n.expiresAt && new Date() > new Date(n.expiresAt)) return false;
                                    return true;
                                });
                                const respondId = order.deliveryOrderId || order._id;

                                if (pendingNegotiations.length > 0) {
                                    activeBtns = renderOffersHtml(pendingNegotiations, respondId);
                                    activeBtns += `<button class="btn btn-outline-danger w-100 rounded-pill fw-bold mt-1" onclick="cancelOrder('${order._id}')"><i class="bi bi-x-circle me-1"></i> إلغاء الطلب</button>`;
                                } else {
                                    // لا عروض بعد → لوحة "جاري البحث عن كابتن" المتحركة
                                    activeBtns = renderSearchingPanel();
                                    activeBtns += `<button class="btn btn-outline-danger w-100 rounded-pill fw-bold mt-2" onclick="cancelOrder('${order._id}')"><i class="bi bi-x-circle me-1"></i> إلغاء الطلب</button>`;
                                }
                            }
                        } else if (order.status === 'chat_initiated') {
                            // Direct chat with merchant — no order placed yet
                            activeBtns = `
                            <button class="btn w-100 rounded-pill fw-bold shadow-sm" 
                                style="background:linear-gradient(135deg,#075e54,#25d366);color:white;"
                                onclick="chat('${order._id}', '')">
                                <i class="bi bi-chat-dots-fill me-1"></i> فتح المحادثة مع التاجر
                            </button>`;
                        } else if (['accepted', 'picked_up'].includes(order.status) && order.captain) {
                            activeBtns = `
                            <div class="d-flex gap-2">
                                <button id="chat-btn-${order._id}" class="btn flex-grow-1 rounded-pill fw-bold shadow-sm text-white" style="background-color:#0d6efd;" onclick="chat('${order._id}', '${order.captain._id}')"><i class="bi bi-person-fill me-1"></i> محادثة الكابتن</button>
                                <a href="tracking.html?orderId=${order._id}" class="btn btn-success flex-grow-1 rounded-pill fw-bold shadow-sm"><i class="bi bi-geo-alt-fill me-1"></i> تتبع</a>
                            </div>
                        `;
                            // ✅ لا يُسمح للعميل بإلغاء الطلب بعد قبول الكابتن
                        }

                        if (order.orderType === 'shop' && order.status !== 'chat_initiated' && order.status !== 'cancelled') {
                            activeBtns = `
                            <button class="btn w-100 rounded-pill fw-bold shadow-sm mb-2 mt-2"
                                style="background:linear-gradient(135deg,#075e54,#25d366);color:white;"
                                onclick="chat('${order.shopOrderId || order._id}', '')">
                                <i class="bi bi-shop me-1"></i> محادثة التاجر
                            </button>` + activeBtns;
                        }

                        // أزرار الطلبات المنتهية: تقييم (للمسلَّمة) + إعادة الطلب (للملغاة فقط)
                        if (['delivered', 'cancelled'].includes(order.status)) {
                            if (order.status === 'delivered' && !order.isRated && !ratedOrders.has(order._id)) {
                                const pId = order.placeId || order.place;
                                activeBtns += `<button class="btn btn-warning w-100 rounded-pill fw-bold shadow-sm mt-2 text-dark" onclick="confirmDelivery('${order._id}', ${pId ? `'${pId}'` : 'null'})"><i class="bi bi-star-fill me-1"></i> قيِّم الطلب</button>`;
                            }
                            // 🔄 إعادة الطلب — للطلبات الملغاة فقط (لا تظهر للطلبات المكتملة/المسلَّمة)
                            if (order.status === 'cancelled' && order.orderType === 'shop' && (order.shopId || order.shopId === 0)) {
                                activeBtns += `<a href="shop-detail.html?id=${order.shopId}" class="btn btn-outline-success w-100 rounded-pill fw-bold mt-2"><i class="bi bi-arrow-repeat me-1"></i> اطلب من نفس المتجر</a>`;
                            } else if (order.status === 'cancelled' && order.orderType !== 'shop') {
                                activeBtns += `<button class="btn btn-outline-success w-100 rounded-pill fw-bold mt-2" onclick='reorderDelivery(${JSON.stringify({
                                    pAddr: order.pickup?.address || '', pName: order.pickup?.contactName || '', pPhone: order.pickup?.contactPhone || '', pLat: order.pickup?.lat, pLng: order.pickup?.lng,
                                    dAddr: order.dropoff?.address || '', dName: order.dropoff?.receiverName || '', dPhone: order.dropoff?.receiverPhone || '', dLat: order.dropoff?.lat, dLng: order.dropoff?.lng,
                                    details: order.details || ''
                                }).replace(/'/g, "&#39;")})'><i class="bi bi-arrow-repeat me-1"></i> إعادة الطلب</button>`;
                            }
                        }

                        let paymentHtml = '';
                        if (order.orderType === 'shop' && order.status !== 'chat_initiated' && order.status !== 'cancelled') {
                            if (order.paymentStatus === 'pending') {
                                paymentHtml = `
                                <div class="p-3 rounded-3 mb-3 border border-warning shadow-sm" style="background:rgba(234,179,8,0.12);">
                                    <div class="d-flex align-items-center gap-2 mb-2">
                                        <i class="bi bi-wallet2 text-warning fs-4"></i>
                                        <strong>في انتظار الدفع للمتجر</strong>
                                    </div>
                                    <p class="small mb-2">
                                        يرجى تحويل مبلغ <strong class="text-danger fs-5">${order.itemsTotal || order.price} ج.س</strong> (قيمة المنتجات) 
                                        وإرفاق الإشعار لكي يبدأ المتجر بتجهيز طلبك.<br>
                                        <span class="text-primary mt-1 d-block"><i class="bi bi-info-circle-fill me-1"></i> رسوم التوصيل تُدفع للكابتن عند الاستلام.</span>
                                    </p>
                                    
                                    ${order.bankInfo && order.bankInfo.account ? `
                                    <div class="p-2 mb-3 rounded-2 text-start" style="background:rgba(255,255,255,0.7); border:1px dashed #eab308; direction: rtl;">
                                        <div class="small text-muted mb-1 text-end">🏦 بيانات الدفع للمتجر:</div>
                                        <div class="fw-bold text-dark text-end"><i class="bi bi-bank me-1"></i> البنك: ${order.bankInfo.bank || 'غير محدد'}</div>
                                        <div class="fw-bold text-dark text-end"><i class="bi bi-person-badge me-1"></i> الاسم: ${order.bankInfo.name || 'غير محدد'}</div>
                                        <div class="fw-bold text-primary mt-1 fs-5 d-flex flex-row-reverse justify-content-between align-items-center" style="font-family: monospace;">
                                            <span>${order.bankInfo.account}</span>
                                            <button class="btn btn-sm btn-outline-primary py-0 px-2" onclick="navigator.clipboard.writeText('${order.bankInfo.account}'); Swal.fire({title:'تم النسخ', icon:'success', toast:true, position:'top-end', showConfirmButton:false, timer:1500});"><i class="bi bi-clipboard"></i> نسخ</button>
                                        </div>
                                    </div>
                                    ` : ''}
                                    <input type="file" id="receiptFile-${order.shopOrderId || order._id}" accept="image/*" class="form-control form-control-sm mb-2" onchange="compressAndUploadReceipt('${order.shopOrderId || order._id}')">
                                    <small id="upload-status-${order.shopOrderId || order._id}" class="text-muted d-block text-center"></small>
                                </div>
                                `;
                            } else if (order.paymentStatus === 'receipt_sent') {
                                paymentHtml = `
                                <div class="p-3 rounded-3 mb-3 border border-info shadow-sm" style="background:rgba(6,182,212,0.1);">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-hourglass-split text-info fs-4"></i>
                                        <strong>جاري مراجعة الإشعار</strong>
                                    </div>
                                    <p class="small mb-0 mt-1">تم إرفاق الإشعار، في انتظار تأكيد المتجر للبدء بالتجهيز.</p>
                                </div>
                                `;
                            } else if (order.paymentStatus === 'confirmed') {
                                paymentHtml = `
                                <div class="p-2 rounded-3 mb-3 border border-success d-flex align-items-center gap-2 shadow-sm" style="background:rgba(22,163,74,0.1);">
                                    <i class="bi bi-check-circle-fill text-success fs-4"></i>
                                    <strong>تم تأكيد الدفع وجاري التجهيز!</strong>
                                </div>
                                `;
                            }
                        }

                        const breakdown = (order.orderType === 'shop' && order.deliveryFee) ? `
                                    <div class="o-cost-sub"><span>المنتجات (للمتجر)</span><span>${order.itemsTotal} ج.س</span></div>
                                    <div class="o-cost-sub"><span>التوصيل (للكابتن)</span><span class="text-danger">${order.deliveryFee} ج.س</span></div>` : '';

                        const html = `
                        <div class="o-card">
                            <div class="o-head">
                                <span class="badge ${badgeClass} o-status">${getDisplayStatusName(order)}</span>
                                <span class="o-id">#${order._id.slice(-6)}</span>
                            </div>
                            <div class="o-body">
                                ${(order.isMultiStop && Array.isArray(order.stops) && order.stops.length >= 2) ? `
                                <div class="o-route">
                                    <div style="margin-bottom:6px;">
                                        <span style="font-size:11px;font-weight:800;color:#0ea5e9;background:#e0f2fe;border-radius:99px;padding:3px 10px;">
                                            <i class="bi bi-signpost-split-fill"></i> رحلة متعددة النقاط — ${order.stops.filter(s=>s.done).length}/${order.stops.length} اكتملت
                                        </span>
                                    </div>
                                    ${order.stops.map((s, i) => `
                                    <div class="o-route-row" style="${s.done ? 'opacity:0.6;' : ''}">
                                        <i class="bi ${s.done ? 'bi-check-circle-fill' : (s.type === 'pickup' ? 'bi-geo-alt-fill' : 'bi-flag-fill')} ${s.type === 'pickup' ? 'o-ic-from' : 'o-ic-to'}"></i>
                                        <span class="o-route-txt"><span class="o-route-lbl">${s.type === 'pickup' ? 'استلام' : 'تسليم'} ${i + 1}</span>${escapeHtml(s.address || '')}</span>
                                    </div>${i < order.stops.length - 1 ? '<div class="o-route-connector"></div>' : ''}`).join('')}
                                </div>` : `
                                <div class="o-route">
                                    <div class="o-route-row">
                                        <i class="bi bi-geo-alt-fill o-ic-from"></i>
                                        <span class="o-route-txt"><span class="o-route-lbl">من</span>${escapeHtml(order.pickup?.address || 'غير محدد')}</span>
                                    </div>
                                    <div class="o-route-connector"></div>
                                    <div class="o-route-row">
                                        <i class="bi bi-flag-fill o-ic-to"></i>
                                        <span class="o-route-txt"><span class="o-route-lbl">إلى</span>${escapeHtml(order.dropoff?.address || 'غير محدد')}</span>
                                    </div>
                                </div>`}

                                ${order.details ? `
                                <div class="o-detail"><span class="o-detail-lbl">التفاصيل:</span> ${escapeHtml(order.details)}</div>` : ''}

                                <div class="o-cost">
                                    <div class="o-cost-main">
                                        <span>الإجمالي</span>
                                        <span class="o-cost-total">${order.price} ج.س</span>
                                    </div>
                                    ${breakdown}
                                </div>

                                ${order.hasImage ? `
                                <button class="btn btn-sm btn-outline-secondary rounded-pill w-100 mt-2" onclick="viewParcelImage('${order._id}', this)">
                                    <i class="bi bi-image me-1"></i> عرض صورة الطرد
                                </button>` : ''}

                                ${order.proofOfPickupImage && ['picked_up','delivered'].includes(order.status) ? `
                                <div class="mt-2">
                                    <div class="d-flex align-items-center gap-1 mb-1">
                                        <i class="bi bi-camera-fill text-warning"></i>
                                        <small class="fw-bold text-muted">صورة إثبات الاستلام من الكابتن:</small>
                                    </div>
                                    <img src="${getFullImageUrl(order.proofOfPickupImage)}"
                                        alt="إثبات الاستلام"
                                        class="w-100 rounded-3 object-fit-cover shadow-sm"
                                        style="max-height:160px;cursor:pointer;border:2px solid #fbbf24;"
                                        onerror="this.style.display='none'"
                                        onclick="viewImage('${getFullImageUrl(order.proofOfPickupImage)}')">
                                </div>` : ''}

                                <div class="o-actions">${paymentHtml}${activeBtns}</div>
                            </div>
                        </div>
                    `;
                        list.insertAdjacentHTML('beforeend', html);
                    });

                    if (!append) {
                        // BUG FIX: Removed the automatic trigger for confirmDelivery here to prevent spamming popups.
                        // Now it relies on the "قيِّم الطلب" button on the order card or the push notification.
                    }

                    if (currentPage < currentTotalPages) {
                        const loadMoreHtml = `
                        <div id="${loadMoreBtnId}" class="text-center py-3">
                            <button class="btn btn-outline-success rounded-pill px-5 fw-bold" onclick="loadOrders(${currentPage + 1}, true)">
                                عرض المزيد <i class="bi bi-chevron-down"></i>
                            </button>
                        </div>`;
                        list.insertAdjacentHTML('beforeend', loadMoreHtml);
                    }

                } catch (e) {
                    console.error("Failed to load orders:", e);
                    if (!append) list.innerHTML = `<div class="alert alert-danger text-center m-3">فشل تحميل الطلبات. تأكد من الاتصال بالإنترنت.<br><small>${e.message}</small></div>`;
                }
            }

            function viewImage(src) {
                document.getElementById('full-img').src = src;
                new bootstrap.Modal(document.getElementById('imgModal')).show();
            }

            // 📷 جلب صورة الطرد عند الطلب فقط ثم فتحها في النافذة
            async function viewParcelImage(orderId, btn) {
                const original = btn ? btn.innerHTML : '';
                if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> جاري التحميل...'; }
                try {
                    const res = await fetch(`${SERVER_URL}/api/orders/${orderId}/image`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!res.ok) throw new Error('تعذّر تحميل الصورة');
                    const data = await res.json();
                    if (data.parcelImage) viewImage(getFullImageUrl(data.parcelImage));
                    else throw new Error('لا توجد صورة');
                } catch (e) {
                    Swal.fire({ icon: 'info', text: e.message || 'تعذّر عرض الصورة', confirmButtonColor: '#0a8754' });
                } finally {
                    if (btn) { btn.disabled = false; btn.innerHTML = original; }
                }
            }
            window.viewParcelImage = viewParcelImage;

            window.chat = function (oid, cid) { window.location.href = `chat.html?orderId=${oid}&receiverId=${cid}`; }

            // 🔄 إعادة طلب توصيل — نخزّن البيانات ونوجّه للصفحة الرئيسية لتعبئتها مسبقاً
            window.reorderDelivery = function (data) {
                try {
                    localStorage.setItem('reorder_payload', JSON.stringify(data));
                    window.location.href = 'index.html?reorder=1';
                } catch (e) {
                    Swal.fire('خطأ', 'تعذّرت إعادة الطلب', 'error');
                }
            };

            // 💬 رد العميل على عرض محدد من كابتن بعينه
            window.respondToNegotiation = async function (orderId, action, captainId) {
                try {
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/${orderId}/negotiate-response`, {
                        method: 'PUT',
                        headers: authHeaders,
                        body: JSON.stringify({ action, captainId })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        if (action === 'accept') {
                            Swal.fire({
                                title: '✅ قبلت السعر!',
                                text: 'تم تأكيد الطلب والكابتن في الطريق.',
                                icon: 'success',
                                confirmButtonText: 'تتبع الطلب',
                                confirmButtonColor: '#04553A'
                            }).then(() =>
                                // ✅ FIX: catch إضافي لمنع الفشل الصامت بعد قبول العرض
                                loadOrders().catch(() => showToast('تنبيه', 'تعذّر تحديث القائمة، اسحب للتحديث', 'warning'))
                            );
                        } else {
                            showToast('تم الرفض', 'الطلب لا يزال متاحاً لكباتن آخر', 'info');
                            loadOrders();
                        }
                    } else {
                        Swal.fire('خطأ', data.message, 'error');
                    }
                } catch (e) {
                    Swal.fire('خطأ', 'فشل الاتصال', 'error');
                }
            };

            window.cancelOrder = async function (id) {
                const ok = await Swal.fire({
                    title: 'إلغاء الطلب؟',
                    text: 'هل أنت متأكد من إلغاء الطلب؟',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'نعم، ألغِ',
                    cancelButtonText: 'تراجع',
                    confirmButtonColor: '#dc3545'
                });
                if (!ok.isConfirmed) return;

                try {
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/${id}/cancel`, {
                        method: 'PUT',
                        headers: { ...authHeaders, 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.message || 'فشل إلغاء الطلب');
                    }
                    loadOrders();
                    showToast('تم الإلغاء', 'تم إلغاء الطلب بنجاح', 'success');
                } catch (e) {
                    Swal.fire('تعذّر الإلغاء', e.message || 'فشل إلغاء الطلب', 'error');
                }
            }

            window.loadOrders = loadOrders;

            // ✅ تهيئة السوكت — WebSocket أولاً لسرعة أكبر، ثم polling كاحتياط
            if (userId) {
                const socket = io(SERVER_URL, {
                    path: '/socket.io',
                    // ✅ FIX: websocket أولاً لتجنب بطء الـ long-polling
                    transports: ['websocket', 'polling']
                });

                socket.on('connect', () => {
                    socket.emit('user_join', userId);
                });

                // ✅ FIX: إعادة جلب الطلبات فور استعادة الاتصال بعد انقطاع الشبكة
                // بدون هذا يبقى العميل يشوف الحالة القديمة حتى يُغلق ويُعيد فتح التطبيق
                socket.on('reconnect', () => {
                    loadOrders().catch(() => {});
                });

                socket.on('connect_error', (err) => {
                    // لا نُظهر خطأ للمستخدم — السوكت سيُعيد المحاولة تلقائياً
                    if (window.__DEV__) console.warn('[Socket] connect_error', err.message);
                });

                socket.on('new_notification', (notification) => {
                    showToast(notification.title, notification.message, notification.type);
                });

                socket.on('order_status_updated', (data) => {
                    const { orderId, status } = data;
                    const statusMap = {
                        'accepted': 'تم قبول طلبك! الكابتن في الطريق.',
                        'picked_up': 'تم استلام طلبك بنجاح.',
                        'delivered': 'تم توصيل طلبك، شكراً لك!',
                        'cancelled': 'تم إلغاء الطلب.'
                    };
                    showToast('تحديث الطلب', statusMap[status] || 'تغيرت حالة طلبك', 'order_update');

                    if (status === 'accepted') {
                        Swal.fire({
                            title: 'تم قبول طلبك! 🛕',
                            text: 'الكابتن في الطريق إليك الآن.',
                            icon: 'success',
                            confirmButtonText: 'تتبع الطلب',
                            confirmButtonColor: '#04553A'
                        }).then(() => window.location.href = `tracking.html?orderId=${orderId}`);
                    }
                    loadOrders();
                });

                // 💬 إشعار بوصول عرض سعر جديد من كابتن — يتجنب الـ popup المتكرر
                socket.on('negotiation_started', (data) => {
                    const { captainName, proposedPrice } = data;
                    showToast(
                        '💬 عرض سعر جديد!',
                        `الكابتن ${captainName} يقترح ${proposedPrice} ج.س`,
                        'info'
                    );
                    // Refresh orders list so the new offer appears in the card
                    loadOrders();
                });

                socket.on('negotiation_withdrawn', () => {
                    showToast('تحديث', 'سحب أحد الكباتن عرضه', 'info');
                    loadOrders();
                });

                socket.on('delivery_attempted', (data) => confirmDelivery(data.orderId, data.placeId || null));
            }

            function confirmDelivery(orderId, placeId) {
                if (ratedOrders.has(orderId) || Swal.isVisible()) return;

                Swal.fire({
                    title: '📦 هل استلمت طلبك؟',
                    text: 'أخبرنا الكابتن أنه وصل إليك، هل تؤكد الاستلام؟',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'نعم، استلمت ✅',
                    cancelButtonText: 'لا، لم استلم ❌',
                    confirmButtonColor: '#04553A',
                    cancelButtonColor: '#d33',
                    allowOutsideClick: false
                }).then((result) => {
                    if (result.isConfirmed) {
                        ratedOrders.add(orderId);
                        showRatingModal(orderId, placeId);
                    } else if (result.dismiss === Swal.DismissReason.cancel) {
                        ratedOrders.add(orderId);
                        showComplaintDialog(orderId);
                    }
                });
            }

            function showComplaintDialog(orderId) {
                Swal.fire({
                    title: '⚠️ نأسف لذلك',
                    text: 'يرجى توضيح المشكلة:',
                    input: 'textarea',
                    inputPlaceholder: 'اكتب تفاصيل المشكلة هنا...',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'إرسال الشكوى',
                    confirmButtonColor: '#d33',
                    preConfirm: (text) => {
                        if (!text || text.length < 10) return Swal.showValidationMessage('يرجى كتابة التفاصيل (10 أحرف على الأقل)');
                        return text;
                    }
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        try {
                            await fetchWithRetry(`${SERVER_URL}/api/complaints`, {
                                method: 'POST',
                                headers: authHeaders,
                                body: JSON.stringify({ orderId, client: userId, reason: "Didn't receive", description: result.value })
                            });
                            Swal.fire('تم الإرسال', 'سنتواصل معك قريباً', 'success');
                            loadOrders();
                        } catch (e) { Swal.fire('خطأ', 'فشل في الإرسال', 'error'); }
                    }
                });
            }

            function showRatingModal(orderId, placeId) {
                const starHtml = `
                    <div id="starRating" style="display:flex;justify-content:center;gap:10px;margin:16px 0;">
                        ${[1,2,3,4,5].map(i => `
                            <i class="bi bi-star-fill" data-val="${i}"
                               style="font-size:2.2rem;cursor:pointer;color:#d1d5db;transition:color .15s;"
                               onmouseover="hoverStars(${i})" onmouseout="resetStars()" onclick="selectStar(${i})"></i>
                        `).join('')}
                    </div>
                    <div id="starLabel" style="font-size:1rem;color:#64748b;min-height:24px;"></div>
                    <input type="hidden" id="selectedStar" value="0">`;

                Swal.fire({
                    title: 'تقييم الكابتن ⭐',
                    html: starHtml,
                    confirmButtonText: 'إرسال',
                    confirmButtonColor: '#04553A',
                    showCancelButton: true,
                    cancelButtonText: 'تخطّي',
                    didOpen: () => {
                        window.hoverStars = (val) => {
                            document.querySelectorAll('#starRating i').forEach((el, i) =>
                                el.style.color = i < val ? '#f59e0b' : '#d1d5db');
                            const labels = ['', 'ضعيف', 'مقبول', 'جيد', 'جيد جداً', 'ممتاز'];
                            document.getElementById('starLabel').textContent = labels[val] || '';
                        };
                        window.resetStars = () => {
                            const sel = parseInt(document.getElementById('selectedStar').value) || 0;
                            hoverStars(sel);
                        };
                        window.selectStar = (val) => {
                            document.getElementById('selectedStar').value = val;
                            resetStars();
                        };
                    },
                    preConfirm: () => {
                        const val = parseInt(document.getElementById('selectedStar').value);
                        if (!val) { Swal.showValidationMessage('يرجى اختيار عدد النجوم'); return false; }
                        return val;
                    }
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        try {
                            await fetchWithRetry(`${SERVER_URL}/api/orders/${orderId}/rate`, {
                                method: 'POST',
                                headers: authHeaders,
                                body: JSON.stringify({ rating: result.value })
                            });
                            // إذا كان طلب متجر نعرض تقييم المتجر بعد ذلك
                            if (placeId) {
                                setTimeout(() => showPlaceRatingModal(orderId, placeId), 600);
                            } else {
                                Swal.fire({ icon: 'success', title: 'شكراً لك!', text: 'تم إرسال تقييمك', confirmButtonColor: '#04553A', timer: 2000, showConfirmButton: false });
                            }
                            loadOrders();
                        } catch (e) { Swal.fire('خطأ', 'فشل في الإرسال', 'error'); }
                    }
                });
            }

            function showPlaceRatingModal(orderId, placeId) {
                const starHtml = `
                    <p style="color:#64748b;font-size:13px;">كيف تقيّم تجربتك مع المتجر؟</p>
                    <div id="placeStars" style="display:flex;justify-content:center;gap:10px;margin:12px 0;">
                        ${[1,2,3,4,5].map(i => `
                            <i class="bi bi-star-fill" data-val="${i}"
                               style="font-size:2rem;cursor:pointer;color:#d1d5db;"
                               onmouseover="hoverPS(${i})" onmouseout="resetPS()" onclick="selectPS(${i})"></i>
                        `).join('')}
                    </div>
                    <textarea id="placeComment" class="form-control mt-2" rows="2" placeholder="أترك تعليقاً (اختياري)..."></textarea>
                    <input type="hidden" id="placeSelectedStar" value="0">`;

                Swal.fire({
                    title: 'قيّم المتجر 🛒',
                    html: starHtml,
                    confirmButtonText: 'إرسال',
                    confirmButtonColor: '#04553A',
                    showCancelButton: true,
                    cancelButtonText: 'تخطّي',
                    didOpen: () => {
                        window.hoverPS = (val) => {
                            document.querySelectorAll('#placeStars i').forEach((el, i) =>
                                el.style.color = i < val ? '#f59e0b' : '#d1d5db');
                        };
                        window.resetPS = () => {
                            const sel = parseInt(document.getElementById('placeSelectedStar').value) || 0;
                            hoverPS(sel);
                        };
                        window.selectPS = (val) => {
                            document.getElementById('placeSelectedStar').value = val;
                            resetPS();
                        };
                    },
                    preConfirm: () => {
                        const val = parseInt(document.getElementById('placeSelectedStar').value);
                        if (!val) { Swal.showValidationMessage('يرجى اختيار عدد النجوم'); return false; }
                        return { val, comment: document.getElementById('placeComment').value.trim() };
                    }
                }).then(async (result) => {
                    if (!result.isConfirmed) return;
                    try {
                        await fetchWithRetry(`${SERVER_URL}/api/places/${placeId}/rate`, {
                            method: 'POST',
                            headers: authHeaders,
                            body: JSON.stringify({ score: result.value.val, comment: result.value.comment, orderId })
                        });
                        Swal.fire({ icon: 'success', title: 'شكراً!', text: 'تم تقييم المتجر بنجاح', confirmButtonColor: '#04553A', timer: 2000, showConfirmButton: false });
                    } catch (e) { /* silent fail */ }
                });
            }

            window.compressImageToDataURL = function(file, maxWidth = 800, quality = 0.7) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                            canvas.width = width;
                            canvas.height = height;

                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(dataUrl);
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            };

            window.compressAndUploadReceipt = async function(orderId) {
                const fileInput = document.getElementById(`receiptFile-${orderId}`);
                const statusText = document.getElementById(`upload-status-${orderId}`);
                
                if (!fileInput.files || fileInput.files.length === 0) return;
                
                const file = fileInput.files[0];
                statusText.innerHTML = '<span class="text-warning"><i class="spinner-border spinner-border-sm me-1"></i>جاري الرفع...</span>';
                
                try {
                    const compressedImage = await compressImageToDataURL(file, 800, 0.7);
                    
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/shop/${orderId}/upload-receipt`, {
                        method: 'PUT',
                        headers: authHeaders,
                        body: JSON.stringify({ receiptImage: compressedImage })
                    });
                    
                    if (res.ok) {
                        statusText.innerHTML = '<span class="text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i>تم رفع الإشعار بنجاح!</span>';
                        setTimeout(() => loadOrders(), 1500);
                    } else {
                        const err = await res.json();
                        statusText.innerHTML = `<span class="text-danger fw-bold"><i class="bi bi-x-circle-fill me-1"></i>${err.message || 'فشل في الرفع'}</span>`;
                    }
                } catch (e) {
                    console.error(e);
                    statusText.innerHTML = '<span class="text-danger fw-bold"><i class="bi bi-x-circle-fill me-1"></i>خطأ في الاتصال</span>';
                }
            };

            // Check for rateOrder parameter from Push Notifications
            const urlParams = new URLSearchParams(window.location.search);
            const rateOrderId = urlParams.get('rateOrder');
            
            loadOrders().then(() => {
                if (rateOrderId && !ratedOrders.has(rateOrderId)) {
                    // Try to find the button we just rendered
                    const rateBtn = document.getElementById(`orders-list`).querySelector(`button[onclick*="confirmDelivery('${rateOrderId}'"]`);
                    if (rateBtn) {
                        rateBtn.click(); // This ensures placeId is passed exactly as rendered
                    } else {
                        // Fallback if button not found for some reason
                        confirmDelivery(rateOrderId, null);
                    }
                    // Cleanup URL so refreshing doesn't show it again
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            });
        }
    </script>
