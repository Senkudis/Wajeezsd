                        </style>
                        <div class="fb-sub">رأيك يصل مباشرة لإدارة وجيز — ما الذي أعجبك، وما الذي تقترح تحسينه؟</div>
                        <div class="fb-stars">${stars}</div>
                        <textarea class="fb-note" id="fbNote" maxlength="1000"
                            placeholder="اكتب ملاحظاتك ومقترحاتك هنا..."></textarea>`,
                    showCancelButton: true,
                    confirmButtonText: 'إرسال',
                    cancelButtonText: 'لاحقاً',
                    confirmButtonColor: '#0A8754',
                    focusConfirm: false,
                    preConfirm: () => {
                        const picked = document.querySelector('input[name="fbRating"]:checked');
                        const note = (document.getElementById('fbNote')?.value || '').trim();
                        if (!picked && !note) {
                            Swal.showValidationMessage('اختر تقييماً أو اكتب رأيك');
                            return false;
                        }
                        return { rating: picked ? Number(picked.value) : null, message: note };
                    }
                });

                if (!res.isConfirmed) return;

                try {
                    const r = await fetchWithRetry(`${SERVER_URL}/api/feedback`, {
                        method: 'POST',
                        headers: { ...authHeaders, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orderId, ...res.value })
                    });
                    const data = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(data.message || 'تعذّر الإرسال');
                    showToast('شكراً لك', data.message || 'وصل رأيك للإدارة', 'success');
                } catch (e) {
                    Swal.fire('تعذّر الإرسال', e.message || 'حاول مرة أخرى لاحقاً', 'error');
                }
            }

            async function checkPendingFeedback(forcedOrderId) {
                try {
                    const r = await fetchWithRetry(`${SERVER_URL}/api/feedback/pending`, { headers: authHeaders });
                    if (!r.ok) return;
                    const { pending } = await r.json();
                    if (!pending) return;
                    // مهلة قصيرة كي لا يقفز النموذج فوق الصفحة وهي ما زالت تُرسم
                    setTimeout(() => openFeedbackForm(forcedOrderId || pending.orderId), 900);
                } catch { /* الرأي ليس حرجاً — لا نزعج العميل برسالة خطأ */ }
            }

            loadOrders().then(() => {
                if (highlightId) {
                    setTimeout(() => highlightOrderCard(highlightId), 400);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }

                // ?feedback=<orderId> يأتي من نقر إشعار "كيف كانت تجربتك الأولى؟"
                const feedbackParam = urlParams.get('feedback');
                if (feedbackParam) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                    checkPendingFeedback(feedbackParam !== '1' ? feedbackParam : null);
                } else {
                    checkPendingFeedback();
                }
                if (rateOrderId && !ratedOrders.has(rateOrderId)) {
                    // Try to find the button we just rendered
                    const rateBtn = document.getElementById(`orders-list`).querySelector(`button[onclick*="confirmDelivery('${rateOrderId}'"]`);
                    if (rateBtn) {
                        rateBtn.click(); // This ensures placeId is passed exactly as rendered
                    } else {
                        // Fallback if button not found for some reason
                        confirmDelivery(rateOrderId, null);
                    }
                    // Cleanup URL so refreshing doesn't show it again
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            });
        }
    </script>
