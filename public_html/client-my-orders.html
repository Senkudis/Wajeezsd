<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>طلباتي | وصل-لي</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a8754">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="css/mobile-overrides.css">
    <link rel="stylesheet" href="css/enhanced-styles.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/splash.css">

    <script src="js/config.js"></script>
    <script src="js/auth-helper.js"></script>
</head>

<body class="pb-5 mb-5 bg-light">

    <!-- Loading Splash Screen (only on first app open) -->
    <script>
        if (!sessionStorage.getItem('splashShown')) {
            document.write('<div class="app-splash" id="appSplash">' +
                '<div class="splash-logo-card">' +
                '<img src="logo-transparent.png" alt="وصل-لي" class="splash-logo app-logo">' +
                '</div>' +
                '<div class="splash-text">وصل-لي</div>' +
                '<div class="splash-subtitle">خدمة التوصيل الذكية</div>' +
                '<div class="splash-progress"><div class="splash-progress-bar"></div></div>' +
                '</div>');
        }
    </script>
    <script>window.addEventListener('DOMContentLoaded', () => { const s = document.getElementById('appSplash'); if (s) { setTimeout(() => { s.classList.add('loaded'); sessionStorage.setItem('splashShown', '1') }, 800) } });</script>

    <div class="app-header">
        <div class="container pt-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white rounded-circle p-2 shadow-sm">
                        <i class="bi bi-box2-fill text-primary fs-4"></i>
                    </div>
                    <div>
                        <h2 class="h5 fw-bold mb-0 text-white">سجل طلباتي</h2>
                        <p class="small text-white-50 mb-0">متابعة حالة الطلبات</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container pt-4">
        <div id="orders-list" class="d-flex flex-column gap-3">
            <div class="text-center py-5" id="loading-spinner">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-2 text-muted fw-bold">جاري تحميل طلباتك...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="imgModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-body p-0 overflow-hidden rounded-4">
                    <img src="" id="full-img" class="w-100 object-fit-cover">
                </div>
                <div class="modal-footer border-top-0 p-2">
                    <button type="button" class="btn btn-secondary w-100 rounded-pill fw-bold"
                        data-bs-dismiss="modal">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="mobile-nav-glass">
        <a href="index.html" class="nav-item-link">
            <i class="bi bi-house-door-fill"></i>
            <span class="small d-block">الرئيسية</span>
        </a>
        <a href="client-my-orders.html" class="nav-item-link active">
            <i class="bi bi-box-seam"></i>
            <span class="small d-block">طلباتي</span>
        </a>
        <a href="notifications.html" class="nav-item-link">
            <i class="bi bi-bell"></i>
            <span class="small d-block">الإشعارات</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="notification-toast.js"></script>

    <script>
        // ✅ تعريف رابط السيرفر يدوياً كاحتياط في حال فشل تحميل config.js
        const SERVER_URL = (typeof API_URL !== 'undefined') ? API_URL : 'https://wassili.site';

        // ✅ التحقق من حالة الدخول
        function checkAuthState() {
            const token = localStorage.getItem('token');
            const ordersList = document.getElementById('orders-list');

            if (token) {
                return false; // المستخدم مسجل دخول
            } else {
                // المستخدم زائر
                if (ordersList) {
                    ordersList.innerHTML = `
                        <div class="text-center py-5" id="guest-view">
                            <div class="mb-4">
                                <i class="bi bi-box-seam" style="font-size: 4rem; color: #dee2e6;"></i>
                            </div>
                            <h5 class="fw-bold text-dark mb-2">لا توجد طلبات</h5>
                            <p class="text-muted mb-4">يجب عليك تسجيل الدخول أو إنشاء حساب لعرض طلباتك</p>
                            <div class="d-flex gap-2 justify-content-center">
                                <a href="client-login.html" class="btn btn-primary rounded-pill px-4">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>تسجيل الدخول
                                </a>
                                <a href="client-register.html" class="btn btn-outline-primary rounded-pill px-4">
                                    <i class="bi bi-person-plus me-2"></i>إنشاء حساب
                                </a>
                            </div>
                        </div>
                    `;
                }
                return true; // Is a guest
            }
        }

        // تشغيل الفحص فوراً
        const isGuest = checkAuthState();

        // سحب التوكن من الذاكرة المحلية مباشرة
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');

        // ✅ هيدر ثابت للطلبات
        const authHeaders = {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };

        if (!isGuest && token) {

            const getStatusName = (s) => ({
                'pending': '⏳ في الانتظار',
                'negotiating': '💬 جاري التفاوض',
                'accepted': '🚀 جاري التنفيذ',
                'picked_up': '📦 تم الاستلام',
                'delivered': '✅ تم التوصيل',
                'cancelled': '❌ ملغي'
            }[s] || s);

            const getStatusBadge = (s) => ({
                'pending': 'bg-warning text-dark',
                'negotiating': 'bg-info text-dark',
                'accepted': 'bg-primary',
                'picked_up': 'bg-info text-dark',
                'delivered': 'bg-success',
                'cancelled': 'bg-danger'
            }[s] || 'bg-secondary');

            const ratedOrders = new Set();
            let currentPage = 1;
            let currentTotalPages = 1;

            async function loadOrders(page = 1, append = false) {
                const list = document.getElementById('orders-list');
                const loadMoreBtnId = 'load-more-btn-container';

                const existingBtn = document.getElementById(loadMoreBtnId);
                if (existingBtn) existingBtn.remove();

                if (!append) {
                    list.innerHTML = Array(3).fill(0).map(() => `
                        <div class="card glass-card border-0 mb-3" aria-hidden="true">
                            <div class="card-header bg-transparent border-bottom-0 pt-3 px-3 d-flex justify-content-between align-items-center">
                                <span class="placeholder col-3 rounded-pill bg-secondary bg-opacity-10" style="height: 25px;"></span>
                                <small class="placeholder col-2 bg-secondary bg-opacity-10"></small>
                            </div>
                            <div class="card-body px-3 pb-3 pt-0">
                                <div class="mt-2 mb-3">
                                    <div class="d-flex align-items-center gap-2 mb-2">
                                        <div class="rounded-circle bg-secondary bg-opacity-10 skeleton" style="width: 20px; height: 20px;"></div>
                                        <span class="placeholder col-8 bg-secondary bg-opacity-10 skeleton rounded"></span>
                                    </div>
                                    <div class="placeholder col-12 rounded-pill bg-secondary bg-opacity-10 skeleton" style="height: 38px;"></div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }

                try {
                    console.log('Fetching orders from:', `${SERVER_URL}/api/orders/my-orders`);

                    const res = await fetch(`${SERVER_URL}/api/orders/my-orders?page=${page}&limit=10`, {
                        method: 'GET',
                        headers: authHeaders
                    });

                    if (!res.ok) {
                        throw new Error(`Server Error: ${res.status}`);
                    }

                    const data = await res.json();
                    const orders = data.orders || [];
                    currentPage = data.currentPage || 1;
                    currentTotalPages = data.totalPages || 1;

                    if (!append) list.innerHTML = '';

                    if (orders.length === 0 && !append) {
                        list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-box-seam fs-1 text-secondary opacity-50 mb-3"></i>
                            <p class="text-muted fw-bold">لم تقم بأي طلبات بعد</p>
                            <a href="index.html" class="btn btn-primary rounded-pill px-4 shadow-sm">ابدأ طلب جديد</a>
                        </div>`;
                        return;
                    }

                    orders.forEach(order => {
                        if (order.isRated) ratedOrders.add(order._id);
                        const badgeClass = getStatusBadge(order.status);

                        let activeBtns = '';
                        if (order.status === 'pending') {
                            // Check if there's an active negotiation
                            if (order.negotiation && order.negotiation.isActive) {
                                activeBtns = `
                                <div class="alert alert-info p-2 rounded-3 mb-2 d-flex justify-content-between align-items-center">
                                    <div>
                                        <small class="fw-bold d-block">💬 عرض سعر جديد</small>
                                        <small>السعر المقترح: <strong class="text-success">${order.negotiation.proposedPrice} ج.س</strong></small>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-success flex-grow-1 rounded-pill fw-bold" onclick="respondToNegotiation('${order._id}', 'accept')">
                                        <i class="bi bi-check-circle me-1"></i> قبول
                                    </button>
                                    <button class="btn btn-outline-danger flex-grow-1 rounded-pill fw-bold" onclick="respondToNegotiation('${order._id}', 'reject')">
                                        <i class="bi bi-x-circle me-1"></i> رفض
                                    </button>
                                </div>`;
                            } else {
                                activeBtns = `<button class="btn btn-outline-danger w-100 rounded-pill fw-bold" onclick="cancelOrder('${order._id}')"><i class="bi bi-x-circle me-1"></i> إلغاء الطلب</button>`;
                            }
                        } else if (['accepted', 'picked_up'].includes(order.status) && order.captain) {
                            activeBtns = `
                            <div class="d-flex gap-2">
                                <button id="chat-btn-${order._id}" class="btn btn-primary flex-grow-1 rounded-pill fw-bold shadow-sm" onclick="chat('${order._id}', '${order.captain._id}')"><i class="bi bi-chat-dots me-1"></i> محادثة</button>
                                <a href="tracking.html?orderId=${order._id}" class="btn btn-success flex-grow-1 rounded-pill fw-bold shadow-sm"><i class="bi bi-geo-alt-fill me-1"></i> تتبع</a>
                            </div>
                        `;
                        }

                        const html = `
                        <div class="card glass-card border-0 card-hover overflow-hidden mb-3">
                            <div class="card-header bg-transparent border-bottom-0 pt-3 px-3 d-flex justify-content-between align-items-center">
                                <span class="badge ${badgeClass} rounded-pill px-3 py-2">${getStatusName(order.status)}</span>
                                <small class="text-muted">#${order._id.slice(-6)}</small>
                            </div>
                            
                            <div class="card-body px-3 pb-3 pt-0">
                                <div class="d-flex justify-content-between align-items-start mt-2 mb-3">
                                    <div class="w-100">
                                        <div class="d-flex align-items-center gap-2 mb-1">
                                            <i class="bi bi-geo-alt-fill text-primary"></i>
                                            <small class="text-muted text-truncate d-inline-block" style="max-width: 250px;">من: <strong class="text-dark">${order.pickup.address}</strong></small>
                                        </div>
                                        <div class="d-flex align-items-center gap-2">
                                            <i class="bi bi-flag-fill text-danger"></i>
                                            <small class="text-muted text-truncate d-inline-block" style="max-width: 250px;">إلى: <strong class="text-dark">${order.dropoff.address}</strong></small>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="bg-light p-2 rounded-3 mb-3 d-flex justify-content-between align-items-center">
                                    <span class="small text-muted">التكلفة:</span>
                                    <span class="fw-bold text-success fs-5">${order.price} ج.س</span>
                                </div>

                                ${activeBtns}
                            </div>
                        </div>
                    `;
                        list.insertAdjacentHTML('beforeend', html);
                    });

                    if (!append) {
                        const unratedOrder = orders.find(o => o.status === 'delivered' && !o.isRated && !ratedOrders.has(o._id));
                        if (unratedOrder) confirmDelivery(unratedOrder._id);
                    }

                    if (currentPage < currentTotalPages) {
                        const loadMoreHtml = `
                        <div id="${loadMoreBtnId}" class="text-center py-3">
                            <button class="btn btn-outline-success rounded-pill px-5 fw-bold" onclick="loadOrders(${currentPage + 1}, true)">
                                عرض المزيد <i class="bi bi-chevron-down"></i>
                            </button>
                        </div>`;
                        list.insertAdjacentHTML('beforeend', loadMoreHtml);
                    }

                } catch (e) {
                    console.error("Failed to load orders:", e);
                    if (!append) list.innerHTML = `<div class="alert alert-danger text-center m-3">فشل تحميل الطلبات. تأكد من الاتصال بالإنترنت.<br><small>${e.message}</small></div>`;
                }
            }

            function viewImage(src) {
                document.getElementById('full-img').src = src;
                new bootstrap.Modal(document.getElementById('imgModal')).show();
            }

            window.chat = function (oid, cid) { window.location.href = `chat.html?orderId=${oid}&receiverId=${cid}`; }

            // 💬 رد العميل على عرض التفاوض
            window.respondToNegotiation = async function (orderId, action) {
                try {
                    const res = await fetch(`${SERVER_URL}/api/orders/${orderId}/negotiate-response`, {
                        method: 'PUT',
                        headers: authHeaders,
                        body: JSON.stringify({ action })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        if (action === 'accept') {
                            Swal.fire({
                                title: '✅ قبلت السعر!',
                                text: 'تم تأكيد الطلب والكابتن في الطريق.',
                                icon: 'success',
                                confirmButtonText: 'تتبع الطلب',
                                confirmButtonColor: '#0a8754'
                            }).then(() => loadOrders());
                        } else {
                            showToast('تم الرفض', 'الطلب لا يزال متاحاً لكابتن آخر', 'info');
                            loadOrders();
                        }
                    } else {
                        Swal.fire('خطأ', data.message, 'error');
                    }
                } catch (e) {
                    Swal.fire('خطأ', 'فشل الاتصال', 'error');
                }
            };

            window.cancelOrder = async function (id) {
                if (confirm('هل أنت متأكد من إلغاء الطلب؟')) {
                    try {
                        const res = await fetch(`${SERVER_URL}/api/orders/${id}/cancel`, {
                            method: 'PUT',
                            headers: authHeaders
                        });
                        if (!res.ok) throw new Error();
                        loadOrders();
                        showToast('تم الإلغاء', 'تم إلغاء الطلب بنجاح', 'success');
                    } catch (e) {
                        Swal.fire('خطأ', 'فشل إلغاء الطلب', 'error');
                    }
                }
            }

            window.loadOrders = loadOrders;

            // ✅ FIX 2: تهيئة السوكت بشكل صحيح باستخدام رابط السيرفر
            if (userId) {
                // الاتصال بالسيرفر الحقيقي وليس اللوكال هوست
                const socket = io(SERVER_URL, {
                    path: '/socket.io',
                    transports: ['websocket', 'polling']
                });

                socket.on('connect', () => {
                    console.log('✅ Connected to Socket Server');
                    socket.emit('user_join', userId);
                });

                socket.on('new_notification', (notification) => {
                    showToast(notification.title, notification.message, notification.type);
                });

                socket.on('order_status_updated', (data) => {
                    const { orderId, status } = data;
                    const statusMap = {
                        'accepted': 'تم قبول طلبك! الكابتن في الطريق.',
                        'picked_up': 'تم استلام طلبك بنجاح.',
                        'delivered': 'تم توصيل طلبك، شكراً لك!',
                        'cancelled': 'تم إلغاء الطلب.'
                    };
                    showToast('تحديث الطلب', statusMap[status] || 'تغيرت حالة طلبك', 'order_update');

                    if (status === 'accepted') {
                        Swal.fire({
                            title: 'تم قبول طلبك! 🛕',
                            text: 'الكابتن في الطريق إليك الآن.',
                            icon: 'success',
                            confirmButtonText: 'تتبع الطلب',
                            confirmButtonColor: '#0a8754'
                        }).then(() => window.location.href = `tracking.html?orderId=${orderId}`);
                    }
                    loadOrders();
                });

                // 💬 إشعار بدء التفاوض (عرض سعر من الكابتن)
                socket.on('negotiation_started', (data) => {
                    const { orderId, captainName, originalPrice, proposedPrice, expiresAt } = data;
                    const expiryTime = new Date(expiresAt);
                    const minutesLeft = Math.round((expiryTime - Date.now()) / 60000);

                    Swal.fire({
                        title: '💬 عرض سعر جديد!',
                        html: `
                            <div class="text-center">
                                <p class="mb-2">الكابتن <strong>${captainName}</strong> يقترح:</p>
                                <div class="d-flex justify-content-center align-items-center gap-3 my-3">
                                    <div class="text-center">
                                        <small class="text-muted d-block">السعر الأصلي</small>
                                        <span class="fw-bold text-secondary fs-5 text-decoration-line-through">${originalPrice} ج.س</span>
                                    </div>
                                    <i class="bi bi-arrow-left fs-4 text-muted"></i>
                                    <div class="text-center">
                                        <small class="text-muted d-block">السعر المقترح</small>
                                        <span class="fw-bold text-success fs-3">${proposedPrice} ج.س</span>
                                    </div>
                                </div>
                                <small class="text-muted">العرض صالح لمدة ${minutesLeft} دقائق</small>
                            </div>
                        `,
                        showDenyButton: true,
                        confirmButtonText: '✅ قبول السعر',
                        denyButtonText: '❌ رفض',
                        confirmButtonColor: '#0a8754',
                        denyButtonColor: '#d33',
                        allowOutsideClick: false
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            await respondToNegotiation(orderId, 'accept');
                        } else if (result.isDenied) {
                            await respondToNegotiation(orderId, 'reject');
                        }
                    });
                });

                socket.on('delivery_attempted', (data) => confirmDelivery(data.orderId));
            }

            function confirmDelivery(orderId) {
                if (ratedOrders.has(orderId) || Swal.isVisible()) return;

                Swal.fire({
                    title: '📦 هل استلمت طلبك؟',
                    text: 'أخبرنا الكابتن أنه وصل إليك، هل تؤكد الاستلام؟',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'نعم، استلمت ✅',
                    cancelButtonText: 'لا، لم استلم ❌',
                    confirmButtonColor: '#0a8754',
                    cancelButtonColor: '#d33',
                    allowOutsideClick: false
                }).then((result) => {
                    if (result.isConfirmed) {
                        ratedOrders.add(orderId);
                        showRatingModal(orderId);
                    } else if (result.dismiss === Swal.DismissReason.cancel) {
                        ratedOrders.add(orderId);
                        showComplaintDialog(orderId);
                    }
                });
            }

            function showComplaintDialog(orderId) {
                Swal.fire({
                    title: '⚠️ نأسف لذلك',
                    text: 'يرجى توضيح المشكلة:',
                    input: 'textarea',
                    inputPlaceholder: 'اكتب تفاصيل المشكلة هنا...',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'إرسال الشكوى',
                    confirmButtonColor: '#d33',
                    preConfirm: (text) => {
                        if (!text || text.length < 10) return Swal.showValidationMessage('يرجى كتابة التفاصيل (10 أحرف على الأقل)');
                        return text;
                    }
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        try {
                            await fetch(`${SERVER_URL}/api/complaints`, {
                                method: 'POST',
                                headers: authHeaders,
                                body: JSON.stringify({ orderId, client: userId, reason: "Didn't receive", description: result.value })
                            });
                            Swal.fire('تم الإرسال', 'سنتواصل معك قريباً', 'success');
                            loadOrders();
                        } catch (e) { Swal.fire('خطأ', 'فشل في الإرسال', 'error'); }
                    }
                });
            }

            function showRatingModal(orderId) {
                Swal.fire({
                    title: 'قيم الكابتن ⭐',
                    html: `<input type="range" class="form-range my-3" min="1" max="10" step="1" id="ratingRange" oninput="document.getElementById('rVal').innerText = this.value"><h3 class="text-warning fw-bold"><span id="rVal">5</span>/10</h3>`,
                    confirmButtonText: 'إرسال',
                    confirmButtonColor: '#0a8754',
                    preConfirm: () => document.getElementById('ratingRange').value
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        try {
                            await fetch(`${SERVER_URL}/api/orders/${orderId}/rate`, {
                                method: 'POST',
                                headers: authHeaders,
                                body: JSON.stringify({ rating: parseInt(result.value) })
                            });
                            Swal.fire('شكراً لك!', 'تم بنجاح', 'success');
                            loadOrders();
                        } catch (e) { Swal.fire('خطأ', 'فشل في الإرسال', 'error'); }
                    }
                });
            }

            loadOrders();
        }
    </script>



    <script src="/sw-register.js"></script>
    <script src="/install-prompt.js"></script>
    <script src="js/theme-manager.js"></script>
    <!-- Auth Helper already loaded in head -->
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
