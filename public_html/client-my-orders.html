    <!-- Bottom Navigation: Built immediately to avoid flash -->
    <div id="mobile-nav-container">
        <nav class="mobile-nav-glass">
            <a href="index.html" class="nav-item-link">
                <i class="bi bi-house-door"></i>
                <span>الرئيسية</span>
            </a>
            <a href="client-order.html" class="nav-item-link">
                <i class="bi bi-shop"></i>
                <span>تسوق</span>
            </a>
            <a href="client-my-orders.html" class="nav-item-link active">
                <i class="bi bi-box-seam"></i>
                <span>طلباتي</span>
            </a>
            <a href="notifications.html" class="nav-item-link">
                <i class="bi bi-bell"></i>
                <span>الإشعارات</span>
            </a>
        </nav>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>

    <script src="vendor/socket.io/socket.io.min.js"></script>

    <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="notification-toast.js"></script>

    <script>
        // ✅ تعريف رابط السيرفر يدوياً كاحتياط في حال فشل تحميل config.js
        const SERVER_URL = (typeof API_URL !== 'undefined') ? API_URL : 'https://wajeezsd.com';

        // 🛡️ escapeHtml معرفة في config.js ومتاحة عالمياً
        const escapeHtml = window.escapeHtml || function(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        };

        // 🖥️ Helper to build full image URL from relative path or absolute URL
        const getFullImageUrl = window.getFullImageUrl || function(url) {
            if (!url) return '';
            return url;
        };

        // ───── 🔍 لوحة "جاري البحث عن كابتن" المتحركة (حالة الانتظار) ─────
        function renderSearchingPanel() {
            return `
            <div class="searching-panel mb-2">
                <div class="radar">
                    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
                    <div class="radar-core"><i class="bi bi-bicycle"></i></div>
                </div>
                <div class="searching-title">جاري البحث عن أقرب كابتن لك</div>
                <div class="searching-sub">
                    أرسلنا طلبك للكباتن القريبين منك<br>
                    ستصلك عروض الأسعار خلال لحظات — يمكنك اختيار الأنسب
                </div>
                <div class="searching-progress"></div>
                <div class="typing-dots mt-2"><span></span><span></span><span></span></div>
            </div>`;
        }

        // ───── 🏬 لوحة "بانتظار موافقة المتجر" (طلب المتجر وصل للتاجر ولم يُقبل بعد) ─────
        function renderMerchantWaitingPanel() {
            return `
            <div class="searching-panel searching-panel--merchant mb-2">
                <div class="radar">
                    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
                    <div class="radar-core"><i class="bi bi-shop"></i></div>
                </div>
                <div class="searching-title">طلبك وصل للمتجر</div>
                <div class="searching-sub">
                    بانتظار موافقة المتجر على طلبك<br>
                    سيبدأ البحث عن كابتن بعد أن يجهّز المتجر طلبك
                </div>
                <div class="searching-progress"></div>
                <div class="typing-dots mt-2"><span></span><span></span><span></span></div>
            </div>`;
        }

        // ───── 💬 بطاقات عروض الكباتن الاحترافية ─────
        function renderOffersHtml(negotiations, respondId) {
            const cards = negotiations.map(n => {
                const photo = n.captainPhoto ? ((n.captainPhoto.startsWith('http') ? '' : (window.API_URL || '')) + n.captainPhoto) : '';
                const avatar = photo
                    ? `<div class="offer-avatar" style="background-image:url('${photo}')"></div>`
                    : `<div class="offer-avatar">${escapeHtml((n.captainName || 'ك')[0])}</div>`;
                const rating = (typeof n.captainRating === 'number' && n.captainRating > 0)
                    ? `<span><i class="bi bi-star-fill star"></i> ${n.captainRating.toFixed(1)} <span style="color:#9ca3af;">(${n.captainRatingCount || 0})</span></span>`
                    : `<span style="color:var(--primary);"><i class="bi bi-stars"></i> كابتن جديد</span>`;
                const vehicle = (n.captainVehicle && window.VehicleTypes)
                    ? `<span>${window.VehicleTypes.iconLabel(n.captainVehicle)}</span>` : '';
                const countdown = n.expiresAt
                    ? `<span class="offer-countdown" data-expires="${n.expiresAt}"><i class="bi bi-clock"></i> <span class="cd-text">—</span></span>` : '';
                return `
                <div class="offer-card">
                    <div class="offer-top">
                        ${avatar}
                        <div style="flex:1;min-width:0;">
                            <div class="offer-name">${escapeHtml(n.captainName || 'كابتن')}</div>
                            <div class="offer-meta">${rating} ${vehicle}</div>
                        </div>
                        <div class="offer-price-box">
                            <div class="lbl">عرضه</div>
                            <div class="val">${escapeHtml(n.proposedPrice)}</div>
                            <div class="lbl">ج.س</div>
                        </div>
                    </div>
                    ${countdown ? `<div class="mt-2">${countdown}</div>` : ''}
                    <div class="offer-actions">
                        <button class="btn btn-success flex-grow-1" onclick="respondToNegotiation('${respondId}', 'accept', '${n.captainId}')"><i class="bi bi-check-lg me-1"></i> قبول العرض</button>
                        <button class="btn btn-outline-danger" style="flex:0 0 40%;" onclick="respondToNegotiation('${respondId}', 'reject', '${n.captainId}')"><i class="bi bi-x-lg me-1"></i> رفض</button>
                    </div>
                </div>`;
            }).join('');
            const header = `<div class="offers-header"><i class="bi bi-hand-thumbs-up-fill"></i> وصلك <span class="badge-count">${negotiations.length}</span> عرض — اختر الأنسب لك</div>`;
            return header + cards;
        }

        // ⏱️ مؤقّت تنازلي حي لعروض الكباتن (يحدّث كل ثانية)
        setInterval(() => {
            document.querySelectorAll('.offer-countdown[data-expires]').forEach(el => {
                const ms = new Date(el.dataset.expires) - new Date();
                const txt = el.querySelector('.cd-text');
                if (!txt) return;
                if (ms <= 0) { el.style.color = '#dc2626'; el.style.background = '#fef2f2'; txt.textContent = 'انتهى العرض'; return; }
                const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
                txt.textContent = `ينتهي خلال ${m}:${String(s).padStart(2, '0')}`;
            });
        }, 1000);

        // ✅ التحقق من حالة الدخول
        function checkAuthState() {
            const token = localStorage.getItem('token');
            const ordersList = document.getElementById('orders-list');

            if (token) {
                return false; // المستخدم مسجل دخول
            } else {
                // المستخدم زائر
                if (ordersList) {
                    ordersList.innerHTML = `
                        <div class="text-center py-5" id="guest-view">
                            <div class="mb-4">
                                <i class="bi bi-box-seam" style="font-size: 4rem; color: #dee2e6;"></i>
                            </div>
                            <h5 class="fw-bold text-dark mb-2">لا توجد طلبات</h5>
                            <p class="text-muted mb-4">يجب عليك تسجيل الدخول أو إنشاء حساب لعرض طلباتك</p>
                            <div class="d-flex gap-2 justify-content-center">
                                <a href="client-login.html" class="btn btn-success rounded-pill px-4">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>تسجيل الدخول
                                </a>
                                <a href="client-register.html" class="btn btn-outline-success rounded-pill px-4">
                                    <i class="bi bi-person-plus me-2"></i>إنشاء حساب
                                </a>
                            </div>
                        </div>
                    `;
                }
                return true; // Is a guest
            }
        }

        // تشغيل الفحص فوراً
        const isGuest = checkAuthState();

        // سحب التوكن من الذاكرة المحلية مباشرة
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');

        // ✅ هيدر ثابت للطلبات
        const authHeaders = {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };

        if (!isGuest && token) {

            // ⚠️ 'scheduled' حالةٌ في النموذج ولم تكن هنا: العميل الذي يجدول
            // طلبه كان يرى كلمة "scheduled" بالإنجليزية وشارةً رمادية مجهولة.
            const getStatusName = (s) => ({
                'chat_initiated': 'محادثة مع التاجر',
                'pending': 'في الانتظار',
                'scheduled': 'مجدول — سيُنشر في موعده',
                'negotiating': 'جاري التفاوض',
                'accepted': 'جاري التنفيذ',
                'picked_up': 'تم الاستلام',
                'delivered': 'تم التوصيل',
                'cancelled': 'ملغي'
            }[s] || s);

            const getStatusBadge = (s) => ({
                'chat_initiated': 'style="background:#f0f9ff;color:#0284c7;border:1px solid #bae6fd;"',
                'pending': 'style="background:#fffbeb;color:#b45309;border:1px solid #fde68a;"',
                'scheduled': 'style="background:#f0f9ff;color:#0284c7;border:1px solid #bae6fd;"',
                'negotiating': 'style="background:#e0f2fe;color:#0284c7;border:1px solid #bae6fd;"',
                'accepted': 'style="background:#e6f7f0;color:#048c5b;border:1px solid #a7f3d0;"',
                'picked_up': 'style="background:#e0e7ff;color:#4338ca;border:1px solid #c7d2fe;"',
                'delivered': 'style="background:#dcfce7;color:#15803d;border:1px solid #86efac;"',
                'cancelled': 'style="background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;"'
            }[s] || 'style="background:#f1f5f9;color:#64748b;"');

            const getStatusDotColor = (s) => ({
                'pending': '#f59e0b',
                'scheduled': '#0284c7',
                'negotiating': '#0284c7',
                'accepted': '#048c5b',
                'picked_up': '#4338ca',
                'delivered': '#16a34a',
                'cancelled': '#ef4444'
            }[s] || '#64748b');

            // اسم الحالة المعروض — واعٍ بطلبات المتجر عبر realShopStatus
            // حتى لا يظهر "في الانتظار" العام بينما الطلب فعلياً عند المتجر.
            const getDisplayStatusName = (order) => {
                if (order.orderType === 'shop' && order.realShopStatus) {
                    return ({
                        'chat_initiated': 'محادثة مع التاجر',
                        'shop_pending':   'بانتظار موافقة المتجر',
                        'shop_preparing': 'المتجر يُجهّز طلبك',
                        'ready_for_pickup': 'جاري البحث عن كابتن',
                        'captain_assigned': 'كابتن في الطريق للمتجر',
                        'picked_up':      'الطلب مع الكابتن',
                        'delivered':      'تم التوصيل',
                        'cancelled':      'ملغي'
                    }[order.realShopStatus] || getStatusName(order.status));
                }
                return getStatusName(order.status);
            };

            // ⏱️ يبني كتلة ETA + الخط الزمني المصغّر من بيانات السيرفر (order.eta / order.timeline)
            const orderProgressHtml = (order) => {
                let html = '';

                // ETA — للطلبات الجارية فقط
                if (order.eta && order.eta.text && !['delivered', 'cancelled'].includes(order.status)) {
                    html += `<div class="o-eta"><i class="bi bi-clock-history"></i> يصل خلال ~${order.eta.text}</div>`;
                }

                // الخط الزمني — من طوابع السيرفر
                const tl = order.timeline;
                if (tl && Array.isArray(tl.steps) && tl.steps.length) {
                    const fmt = (iso) => {
                        if (!iso) return '';
                        try { return new Date(iso).toLocaleTimeString('ar-SD', { hour: '2-digit', minute: '2-digit' }); }
                        catch (_) { return ''; }
                    };
                    const icon = (key, done) => key === 'cancelled' ? '<i class="bi bi-x"></i>'
                        : done ? '<i class="bi bi-check"></i>' : '';
                    html += `<div class="o-timeline">${tl.steps.map(s => {
                        const cls = s.cancelled ? 'cancelled' : (s.done ? (s.key === tl.current ? 'active done' : 'done') : '');
                        return `<div class="o-tl-step ${cls}">
                            <div class="o-tl-dot">${icon(s.key, s.done)}</div>
                            <div class="o-tl-lbl">${escapeHtml(s.label)}</div>
                            <div class="o-tl-time">${fmt(s.at)}</div>
                        </div>`;
                    }).join('')}</div>`;
                }
                return html;
            };

            const ratedOrders = new Set();
            let currentPage = 1;
            let currentTotalPages = 1;

            // ═══ 🗂️ فلاتر الطلبات ═══════════════════════════════════
            let _ordersSeen = [];
            let _activeFilter = 'active';

            const ORDER_TABS = [
                { key: 'active', label: 'جارية', icon: 'bi-lightning-charge-fill', match: s =>
                    ['pending','scheduled','accepted','picked_up',
                     'shop_pending','shop_preparing','ready_for_pickup','captain_assigned'].includes(s) },
                { key: 'waiting', label: 'بانتظار كابتن', icon: 'bi-hourglass-split', match: s =>
                    ['pending','ready_for_pickup'].includes(s) },
                { key: 'delivered', label: 'مكتملة', icon: 'bi-check-circle-fill', match: s => s === 'delivered' },
                { key: 'cancelled', label: 'ملغاة', icon: 'bi-x-circle-fill', match: s => s === 'cancelled' },
                { key: 'all', label: 'الكل', icon: 'bi-grid-fill', match: () => true }
            ];

            function renderOrderTabs() {
                const bar = document.getElementById('ordersFilterBar');
                if (!bar) return;
                if (!_ordersSeen.length) { bar.style.display = 'none'; return; }
                bar.style.display = 'flex';
                bar.innerHTML = ORDER_TABS.map(t => {
                    const n = _ordersSeen.filter(o => t.match(o.fstatus)).length;
                    return `<div class="of-tab ${_activeFilter === t.key ? 'active' : ''}"
                        onclick="applyOrderFilter('${t.key}')">
                        <i class="bi ${t.icon}"></i>
                        <span>${t.label}</span>
                        <span class="cnt">${n}</span>
                    </div>`;
                }).join('');
            }

            window.applyOrderFilter = function (key) {
                _activeFilter = key;
                const tab = ORDER_TABS.find(t => t.key === key) || ORDER_TABS[0];
                let shown = 0;
                _ordersSeen.forEach(o => {
                    const el = document.getElementById('order-' + o.id);
                    if (!el) return;
                    const ok = tab.match(o.fstatus);
                    el.style.display = ok ? '' : 'none';
                    if (ok) shown++;
                });

                // رسالة فراغٍ خاصّة بالفلتر — «لم تطلب بعد» كذبةٌ هنا
                let empty = document.getElementById('filter-empty-state');
                if (!shown) {
                    if (!empty) {
                        empty = document.createElement('div');
                        empty.id = 'filter-empty-state';
                        empty.className = 'text-center py-5';
                        document.getElementById('orders-list').appendChild(empty);
                    }
                    empty.innerHTML = `<i class="bi bi-funnel fs-1 text-secondary opacity-50 mb-2 d-block"></i>
                        <p class="text-muted fw-bold mb-0">لا توجد طلبات ${tab.label === 'الكل' ? '' : 'في «' + tab.label + '»'}</p>`;
                } else if (empty) {
                    empty.remove();
                }
                renderOrderTabs();
            };

            async function loadOrders(page = 1, append = false) {
                const list = document.getElementById('orders-list');
                const loadMoreBtnId = 'load-more-btn-container';

                const existingBtn = document.getElementById(loadMoreBtnId);
                if (existingBtn) existingBtn.remove();

                if (!append) {
                    list.innerHTML = Array(3).fill(0).map(() => `
            <div class="skeleton-card skeleton">
                <div class="skeleton-avatar skeleton"></div>
                <div class="skeleton-card-body">
                    <div class="skeleton-title skeleton"></div>
                    <div class="skeleton-text skeleton"></div>
                    <div class="skeleton-text skeleton" style="width: 80%"></div>
                    <div class="skeleton-btn skeleton mt-2"></div>
                </div>
            </div>`).join('');
                }

                try {
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/my-orders?page=${page}&limit=10`, {
                        method: 'GET',
                        headers: authHeaders
                    });

                    if (!res.ok) {
                        throw new Error(`Server Error: ${res.status}`);
                    }

                    const data = await res.json();
                    const orders = data.orders || [];
                    currentPage = data.currentPage || 1;
                    currentTotalPages = data.totalPages || 1;

                    if (!append) { list.innerHTML = ''; _ordersSeen = []; }

                    if (orders.length === 0 && !append) {
                        const bar = document.getElementById('ordersFilterBar');
                        if (bar) bar.style.display = 'none';
                        list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-box-seam fs-1 text-secondary opacity-50 mb-3"></i>
                            <p class="text-muted fw-bold">لم تقم بأي طلبات بعد</p>
                            <a href="index.html" class="btn btn-primary rounded-pill px-4 shadow-sm">ابدأ طلب جديد</a>
                        </div>`;
                        return;
                    }

                    // 🎓 لحظة القبول هي أول ما يحتاج العميل شرحه: من هنا
                    // يتتبّع ويراسل. وعرض السعر يسبقه أحياناً فيأخذ الأولوية.
                    if (!append) {
                        const hasOffer = orders.some(o =>
                            o.status === 'pending' && Array.isArray(o.negotiations) &&
                            o.negotiations.some(n => n.status === 'pending'));
                        if (hasOffer) {
                            coachFire('client_first_offer', '#orders-list > *');
                        } else if (orders.some(o => ['accepted', 'picked_up'].includes(o.status))) {
                            coachFire('client_first_accept', '#orders-list > *');
                        } else if (orders.some(o => o.status === 'delivered')) {
                            coachFire('client_first_delivered', '#orders-list > *');
                        }
                    }

                    orders.forEach(order => {
                        if (order.isRated) ratedOrders.add(order._id);
                        const badgeClass = getStatusBadge(order.status);

                        let activeBtns = '';

                        // 🛍️ errand: سعر البضاعة وصل وبانتظار موافقة العميل → أعلى الأولوية
                        if (order.orderType === 'errand' && order.errand && order.errand.quoteStatus === 'quoted') {
                            const amount = order.errand.goodsQuote;
                            const budget = order.errand.budget;
                            const overBudget = budget && amount > budget;
                            activeBtns = `
                            <div style="background:${overBudget ? '#fef2f2' : '#f0fdf4'};border:2px solid ${overBudget ? '#fca5a5' : '#86efac'};border-radius:14px;padding:12px 14px;margin-bottom:8px;">
                                <div style="font-size:13px;color:#475569;font-weight:600;margin-bottom:4px;">🛍️ سعر البضاعة من <b>${escapeHtml(order.shopName || 'المحل')}</b></div>
                                <div style="font-size:26px;font-weight:900;color:${overBudget ? '#b91c1c' : '#16a34a'};">${amount} ج.س</div>
                                ${overBudget ? `<div style="font-size:11.5px;color:#b91c1c;margin-top:3px;">⚠️ أعلى من ميزانيتك (${budget} ج.س)</div>` : (budget ? `<div style="font-size:11.5px;color:#16a34a;margin-top:3px;">✓ ضمن ميزانيتك (${budget} ج.س)</div>` : '')}
                                <div style="font-size:11px;color:#94a3b8;margin-top:3px;">أجرة التوصيل (${order.price} ج.س) تُضاف عند الاستلام</div>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn flex-grow-1 rounded-pill fw-bold shadow-sm text-white" style="background:#16a34a;" onclick="respondErrandQuote('${order._id}', true)">
                                    ✅ وافق وابدأ الشراء
                                </button>
                                <button class="btn btn-outline-danger flex-grow-1 rounded-pill fw-bold" onclick="respondErrandQuote('${order._id}', false)">
                                    ❌ رفض
                                </button>
                            </div>`;
                        } else if (order.status === 'pending') {
                            if (order.orderType === 'shop') {
                                // 🐛 إصلاح: طلب المتجر في حالة shop_pending = "بانتظار موافقة المتجر"،
                                // وليس بحثاً عن كابتن. لا نعرض رادار الكابتن هنا — البحث عن كابتن
                                // يبدأ فقط بعد أن يجهّز المتجر الطلب (ready_for_pickup).
                                activeBtns = renderMerchantWaitingPanel();
                                activeBtns += `<button class="btn btn-outline-danger w-100 rounded-pill fw-bold mt-2" onclick="cancelOrder('${order._id}')"><i class="bi bi-x-circle me-1"></i> إلغاء الطلب</button>`;
                            } else {
                                // طلب توصيل عادي أو errand لم يصل سعره بعد → اعرض عروض الكباتن أو لوحة البحث
                                const pendingNegotiations = (order.negotiations || []).filter(n => {
                                    if (n.status !== 'pending') return false;
                                    if (n.expiresAt && new Date() > new Date(n.expiresAt)) return false;
                                    return true;
                                });
                                const respondId = order.deliveryOrderId || order._id;

                                if (pendingNegotiations.length > 0) {
                                    activeBtns = renderOffersHtml(pendingNegotiations, respondId);
                                    activeBtns += `<button class="btn btn-outline-danger w-100 rounded-pill fw-bold mt-1" onclick="cancelOrder('${order._id}')"><i class="bi bi-x-circle me-1"></i> إلغاء الطلب</button>`;
                                } else {
                                    // لا عروض بعد → لوحة "جاري البحث عن كابتن" المتحركة
                                    activeBtns = renderSearchingPanel();
                                    activeBtns += `<button class="btn btn-outline-danger w-100 rounded-pill fw-bold mt-2" onclick="cancelOrder('${order._id}')"><i class="bi bi-x-circle me-1"></i> إلغاء الطلب</button>`;
                                }
                            }
                        } else if (order.status === 'chat_initiated') {
                            // Direct chat with merchant — no order placed yet
                            activeBtns = `
                            <button class="btn w-100 rounded-pill fw-bold shadow-sm" 
                                style="background:linear-gradient(135deg,#075e54,#25d366);color:white;"
                                onclick="chat('${order._id}', '')">
                                <i class="bi bi-chat-dots-fill me-1"></i> فتح المحادثة مع التاجر
                            </button>`;
                        } else if (['accepted', 'picked_up'].includes(order.status) && order.captain) {
                            // ⚠️ صفحة التتبّع تطلب /api/orders/:id — أي معرّف **طلب التوصيل**.
                            // وطلب المتجر يأتي هنا بـ _id = معرّف ShopOrder، فكان الزرّ
                            // يمرّر المعرّف الخطأ فينتهي بـ«الطلب غير موجود» ورجوعٍ
                            // للرئيسية: التتبّع معطّل لكل طلبات المتاجر بلا استثناء.
                            // المعرّف الصحيح يصل من السيرفر أصلاً في deliveryOrderId.
                            const trackId = order.deliveryOrderId || (order.orderType === 'shop' ? null : order._id);
                            const trackBtn = trackId
                                ? `<a href="tracking.html?orderId=${trackId}" class="btn btn-success flex-grow-1 rounded-pill fw-bold shadow-sm"><i class="bi bi-geo-alt-fill me-1"></i> تتبع</a>`
                                : '';
                            activeBtns = `
                            <div class="d-flex gap-2">
                                <button id="chat-btn-${order._id}" class="btn flex-grow-1 rounded-pill fw-bold shadow-sm text-white" style="background-color:#0d6efd;" onclick="chat('${order._id}', '${order.captain._id}')"><i class="bi bi-person-fill me-1"></i> محادثة الكابتن</button>
                                ${trackBtn}
                            </div>
                        `;
                            // ✅ لا يُسمح للعميل بإلغاء الطلب بعد قبول الكابتن
                        }

                        if (order.orderType === 'shop' && order.status !== 'chat_initiated' && order.status !== 'cancelled') {
                            activeBtns = `
                            <button class="btn w-100 rounded-pill fw-bold shadow-sm mb-2 mt-2"
                                style="background:linear-gradient(135deg,#075e54,#25d366);color:white;"
                                onclick="chat('${order.shopOrderId || order._id}', '')">
                                <i class="bi bi-shop me-1"></i> محادثة التاجر
                            </button>` + activeBtns;
                        }

                        // أزرار الطلبات المنتهية: تقييم (للمسلَّمة) + إعادة الطلب (للملغاة فقط)
                        if (['delivered', 'cancelled'].includes(order.status)) {
                            if (order.status === 'delivered' && !order.isRated && !ratedOrders.has(order._id)) {
                                const pId = order.placeId || order.place;
                                activeBtns += `<button class="btn btn-warning w-100 rounded-pill fw-bold shadow-sm mt-2 text-dark" data-rate-id="${order._id}" onclick="confirmDelivery('${order._id}', ${pId ? `'${pId}'` : 'null'})"><i class="bi bi-star-fill me-1"></i> قيِّم الطلب</button>`;
                            }
                            // 🔄 إعادة الطلب — للطلبات الملغاة فقط (لا تظهر للطلبات المكتملة/المسلَّمة)
                            if (order.status === 'cancelled' && order.orderType === 'shop' && (order.shopId || order.shopId === 0)) {
                                activeBtns += `<a href="shop-detail.html?id=${order.shopId}" class="btn btn-outline-success w-100 rounded-pill fw-bold mt-2"><i class="bi bi-arrow-repeat me-1"></i> اطلب من نفس المتجر</a>`;
                            } else if (order.status === 'cancelled' && order.orderType !== 'shop') {
                                activeBtns += `<button class="btn btn-outline-success w-100 rounded-pill fw-bold mt-2" onclick='reorderDelivery(${JSON.stringify({
                                    pAddr: order.pickup?.address || '', pName: order.pickup?.contactName || '', pPhone: order.pickup?.contactPhone || '', pLat: order.pickup?.lat, pLng: order.pickup?.lng,
                                    dAddr: order.dropoff?.address || '', dName: order.dropoff?.receiverName || '', dPhone: order.dropoff?.receiverPhone || '', dLat: order.dropoff?.lat, dLng: order.dropoff?.lng,
                                    details: order.details || ''
                                }).replace(/'/g, "&#39;")})'><i class="bi bi-arrow-repeat me-1"></i> إعادة الطلب</button>`;
                            }
                        }

                        let paymentHtml = '';
                        if (order.orderType === 'shop' && order.status !== 'chat_initiated' && order.status !== 'cancelled') {
                            if (order.paymentStatus === 'pending') {
                                paymentHtml = `
                                <div class="p-3 rounded-3 mb-3 border border-warning shadow-sm" style="background:rgba(234,179,8,0.12);">
                                    <div class="d-flex align-items-center gap-2 mb-2">
                                        <i class="bi bi-wallet2 text-warning fs-4"></i>
                                        <strong>في انتظار الدفع للمتجر</strong>
                                    </div>
                                    <p class="small mb-2">
                                        يرجى تحويل مبلغ <strong class="text-danger fs-5">${order.itemsTotal || order.price} ج.س</strong> (قيمة المنتجات) 
                                        وإرفاق الإشعار لكي يبدأ المتجر بتجهيز طلبك.<br>
                                        <span class="text-primary mt-1 d-block"><i class="bi bi-info-circle-fill me-1"></i> رسوم التوصيل تُدفع للكابتن عند الاستلام.</span>
                                    </p>
                                    
                                    ${order.bankInfo && order.bankInfo.account ? `
                                    <div class="p-2 mb-3 rounded-2 text-start" style="background:rgba(255,255,255,0.7); border:1px dashed #eab308; direction: rtl;">
                                        <div class="small text-muted mb-1 text-end">🏦 بيانات الدفع للمتجر:</div>
                                        <div class="fw-bold text-dark text-end"><i class="bi bi-bank me-1"></i> البنك: ${order.bankInfo.bank || 'غير محدد'}</div>
                                        <div class="fw-bold text-dark text-end"><i class="bi bi-person-badge me-1"></i> الاسم: ${order.bankInfo.name || 'غير محدد'}</div>
                                        <div class="fw-bold text-primary mt-1 fs-5 d-flex flex-row-reverse justify-content-between align-items-center" style="font-family: monospace;">
                                            <span>${order.bankInfo.account}</span>
                                            <button class="btn btn-sm btn-outline-primary py-0 px-2" onclick="navigator.clipboard.writeText('${order.bankInfo.account}'); Swal.fire({title:'تم النسخ', icon:'success', toast:true, position:'top-end', showConfirmButton:false, timer:1500});"><i class="bi bi-clipboard"></i> نسخ</button>
                                        </div>
                                    </div>
                                    ` : ''}
                                    <!-- ⚠️ كان input[type=file] خاماً: يعرضه المتصفّح بزرّ إنجليزي
                                         "Choose File / No file chosen" وسط واجهة عربية — أوّل ما
                                         تقع عليه العين في أهمّ خطوة (رفع إشعار الدفع). -->
                                    <input type="file" id="receiptFile-${order.shopOrderId || order._id}" accept="image/*" class="d-none" onchange="compressAndUploadReceipt('${order.shopOrderId || order._id}')">
                                    <label for="receiptFile-${order.shopOrderId || order._id}" class="upload-receipt-btn">
                                        <i class="bi bi-cloud-arrow-up-fill"></i>
                                        <span>ارفع صورة إشعار الدفع</span>
                                    </label>
                                    <small id="upload-status-${order.shopOrderId || order._id}" class="text-muted d-block text-center"></small>
                                </div>
                                `;
                            } else if (order.paymentStatus === 'receipt_sent') {
                                paymentHtml = `
                                <div class="p-3 rounded-3 mb-3 border border-info shadow-sm" style="background:rgba(6,182,212,0.1);">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-hourglass-split text-info fs-4"></i>
                                        <strong>جاري مراجعة الإشعار</strong>
                                    </div>
                                    <p class="small mb-0 mt-1">تم إرفاق الإشعار، في انتظار تأكيد المتجر للبدء بالتجهيز.</p>
                                </div>
                                `;
                            } else if (order.paymentStatus === 'confirmed') {
                                paymentHtml = `
                                <div class="p-2 rounded-3 mb-3 border border-success d-flex align-items-center gap-2 shadow-sm" style="background:rgba(22,163,74,0.1);">
                                    <i class="bi bi-check-circle-fill text-success fs-4"></i>
                                    <strong>تم تأكيد الدفع وجاري التجهيز!</strong>
                                </div>
                                `;
                            }
                        }

                        // 💰 حساب الإجمالي المعروض للعميل بناءً على حالة الدفع
                        let displayTotal = order.price;
                        let displayTotalLabel = 'الإجمالي';
                        let breakdown = '';

                        if (order.orderType === 'shop' && order.deliveryFee) {
                            if (order.paymentStatus === 'confirmed') {
                                // العميل دفع قيمة المنتجات والتاجر أكد الدفع
                                displayTotal = order.deliveryFee;
                                displayTotalLabel = 'المتبقي (للكابتن)';
                                breakdown = `
                                    <div class="o-cost-sub text-muted" style="text-decoration: line-through;">
                                        <span>المنتجات (مدفوعة)</span>
                                        <span>${order.itemsTotal} ج.س</span>
                                    </div>
                                    <div class="o-cost-sub">
                                        <span>التوصيل (يُدفع للكابتن)</span>
                                        <span class="text-danger fw-bold">${order.deliveryFee} ج.س</span>
                                    </div>`;
                            } else {
                                // العميل لم يدفع أو الدفع قيد المراجعة
                                breakdown = `
                                    <div class="o-cost-sub">
                                        <span>المنتجات (للمتجر)</span>
                                        <span>${order.itemsTotal} ج.س</span>
                                    </div>
                                    <div class="o-cost-sub">
                                        <span>التوصيل (للكابتن)</span>
                                        <span class="text-danger">${order.deliveryFee} ج.س</span>
                                    </div>`;
                            }
                        }

                        // 🗂️ وسمُ الحالة على البطاقة نفسها: الفلترة تُخفي وتُظهر بلا
                        // إعادة رسم — فلا يُمسّ منطق البناء أعلاه ولا تُفقد حالة
                        // النماذج المفتوحة داخل البطاقة (كرفع الإشعار).
                        const _fstatus = order.realShopStatus || order.status;
                        const html = `
                        <div class="o-card" id="order-${order._id}" data-fstatus="${_fstatus}">
                            <div class="o-head">
                                <span class="o-status" ${badgeClass}>
                                    <span class="status-dot" style="background:${getStatusDotColor(order.status)};"></span>
                                    <span>${getDisplayStatusName(order)}</span>
                                </span>
                                <span class="o-id">#${order._id.slice(-6)}</span>
                            </div>
                            <div class="o-body">
                                ${(order.isMultiStop && Array.isArray(order.stops) && order.stops.length >= 2) ? `
                                <div class="o-route">
                                    <div style="margin-bottom:8px;">
                                        <span style="font-size:11.5px;font-weight:800;color:#0284c7;background:#e0f2fe;border-radius:50px;padding:3px 12px;display:inline-flex;align-items:center;gap:4px;">
                                            <i class="bi bi-signpost-split-fill"></i> رحلة متعددة النقاط — ${order.stops.filter(s=>s.done).length}/${order.stops.length} اكتملت
                                        </span>
                                    </div>
                                    ${order.stops.map((s, i) => `
                                    <div class="o-route-row" style="${s.done ? 'opacity:0.6;' : ''}">
                                        <div class="o-route-node ${s.type === 'pickup' ? 'from' : 'to'}">
                                            <i class="bi ${s.done ? 'bi-check' : (s.type === 'pickup' ? 'bi-geo-alt-fill' : 'bi-flag-fill')}"></i>
                                        </div>
                                        <span class="o-route-txt"><span class="o-route-lbl">${s.type === 'pickup' ? 'استلام' : 'تسليم'} ${i + 1}:</span> ${escapeHtml(s.address || '')}</span>
                                    </div>${i < order.stops.length - 1 ? '<div class="o-route-connector"></div>' : ''}`).join('')}
                                </div>` : `
                                <div class="o-route">
                                    <div class="o-route-row">
                                        <div class="o-route-node from"><i class="bi bi-geo-alt-fill"></i></div>
                                        <span class="o-route-txt"><span class="o-route-lbl">من:</span> ${escapeHtml(order.pickup?.address || 'غير محدد')}</span>
                                    </div>
                                    <div class="o-route-connector"></div>
                                    <div class="o-route-row">
                                        <div class="o-route-node to"><i class="bi bi-flag-fill"></i></div>
                                        <span class="o-route-txt"><span class="o-route-lbl">إلى:</span> ${escapeHtml(order.dropoff?.address || 'غير محدد')}</span>
                                    </div>
                                </div>`}

                                ${orderProgressHtml(order)}

                                ${order.details ? `
                                <div class="o-detail"><span class="o-detail-lbl">التفاصيل:</span> ${escapeHtml(order.details)}</div>` : ''}

                                <div class="o-cost">
                                    <div class="o-cost-main">
                                        <span>${displayTotalLabel}</span>
                                        <span class="o-cost-total">${displayTotal} ج.س</span>
                                    </div>
                                    ${breakdown}
                                </div>

                                ${order.hasImage ? `
                                <button class="btn btn-sm btn-outline-secondary rounded-pill w-100 mt-2" onclick="viewParcelImage('${order._id}', this)">
                                    <i class="bi bi-image me-1"></i> عرض صورة الطرد
                                </button>` : ''}

                                ${order.proofOfPickupImage && ['picked_up','delivered'].includes(order.status) ? `
                                <div class="mt-2">
                                    <div class="d-flex align-items-center gap-1 mb-1">
                                        <i class="bi bi-camera-fill text-warning"></i>
                                        <small class="fw-bold text-muted">صورة إثبات الاستلام من الكابتن:</small>
                                    </div>
                                    <img src="${getFullImageUrl(order.proofOfPickupImage)}"
                                        alt="إثبات الاستلام"
                                        class="w-100 rounded-3 object-fit-cover shadow-sm"
                                        style="max-height:160px;cursor:pointer;border:2px solid #fbbf24;"
                                        onerror="this.style.display='none'"
                                        onclick="viewImage('${getFullImageUrl(order.proofOfPickupImage)}')">
                                </div>` : ''}

                                <div class="o-actions">${paymentHtml}${activeBtns}</div>
                            </div>
                        </div>
                    `;
                        list.insertAdjacentHTML('beforeend', html);
                        _ordersSeen.push({ id: order._id, fstatus: _fstatus });
                    });

                    if (!append) {
                        // BUG FIX: Removed the automatic trigger for confirmDelivery here to prevent spamming popups.
                        // Now it relies on the "قيِّم الطلب" button on the order card or the push notification.
                    }

                    // 🗂️ أوّل تحميل: افتح على «جارية» إن وُجدت — الطلب الجاري هو ما
                    // يفتح العميل الصفحة لأجله، لا سجلّ ما انتهى قبل شهر.
                    if (!append) {
                        const hasActive = _ordersSeen.some(o => ORDER_TABS[0].match(o.fstatus));
                        _activeFilter = hasActive ? 'active' : 'all';
                    }
                    applyOrderFilter(_activeFilter);

                    if (currentPage < currentTotalPages) {
                        const loadMoreHtml = `
                        <div id="${loadMoreBtnId}" class="text-center py-3">
                            <button class="btn btn-outline-success rounded-pill px-5 fw-bold" onclick="loadOrders(${currentPage + 1}, true)">
                                عرض المزيد <i class="bi bi-chevron-down"></i>
                            </button>
                        </div>`;
                        list.insertAdjacentHTML('beforeend', loadMoreHtml);
                    }

                } catch (e) {
                    console.error("Failed to load orders:", e);
                    if (!append) list.innerHTML = `<div class="alert alert-danger text-center m-3">فشل تحميل الطلبات. تأكد من الاتصال بالإنترنت.<br><small>${e.message}</small></div>`;
                }
            }

            function viewImage(src) {
                document.getElementById('full-img').src = src;
                new bootstrap.Modal(document.getElementById('imgModal')).show();
            }

            // 📷 جلب صورة الطرد عند الطلب فقط ثم فتحها في النافذة
            async function viewParcelImage(orderId, btn) {
                const original = btn ? btn.innerHTML : '';
                if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> جاري التحميل...'; }
                try {
                    const res = await fetch(`${SERVER_URL}/api/orders/${orderId}/image`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!res.ok) throw new Error('تعذّر تحميل الصورة');
                    const data = await res.json();
                    if (data.parcelImage) viewImage(getFullImageUrl(data.parcelImage));
                    else throw new Error('لا توجد صورة');
                } catch (e) {
                    Swal.fire({ icon: 'info', text: e.message || 'تعذّر عرض الصورة', confirmButtonColor: '#0a8754' });
                } finally {
                    if (btn) { btn.disabled = false; btn.innerHTML = original; }
                }
            }
            window.viewParcelImage = viewParcelImage;

            window.chat = function (oid, cid) { window.location.href = `chat.html?orderId=${oid}&receiverId=${cid}`; }

            // 🔄 إعادة طلب توصيل — نخزّن البيانات ونوجّه للصفحة الرئيسية لتعبئتها مسبقاً
            window.reorderDelivery = function (data) {
                try {
                    localStorage.setItem('reorder_payload', JSON.stringify(data));
                    window.location.href = 'index.html?reorder=1';
                } catch (e) {
                    Swal.fire('خطأ', 'تعذّرت إعادة الطلب', 'error');
                }
            };

            // 💬 رد العميل على عرض محدد من كابتن بعينه
            window.respondToNegotiation = async function (orderId, action, captainId) {
                try {
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/${orderId}/negotiate-response`, {
                        method: 'PUT',
                        headers: authHeaders,
                        body: JSON.stringify({ action, captainId })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        if (action === 'accept') {
                            Swal.fire({
                                title: '✅ قبلت السعر!',
                                text: 'تم تأكيد الطلب والكابتن في الطريق.',
                                icon: 'success',
                                confirmButtonText: 'تتبع الطلب',
                                confirmButtonColor: 'var(--primary)'
                            }).then(() =>
                                // ✅ FIX: catch إضافي لمنع الفشل الصامت بعد قبول العرض
                                loadOrders().catch(() => showToast('تنبيه', 'تعذّر تحديث القائمة، اسحب للتحديث', 'warning'))
                            );
                        } else {
                            showToast('تم الرفض', 'الطلب لا يزال متاحاً لكباتن آخر', 'info');
                            loadOrders();
                        }
                    } else {
                        Swal.fire('خطأ', data.message, 'error');
                    }
                } catch (e) {
                    Swal.fire('خطأ', 'فشل الاتصال', 'error');
                }
            };

            // أسباب الإلغاء — يجب أن تطابق CANCEL_REASONS في models/Feedback.js
            const CANCEL_REASONS = [
                ['slow_captain', 'لم يقبل أي كابتن الطلب'],
                ['price_high', 'سعر التوصيل مرتفع'],
                ['changed_mind', 'غيّرت رأيي / لم أعد بحاجة'],
                ['wrong_details', 'أخطأت في بيانات الطلب'],
                ['found_alternative', 'وجدت وسيلة أخرى'],
                ['other', 'سبب آخر']
            ];

            window.cancelOrder = async function (id) {
                // نسأل عن السبب قبل الإلغاء لا بعده: بعد الإلغاء يكون العميل
                // قد أغلق الشاشة، وهذه الإجابة هي كل ما نملكه لفهم التسرّب.
                const optionsHtml = CANCEL_REASONS.map(([code, label]) => `
                    <label class="cr-opt">
                        <input type="radio" name="cancelReason" value="${code}">
                        <span>${label}</span>
                    </label>`).join('');

                const ok = await Swal.fire({
                    title: 'لماذا تريد إلغاء الطلب؟',
                    html: `
                        <style>
                            .cr-list { text-align: right; display: flex; flex-direction: column; gap: 6px; }
                            .cr-opt { display: flex; align-items: center; gap: 10px; padding: 11px 13px;
                                border: 1.5px solid #e2e8f0; border-radius: 12px; cursor: pointer;
                                font-size: 14.5px; font-weight: 600; color: #334155; transition: .15s; }
                            .cr-opt:has(input:checked) { border-color: #0A8754; background: #e7f5ef; color: #04553A; }
                            .cr-opt input { width: 18px; height: 18px; accent-color: #0A8754; flex-shrink: 0; }
                            .cr-note { width: 100%; margin-top: 10px; padding: 11px 13px; border: 1.5px solid #e2e8f0;
                                border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 16px;
                                resize: vertical; min-height: 62px; outline: none; box-sizing: border-box; }
                            .cr-note:focus { border-color: #0A8754; }
                            body.dark-mode .cr-opt { border-color: #334155; color: #cbd5e1; }
                            body.dark-mode .cr-note { border-color: #334155; background: #1e293b; color: #f1f5f9; }
                        </style>
                        <div class="cr-list">${optionsHtml}</div>
                        <textarea class="cr-note" id="crNote" maxlength="200"
                            placeholder="أضف تفاصيل تساعدنا على التحسين (اختياري)"></textarea>`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'تأكيد الإلغاء',
                    cancelButtonText: 'تراجع',
                    confirmButtonColor: '#dc3545',
                    focusConfirm: false,
                    preConfirm: () => {
                        const picked = document.querySelector('input[name="cancelReason"]:checked');
                        if (!picked) {
                            Swal.showValidationMessage('اختر سبباً واحداً من فضلك');
                            return false;
                        }
                        return {
                            reasonCode: picked.value,
                            reason: (document.getElementById('crNote')?.value || '').trim()
                        };
                    }
                });
                if (!ok.isConfirmed) return;

                try {
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/${id}/cancel`, {
                        method: 'PUT',
                        headers: { ...authHeaders, 'Content-Type': 'application/json' },
                        body: JSON.stringify(ok.value || {})
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.message || 'فشل إلغاء الطلب');
                    }
                    loadOrders();
                    showToast('تم الإلغاء', 'تم إلغاء الطلب بنجاح', 'success');
                } catch (e) {
                    Swal.fire('تعذّر الإلغاء', e.message || 'فشل إلغاء الطلب', 'error');
                }
            }

            window.loadOrders = loadOrders;

            // 🛍️ errand: موافقة العميل على سعر البضاعة أو رفضه
            let _errandPromptedFor = null;
            window.respondErrandQuote = async function(orderId, accept) {
                if (!accept) {
                    const conf = await Swal.fire({
                        title: 'رفض السعر؟', text: 'سيُلغى الطلب ولن يتمكن الكابتن من الشراء.',
                        icon: 'warning', showCancelButton: true,
                        confirmButtonText: 'نعم، ارفض', cancelButtonText: 'تراجع',
                        confirmButtonColor: '#dc3545'
                    });
                    if (!conf.isConfirmed) return;
                }
                try {
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/${orderId}/errand/respond`, {
                        method: 'PUT',
                        headers: { ...authHeaders, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ accept })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok) {
                        _errandPromptedFor = null;
                        Swal.fire({
                            icon: accept ? 'success' : 'info',
                            title: accept ? '✅ تم التأكيد' : 'تم الرفض',
                            text: data.message || '',
                            timer: 2200, showConfirmButton: false
                        });
                        loadOrders();
                    } else {
                        Swal.fire('خطأ', data.message || 'تعذّر إرسال ردّك', 'error');
                    }
                } catch (e) {
                    Swal.fire('خطأ', 'تعذّر الاتصال، حاول مجدداً', 'error');
                }
            };

            // 🛍️ نافذة تلقائية عند وصول سعر errand عبر السوكت (لو كان المستخدم في الصفحة)
            async function promptErrandQuoteDialog(data) {
                const key = `${data.orderId}:${data.amount}`;
                if (_errandPromptedFor === key) return;
                _errandPromptedFor = key;
                const result = await Swal.fire({
                    title: '🛍️ سعر طلبك جاهز',
                    html: `<div style="font-size:14px;color:#475569;">سعر البضاعة من <b>${escapeHtml(data.shopName || 'المحل')}</b>:</div>
                           <div style="font-size:30px;font-weight:900;color:#4f46e5;margin:8px 0;">${data.amount} ج.س</div>`,
                    showCancelButton: true,
                    confirmButtonText: '✅ وافق وابدأ الشراء',
                    cancelButtonText: '❌ رفض',
                    confirmButtonColor: '#16a34a',
                    cancelButtonColor: '#dc3545',
                    allowOutsideClick: false
                });
                if (!result.isConfirmed && !result.isDismissed) return;
                if (result.isDismissed && result.dismiss !== Swal.DismissReason.cancel) {
                    _errandPromptedFor = null; return;
                }
                await window.respondErrandQuote(data.orderId, result.isConfirmed);
            }

            // ✅ تهيئة السوكت — WebSocket أولاً لسرعة أكبر، ثم polling كاحتياط
            if (userId) {
                const socket = io(SERVER_URL, {
                    path: '/socket.io',
                    // ✅ FIX: websocket أولاً لتجنب بطء الـ long-polling
                    transports: ['websocket', 'polling'],
                    auth: { token: localStorage.getItem('token') }
                });

                socket.on('connect', () => {
                    socket.emit('user_join', userId);
                });

                // ✅ FIX: إعادة جلب الطلبات فور استعادة الاتصال بعد انقطاع الشبكة
                // بدون هذا يبقى العميل يشوف الحالة القديمة حتى يُغلق ويُعيد فتح التطبيق
                socket.on('reconnect', () => {
                    loadOrders().catch(() => {});
                });

                socket.on('connect_error', (err) => {
                    // لا نُظهر خطأ للمستخدم — السوكت سيُعيد المحاولة تلقائياً
                    if (window.__DEV__) console.warn('[Socket] connect_error', err.message);
                });

                socket.on('new_notification', () => {
                    loadOrders();
                });

                socket.on('order_status_updated', (data) => {
                    const { orderId, status } = data;
                    if (status === 'accepted') {
                        Swal.fire({
                            title: 'تم قبول طلبك! 🛕',
                            text: 'الكابتن في الطريق إليك الآن.',
                            icon: 'success',
                            confirmButtonText: 'تتبع الطلب',
                            confirmButtonColor: 'var(--primary)'
                        }).then(() => window.location.href = `tracking.html?orderId=${orderId}`);
                    }
                    loadOrders();
                });

                // 💬 إشعار بوصول عرض سعر جديد من كابتن — يتجنب الـ popup المتكرر
                socket.on('negotiation_started', (data) => {
                    const { captainName, proposedPrice } = data;
                    showToast(
                        '💬 عرض سعر جديد!',
                        `الكابتن ${captainName} يقترح ${proposedPrice} ج.س`,
                        'info'
                    );
                    // Refresh orders list so the new offer appears in the card
                    loadOrders();
                });

                socket.on('negotiation_withdrawn', () => {
                    showToast('تحديث', 'سحب أحد الكباتن عرضه', 'info');
                    loadOrders();
                });

                socket.on('delivery_attempted', (data) => confirmDelivery(data.orderId, data.placeId || null));

                // 🛍️ errand: الكابتن أرسل سعر البضاعة → أعد تحميل القائمة + افتح نافذة تلقائية
                socket.on('errand_quote', (data) => {
                    _errandPromptedFor = null; // اسمح بإظهار نافذة جديدة لكل سعر
                    loadOrders(); // حدّث البطاقة لتظهر أزرار الموافقة/الرفض
                    if (data && data.orderId && data.amount) {
                        promptErrandQuoteDialog(data); // افتح النافذة فوراً إذا كان المستخدم في الصفحة
                    }
                });
            }

            function confirmDelivery(orderId, placeId) {
                if (ratedOrders.has(orderId) || Swal.isVisible()) return;

                Swal.fire({
                    title: '📦 هل استلمت طلبك؟',
                    text: 'أخبرنا الكابتن أنه وصل إليك، هل تؤكد الاستلام؟',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'نعم، استلمت ✅',
                    cancelButtonText: 'لا، لم استلم ❌',
                    confirmButtonColor: 'var(--primary)',
                    cancelButtonColor: '#d33',
                    allowOutsideClick: false
                }).then((result) => {
                    if (result.isConfirmed) {
                        ratedOrders.add(orderId);
                        showRatingModal(orderId, placeId);
                    } else if (result.dismiss === Swal.DismissReason.cancel) {
                        ratedOrders.add(orderId);
                        showComplaintDialog(orderId);
                    }
                });
            }

            function showComplaintDialog(orderId) {
                Swal.fire({
                    title: '⚠️ نأسف لذلك',
                    text: 'يرجى توضيح المشكلة:',
                    input: 'textarea',
                    inputPlaceholder: 'اكتب تفاصيل المشكلة هنا...',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'إرسال الشكوى',
                    confirmButtonColor: '#d33',
                    preConfirm: (text) => {
                        if (!text || text.length < 10) return Swal.showValidationMessage('يرجى كتابة التفاصيل (10 أحرف على الأقل)');
                        return text;
                    }
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        try {
                            await fetchWithRetry(`${SERVER_URL}/api/complaints`, {
                                method: 'POST',
                                headers: authHeaders,
                                body: JSON.stringify({ orderId, client: userId, reason: "Didn't receive", description: result.value })
                            });
                            Swal.fire('تم الإرسال', 'سنتواصل معك قريباً', 'success');
                            loadOrders();
                        } catch (e) { Swal.fire('خطأ', 'فشل في الإرسال', 'error'); }
                    }
                });
            }

            // 🏷️ وسوم التقييم — تُجلب من الخادم مرّة واحدة وتُحفظ في الذاكرة.
            //    مصدرها utils/ratingTags، فإضافة وسمٍ أو حذفه لا تنتظر تحديث
            //    التطبيق على أجهزة المستخدمين.
            let _ratingTagsCache = null;
            async function loadRatingTags() {
                if (_ratingTagsCache) return _ratingTagsCache;
                try {
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/rating-tags`, { headers: authHeaders });
                    _ratingTagsCache = res.ok ? await res.json() : { positive: [], negative: [], maxTags: 4 };
                } catch (e) {
                    // 🛟 فشل الجلب ⇒ نجومٌ بلا وسوم. التقييم نفسه هو القيمة،
                    //    ولا يصحّ أن يمنعه تعذُّرُ تحميل قائمةٍ تكميلية.
                    _ratingTagsCache = { positive: [], negative: [], maxTags: 4 };
                }
                return _ratingTagsCache;
            }

            async function showRatingModal(orderId, placeId) {
                const tagSets = await loadRatingTags();
                const maxTags = tagSets.maxTags || 4;

                const starHtml = `
                    <div id="starRating" style="display:flex;justify-content:center;gap:10px;margin:16px 0;">
                        ${[1,2,3,4,5].map(i => `
                            <i class="bi bi-star-fill" data-val="${i}"
                               style="font-size:2.2rem;cursor:pointer;color:#d1d5db;transition:color .15s;"
                               onmouseover="hoverStars(${i})" onmouseout="resetStars()" onclick="selectStar(${i})"></i>
                        `).join('')}
                    </div>
                    <div id="starLabel" style="font-size:1rem;color:#64748b;min-height:24px;"></div>
                    <!-- 🏷️ الوسوم مخفية حتى تُختار النجوم: مجموعة الوسوم نفسها
                         تتبع التقييم (ثناء عند 4-5، شكوى عند 1-3)، وعرضُ الاثنين
                         معاً يُنتج تقييماً متناقضاً مثل "سريع" و"تأخّر كثيراً". -->
                    <div id="ratingTagsWrap" style="display:none;margin-top:6px;">
                        <div id="ratingTagsHint" style="font-size:11.5px;color:#94a3b8;font-weight:600;margin-bottom:7px;"></div>
                        <div id="ratingTags" style="display:flex;flex-wrap:wrap;gap:7px;justify-content:center;"></div>
                    </div>
                    <textarea id="captainComment" class="form-control mt-3" rows="2"
                              maxlength="500" placeholder="أضف تعليقاً (اختياري)..."></textarea>
                    <input type="hidden" id="selectedStar" value="0">`;

                Swal.fire({
                    title: 'تقييم الكابتن ⭐',
                    html: starHtml,
                    confirmButtonText: 'إرسال',
                    confirmButtonColor: 'var(--primary)',
                    showCancelButton: true,
                    cancelButtonText: 'تخطّي',
                    didOpen: () => {
                        let selectedTags = [];

                        const renderTags = (stars) => {
                            const wrap = document.getElementById('ratingTagsWrap');
                            const list = stars >= 4 ? (tagSets.positive || []) : (tagSets.negative || []);
                            if (!list.length) { wrap.style.display = 'none'; return; }
                            wrap.style.display = 'block';
                            document.getElementById('ratingTagsHint').textContent =
                                stars >= 4 ? 'ما الذي أعجبك؟ (اختياري)' : 'ما الذي حدث؟ (اختياري)';
                            document.getElementById('ratingTags').innerHTML = list.map(t => `
                                <button type="button" class="rate-tag" data-code="${escapeHtml(t.code)}"
                                    style="border:1.5px solid #e2e8f0;background:#fff;color:#475569;
                                           font-size:12px;font-weight:700;border-radius:99px;
                                           padding:5px 12px;cursor:pointer;font-family:inherit;">
                                    ${escapeHtml(t.label)}
                                </button>`).join('');

                            document.querySelectorAll('#ratingTags .rate-tag').forEach(btn => {
                                btn.onclick = () => {
                                    const code = btn.dataset.code;
                                    const wasOn = selectedTags.includes(code);
                                    if (wasOn) {
                                        selectedTags = selectedTags.filter(c => c !== code);
                                    } else {
                                        if (selectedTags.length >= maxTags) return;
                                        selectedTags.push(code);
                                    }
                                    const active = !wasOn;
                                    btn.style.background  = active ? 'var(--primary)' : '#fff';
                                    btn.style.color       = active ? '#fff' : '#475569';
                                    btn.style.borderColor = active ? 'var(--primary)' : '#e2e8f0';
                                };
                            });
                        };

                        window.hoverStars = (val) => {
                            document.querySelectorAll('#starRating i').forEach((el, i) =>
                                el.style.color = i < val ? '#f59e0b' : '#d1d5db');
                            const labels = ['', 'ضعيف', 'مقبول', 'جيد', 'جيد جداً', 'ممتاز'];
                            document.getElementById('starLabel').textContent = labels[val] || '';
                        };
                        window.resetStars = () => {
                            const sel = parseInt(document.getElementById('selectedStar').value) || 0;
                            hoverStars(sel);
                        };
                        window.selectStar = (val) => {
                            const prev = parseInt(document.getElementById('selectedStar').value) || 0;
                            document.getElementById('selectedStar').value = val;
                            resetStars();
                            // 🔄 العبور بين مجموعتَي الوسوم يُفرغ الاختيار: وسمُ ثناءٍ
                            //    بقي محدَّداً تحت تقييمٍ منخفض تناقضٌ لا يقصده أحد.
                            if (!prev || ((prev >= 4) !== (val >= 4))) selectedTags = [];
                            renderTags(val);
                        };
                        window.__getRatingTags = () => selectedTags.slice();
                    },
                    preConfirm: () => {
                        const val = parseInt(document.getElementById('selectedStar').value);
                        if (!val) { Swal.showValidationMessage('يرجى اختيار عدد النجوم'); return false; }
                        return {
                            val,
                            tags: (window.__getRatingTags ? window.__getRatingTags() : []),
                            comment: (document.getElementById('captainComment')?.value || '').trim()
                        };
                    }
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        try {
                            await fetchWithRetry(`${SERVER_URL}/api/orders/${orderId}/rate`, {
                                method: 'POST',
                                headers: authHeaders,
                                body: JSON.stringify({
                                    rating: result.value.val,
                                    tags: result.value.tags,
                                    comment: result.value.comment
                                })
                            });
                            // ✅ إخفاء زر التقييم فوراً بدون انتظار إعادة التحميل
                            ratedOrders.add(orderId);
                            document.querySelectorAll(`[data-rate-id="${orderId}"]`).forEach(btn => btn.remove());
                            // إذا كان طلب متجر نعرض تقييم المتجر بعد ذلك
                            if (placeId) {
                                setTimeout(() => showPlaceRatingModal(orderId, placeId), 600);
                            } else {
                                Swal.fire({ icon: 'success', title: 'شكراً لك!', text: 'تم إرسال تقييمك', confirmButtonColor: 'var(--primary)', timer: 2000, showConfirmButton: false });
                            }
                            loadOrders();
                        } catch (e) { Swal.fire('خطأ', 'فشل في الإرسال', 'error'); }
                    }
                });
            }

            function showPlaceRatingModal(orderId, placeId) {
                const starHtml = `
                    <p style="color:#64748b;font-size:13px;">كيف تقيّم تجربتك مع المتجر؟</p>
                    <div id="placeStars" style="display:flex;justify-content:center;gap:10px;margin:12px 0;">
                        ${[1,2,3,4,5].map(i => `
                            <i class="bi bi-star-fill" data-val="${i}"
                               style="font-size:2rem;cursor:pointer;color:#d1d5db;"
                               onmouseover="hoverPS(${i})" onmouseout="resetPS()" onclick="selectPS(${i})"></i>
                        `).join('')}
                    </div>
                    <textarea id="placeComment" class="form-control mt-2" rows="2" placeholder="أترك تعليقاً (اختياري)..."></textarea>
                    <input type="hidden" id="placeSelectedStar" value="0">`;

                Swal.fire({
                    title: 'قيّم المتجر 🛒',
                    html: starHtml,
                    confirmButtonText: 'إرسال',

                    showCancelButton: true,

                        if (!val) { Swal.showValidationMessage('يرجى اختيار عدد النجوم'); return false; }
                        return { val, comment: document.getElementById('placeComment').value.trim() };
                    }
                }).then(async (result) => {
                    if (!result.isConfirmed) return;
                    try {
                        await fetchWithRetry(`${SERVER_URL}/api/places/${placeId}/rate`, {
                            method: 'POST',
                            headers: authHeaders,
                            body: JSON.stringify({ score: result.value.val, comment: result.value.comment, orderId })
                        });
                        Swal.fire({ icon: 'success', title: 'شكراً!', text: 'تم تقييم المتجر بنجاح', confirmButtonColor: 'var(--primary)', timer: 2000, showConfirmButton: false });
                    } catch (e) { /* silent fail */ }
                });
            }

            window.compressImageToDataURL = function(file, maxWidth = 800, quality = 0.7) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                            canvas.width = width;
                            canvas.height = height;

                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(dataUrl);
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            };

            window.compressAndUploadReceipt = async function(orderId) {
                const fileInput = document.getElementById(`receiptFile-${orderId}`);
                const statusText = document.getElementById(`upload-status-${orderId}`);
                
                if (!fileInput.files || fileInput.files.length === 0) return;
                
                const file = fileInput.files[0];
                statusText.innerHTML = '<span class="text-warning"><i class="spinner-border spinner-border-sm me-1"></i>جاري الرفع...</span>';
                
                try {
                    const compressedImage = await compressImageToDataURL(file, 800, 0.7);
                    
                    const res = await fetchWithRetry(`${SERVER_URL}/api/orders/shop/${orderId}/upload-receipt`, {
                        method: 'PUT',
                        headers: authHeaders,
                        body: JSON.stringify({ receiptImage: compressedImage })
                    });
                    
                    if (res.ok) {
                        statusText.innerHTML = '<span class="text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i>تم رفع الإشعار بنجاح!</span>';
                        setTimeout(() => loadOrders(), 1500);
                    } else {
                        const err = await res.json();
                        statusText.innerHTML = `<span class="text-danger fw-bold"><i class="bi bi-x-circle-fill me-1"></i>${err.message || 'فشل في الرفع'}</span>`;
                    }
                } catch (e) {
                    console.error(e);
                    statusText.innerHTML = '<span class="text-danger fw-bold"><i class="bi bi-x-circle-fill me-1"></i>خطأ في الاتصال</span>';
                }
            };

            // Check for rateOrder parameter from Push Notifications
            const urlParams = new URLSearchParams(window.location.search);
            const rateOrderId = urlParams.get('rateOrder');
            const highlightId = urlParams.get('highlight');

            // 🎯 إبراز الطلب القادم من الإشعار — بدونه يهبط العميل على قائمة
            // ولا يعرف أي طلب قُصد (نفس نمط client-shop-orders و merchant-orders)
            function highlightOrderCard(id) {
                const card = document.getElementById(`order-${id}`);
                if (!card) return;
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.style.transition = 'box-shadow 0.4s, transform 0.4s';
                card.style.boxShadow = '0 0 0 4px rgba(10,135,84,0.5), 0 10px 30px rgba(10,135,84,0.3)';
                card.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    card.style.boxShadow = '';
                    card.style.transform = '';
                }, 3000);
            }

            // ═══════════════════════════════════════════════════════════
            // 💬 رأي العميل بعد أول توصيلة
            // ═══════════════════════════════════════════════════════════
            // لا نعتمد على وصول الدفعة وحدها: الإشعارات قد تكون معطّلة على
            // الجهاز، وهذا بالضبط ما نحاول علاجه. لذلك نسأل الخادم عند فتح
            // الصفحة إن كان هناك رأي لم يُرسل بعد.

                    html: `
                        <style>
