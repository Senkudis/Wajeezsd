<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشكاوى | وَصِّلِي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f7fa;
            direction: rtl;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            color: white;
            height: 100vh;
            position: fixed;
            right: 0;
            top: 0;
            padding: 0;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h2 {
            font-size: 24px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .sidebar-header p {
            font-size: 14px;
            opacity: 0.7;
        }

        .sidebar-menu {
            padding: 20px 0;
        }

        .sidebar button {
            width: 100%;
            padding: 15px 25px;
            background: transparent;
            color: white;
            border: none;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-right: 3px solid transparent;
        }

        .sidebar button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-right-color: #3498db;
            padding-right: 30px;
        }

        .sidebar button.active {
            background: rgba(255, 255, 255, 0.15);
            border-right-color: #e74c3c;
        }

        .sidebar button i {
            width: 25px;
            font-size: 18px;
        }

        .sidebar .logout {
            position: absolute;
            bottom: 20px;
            width: calc(100% - 40px);
            margin: 0 20px;
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.5);
            border-radius: 8px;
        }

        .sidebar .logout:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        /* Main Content */
        .content {
            margin-right: 280px;
            padding: 30px;
            min-height: 100vh;
        }

        .page-header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: #2c3e50;
            font-size: 32px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-header p {
            color: #7f8c8d;
            margin-top: 10px;
            font-size: 16px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: var(--card-color);
        }

        .stat-card.pending {
            --card-color: #f39c12;
        }

        .stat-card.resolved {
            --card-color: #27ae60;
        }

        .stat-card.total {
            --card-color: #3498db;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: 900;
            color: var(--card-color);
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #7f8c8d;
            font-size: 14px;
        }

        /* Filter Section */
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .filter-section label {
            font-weight: 600;
            color: #2c3e50;
        }

        .filter-section select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .filter-section select:focus {
            outline: none;
            border-color: #3498db;
        }

        /* DataTables Custom Styling */
        .dataTables_wrapper {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        table.dataTable {
            width: 100% !important;
            border-collapse: separate;
            border-spacing: 0;
        }

        table.dataTable thead th {
            background: #34495e;
            color: white;
            padding: 15px;
            font-weight: 600;
            border: none;
        }

        table.dataTable tbody td {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
            vertical-align: middle;
        }

        table.dataTable tbody tr:hover {
            background: #f8f9fa;
        }

        /* Status Badges */
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-resolved {
            background: #d4edda;
            color: #155724;
        }

        /* Rating Stars */
        .rating-stars {
            color: #f39c12;
            font-size: 16px;
        }

        /* Action Button */
        .btn-resolve {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-resolve:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-resolved {
            background: #95a5a6;
            cursor: not-allowed;
        }

        /* Complaint Text */
        .complaint-text {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .loading i {
            font-size: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .content {
                margin-right: 0;
            }

            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css">
    <script src="js/config.js"></script>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-crown"></i> لوحة التحكم</h2>
            <p>إدارة الشكاوى</p>
        </div>

        <div class="sidebar-menu">
            <button onclick="location.href='admin.html'">
                <i class="fas fa-chart-line"></i>
                <span>الإحصائيات</span>
            </button>
            <button class="active">
                <i class="fas fa-flag"></i>
                <span>الشكاوى والتقييمات</span>
            </button>
        </div>

        <button class="logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>تسجيل خروج</span>
        </button>
    </div>

    <div class="content">
        <div class="page-header">
            <h1><i class="fas fa-flag"></i> إدارة الشكاوى والتقييمات</h1>
            <p>متابعة وحل شكاوى العملاء وإدارة التقييمات</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card total">
                <div class="number" id="totalComplaints">0</div>
                <div class="label">إجمالي الشكاوى</div>
            </div>
            <div class="stat-card pending">
                <div class="number" id="pendingComplaints">0</div>
                <div class="label">قيد الانتظار</div>
            </div>
            <div class="stat-card resolved">
                <div class="number" id="resolvedComplaints">0</div>
                <div class="label">تم الحل</div>
            </div>
        </div>

        <div class="filter-section">
            <label><i class="fas fa-filter"></i> تصفية حسب الحالة:</label>
            <select id="statusFilter" onchange="filterComplaints()">
                <option value="all">الكل</option>
                <option value="pending">قيد الانتظار</option>
                <option value="resolved">تم الحل</option>
            </select>
        </div>

        <table id="complaintsTable" class="display">
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>العميل</th>
                    <th>تفاصيل الشكوى</th>
                    <th>قيمة الطلب</th>
                    <th>الحالة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="loading"><i class="fas fa-spinner"></i> جاري التحميل...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('token') || localStorage.getItem('adminToken');
        if (!token) window.location.href = 'admin-login.html';

        let complaintsData = [];
        let complaintsTable;

        async function loadComplaints() {
            try {
                const res = await fetch(`${API_URL}/api/complaints`, {
                    headers: window.Auth.getAuthHeader()
                });

                if (!res.ok) {
                    if (res.status === 403) {
                        Swal.fire('خطأ', 'ليس لديك صلاحية الوصول', 'error');
                        return;
                    }
                    throw new Error('Failed to load complaints');
                }

                const complaints = await res.json();
                complaintsData = complaints;

                // Update stats
                updateStats(complaints);

                // Initialize DataTable
                if ($.fn.DataTable.isDataTable('#complaintsTable')) {
                    $('#complaintsTable').DataTable().destroy();
                }

                const tableData = complaints.map(complaint => {
                    const orderId = complaint.orderId?._id?.substring(0, 8) || 'N/A';
                    const clientName = complaint.client?.name || '---';
                    const clientPhone = complaint.client?.phone || '---';
                    const reason = complaint.reason || '---';
                    const description = complaint.description || 'لا يوجد';
                    const status = complaint.status || 'pending';
                    const orderPrice = complaint.orderId?.price || 0;

                    const statusHtml = `<span class="status-badge status-${status}">
                        ${status === 'resolved' ? 'تم الحل' : 'قيد الانتظار'}
                    </span>`;

                    const actionHtml = status === 'pending'
                        ? `<button class="btn-resolve" onclick="resolveComplaint('${complaint._id}')">
                            <i class="fas fa-check"></i> تم الحل
                           </button>`
                        : `<button class="btn-resolve btn-resolved" disabled>
                            <i class="fas fa-check-circle"></i> محلول
                           </button>`;

                    return [
                        orderId,
                        `<div><strong>${clientName}</strong><br><small>${clientPhone}</small></div>`,
                        `<div><strong>${reason}</strong><br><small class="complaint-text" title="${description}">${description}</small></div>`,
                        `${orderPrice} ج`,
                        statusHtml,
                        actionHtml
                    ];
                });

                complaintsTable = $('#complaintsTable').DataTable({
                    data: tableData,
                    language: {
                        url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/ar.json'
                    },
                    pageLength: 10,
                    order: [[4, 'asc']] // Sort by status (pending first)
                });

            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ',
                    text: 'فشل تحميل الشكاوى',
                    confirmButtonText: 'حسناً'
                });
            }
        }

        function updateStats(complaints) {
            const total = complaints.length;
            const pending = complaints.filter(c => c.status === 'pending').length;
            const resolved = complaints.filter(c => c.status === 'resolved').length;

            document.getElementById('totalComplaints').textContent = total;
            document.getElementById('pendingComplaints').textContent = pending;
            document.getElementById('resolvedComplaints').textContent = resolved;
        }

        function filterComplaints() {
            const filter = document.getElementById('statusFilter').value;

            if (filter === 'all') {
                complaintsTable.search('').draw();
            } else {
                const searchTerm = filter === 'pending' ? 'قيد الانتظار' : 'تم الحل';
                complaintsTable.column(4).search(searchTerm).draw();
            }
        }

        async function resolveComplaint(id) {
            const result = await Swal.fire({
                title: 'تأكيد الحل',
                text: 'هل تم حل هذه الشكوى فعلاً؟',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'نعم، تم الحل',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#27ae60',
                cancelButtonColor: '#95a5a6'
            });

            if (!result.isConfirmed) return;

            try {
                const res = await fetch(`/api/complaints/${id}/resolve`, {
                    method: 'PUT',
                    headers: window.Auth.getAuthHeader()
                });

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'تم بنجاح',
                        text: 'تم وضع علامة على الشكوى كمحلولة وإرسال إشعار للعميل',
                        timer: 2000,
                        showConfirmButton: false
                    });
                    loadComplaints();
                } else {
                    throw new Error('Failed to resolve complaint');
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ',
                    text: 'فشل حل الشكوى',
                    confirmButtonText: 'حسناً'
                });
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'admin-login.html';
        }

        // Initialize
        loadComplaints();
    </script>

    <!-- Auth Helper & App Core -->
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
