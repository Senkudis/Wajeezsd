<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الطلبات المتاحة | وجيز</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.4">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css?v=97af4497">
    <link rel="stylesheet" href="css/enhanced-styles.css?v=3dc00ed1">
    <link rel="stylesheet" href="css/dark-mode.css?v=f21a3ab5">
    <script src="js/config.js?v=b84e6b6a"></script>
    <script src="js/fetch-retry.js?v=069d96ba"></script>
    <script src="js/theme-manager.js?v=a33a528b"></script>
    <script src="js/auth-helper.js?v=849c502f"></script>

    <style>
        /* ───── بطاقات أطلبات أصغر وأنظف (توحيد مع صفحة "طلباتي") ───── */
        #orders-list .card { border-radius: 15px !important; box-shadow: 0 2px 10px rgba(15,23,42,0.06) !important; }
        #orders-list .card-header { padding-top: 10px !important; padding-bottom: 6px !important; }
        #orders-list .card-body.px-3 { padding-left: 12px !important; padding-right: 12px !important; padding-bottom: 12px !important; }
        #orders-list .card .p-3 { padding: 10px !important; }
        #orders-list .card .p-2 { padding: 8px !important; }
        #orders-list .card .mb-3 { margin-bottom: 9px !important; }
        #orders-list .card h5 { font-size: 1.05rem !important; }
        #orders-list .card .fs-5 { font-size: 1rem !important; }
        #orders-list .card .fs-6 { font-size: 0.9rem !important; }
        #orders-list .card .btn { font-size: 13px !important; }
        #orders-list .card .alert { padding: 8px 10px !important; margin-bottom: 9px !important; }
        #orders-list .card img { max-height: 150px !important; }
    </style>
</head>

<body class="bg-light">

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white rounded-circle p-2 shadow-sm">
                        <i class="bi bi-bicycle text-success fs-4"></i>
                    </div>
                    <div>
                        <h2 class="h6 fw-bold mb-0 text-white">
                            الطلبات المتاحة
                            <span id="orders-count-badge" class="badge bg-warning text-dark rounded-pill ms-1 align-middle" style="display:none;">0</span>
                        </h2>
                        <p class="small text-white-50 mb-0">فرص جديدة لزيادة دخلك 💰</p>
                    </div>
                </div>
                <button onclick="fetchOrders()" class="btn btn-sm btn-light rounded-pill fw-bold" title="تحديث">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Orders Grid -->
    <div class="container mt-3">
        <!-- 🔔 Sound Enable Button (Shown if Autoplay blocked) -->
        <div id="sound-enable-banner"
            class="alert alert-warning d-flex align-items-center justify-content-between mb-3 d-none" role="alert">
            <div>
                <i class="bi bi-volume-mute-fill fs-4 me-2"></i>
                <strong>تفعيل التنبيهات الصوتية</strong>
            </div>
            <button onclick="enableAudio()" class="btn btn-sm btn-dark">تفعيل الآن</button>
        </div>

        <!-- Orders List -->
        <div id="orders-list" class="row g-3">
            <!-- Skeleton Loaders -->
            <div class="col-12">
                <div class="skeleton-card skeleton">
                    <div class="skeleton-avatar skeleton"></div>
                    <div class="skeleton-card-body">
                        <div class="skeleton-title skeleton"></div>
                        <div class="skeleton-text skeleton"></div>
                        <div class="skeleton-text skeleton" style="width: 80%"></div>
                        <div class="skeleton-btn skeleton mt-2"></div>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div class="skeleton-card skeleton">
                    <div class="skeleton-avatar skeleton"></div>
                    <div class="skeleton-card-body">
                        <div class="skeleton-title skeleton"></div>
                        <div class="skeleton-text skeleton"></div>
                        <div class="skeleton-text skeleton" style="width: 80%"></div>
                        <div class="skeleton-btn skeleton mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="mobile-nav-glass">
        <a href="captain-dashboard.html" class="nav-item-link">
            <i class="bi bi-house-door-fill"></i>
        </a>
        <a href="captain-orders.html" class="nav-item-link active">
            <i class="bi bi-bicycle"></i>
        </a>
        <a href="captain-missions.html" class="nav-item-link">
            <i class="bi bi-card-checklist"></i>
        </a>
        <a href="captain-notifications.html" class="nav-item-link">
            <i class="bi bi-bell-fill"></i>
        </a>
        <a href="captain-profile.html" class="nav-item-link">
            <i class="bi bi-person-circle"></i>
        </a>
    </nav>

    <!-- Modal for Image Preview -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-body p-0 overflow-hidden rounded-4">
                    <img src="" id="preview-img" class="w-100 object-fit-cover">
                </div>
                <div class="modal-footer border-top-0 p-2">
                    <button type="button" class="btn btn-secondary w-100 rounded-pill fw-bold"
                        data-bs-dismiss="modal">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="notification-toast.js"></script>

    <script>
        // Check Auth
        const token = window.Auth?.getToken() || localStorage.getItem('token');
        const userId = localStorage.getItem('userId');

        if (!token) { window.location.href = 'captain-login.html'; throw new Error('no token'); }
        // Guard: initNotificationSocket is defined in app-core.js (module) — may not be ready yet
        if (userId && typeof initNotificationSocket === 'function') initNotificationSocket(userId);

        // 🛡️ BUG #13: Race-condition guard — prevent double-accept
        let isAccepting = false;

        // ✅ Live commission rate from Settings — loaded once at start
        let commissionRate = 0.15; // default fallback
        (async () => {
            try {
                const res = await fetch(`${API_URL}/api/admin/pricing`, { headers: window.Auth.getAuthHeader() });
                if (res.ok) {
                    const d = await res.json();
                    if (typeof d.commissionRate === 'number') commissionRate = d.commissionRate;
                    console.log('💰 Live commission rate:', (commissionRate * 100).toFixed(1) + '%');
                }
            } catch (e) { console.warn('Commission rate fetch failed, using 15%'); }
        })();

        // 🖼️ عرض الصورة من الخريطة (آمن مع Base64 الطويلة)
        function showImageByKey(key) {
            const src = orderImagesMap[key];
            if (!src) return;
            document.getElementById('preview-img').src = src;
            new bootstrap.Modal(document.getElementById('imageModal')).show();
        }

        // 🧾 عرض إيصال الدفع من الخريطة
        function viewReceiptByKey(orderId, key) {
            const src = orderImagesMap[key];
            if (!src) return;
            Swal.fire({
                title: 'إشعار الدفع 🧾',
                html: `<img src="${src}" style="width:100%; border-radius:12px; max-height:70vh; object-fit:contain;" alt="إيصال الدفع">`,
                showConfirmButton: false,
                showCloseButton: true,
                width: '90%',
                padding: '1rem'
            });
        }

        async function fetchOrders() {
            document.getElementById('orders-list').innerHTML = `
            <div class="col-12"><div class="skeleton-card skeleton"><div class="skeleton-avatar skeleton"></div><div class="skeleton-card-body"><div class="skeleton-title skeleton"></div><div class="skeleton-text skeleton"></div><div class="skeleton-text skeleton" style="width: 80%"></div><div class="skeleton-btn skeleton mt-2"></div></div></div></div>
            <div class="col-12"><div class="skeleton-card skeleton"><div class="skeleton-avatar skeleton"></div><div class="skeleton-card-body"><div class="skeleton-title skeleton"></div><div class="skeleton-text skeleton"></div><div class="skeleton-text skeleton" style="width: 80%"></div><div class="skeleton-btn skeleton mt-2"></div></div></div></div>
            `;
            try {
                const res = await fetch(`${API_URL}/api/orders`, { headers: window.Auth.getAuthHeader() });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || `خطأ في السيرفر: ${res.status}`);
                }
                const data = await res.json();
                renderOrders(data.orders || []);
            } catch (err) {
                console.error('Fetch Orders Error:', err);
                document.getElementById('orders-list').innerHTML =
                    `<div class="col-12 text-center text-muted py-5">
                        <i class="bi bi-wifi-off fs-1 text-secondary mb-3"></i>
                        <p class="fw-bold">فشل في تحميل البيانات</p>
                        <small class="text-danger">${err.message}</small>
                        <div class="mt-3"><button class="btn btn-outline-success rounded-pill" onclick="fetchOrders()">إعادة المحاولة</button></div>
                    </div>`;
            }
        }

        // 🗺️ خريطة لتخزين صور الطلبات (Base64 تكون طويلة جداً لوضعها في onclick)
        const orderImagesMap = {};

        function renderOrders(orders) {
            const container = document.getElementById('orders-list');
            container.innerHTML = '';

            // 🔢 حدّث عدّاد الطلبات + عنوان التبويب حتى يلاحظه الكابتن ولو كان التطبيق في الخلفية
            const count = orders.length;
            document.title = count > 0 ? `(${count}) الطلبات المتاحة | وجيز` : 'الطلبات المتاحة | وجيز';
            const _cntBadge = document.getElementById('orders-count-badge');
            if (_cntBadge) {
                _cntBadge.textContent = count;
                _cntBadge.style.display = count > 0 ? 'inline-flex' : 'none';
            }

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center text-muted py-5">
                        <div class="bg-white rounded-circle p-4 d-inline-block shadow-sm mb-3">
                            <i class="bi bi-inbox fs-1 text-secondary"></i>
                        </div>
                        <p class="fw-bold">لا توجد طلبات جديدة حالياً</p>
                        <small>خليك قريب، الطلبات بتجي في أي لحظة!</small>
                    </div>`;
                return;
            }

            orders.forEach(order => {
                // ✅ Use live commission rate from Settings (not hardcoded 10%)
                const netProfit = order.netRevenue || (order.price * (1 - commissionRate));

                // ✅ استخدام الإحداثيات إذا متوفرة، وإلا العنوان النصي
                const pickupCoords = (order.pickup?.lat && order.pickup?.lng)
                    ? `${order.pickup.lat},${order.pickup.lng}`
                    : encodeURIComponent(order.pickup?.address || '');
                const dropoffCoords = (order.dropoff?.lat && order.dropoff?.lng)
                    ? `${order.dropoff.lat},${order.dropoff.lng}`
                    : encodeURIComponent(order.dropoff?.address || '');

                // 🧭 توصيل متعدد النقاط
                const isMulti = order.isMultiStop && Array.isArray(order.stops) && order.stops.length >= 2;
                const stopCoord = (s) => (s.lat && s.lng) ? `${s.lat},${s.lng}` : encodeURIComponent(s.address || '');

                // رابط المسار الكامل — مع نقاط وسطية عند تعدّد النقاط
                let routeLink;
                if (isMulti) {
                    const origin = stopCoord(order.stops[0]);
                    const destination = stopCoord(order.stops[order.stops.length - 1]);
                    const mids = order.stops.slice(1, -1).map(stopCoord).join('|');
                    routeLink = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${mids ? `&waypoints=${mids}` : ''}&travelmode=driving`;
                } else {
                    routeLink = `https://www.google.com/maps/dir/?api=1&origin=${pickupCoords}&destination=${dropoffCoords}&travelmode=driving`;
                }

                // بناء قائمة المحطات المرتّبة (عرض فقط في صفحة الطلبات المتاحة)
                const stopsTimeline = isMulti ? order.stops.map((s, i) => {
                    const isP = s.type === 'pickup';
                    return `<div class="mb-2 position-relative">
                        <span class="position-absolute top-0 start-0 translate-middle p-1 ${isP ? 'bg-primary' : 'bg-danger'} border border-white rounded-circle" style="left:-2px;"></span>
                        <div class="d-flex justify-content-between align-items-start">
                            <div style="min-width:0;">
                                <small class="text-muted d-block">${isP ? 'استلام' : 'تسليم'} ${i + 1}${s.contactName ? ' — ' + s.contactName : ''}:</small>
                                <strong class="text-dark d-block" style="font-size:0.9rem;">${s.address || ''}</strong>
                                ${s.contactPhone ? `<a href="tel:${s.contactPhone}" class="text-success small fw-bold text-decoration-none" dir="ltr"><i class="bi bi-telephone-fill"></i> ${s.contactPhone}</a>` : ''}
                            </div>
                            <button class="btn btn-sm ${isP ? 'btn-primary' : 'btn-danger'} text-white border-0 rounded-pill px-2 py-1 nav-btn" style="font-size:0.72rem;"
                                data-type="${s.type}" data-lat="${s.lat || ''}" data-lng="${s.lng || ''}" data-addr="${(s.address || '').replace(/"/g, '&quot;')}" onclick="openMapsNav(this)">
                                <i class="bi bi-geo-alt-fill"></i>
                            </button>
                        </div>
                    </div>`;
                }).join('') : '';

                // 🖼️ صورة الطرد — تُخزَّن في الخريطة لتفادي مشكلة HTML attribute overflow
                let imgHtml = '';
                if (order.parcelImage) {
                    const imgKey = `parcel_${order._id}`;
                    const parcelSrc = (typeof getFullImageUrl === 'function') ? getFullImageUrl(order.parcelImage) : order.parcelImage;
                    orderImagesMap[imgKey] = parcelSrc;
                    imgHtml = `<div class="position-relative mt-2">
                        <img src="${parcelSrc}" class="w-100 rounded-3 object-fit-cover shadow-sm"
                             style="height: 180px; cursor: pointer;"
                             data-img-key="${imgKey}"
                             onclick="showImageByKey(this.dataset.imgKey)"
                             onerror="this.parentElement.style.display='none'"
                             alt="صورة الطرد">
                        <span class="position-absolute bottom-0 end-0 m-2 badge bg-dark bg-opacity-75 rounded-pill"><i class="bi bi-zoom-in"></i> تكبير</span>
                    </div>`;
                } // ← FIX: closing brace for if (order.parcelImage)

                const isShop = order.orderType === 'shop';
                const isErrand = order.orderType === 'errand';
                const headerClass = isShop ? 'bg-success bg-opacity-10 border-bottom border-success border-opacity-25'
                    : isErrand ? 'border-bottom' : 'bg-transparent border-bottom-0';
                const badgeHtml = isShop
                    ? `<span class="badge bg-success shadow-sm px-3 rounded-pill"><i class="bi bi-shop me-1"></i> طلب محل: ${order.shopName || ''}</span>`
                    : isErrand
                        ? `<span class="badge shadow-sm px-3 rounded-pill" style="background:#7c3aed;"><i class="bi bi-bag-heart-fill me-1"></i> اشترِ لي: ${order.shopName || ''}</span>`
                        : `<span class="badge bg-light text-secondary border">#${order._id.slice(-4)}</span>`;

                // 🛡️ Pre-paid disclaimer badge (shop orders only)
                const prepaidBadgeHtml = isShop ? `
                    <div class="alert alert-success border-0 py-2 px-3 mb-3 d-flex align-items-center gap-2" style="font-size:0.82rem; background:rgba(25,135,84,0.1);">
                        <i class="bi bi-shield-check-fill text-success fs-5"></i>
                        <div>
                            <strong class="d-block text-success">الأغراض مدفوعة مسبقاً</strong>
                            <span class="text-muted">الكابتن للتوصيل فقط — لا تدفع للمحل</span>
                        </div>
                    </div>` : '';

                // 🛍️ errand disclaimer: الكابتن يشتري بماله ثم يسترد + الأجرة نقداً
                const errandBadgeHtml = isErrand ? `
                    <div class="alert border-0 py-2 px-3 mb-3 d-flex align-items-center gap-2" style="font-size:0.82rem; background:rgba(124,58,237,0.1);">
                        <i class="bi bi-info-circle-fill fs-5" style="color:#7c3aed;"></i>
                        <div>
                            <strong class="d-block" style="color:#6d28d9;">خدمة شراء — أدخِل سعر البضاعة وانتظر موافقة العميل قبل الشراء</strong>
                            <span class="text-muted">تسترد ثمن البضاعة + أجرة التوصيل (${order.price} ج.س) نقداً عند التسليم</span>
                        </div>
                    </div>` : '';

                // 🧾 Shop Order Details box (description of items the client agreed on)
                const shopDetails = order.shopOrderDetails || (order.items ? order.items.join('، ') : '');
                const detailsItemsHtml = isShop && shopDetails ? `
                    <div class="bg-success bg-opacity-10 p-3 rounded-3 mb-3 border border-success border-opacity-25">
                        <h6 class="fw-bold text-success mb-2"><i class="bi bi-receipt me-1"></i> تفاصيل الطلبية:</h6>
                        <p class="mb-0 text-dark small" style="white-space:pre-line;">${shopDetails}</p>
                    </div>` : '';

                // 🛍️ errand: قائمة المطلوب شراؤه + الميزانية
                const errandItemsHtml = isErrand && Array.isArray(order.items) && order.items.length ? `
                    <div class="p-3 rounded-3 mb-3" style="background:rgba(124,58,237,0.08);border:1px solid #ddd6fe;">
                        <h6 class="fw-bold mb-2" style="color:#6d28d9;"><i class="bi bi-bag-check-fill me-1"></i> المطلوب شراؤه${order.errand && order.errand.budget ? ` — ميزانية تقديرية: ${order.errand.budget} ج.س` : ''}:</h6>
                        <ul class="mb-0 ps-3 text-dark small">${order.items.map(it => `<li>${(it || '').toString().replace(/[<>]/g, '')}</li>`).join('')}</ul>
                    </div>` : '';

                // 📷 زر عرض إيصال الدفع (طلبات المحل فقط) — يُخزَّن في الخريطة
                let receiptBtnHtml = '';
                if (isShop && order.receiptImage) {
                    const rKey = `receipt_${order._id}`;
                    const receiptSrc = (typeof getFullImageUrl === 'function') ? getFullImageUrl(order.receiptImage) : order.receiptImage;
                    orderImagesMap[rKey] = receiptSrc;
                    receiptBtnHtml = `<button class="btn btn-outline-warning w-100 fw-bold rounded-pill mb-2"
                        data-img-key="${rKey}"
                        onclick="viewReceiptByKey('${order._id}', this.dataset.imgKey)">
                        <i class="bi bi-file-earmark-image me-1"></i> عرض إشعار الدفع
                    </button>`;
                }


                const html = `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card glass-card card-hover h-100 ${isShop ? 'border border-success border-2 shadow' : 'border-0'}">
                            <div class="card-header ${headerClass} pt-3 px-3 d-flex justify-content-between align-items-center">
                                ${badgeHtml}
                                <div class="text-end">
                                    <h5 class="fw-bold text-primary mb-0">${order.price} ج.س</h5>
                                    <small class="text-success fw-bold" style="font-size: 0.75rem;">صافي ربحك: ${netProfit.toFixed(0)} ج.س</small>
                                </div>
                            </div>
                            
                            <div class="card-body px-3 pb-3 pt-0">
                                <div class="d-flex align-items-center gap-2 mb-3">
                                    <div class="bg-light rounded-circle p-2 text-primary">
                                        <i class="bi bi-person-fill"></i>
                                    </div>
                                    <h6 class="fw-bold fs-6 mb-0">${order.client?.name || 'عميل'}</h6>
                                </div>

                                <!-- ✅ تفاصيل جهات الاتصال — ظاهرة قبل القبول -->
                                <div class="bg-light rounded-3 p-3 mb-3" style="font-size:0.82rem;">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <small class="text-muted d-block mb-1"><i class="bi bi-telephone-outbound text-primary"></i> جهة الاستلام</small>
                                            <strong class="d-block">${order.pickup?.contactName || '—'}</strong>
                                            ${order.pickup?.contactPhone ? `<a href="tel:${order.pickup.contactPhone}" class="text-decoration-none text-success small fw-bold" dir="ltr"><i class="bi bi-telephone-fill"></i> ${order.pickup.contactPhone}</a>` : ''}
                                        </div>
                                        <div class="col-6 border-start">
                                            <small class="text-muted d-block mb-1"><i class="bi bi-telephone-inbound text-danger"></i> جهة التسليم</small>
                                            <strong class="d-block">${order.dropoff?.receiverName || '—'}</strong>
                                            ${order.dropoff?.receiverPhone ? `<a href="tel:${order.dropoff.receiverPhone}" class="text-decoration-none text-success small fw-bold" dir="ltr"><i class="bi bi-telephone-fill"></i> ${order.dropoff.receiverPhone}</a>` : ''}
                                        </div>
                                    </div>
                                </div>

                                <!-- 📝 ملاحظات الطلب — ظاهرة قبل القبول -->
                                ${order.details ? `
                                <div class="alert alert-warning border-0 py-2 px-3 mb-3" style="font-size:0.82rem; background:rgba(255,193,7,0.12);">
                                    <div class="d-flex gap-2 align-items-start">
                                        <i class="bi bi-chat-left-text-fill text-warning fs-5"></i>
                                        <div>
                                            <strong class="d-block text-dark mb-1">ملاحظات العميل:</strong>
                                            <span class="text-dark" style="white-space:pre-line;">${order.details}</span>
                                        </div>
                                    </div>
                                </div>` : ''}

                                ${isMulti ? `
                                <div class="mb-2">
                                    <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 rounded-pill">
                                        <i class="bi bi-signpost-split-fill me-1"></i>رحلة متعددة النقاط — ${order.stops.filter(s=>s.type==='pickup').length} استلام و${order.stops.filter(s=>s.type==='dropoff').length} تسليم
                                    </span>
                                </div>
                                <div class="timeline position-relative ps-3 border-start border-2 border-light ms-2 mb-3">
                                    ${stopsTimeline}
                                </div>` : `
                                <div class="timeline position-relative ps-3 border-start border-2 border-light ms-2 mb-3">
                                    <!-- نقطة الاستلام -->
                                    <div class="mb-3 position-relative">
                                        <span class="position-absolute top-0 start-0 translate-middle p-1 bg-primary border border-white rounded-circle" style="left: -2px;"></span>
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <small class="text-muted d-block">من:</small>
                                                <strong class="text-dark fs-6 d-block">${order.pickup?.address}</strong>
                                            </div>
                                            <button 
                                                class="btn btn-sm btn-primary text-white border-0 rounded-pill px-2 py-1 d-flex align-items-center gap-1 nav-btn"
                                                style="font-size:0.75rem;"
                                                data-type="pickup"
                                                data-lat="${order.pickup?.lat || ''}"
                                                data-lng="${order.pickup?.lng || ''}"
                                                data-addr="${(order.pickup?.address || '').replace(/"/g, '&quot;')}"
                                                onclick="openMapsNav(this)">
                                                <i class="bi bi-geo-alt-fill"></i> اتجاهات
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <!-- نقطة التسليم -->
                                    <div class="position-relative">
                                        <span class="position-absolute top-0 start-0 translate-middle p-1 bg-danger border border-white rounded-circle" style="left: -2px;"></span>
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <small class="text-muted d-block">إلى:</small>
                                                <strong class="text-dark fs-6 d-block">${order.dropoff?.address}</strong>
                                            </div>
                                            <button 
                                                class="btn btn-sm btn-danger text-white border-0 rounded-pill px-2 py-1 d-flex align-items-center gap-1 nav-btn"
                                                style="font-size:0.75rem;"
                                                data-type="dropoff"
                                                data-lat="${order.dropoff?.lat || ''}"
                                                data-lng="${order.dropoff?.lng || ''}"
                                                data-addr="${(order.dropoff?.address || '').replace(/"/g, '&quot;')}"
                                                data-from-lat="${order.pickup?.lat || ''}"
                                                data-from-lng="${order.pickup?.lng || ''}"
                                                data-from-addr="${(order.pickup?.address || '').replace(/"/g, '&quot;')}"
                                                onclick="openMapsNav(this)">
                                                <i class="bi bi-flag-fill"></i> اتجاهات
                                            </button>
                                        </div>
                                    </div>
                                </div>`}

                                <!-- زر عرض المسار الكامل -->
                                <div class="mb-3 text-center">
                                    <a href="${routeLink}" target="_blank" class="btn btn-sm btn-outline-secondary rounded-pill w-100 border-dashed">
                                        <i class="bi bi-map me-1"></i> معاينة المسار والمسافة (Google Maps)
                                    </a>
                                </div>
                                
                                
                                ${prepaidBadgeHtml}

                                ${errandBadgeHtml}

                                ${detailsItemsHtml}

                                ${errandItemsHtml}

                                ${receiptBtnHtml}

                                ${imgHtml}

                                <div class="d-flex gap-2 mt-3 text-white">
                                    ${order.status === 'pending' ? `<button class="btn btn-success flex-grow-1 fw-bold rounded-pill shadow-sm" onclick="acceptOrder('${order._id}')">
                                        <i class="bi bi-check-circle me-1"></i> قبول
                                    </button>` : ''}
                                    ${order.myOffer
                                        ? `<button class="btn btn-outline-warning flex-grow-1 fw-bold rounded-pill border-2" onclick="withdrawNegotiation('${order._id}')">
                                                <i class="bi bi-dash-circle me-1"></i> سحب عرضي (${order.myOffer.proposedPrice} ج.س)
                                            </button>`
                                        : (order.status === 'pending' ? `<button class="btn btn-outline-primary flex-grow-1 fw-bold rounded-pill border-2" onclick="negotiateOrder('${order._id}', ${order.price})">
                                                <i class="bi bi-chat-dots me-1"></i> تفاوض
                                            </button>` : '')
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        async function acceptOrder(id) {
            // 🛡️ BUG #13: Prevent double-click race condition
            if (isAccepting) return;
            isAccepting = true;

            // Disable the specific accept button immediately before Swal opens
            const btn = document.querySelector(`button[onclick="acceptOrder('${id}')"]`);
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> جاري...';
            }

            const result = await Swal.fire({
                title: 'قبول الطلب؟',
                text: "سيتم تعيين الطلب لك وتبليغ العميل",
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'نعم، توكلنا! 🚀',
                cancelButtonText: 'تراجع',
                confirmButtonColor: '#04553A',
                cancelButtonColor: '#7f8c8d'
            });

            if (result.isConfirmed) {
                if (btn) {
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> جاري التعيين...';
                }
                try {
                    const res = await fetch(`${API_URL}/api/orders/${id}/accept`, {
                        method: 'PUT',
                        headers: window.Auth.getAuthHeader()
                    });
                    if (res.ok) {
                        isAccepting = false;
                        Swal.fire({
                            title: 'مبروك!',
                            text: 'تم قبول الطلب بنجاح',
                            icon: 'success',
                            confirmButtonColor: '#04553A'
                        }).then(() => window.location.href = 'captain-missions.html');
                    } else {
                        const err = await res.json();
                        Swal.fire('عذراً', err.message, 'error');
                        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-circle me-1"></i> قبول'; }
                        isAccepting = false;
                    }
                } catch (e) {
                    Swal.fire('خطأ', 'فشل الاتصال', 'error');
                    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-circle me-1"></i> قبول'; }
                    isAccepting = false;
                }
            } else {
                // User cancelled — restore button
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-circle me-1"></i> قبول'; }
                isAccepting = false;
            }
        }

        // ========================================
        // 💬 نظام التفاوض الكامل
        // ========================================
        let activeNegotiationOrderId = null; // Track active negotiation

        // ⏱️ مدة صلاحية العرض تأتي من السيرفر (utils/negotiation.js عبر /api/auth/app-config).
        // الرقم كان مكتوباً هنا يدوياً في نصّين، فبقي "5 دقائق" بعد رفع المدة على
        // السيرفر — الكابتن يقرأ مدة لا تطابق ما يُنفّذ فعلاً.
        let negotiationTtlMin = null;
        async function getNegotiationTtl() {
            if (negotiationTtlMin) return negotiationTtlMin;
            try {
                const res = await fetch(`${API_URL}/api/auth/app-config`);
                const cfg = await res.json();
                if (Number.isFinite(cfg.negotiationTtlMinutes)) {
                    negotiationTtlMin = cfg.negotiationTtlMinutes;
                }
            } catch (_) { /* بلا إنترنت: نكتب المدة بصيغة محيّدة أدناه */ }
            return negotiationTtlMin;
        }
        // نصّ المدة: بلا قيمة من السيرفر لا نخترع رقماً قد يكون خاطئاً
        const ttlText = (ttl) => (ttl ? `${ttl} دقائق` : 'مدة محدودة');

        async function negotiateOrder(id, originalPrice) {
            const ttl = await getNegotiationTtl();
            const { value: proposedPrice, isConfirmed } = await Swal.fire({
                title: '💬 اقتراح سعر',
                html: `
                    <p class="text-muted mb-3">السعر الأصلي: <strong class="text-primary">${originalPrice} ج.س</strong></p>
                    <label class="form-label fw-bold">اقترح سعرك:</label>
                    <div class="input-group">
                        <input type="number" id="proposed-price-input" class="form-control form-control-lg text-center fw-bold" 
                               placeholder="0" min="1" step="100" value="${originalPrice}">
                        <span class="input-group-text fw-bold">ج.س</span>
                    </div>
                    <small class="text-muted mt-2 d-block">سيتم إشعار العميل بعرضك وينتظر موافقته (${ttlText(ttl)})</small>
                `,
                confirmButtonText: '📤 إرسال العرض',
                cancelButtonText: 'إلغاء',
                showCancelButton: true,
                confirmButtonColor: '#04553A',
                cancelButtonColor: '#7f8c8d',
                preConfirm: () => {
                    const val = parseFloat(document.getElementById('proposed-price-input').value);
                    if (!val || val <= 0) {
                        Swal.showValidationMessage('يرجى إدخال سعر صحيح أكبر من صفر');
                        return false;
                    }
                    return val;
                }
            });

            if (!isConfirmed || !proposedPrice) return;

            try {
                const res = await fetch(`${API_URL}/api/orders/${id}/negotiate`, {
                    method: 'PUT',
                    headers: { ...window.Auth.getAuthHeader(), 'Content-Type': 'application/json' },
                    body: JSON.stringify({ proposedPrice })
                });
                const data = await res.json();

                if (res.ok) {
                    activeNegotiationOrderId = id;
                    Swal.fire({
                        title: '✅ تم إرسال العرض!',
                        html: `
                            <p>عرضك <strong class="text-success">${proposedPrice} ج.س</strong> أُرسل للعميل.</p>
                            <p class="text-muted small">ستتلقى إشعاراً عند رده. لديك ${ttlText(ttl)}.</p>
                            <button class="btn btn-outline-danger btn-sm mt-2 rounded-pill" onclick="withdrawNegotiation('${id}'); Swal.close();">
                                <i class="bi bi-x-circle me-1"></i> سحب العرض
                            </button>
                        `,
                        icon: 'success',
                        confirmButtonText: 'حسناً',
                        confirmButtonColor: '#04553A'
                    });
                    fetchOrders(); // ✅ Refresh UI so the button changes to "Withdraw"
                } else {
                    Swal.fire('تنبيه', data.message, 'warning');
                }
            } catch (e) {
                Swal.fire('خطأ', 'فشل الاتصال بالسيرفر', 'error');
            }
        }

        async function withdrawNegotiation(id) {
            try {
                const res = await fetch(`${API_URL}/api/orders/${id}/negotiate-withdraw`, {
                    method: 'PUT',
                    headers: window.Auth.getAuthHeader()
                });
                const data = await res.json();
                if (res.ok) {
                    activeNegotiationOrderId = null;
                    Swal.fire('تم', 'تم سحب عرضك بنجاح', 'info');
                    fetchOrders(); // ✅ Refresh UI so the button changes back to "Negotiate"
                } else {
                    Swal.fire('خطأ', data.message, 'error');
                }
            } catch (e) {
                Swal.fire('خطأ', 'فشل الاتصال', 'error');
            }
        }

        function showImage(src) {
            document.getElementById('preview-img').src = src;
            new bootstrap.Modal(document.getElementById('imageModal')).show();
        }

        // 🧾 عرض إشعار الدفع للكابتن (ضغط "عرض إشعار الدفع")
        function viewReceipt(orderId, imageUrl) {
            Swal.fire({
                title: 'إشعار الدفع 🧾',
                html: `
                    <p class="text-muted small mb-3">تأكد من وجود إشعار دفع حقيقي قبل استلام الأغراض من المحل.</p>
                    <img src="${imageUrl}" class="img-fluid rounded-3 shadow" style="max-height:60vh; object-fit:contain;" alt="إشعار الدفع" />
                `,
                confirmButtonText: 'تم التحقق ✔️',
                confirmButtonColor: '#04553A',
                showCancelButton: true,
                cancelButtonText: 'إغلاق',
                width: '90%'
            });
        }

        const socket = io(API_URL, {
            transports: ['polling', 'websocket'],
            auth: { token }
        });

        socket.on('connect', () => {
            socket.emit('user_join', userId);
        });

        // 🔔 Robust Web Audio API Implementation
        let audioCtx = null;

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // Check if autoplay is blocked
                if (audioCtx.state === 'suspended' && localStorage.getItem('captain_audio_enabled') !== 'true') {
                    document.getElementById('sound-enable-banner').classList.remove('d-none');
                }
            } catch (e) { console.error('Audio API not supported'); }
        }

        // Called by user button click — unlocks audio autoplay
        function enableAudio() {
            localStorage.setItem('captain_audio_enabled', 'true');
            const banner = document.getElementById('sound-enable-banner');
            if (banner) banner.classList.add('d-none');
            // Play a silent audio to unlock autoplay permission
            const audio = new Audio('/sounds/wajeezsd-bell.wav');
            audio.volume = 0.3;
            audio.play().catch(e => console.log('Audio enable failed:', e));
        }

        function playOrderAlert(isTest = false, isShopAlert = false) {
            // ✅ Use official Wajeez bell sound for all order alerts
            const playOnce = () => {
                try {
                    const audio = new Audio('/sounds/wajeezsd-bell.wav');
                    audio.volume = isTest ? 0.4 : 1.0;
                    audio.play().catch(() => {
                        // Autoplay blocked — show enable banner
                        const banner = document.getElementById('sound-enable-banner');
                        if (banner && localStorage.getItem('captain_audio_enabled') !== 'true') banner.classList.remove('d-none');
                    });
                } catch (e) { console.error('Audio play error', e); }
            };

            playOnce();

            // 🔔 للطلبات الحقيقية: كرّر النغمة + اهتزاز حتى لا يفوت الكابتن الطلب
            if (!isTest) {
                setTimeout(playOnce, 900);
                setTimeout(playOnce, 1800);
                // اهتزاز على الويب
                try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (_) {}
                // اهتزاز أصلي عبر Capacitor Haptics إن توفّر
                try {
                    const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
                    if (H && H.vibrate) H.vibrate({ duration: 700 });
                } catch (_) {}
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initAudio);

        socket.on('new_order_available', () => {
            playOrderAlert(); // 🔊 Sound alert
            const toast = Swal.mixin({
                toast: true, position: 'top-end', showConfirmButton: false,
                timer: 3000, timerProgressBar: true
            });
            toast.fire({ icon: 'info', title: '🔔 طلب توصيل جديد وصل!' });
            fetchOrders();
        });

        // 🚗 طلب أخذه كابتن آخر → حدّث القائمة بصمت ليختفي فوراً (بدون صوت/تنبيه)
        let orderTakenTimer = null;
        socket.on('order_taken', () => {
            clearTimeout(orderTakenTimer);
            orderTakenTimer = setTimeout(fetchOrders, 400);
        });

        socket.on('shop_order_available', (data) => {
            playOrderAlert(false, true); // True for special shop alert
            const toast = Swal.mixin({
                toast: true, position: 'top-end', showConfirmButton: false,
                timer: 5000, timerProgressBar: true
            });
            toast.fire({ icon: 'success', title: '🛒 طلب محل جديد! (' + (data.shopName || '') + ')' });
            fetchOrders();
        });

        // 🔔 نتيجة التفاوض (رد العميل)
        socket.on('negotiation_resolved', (data) => {
            activeNegotiationOrderId = null;
            if (data.result === 'accepted') {
                Swal.fire({
                    title: '🎉 قبل العميل عرضك!',
                    html: `السعر النهائي: <strong class="text-success fs-4">${data.finalPrice} ج.س</strong>`,
                    icon: 'success',
                    confirmButtonText: 'عرض مهامي 🚀',
                    confirmButtonColor: '#04553A'
                }).then(() => window.location.href = 'captain-missions.html');
            } else if (data.result === 'rejected') {
                Swal.fire({
                    title: '❌ رفض العميل عرضك',
                    text: 'الطلب لا يزال متاحاً. يمكنك المحاولة مجدداً أو قبول الطلب بالسعر الأصلي.',
                    icon: 'warning',
                    confirmButtonText: 'حسناً',
                    confirmButtonColor: '#04553A'
                });
                fetchOrders(); // Refresh to show updated order
            } else if (data.result === 'order_taken') {
                Swal.fire({
                    title: 'ℹ️ تم قبول عرض كابتن آخر',
                    text: 'قبل العميل عرض كابتن آخر. تم تعيين الطلب لغيرك.',
                    icon: 'info',
                    confirmButtonText: 'حسناً',
                    confirmButtonColor: '#04553A'
                });
                fetchOrders();
            }
        });

        // ========================================
        // 🗺️ فتح Google Maps بالاتجاهات المباشرة
        // ========================================
        function openMapsNav(btn) {
            const type = btn.dataset.type;
            const lat = btn.dataset.lat;
            const lng = btn.dataset.lng;
            const addr = btn.dataset.addr;

            // الوجهة: إحداثيات إذا متوفرة، وإلا العنوان
            const dest = (lat && lng)
                ? `${lat},${lng}`
                : encodeURIComponent(addr || '');

            if (type === 'pickup') {
                // من موقع الكابتن الحالي → نقطة الاستلام.
                // ⚠️ كانت { timeout: 5000 } بلا enableHighAccuracy — نقطة انطلاق خشنة (±كيلومترات).
                window.WajeezGeo.getPrecise({ minAccuracy: 50, maxWait: 6000 })
                    .then((fix) => {
                        const origin = `${fix.lat},${fix.lng}`;
                        window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving`, '_blank');
                    })
                    .catch(() => {
                        // بلا موقع — Google Maps يحدد نقطة الانطلاق تلقائياً
                        window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`, '_blank');
                    });
            } else {
                // من نقطة الاستلام → نقطة التسليم
                const fromLat = btn.dataset.fromLat;
                const fromLng = btn.dataset.fromLng;
                const fromAddr = btn.dataset.fromAddr;
                const origin = (fromLat && fromLng)
                    ? `${fromLat},${fromLng}`
                    : encodeURIComponent(fromAddr || '');
                window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving`, '_blank');
            }
        }

        // 🔄 شبكة أمان: فحص دوري دائم كل 30 ثانية (حتى مع اتصال السوكت).
        // شبكات الموبايل قد تُسقط أحداث socket دون قطع ظاهر، فيفوت الكابتن الطلب —
        // هذا الفحص يضمن ظهور أي طلب جديد خلال 30 ثانية كحد أقصى.
        setInterval(() => {
            if (document.visibilityState === 'visible') fetchOrders();
        }, 30000);
        // تحديث فوري عند رجوع التطبيق للواجهة
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') fetchOrders();
        });
        // تحديث فوري عند إعادة الاتصال بالسوكت (بعد انقطاع الشبكة)
        socket.on('connect', () => { fetchOrders(); });

        fetchOrders().then(() => {
            // ✅ Highlight order if came from push notification
            const highlightId = new URLSearchParams(window.location.search).get('highlight');
            if (highlightId) {
                setTimeout(() => {
                    const cards = document.querySelectorAll('#orders-list .card');
                    cards.forEach(card => {
                        const acceptBtn = card.querySelector(`button[onclick*="${highlightId}"]`);
                        if (acceptBtn) {
                            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            card.style.transition = 'box-shadow 0.4s, transform 0.4s';
                            card.style.boxShadow = '0 0 0 4px rgba(10,135,84,0.5), 0 10px 30px rgba(10,135,84,0.3)';
                            card.style.transform = 'scale(1.02)';
                            setTimeout(() => {
                                card.style.boxShadow = '';
                                card.style.transform = '';
                            }, 3000);
                        }
                    });
                }, 400);
            }
        });
    </script>
