<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطلبات المتاحة | وصل-لي</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css">
    <script src="js/config.js"></script>
</head>

<body class="pb-5 mb-5 bg-light">

    <!-- Header Section -->
    <div class="app-header">
        <div class="container pt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white rounded-circle p-2 shadow-sm">
                        <i class="bi bi-bicycle text-success fs-4"></i>
                    </div>
                    <div>
                        <h2 class="h5 fw-bold mb-0 text-white">الطلبات المتاحة</h2>
                        <p class="small text-white-50 mb-0">فرص جديدة لزيادة دخلك 💰</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Orders Grid -->
    <div class="container" style="margin-top: -30px;">
        <div id="orders-container" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-2 text-muted fw-bold">جاري البحث عن طلبات حولك...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="mobile-nav-glass">
        <a href="captain-dashboard.html" class="nav-item-link">
            <i class="bi bi-house-door-fill"></i>
        </a>
        <a href="captain-orders.html" class="nav-item-link active">
            <i class="bi bi-bicycle"></i>
        </a>
        <a href="captain-missions.html" class="nav-item-link">
            <i class="bi bi-card-checklist"></i>
        </a>
        <a href="captain-notifications.html" class="nav-item-link">
            <i class="bi bi-bell-fill"></i>
        </a>
        <a href="captain-profile.html" class="nav-item-link">
            <i class="bi bi-person-circle"></i>
        </a>
    </nav>

    <!-- Modal for Image Preview -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-body p-0 overflow-hidden rounded-4">
                    <img src="" id="preview-img" class="w-100 object-fit-cover">
                </div>
                <div class="modal-footer border-top-0 p-2">
                    <button type="button" class="btn btn-secondary w-100 rounded-pill fw-bold"
                        data-bs-dismiss="modal">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="notification-toast.js"></script>

    <script>
        // Check Auth
        if (!window.Auth || !window.Auth.isAuthenticated()) {
            // Identify login page based on context or generic
            // window.location.href = "client-login.html"; // handled by specific pages usually
        }
        const token = window.Auth.getToken();
        const userId = localStorage.getItem('userId');

        if (!token) window.location.href = 'captain-login.html';
        if (userId) initNotificationSocket(userId);

        // Fetch Orders
        async function fetchOrders() {
            try {
                const res = await fetch(`${API_URL}/api/orders`, { headers: window.Auth.getAuthHeader() });
                if (!res.ok) throw new Error('Failed to fetch');
                const orders = await res.json();
                renderOrders(orders);
            } catch (err) {
                document.getElementById('orders-container').innerHTML =
                    '<div class="col-12 text-center text-muted py-5"><i class="bi bi-wifi-off fs-1 text-secondary mb-3"></i><p class="fw-bold">فشل في تحميل البيانات</p></div>';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center text-muted py-5">
                        <div class="bg-white rounded-circle p-4 d-inline-block shadow-sm mb-3">
                            <i class="bi bi-inbox fs-1 text-secondary"></i>
                        </div>
                        <p class="fw-bold">لا توجد طلبات جديدة حالياً</p>
                        <small>خليك قريب، الطلبات بتجي في أي لحظة!</small>
                    </div>`;
                return;
            }

            orders.forEach(order => {
                const netProfit = order.netRevenue || (order.price * 0.9);

                // روابط الخرائط
                const pickupLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.pickup?.address)}`;
                const dropoffLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.dropoff?.address)}`;
                // رابط المسار الكامل (من الاستلام للتسليم)
                const routeLink = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(order.pickup?.address)}&destination=${encodeURIComponent(order.dropoff?.address)}&travelmode=driving`;

                const imgHtml = order.parcelImage ?
                    `<div class="position-relative mt-2">
                        <img src="${order.parcelImage}" class="w-100 rounded-3 object-fit-cover shadow-sm" style="height: 180px; cursor: pointer;" onclick="showImage('${order.parcelImage}')" alt="صورة الطرد">
                        <span class="position-absolute bottom-0 end-0 m-2 badge bg-dark bg-opacity-75 rounded-pill"><i class="bi bi-zoom-in"></i> تكبير</span>
                     </div>` : '';

                const html = `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card glass-card card-hover h-100 border-0">
                            <div class="card-header bg-transparent border-bottom-0 pt-3 px-3 d-flex justify-content-between align-items-center">
                                <span class="badge bg-light text-secondary border">#${order._id.slice(-4)}</span>
                                <div class="text-end">
                                    <h5 class="fw-bold text-primary mb-0">${order.price} ج.س</h5>
                                    <small class="text-success fw-bold" style="font-size: 0.75rem;">صافي ربحك: ${netProfit.toFixed(0)} ج.س</small>
                                </div>
                            </div>
                            
                            <div class="card-body px-3 pb-3 pt-0">
                                <div class="d-flex align-items-center gap-2 mb-3">
                                    <div class="bg-light rounded-circle p-2 text-primary">
                                        <i class="bi bi-person-fill"></i>
                                    </div>
                                    <h6 class="fw-bold fs-6 mb-0">${order.client?.name || 'عميل'}</h6>
                                </div>

                                <div class="timeline position-relative ps-3 border-start border-2 border-light ms-2 mb-3">
                                    <!-- نقطة الاستلام -->
                                    <div class="mb-3 position-relative">
                                        <span class="position-absolute top-0 start-0 translate-middle p-1 bg-primary border border-white rounded-circle" style="left: -2px;"></span>
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <small class="text-muted d-block">من:</small>
                                                <strong class="text-dark fs-6 d-block">${order.pickup?.address}</strong>
                                            </div>
                                            <a href="${pickupLink}" target="_blank" class="btn btn-sm btn-light text-primary border rounded-circle" style="width: 32px; height: 32px; padding: 4px;">
                                                <i class="bi bi-geo-alt-fill"></i>
                                            </a>
                                        </div>
                                    </div>
                                    
                                    <!-- نقطة التسليم -->
                                    <div class="position-relative">
                                        <span class="position-absolute top-0 start-0 translate-middle p-1 bg-danger border border-white rounded-circle" style="left: -2px;"></span>
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <small class="text-muted d-block">إلى:</small>
                                                <strong class="text-dark fs-6 d-block">${order.dropoff?.address}</strong>
                                            </div>
                                            <a href="${dropoffLink}" target="_blank" class="btn btn-sm btn-light text-danger border rounded-circle" style="width: 32px; height: 32px; padding: 4px;">
                                                <i class="bi bi-flag-fill"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- زر عرض المسار الكامل -->
                                <div class="mb-3 text-center">
                                    <a href="${routeLink}" target="_blank" class="btn btn-sm btn-outline-secondary rounded-pill w-100 border-dashed">
                                        <i class="bi bi-map me-1"></i> معاينة المسار والمسافة (Google Maps)
                                    </a>
                                </div>
                                
                                ${order.details ? `
                                <div class="bg-light p-2 rounded-3 mb-3 d-flex gap-2">
                                    <i class="bi bi-info-circle text-secondary mt-1"></i>
                                    <small class="text-muted line-clamp-2">${order.details}</small>
                                </div>` : ''}
                                
                                ${imgHtml}

                                <div class="d-flex gap-2 mt-3 text-white">
                                    <button class="btn btn-success flex-grow-1 fw-bold rounded-pill shadow-sm" onclick="acceptOrder('${order._id}')">
                                        <i class="bi bi-check-circle me-1"></i> قبول
                                    </button>
                                    <button class="btn btn-outline-primary flex-grow-1 fw-bold rounded-pill border-2" onclick="negotiateOrder('${order._id}')">
                                        <i class="bi bi-chat-dots me-1"></i> تفاوض
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        async function acceptOrder(id) {
            const result = await Swal.fire({
                title: 'قبول الطلب؟',
                text: "سيتم تعيين الطلب لك وتبليغ العميل",
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'نعم، توكلنا! 🚀',
                cancelButtonText: 'تراجع',
                confirmButtonColor: '#0a8754',
                cancelButtonColor: '#7f8c8d'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch(`/api/orders/${id}/accept`, {
                        method: 'PUT',
                        headers: window.Auth.getAuthHeader()
                    });
                    if (res.ok) {
                        Swal.fire({
                            title: 'مبروك!',
                            text: 'تم قبول الطلب بنجاح',
                            icon: 'success',
                            confirmButtonColor: '#0a8754'
                        }).then(() => window.location.href = 'captain-missions.html');
                    } else {
                        const err = await res.json();
                        Swal.fire('عذراً', err.message, 'error');
                    }
                } catch (e) { Swal.fire('خطأ', 'فشل الاتصال', 'error'); }
            }
        }

        async function negotiateOrder(id) {
            try {
                const res = await fetch(`/api/orders/${id}/negotiate`, {
                    method: 'PUT',
                    headers: window.Auth.getAuthHeader()
                });
                const data = await res.json();
                if (res.ok) {
                    const clientId = data.client._id || data.client;
                    window.location.href = `chat.html?orderId=${id}&receiverId=${clientId}`;
                } else {
                    Swal.fire('تنبيه', data.message, 'warning');
                }
            } catch (e) { Swal.fire('خطأ', 'فشل الاتصال', 'error'); }
        }

        function showImage(src) {
            document.getElementById('preview-img').src = src;
            new bootstrap.Modal(document.getElementById('imageModal')).show();
        }

        const socket = io();
        socket.on('new_order_available', () => {
            const toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            });
            toast.fire({
                icon: 'info',
                title: '🔔 طلب جديد وصل!'
            });
            fetchOrders();
        });

        fetchOrders();
    </script>

    <!-- WhatsApp Subscription Modal -->

    <!-- Auth Helper & App Core -->
    <script src="js/auth-helper.js"></script>
    <script type="module" src="js/app-core.js"></script>
    <script type="module" src="js/native-notifications.js"></script>
</body>

</html>
