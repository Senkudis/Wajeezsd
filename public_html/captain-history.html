<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سجل الرحلات | كابتن وجيز</title>

    <link rel="stylesheet" href="css/tour.css?v=92063527">
    <!-- نظام تصميم الكابتن — بعد dark-mode.css عمداً كي تفوز قواعده الليلية -->
    <link rel="stylesheet" href="css/captain-ui.css?v=29690076">
    <script src="js/config.js?v=6706269c"></script>
    <script src="js/fetch-retry.js?v=069d96ba"></script>
    <script src="js/theme-manager.js?v=286ae5ac"></script>
    <script src="js/auth-helper.js?v=bf5c4a16"></script>
    <script src="js/safe-area.js?v=176d6050"></script>

    <style>
        /*
         * ────────────────────────────────────────────────────────────
         *  ما يخصّ هذه الشاشة وحدها. كل ما عداه من captain-ui.css.
         *
         *  الصفحة السابقة كانت بهوية بنفسجية (#667eea → #764ba2) لا صلة
         *  لها بهوية الكابتن الخضراء، ولا تُحمّل captain-ui.css أصلاً،
         *  وبأيقونات 80px وحاوية 1200px وحشو 20px — تصميم شاشة مكتب
         *  على هاتف يُمسك بيد واحدة تحت الشمس.
         * ────────────────────────────────────────────────────────────
         */

        /* بطاقة الرحلة: المسار أولاً ثم الأرقام — الكابتن يتعرّف على
           الرحلة بمكانها لا بمبلغها. */
        .trip {
            background: var(--cap-surface);
            border: 1px solid var(--cap-line);
            border-radius: var(--cap-r-lg);
            box-shadow: var(--cap-shadow);
            padding: 14px;
            margin-bottom: 10px;
            transition: box-shadow .3s, transform .3s;
        }

        .trip-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .trip .trip-when {
            font-size: 12px;
            font-weight: 700;
            color: var(--cap-ink-3);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .trip-done {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 800;
            color: var(--cap-green);
            background: var(--cap-green-soft);
            border-radius: 999px;
            padding: 4px 10px;
            white-space: nowrap;
        }

        /* خطّ المسار: نقطتان يربطهما خط — أوضح من أيقونتين منفصلتين */
        .trip-route {
            display: grid;
            grid-template-columns: 14px 1fr;
            gap: 0 10px;
        }

        .trip-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 5px;
            justify-self: center;
        }

        .trip-dot.from { background: var(--cap-blue); }
        .trip-dot.to { background: var(--cap-green); }

        .trip-line {
            grid-column: 1;
            width: 2px;
            background: var(--cap-line);
            justify-self: center;
            margin: 2px 0;
            min-height: 14px;
        }

        /* ⚠️ محدّد مركّب: dark-mode.css يحمل `body.dark-mode div` بوزن
           (0,1,2) يهزم `.trip-addr` (0,1,0)، فيخرج العنوان بلون العنوان
           الرئيسي نفسه ليلاً وتضيع التفرقة بين التسمية والعنوان. */
        .trip .trip-addr {
            font-size: 13px;
            font-weight: 700;
            color: var(--cap-ink-2);
            line-height: 1.5;
            padding-bottom: 8px;
            /* عنوان طويل يُقصّ بدل أن يمطّ البطاقة */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .trip .trip-addr small {
            display: block;
            font-size: 10.5px;
            font-weight: 800;
            color: var(--cap-ink-3);
            margin-bottom: 1px;
        }

        /* الأرقام: صافي الربح هو ما يهمّ الكابتن فيأخذ الوزن الأكبر */
        .trip-money {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--cap-line);
            text-align: center;
        }

        .trip-money .m-price b,
        .trip-money .m-fee b,
        .trip-money .m-net b {
            display: block;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--cap-ink-3);
            margin-bottom: 2px;
        }

        /* الأرقام معزولة اتجاهياً: إشارة السالب في سياق عربي تنتقل
           للطرف البصري الخطأ فتُقرأ العمولة ربحاً */
        .trip-money span {
            font-size: 14px;
            font-weight: 900;
            unicode-bidi: isolate;
            direction: ltr;
            display: inline-block;
        }

        /* ⚠️ محدّدات مركّبة: dark-mode.css يحمل `body.dark-mode span`
           بوزن (0,1,2) وهو يهزم `.m-net span` (0,1,1)، فيخرج الأحمر
           والأخضر أبيضين ليلاً وتضيع القراءة اللونية للأرقام —
           وهي أسرع ما يميّز العمولة عن الربح بنظرة خاطفة. */
        .trip-money .m-price span { color: var(--cap-ink-2); }
        .trip-money .m-fee span { color: var(--cap-red); }
        .trip-money .m-net span { color: var(--cap-green); font-size: 16px; }

        /* حالة فارغة: أيقونة 26px لا 80px — الشاشة صغيرة والرسالة أهمّ */
        .cap-empty {
            text-align: center;
            padding: 46px 20px;
        }

        .cap-empty-ico {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: var(--cap-surface-2);
            color: var(--cap-ink-3);
        }

        .cap-empty h2 {
            font-size: 16px;
            font-weight: 800;
            color: var(--cap-ink);
            margin-bottom: 6px;
        }

        .cap-empty p {
            font-size: 13px;
            color: var(--cap-ink-2);
            margin-bottom: 16px;
        }

        .trip-skel {
            height: 148px;
            border-radius: var(--cap-r-lg);
            margin-bottom: 10px;
        }
    </style>
</head>

<body class="cap-body">

    <!-- ═══ الترويسة: نفس بنية لوحة الكابتن ═══ -->
    <header class="cap-topbar">
        <div class="cap-wrap" style="padding:0;">
            <div class="cap-topbar-row">
                <div class="cap-identity">
                    <a href="captain-dashboard.html" class="cap-avatar" aria-label="رجوع"
                        style="text-decoration:none;">
                        <i class="bi bi-arrow-right"></i>
                    </a>
                    <div class="cap-hello">
                        <h1 class="cap-hello-name">سجل رحلاتي</h1>
                        <p class="cap-hello-sub">رحلاتك المكتملة وأرباحك</p>
                    </div>
                </div>
            </div>

            <!-- المقياس البطل: الرقم الذي يفتح الكابتن الصفحة لأجله -->
            <div class="cap-hero">
                <div class="cap-hero-label">صافي أرباحك</div>
                <div id="totalEarnings" class="cap-hero-value">0</div>
                <div class="cap-hero-unit">جنيه سوداني</div>
            </div>
        </div>
    </header>

    <div class="cap-wrap">
        <div class="cap-metrics">
            <div class="cap-metric">
                <i class="bi bi-bicycle"></i>
                <div id="totalTrips" class="cap-metric-val">0</div>
                <div class="cap-metric-lbl">الرحلات</div>
            </div>
            <div class="cap-metric tone-amber">
                <i class="bi bi-graph-up"></i>
                <div id="avgProfit" class="cap-metric-val">0</div>
                <div class="cap-metric-lbl">متوسط الرحلة</div>
            </div>
            <a href="captain-wallet.html" class="cap-metric">
                <i class="bi bi-wallet2"></i>
                <div class="cap-metric-val"><i class="bi bi-chevron-left"></i></div>
                <div class="cap-metric-lbl">المحفظة</div>
            </a>
        </div>

        <div class="cap-section">
            <div class="cap-section-title">
                <i class="bi bi-clock-history"></i> كل الرحلات
            </div>
            <div id="tripsContainer"></div>
        </div>
    </div>

    <nav class="captain-nav">
        <a href="captain-dashboard.html">
            <i class="bi bi-house-door-fill"></i><span>الرئيسية</span>
        </a>
        <a href="captain-orders.html">
            <i class="bi bi-bicycle"></i><span>الطلبات</span>
        </a>
        <a href="captain-missions.html">
            <i class="bi bi-card-checklist"></i><span>مهامي</span>
        </a>
        <a href="captain-notifications.html">
            <i class="bi bi-bell-fill"></i><span>الإشعارات</span>
        </a>
        <a href="captain-profile.html">
            <i class="bi bi-person-circle"></i><span>حسابي</span>
        </a>
    </nav>

    <script>
        const token = window.Auth && window.Auth.getToken();
        if (!token) window.location.href = 'captain-login.html';

        const esc = s => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        const fmt = n => Number(n || 0).toLocaleString('en-US');

        function emptyState(icon, title, text, action) {
            return `<div class="cap-empty">
                <div class="cap-empty-ico"><i class="bi ${icon}"></i></div>
                <h2>${esc(title)}</h2>
                <p>${esc(text)}</p>
                ${action || ''}
            </div>`;
        }

        function tripCard(t) {
            const when = new Date(t.createdAt).toLocaleString('ar-EG', {
                day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
            });
            return `
            <div class="trip" id="order-${esc(t._id)}">
                <div class="trip-top">
                    <span class="trip-when"><i class="bi bi-calendar3"></i> ${esc(when)}</span>
                    <span class="trip-done"><i class="bi bi-check-circle-fill"></i> مكتملة</span>
                </div>

                <div class="trip-route">
                    <span class="trip-dot from"></span>
                    <div class="trip-addr"><small>الاستلام</small>${esc(t.pickup?.address || 'غير محدد')}</div>
                    <span class="trip-line"></span>
                    <span></span>
                    <span class="trip-dot to"></span>
                    <div class="trip-addr" style="padding-bottom:0"><small>التسليم</small>${esc(t.dropoff?.address || 'غير محدد')}</div>
                </div>

                <div class="trip-money">
                    <div class="m-price"><b>الأجرة</b><span>${fmt(t.price)}</span></div>
                    <div class="m-fee"><b>العمولة</b><span>-${fmt(t.commission)}</span></div>
                    <div class="m-net"><b>صافي الربح</b><span>${fmt(t.netProfit)}</span></div>
                </div>
            </div>`;
        }

        // 📄 المسار /api/captain/trips مُصفَّح (٢٠ رحلة للصفحة). كانت الصفحة تجلب
        // الصفحة الأولى فقط وتعرض مجموعها تحت عنوان «صافي أرباحك» و«الرحلات» —
        // فكابتن أنجز ٩٠ رحلة يقرأ هنا رقماً غير الذي يقرأه في «حسابي» (المجموع
        // الحقيقي مدى الحياة). الآن: الإجماليات من السيرفر، والقائمة تُحمَّل تباعاً.
        let tripsPage = 1;
        let tripsHasMore = false;
        let loadedTrips = [];

        async function loadTrips(page = 1) {
            const container = document.getElementById('tripsContainer');
            if (page === 1) {
                loadedTrips = [];
                container.innerHTML = '<div class="cap-skeleton trip-skel"></div>'.repeat(3);
            }

            try {
                const res = await fetchWithRetry(`${API_URL}/api/captain/trips?page=${page}&limit=20`, {
                    headers: window.Auth.getAuthHeader()
                });
                if (!res.ok) throw new Error('Failed to fetch trips');

                const data = await res.json();
                const trips = Array.isArray(data) ? data : (data.trips || []);
                tripsPage = page;
                tripsHasMore = data.pagination?.hasMore ?? false;
                loadedTrips = page === 1 ? trips : loadedTrips.concat(trips);

                if (!loadedTrips.length) {
                    container.innerHTML = emptyState(
                        'bi-inbox', 'لا توجد رحلات بعد',
                        'ستظهر هنا كل رحلة تُكملها، بأجرتها وعمولتها وصافي ربحك منها.',
                        '<a href="captain-orders.html" class="cap-btn cap-btn-primary">تصفّح الطلبات المتاحة</a>'
                    );
                    return;
                }

                // الإجماليات مدى الحياة من /stats — لا من الصفحة المعروضة وحدها
                const lifetimeCount = data.pagination?.total ?? loadedTrips.length;
                document.getElementById('totalTrips').textContent = fmt(lifetimeCount);
                if (page === 1) loadLifetimeEarnings(lifetimeCount);

                container.innerHTML = loadedTrips.map(tripCard).join('')
                    + (tripsHasMore
                        ? `<button type="button" class="cap-btn cap-btn-ghost" style="width:100%;margin-top:6px;"
                                   id="tripsMoreBtn" onclick="loadMoreTrips(this)">
                               <i class="bi bi-arrow-down-circle"></i> عرض رحلات أقدم
                           </button>`
                        : '');

                // 🎯 إبراز الرحلة القادمة من الإشعار (?highlight=<orderId>)
                const highlightId = new URLSearchParams(window.location.search).get('highlight');
                if (highlightId) {
                    setTimeout(() => {
                        const card = document.getElementById(`order-${highlightId}`);
                        if (!card) return;
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        card.style.boxShadow = '0 0 0 3px var(--cap-green), var(--cap-shadow-lg)';
                        card.style.transform = 'scale(1.01)';
                        setTimeout(() => {
                            card.style.boxShadow = '';
                            card.style.transform = '';
                        }, 3000);
                    }, 400);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            } catch (error) {
                console.error('Error loading trips:', error);
                container.innerHTML = emptyState(
                    'bi-wifi-off', 'تعذّر تحميل الرحلات',
                    'تحقّق من اتصالك ثم أعد المحاولة.',
                    '<button type="button" class="cap-btn cap-btn-primary" onclick="loadTrips()">إعادة المحاولة</button>'
                );
            }
        }

        async function loadMoreTrips(btn) {
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="bi bi-hourglass-split"></i> جاري التحميل…'; }
            await loadTrips(tripsPage + 1);
        }

        // 💰 صافي الأرباح مدى الحياة — نفس المصدر الذي تقرأ منه صفحة «حسابي»
        // (مجموع netRevenue لكل الطلبات المسلَّمة)، فلا تختلف الشاشتان.
        async function loadLifetimeEarnings(tripCount) {
            const el = document.getElementById('totalEarnings');
            const avgEl = document.getElementById('avgProfit');
            try {
                const res = await fetchWithRetry(`${API_URL}/api/captain/stats`, {
                    headers: window.Auth.getAuthHeader()
                });
                if (!res.ok) throw new Error('stats');
                const s = await res.json();
                const total = Number(s.earnings || 0);
                el.textContent = fmt(Math.round(total));
                avgEl.textContent = tripCount ? fmt(Math.round(total / tripCount)) : '0';
            } catch (_) {
                // بلا إجمالي موثوق لا نعرض رقماً قد يكون ناقصاً
                el.textContent = '—';
                avgEl.textContent = '—';
            }
        }

        loadTrips();
    </script>

    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="notification-toast.js"></script>
    <script type="module" src="js/app-core.js?v=eabc83fd"></script>
    <script type="module" src="js/native-notifications.js?v=c076999e"></script>
    <script src="js/tour.js?v=d6d632d6"></script>
    <script src="js/tour-pages.js?v=5e20479b"></script>
</body>

</html>
