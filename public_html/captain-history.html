<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سجل الرحلات | وجيز</title>
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-box .number {
            font-size: 28px;
            font-weight: bold;
        }

        .trips-grid {
            display: grid;
            gap: 20px;
        }

        .trip-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .trip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .trip-date {
            color: #7f8c8d;
            font-size: 14px;
        }

        .trip-status {
            background: #27ae60;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
        }

        .trip-route {
            margin-bottom: 20px;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .location i {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .pickup i {
            background: #3498db;
            color: white;
        }

        .dropoff i {
            background: #e74c3c;
            color: white;
        }

        .trip-earnings {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .earning-item {
            text-align: center;
        }

        .earning-item label {
            display: block;
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .earning-item .value {
            font-size: 18px;
            font-weight: bold;
        }

        .earning-item.total .value {
            color: #3498db;
        }

        .earning-item.commission .value {
            color: #e74c3c;
        }

        .earning-item.profit .value {
            color: #27ae60;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        .empty-state {
            background: white;
            padding: 60px;
            border-radius: 15px;
            text-align: center;
        }

        .empty-state i {
            font-size: 80px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .back-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
    <!-- Mobile App Overrides -->
    <link rel="stylesheet" href="css/mobile-overrides.css?v=b6fff3fa">
    <link rel="stylesheet" href="css/enhanced-styles.css?v=3dc00ed1">
    <link rel="stylesheet" href="css/dark-mode.css?v=c9324219">
    <script src="js/config.js?v=b84e6b6a"></script>
    <script src="js/fetch-retry.js?v=069d96ba"></script>
    <script src="js/theme-manager.js?v=01cb92bf"></script>
    <script src="js/auth-helper.js?v=849c502f"></script>
</head>

<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='captain-dashboard.html'">
            <i class="fas fa-arrow-right"></i> العودة للوحة التحكم
        </button>

        <div class="header">
            <h1><i class="fas fa-history"></i> سجل رحلاتي</h1>
            <p style="color: #7f8c8d;">جميع رحلاتك المكتملة وأرباحك</p>

            <div class="stats-row" id="stats">
                <div class="stat-box">
                    <h3>إجمالي الرحلات</h3>
                    <div class="number" id="totalTrips">0</div>
                </div>
                <div class="stat-box">
                    <h3>إجمالي الأرباح</h3>
                    <div class="number" id="totalEarnings">0 ج.س</div>
                </div>
                <div class="stat-box">
                    <h3>متوسط الربح</h3>
                    <div class="number" id="avgProfit">0 ج.س</div>
                </div>
            </div>
        </div>

        <div id="tripsContainer"></div>
    </div>

    <script>
        // Check Auth
        if (!window.Auth || !window.Auth.isAuthenticated()) {
            // Identify login page based on context or generic
            // window.location.href = "client-login.html"; // handled by specific pages usually
        }
        const token = window.Auth.getToken();
        if (!token) {
            window.location.href = 'captain-login.html';
        }

        async function loadTrips() {
            const container = document.getElementById('tripsContainer');
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';

            try {
                const res = await fetchWithRetry(`${API_URL}/api/captain/trips`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Failed to fetch trips');

                const data = await res.json();
                const trips = data.trips || [];

                if (trips.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-box-open"></i>
                            <h2>لا توجد رحلات بعد</h2>
                            <p style="color: #7f8c8d;">ابدأ بقبول الطلبات لرؤية سجل رحلاتك هنا</p>
                        </div>
                    `;
                    return;
                }

                // Calculate stats
                const totalTrips = trips.length;
                const totalEarnings = trips.reduce((sum, trip) => sum + (trip.netProfit || 0), 0);
                const avgProfit = Math.round(totalEarnings / totalTrips);

                document.getElementById('totalTrips').textContent = totalTrips;
                document.getElementById('totalEarnings').textContent = totalEarnings.toFixed(0) + ' ج.س';
                document.getElementById('avgProfit').textContent = avgProfit + ' ج.س';

                // Render trips
                container.innerHTML = trips.map(trip => `
                    <div class="trip-card">
                        <div class="trip-header">
                            <div>
                                <div class="trip-date">
                                    <i class="fas fa-calendar"></i> 
                                    ${new Date(trip.createdAt).toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })}
                                </div>
                            </div>
                            <div class="trip-status">
                                <i class="fas fa-check-circle"></i> مكتملة
                            </div>
                        </div>

                        <div class="trip-route">
                            <div class="location pickup">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>
                                    <strong>الاستلام</strong>
                                    <div style="color: #7f8c8d; font-size: 14px;">${trip.pickup?.address || 'غير محدد'}</div>
                                </div>
                            </div>
                            <div class="location dropoff">
                                <i class="fas fa-flag-checkered"></i>
                                <div>
                                    <strong>التسليم</strong>
                                    <div style="color: #7f8c8d; font-size: 14px;">${trip.dropoff?.address || 'غير محدد'}</div>
                                </div>
                            </div>
                        </div>

                        <div class="trip-earnings">
                            <div class="earning-item total">
                                <label>السعر الكلي</label>
                                <div class="value">${trip.price || 0} ج.س</div>
                            </div>
                            <div class="earning-item commission">
                                <label>العمولة</label>
                                <div class="value">-${trip.commission || 0} ج.س</div>
                            </div>
                            <div class="earning-item profit">
                                <label>صافي الربح</label>
                                <div class="value">${trip.netProfit || 0} ج.س</div>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading trips:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color: #e74c3c;"></i>
                        <h2>خطأ في تحميل البيانات</h2>
                        <p style="color: #7f8c8d;">حاول مرة أخرى لاحقاً</p>
                    </div>
                `;
            }
        }

        loadTrips();
    </script>
    <!-- Auth Helper & App Core -->
    <!-- Socket.io & App Core -->
    <script src="vendor/socket.io/socket.io.min.js"></script>
    <script src="notification-toast.js"></script>
    <script src="js/geo.js?v=3f3df042"></script>
    <script type="module" src="js/app-core.js?v=dc9acf49"></script>
    <script type="module" src="js/native-notifications.js?v=76150d71"></script>
</body>

</html>
