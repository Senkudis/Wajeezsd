<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الدعم الفني | وجيز</title>
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.4">
    <link rel="stylesheet" href="css/mobile-overrides.css?v=97af4497">
    <script src="js/config.js?v=b84e6b6a"></script>
    <script src="js/fetch-retry.js?v=069d96ba"></script>
    <style>
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: #f0f4f8; padding-bottom: 90px; }

        .support-hero {
            background: linear-gradient(135deg, #1e3a5f 0%, #04553A 100%);
            padding: 48px 20px 44px;
            position: relative; overflow: hidden;
        }
        .support-hero::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 28px;
            background: #f0f4f8; clip-path: ellipse(60% 100% at 50% 100%);
        }

        /* حاوية المحتوى ترتفع قليلاً فوق المنحنى — مع z-index لتظهر فوق الهيرو بوضوح */
        .content-wrap { position: relative; z-index: 5; margin-top: -14px; }

        .tab-switcher {
            display: flex; background: #fff; border-radius: 14px;
            padding: 5px; gap: 5px; box-shadow: 0 4px 16px rgba(0,0,0,.10);
            border: 1px solid #e2e8f0; margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1; padding: 12px 8px; border: none; border-radius: 11px;
            font-family: 'Cairo', sans-serif; font-size: 13.5px; font-weight: 800;
            cursor: pointer; transition: all .2s; background: transparent; color: #475569;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .tab-btn.active { background: #04553A; color: #fff; box-shadow: 0 3px 10px rgba(10,135,84,.35); }

        .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
        .form-control, .form-select {
            border-radius: 12px; border: 1.5px solid #e2e8f0;
            font-family: 'Cairo', sans-serif; background: #f8fafc;
            padding: 10px 14px; font-size: 14px; transition: border-color .2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #04553A; background: #fff; box-shadow: 0 0 0 3px rgba(10,135,84,.1);
        }
        .form-label { font-weight: 700; font-size: 13px; color: #374151; margin-bottom: 6px; }

        .btn-submit {
            background: linear-gradient(135deg, #04553A, #0d9d63);
            border: none; color: #fff; font-weight: 800; border-radius: 14px;
            padding: 14px; font-size: 15px; width: 100%; font-family: 'Cairo', sans-serif;
            box-shadow: 0 4px 16px rgba(10,135,84,.3); transition: all .2s;
        }
        .btn-submit:hover { filter: brightness(1.07); transform: translateY(-1px); }
        .btn-submit:disabled { opacity: .6; transform: none; }

        /* Ticket cards */
        .ticket-card {
            background: #fff; border-radius: 16px; padding: 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05); border: 1px solid #e2e8f0;
            margin-bottom: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s;
        }
        .ticket-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.1); }
        .ticket-subject { font-weight: 800; font-size: 14px; color: #1e293b; margin-bottom: 6px; }
        .ticket-desc { font-size: 12px; color: #64748b; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ticket-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
        .badge-status { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
        .s-open        { background:#dbeafe; color:#1d4ed8; }
        .s-in_progress { background:#fef9c3; color:#854d0e; }
        .s-resolved    { background:#dcfce7; color:#166534; }
        .s-dismissed   { background:#f1f5f9; color:#64748b; }
        .s-pending     { background:#dbeafe; color:#1d4ed8; }
        .replies-badge { background:#f1f5f9; color:#374151; border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; }

        /* Thread modal */
        .thread-wrap { max-height: 55vh; overflow-y: auto; padding: 12px; background: #f8fafc; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; }
        .msg-admin  { background: #04553A; color: #fff; align-self: flex-start; border-bottom-right-radius: 4px; }
        .msg-client { background: #fff; border: 1px solid #e2e8f0; align-self: flex-end; color: #1e293b; border-bottom-left-radius: 4px; }
        .msg-time   { font-size: 10px; opacity: .65; margin-top: 3px; }

        .empty-state { text-align: center; padding: 50px 20px; color: #94a3b8; }
        .empty-state i { font-size: 3rem; display: block; margin-bottom: 12px; }

        .mobile-nav-glass { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,.96); backdrop-filter: blur(12px); border-top: 1px solid rgba(0,0,0,.06); display: flex; justify-content: space-around; padding: 8px 0 14px; }
        .nav-item-link { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #94a3b8; text-decoration: none; font-size: 20px; transition: color .2s; flex: 1; }
        .nav-item-link span { font-size: 10.5px; font-weight: 700; }
        .nav-item-link:hover, .nav-item-link.active { color: #04553A; }
    </style>
    <link rel="stylesheet" href="css/dark-mode.css?v=7df0a5e8">
</head>
<body>
    <div class="support-hero">
        <div class="container">
            <div class="d-flex align-items-center gap-3 mb-3">
                <a href="client-my-orders.html" class="text-white-50 text-decoration-none"><i class="bi bi-arrow-right fs-5"></i></a>
                <div>
                    <h2 class="h5 fw-bold mb-0 text-white">الدعم الفني</h2>
                    <p class="small text-white-50 mb-0">نحن هنا لمساعدتك</p>
                </div>
                <div class="ms-auto bg-white bg-opacity-10 rounded-circle p-2">
                    <i class="bi bi-headset text-white fs-4"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="container content-wrap">

        <!-- Tab Switcher -->
        <div class="tab-switcher">
            <button class="tab-btn active" id="tabNewBtn" onclick="switchTab('new')">
                <i class="bi bi-plus-circle-fill me-1"></i>تذكرة جديدة
            </button>
            <button class="tab-btn" id="tabMyBtn" onclick="switchTab('my')">
                <i class="bi bi-ticket-detailed me-1"></i>تذاكري
                <span id="ticketCountBadge" style="display:none;" class="badge bg-danger rounded-pill ms-1" id="tBadge"></span>
            </button>
        </div>

        <!-- NEW TICKET FORM -->
        <div id="panelNew">
            <div class="card p-4">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-card-heading text-success me-1"></i>موضوع الشكوى *</label>
                    <input type="text" id="fSubject" class="form-control" placeholder="مثال: لم يصل طلبي منذ ساعة">
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-tags-fill text-warning me-1"></i>نوع المشكلة *</label>
                    <select id="fCategory" class="form-select">
                        <option value="" disabled selected>اختر نوع المشكلة...</option>
                        <option value="late_delivery">🕐 تأخر التوصيل</option>
                        <option value="wrong_item">📦 منتج خاطئ أو ناقص</option>
                        <option value="captain_behavior">🚗 سلوك الكابتن</option>
                        <option value="payment">💳 مشكلة في الدفع</option>
                        <option value="app_bug">📱 خطأ في التطبيق</option>
                        <option value="store_issue">🏪 مشكلة مع المتجر</option>
                        <option value="missing_item">❌ منتج مفقود</option>
                        <option value="other">💬 أخرى</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-hash text-muted me-1"></i>رقم الطلب (اختياري)</label>
                    <input type="text" id="fOrderId" class="form-control" placeholder="مثال: 68abc...">
                </div>
                <div class="mb-4">
                    <label class="form-label"><i class="bi bi-chat-text-fill text-success me-1"></i>اشرح المشكلة بالتفصيل *</label>
                    <textarea id="fDescription" class="form-control" rows="4"
                        placeholder="كلما أعطيتنا تفاصيل أكثر، كلما تمكنّا من مساعدتك بشكل أسرع..."></textarea>
                </div>
                <button class="btn-submit" id="submitBtn" onclick="submitComplaint()">
                    <i class="bi bi-send-fill me-2"></i>إرسال الشكوى
                </button>
            </div>
        </div>

        <!-- MY TICKETS -->
        <div id="panelMy" style="display:none;">
            <div id="ticketsList">
                <div class="empty-state">
                    <i class="bi bi-hourglass-split"></i>
                    <p>جاري التحميل...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Thread Modal -->
    <div class="modal fade" id="threadModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 rounded-4 overflow-hidden">
                <div class="modal-header border-0" style="background:linear-gradient(135deg,#04553A,#0d9d63);color:white;">
                    <h6 class="modal-title fw-bold" id="threadTitle"><i class="bi bi-headset me-2"></i>تفاصيل التذكرة</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="threadBody" class="thread-wrap"></div>
                </div>
                <div class="modal-footer border-0 px-3 pb-4 flex-column gap-2" id="replyFooter" style="display:none!important;">
                    <div class="input-group">
                        <textarea id="replyInput" class="form-control" rows="2" placeholder="اكتب ردك..."></textarea>
                        <button class="btn btn-success fw-bold" onclick="sendReply()"><i class="bi bi-send-fill"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="mobile-nav-glass">
        <a href="index.html" class="nav-item-link">
            <i class="bi bi-house-door"></i><span>الرئيسية</span>
        </a>
        <a href="client-order.html" class="nav-item-link">
            <i class="bi bi-shop"></i><span>تسوق</span>
        </a>
        <a href="client-my-orders.html" class="nav-item-link">
            <i class="bi bi-box-seam"></i><span>طلباتي</span>
        </a>
        <a href="notifications.html" class="nav-item-link">
            <i class="bi bi-bell"></i><span>الإشعارات</span>
        </a>
    </nav>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="notification-toast.js"></script>
    <script src="js/auth-helper.js?v=849c502f"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const prefillOrderId = urlParams.get('orderId') || '';
        const token = window.Auth?.getToken() || localStorage.getItem('token') || localStorage.getItem('clientToken');

        if (!token) window.location.href = 'client-login.html';
        if (prefillOrderId) document.getElementById('fOrderId').value = prefillOrderId;

        const BASE    = window.API_URL || 'https://wajeezsd.com';
        const authHdr = () => ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' });

        const statusLabel = { open:'مفتوحة', in_progress:'قيد المعالجة', resolved:'محلولة ✅', dismissed:'مرفوضة', pending:'معلقة' };
        const statusCls   = { open:'s-open', in_progress:'s-in_progress', resolved:'s-resolved', dismissed:'s-dismissed', pending:'s-pending' };

        let activeTicketId = null;

        // ─── Tab Switcher ───────────────────────────────────────
        function switchTab(tab) {
            const isNew = tab === 'new';
            document.getElementById('panelNew').style.display = isNew ? 'block' : 'none';
            document.getElementById('panelMy').style.display  = isNew ? 'none'  : 'block';
            document.getElementById('tabNewBtn').classList.toggle('active', isNew);
            document.getElementById('tabMyBtn').classList.toggle('active', !isNew);
            if (!isNew) loadMyTickets();
        }

        // ─── Submit Complaint ───────────────────────────────────
        async function submitComplaint() {
            const subject     = document.getElementById('fSubject').value.trim();
            const category    = document.getElementById('fCategory').value;
            const orderId     = document.getElementById('fOrderId').value.trim();
            const description = document.getElementById('fDescription').value.trim();

            if (!subject)     return Swal.fire('تنبيه', 'يرجى كتابة موضوع الشكوى', 'warning');
            if (!category)    return Swal.fire('تنبيه', 'يرجى اختيار نوع المشكلة', 'warning');
            if (!description) return Swal.fire('تنبيه', 'يرجى كتابة تفاصيل المشكلة', 'warning');

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>جاري الإرسال...';

            try {
                const res = await fetchWithRetry(`${BASE}/api/complaints`, {
                    method: 'POST',
                    headers: authHdr(),
                    body: JSON.stringify({ subject, category, description, orderId: orderId || undefined })
                });
                const data = await res.json();
                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '✅ تم إرسال شكواك!',
                        html: 'سنراجعها ونرد عليك في أقرب وقت.<br><small class="text-muted">رقم التذكرة: #' + (data.complaint?._id?.slice(-6) || '—') + '</small>',
                        confirmButtonText: 'عرض تذاكري',
                        confirmButtonColor: '#04553A'
                    }).then(() => switchTab('my'));
                    // Reset form
                    document.getElementById('fSubject').value = '';
                    document.getElementById('fCategory').value = '';
                    document.getElementById('fOrderId').value = '';
                    document.getElementById('fDescription').value = '';
                } else {
                    Swal.fire('خطأ', data.message || 'حدث خطأ ما', 'error');
                }
            } catch (err) {
                Swal.fire('خطأ', 'فشل الاتصال بالخادم', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-send-fill me-2"></i>إرسال الشكوى';
            }
        }

        // ─── Load My Tickets ────────────────────────────────────
        async function loadMyTickets() {
            const list = document.getElementById('ticketsList');
            list.innerHTML = '<div class="empty-state"><i class="bi bi-hourglass-split"></i><p>جاري التحميل...</p></div>';
            try {
                const res  = await fetchWithRetry(`${BASE}/api/complaints/mine`, { headers: authHdr() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message);
                renderTickets(data.complaints || data);
            } catch (e) {
                list.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-circle text-danger"></i><p>${e.message}</p></div>`;
            }
        }

        function renderTickets(tickets) {
            const list = document.getElementById('ticketsList');
            if (!tickets.length) {
                list.innerHTML = '<div class="empty-state"><i class="bi bi-ticket-detailed"></i><p>لا توجد تذاكر دعم بعد</p></div>';
                return;
            }

            // Update badge
            const openCount = tickets.filter(t => t.status === 'open' || t.status === 'in_progress').length;
            const badge = document.getElementById('ticketCountBadge');
            if (openCount > 0) { badge.textContent = openCount; badge.style.display = 'inline-block'; }

            const catLabel = {
                late_delivery:'تأخر التوصيل', wrong_item:'منتج خاطئ', captain_behavior:'سلوك الكابتن',
                payment:'مشكلة دفع', app_bug:'خطأ تطبيق', missing_item:'منتج مفقود',
                store_issue:'مشكلة متجر', other:'أخرى'
            };

            list.innerHTML = tickets.map(t => `
                <div class="ticket-card" onclick="openThread('${t._id}', '${(t.subject||'').replace(/'/g,"&#39;")}')">
                    <div class="ticket-subject">${t.subject || '—'}</div>
                    <div class="ticket-desc">${t.description}</div>
                    <div class="ticket-meta">
                        <span class="badge-status ${statusCls[t.status] || 's-open'}">${statusLabel[t.status] || t.status}</span>
                        <span class="badge-status" style="background:#f8fafc;color:#374151;">${catLabel[t.category] || t.category || ''}</span>
                        ${t.replies?.length > 0 ? `<span class="replies-badge"><i class="bi bi-chat-dots me-1"></i>${t.replies.length} رد</span>` : ''}
                        <span class="text-muted ms-auto" style="font-size:11px;">${new Date(t.createdAt).toLocaleDateString('ar-EG')}</span>
                    </div>
                </div>
            `).join('');
        }

        // ─── Open Thread ────────────────────────────────────────
        async function openThread(id, subject) {
            activeTicketId = id;
            document.getElementById('threadTitle').innerHTML = `<i class="bi bi-headset me-2"></i>${subject || 'تفاصيل التذكرة'}`;
            document.getElementById('threadBody').innerHTML = '<div class="d-flex justify-content-center py-4"><div class="spinner-border text-success"></div></div>';
            new bootstrap.Modal(document.getElementById('threadModal')).show();

            try {
                const res = await fetchWithRetry(`${BASE}/api/complaints/${id}`, { headers: authHdr() });
                const c   = await res.json();
                renderThread(c);

                // Show reply input only if not resolved/dismissed
                const footer = document.getElementById('replyFooter');
                if (c.status !== 'resolved' && c.status !== 'dismissed') {
                    footer.style.display = 'flex';
                    footer.style.flexDirection = 'column';
                } else {
                    footer.style.display = 'none';
                }
            } catch (e) {
                document.getElementById('threadBody').innerHTML = `<div class="text-center text-danger p-4">${e.message}</div>`;
            }
        }

        function renderThread(c) {
            const body = document.getElementById('threadBody');
            const msgs = [];

            // Original message from client
            msgs.push(`
                <div class="msg-bubble msg-client">
                    ${c.description}
                    <div class="msg-time">${new Date(c.createdAt).toLocaleString('ar-EG')} · أنت</div>
                </div>`);

            (c.replies || []).forEach(r => {
                const isAdmin = r.senderRole === 'admin';
                msgs.push(`
                    <div class="msg-bubble ${isAdmin ? 'msg-admin' : 'msg-client'}">
                        ${r.message}
                        <div class="msg-time">${new Date(r.createdAt).toLocaleString('ar-EG')} · ${isAdmin ? '🔐 فريق الدعم' : 'أنت'}</div>
                    </div>`);
            });

            body.innerHTML = msgs.join('');
            body.scrollTop = body.scrollHeight;
        }

        // ─── Send Reply ─────────────────────────────────────────
        async function sendReply() {
            const text = document.getElementById('replyInput').value.trim();
            if (!text) return;
            try {
                const res = await fetchWithRetry(`${BASE}/api/complaints/${activeTicketId}/reply`, {
                    method: 'POST', headers: authHdr(),
                    body: JSON.stringify({ message: text })
                });
                if (!res.ok) throw new Error();
                document.getElementById('replyInput').value = '';
                // Reload thread
                const updated = await fetchWithRetry(`${BASE}/api/complaints/${activeTicketId}`, { headers: authHdr() });
                renderThread(await updated.json());
            } catch {
                Swal.fire({ toast: true, position: 'top', icon: 'error', title: 'فشل إرسال الرد', timer: 2000, showConfirmButton: false });
            }
        }

        function logout() {
            if (window.Auth) { window.Auth.logout(); }
            else { localStorage.clear(); window.location.href = 'client-login.html'; }
        }
    </script>
    <script src="js/geo.js?v=3f3df042"></script>
    <script type="module" src="js/app-core.js?v=064b92a3"></script>
    <script type="module" src="js/native-notifications.js?v=76150d71"></script>
    <script src="js/theme-manager.js?v=a33a528b"></script>
</body>
